<script>
var AuthLoading={
  observer:null,timer:null,minimumTimer:null,startedAt:0,minimumDuration:2000,
  logoMotion:function(){
    var logo=typeof BRAND_LOGO==='string'?'<img src="'+BRAND_LOGO+'" alt="Logo Meirista" width="120" height="120">':brandLogo();
    return '<div class="auth-logo-motion"><div class="auth-logo-pieces" aria-hidden="true">'+[0,1,2,3,4,5].map(function(i){return '<span class="auth-logo-piece auth-logo-piece-'+i+'">'+logo+'</span>';}).join('')+'</div><div class="auth-logo-complete">'+logo+'</div><svg class="auth-logo-outline" viewBox="0 0 144 144" fill="none" aria-hidden="true"><rect x="5" y="5" width="134" height="134" rx="31" pathLength="1"/></svg></div>';
  },
  show:function(message){
    this.hide();this.startedAt=Date.now();var overlay=document.createElement('div');overlay.id='auth-loading';overlay.className='auth-loading';overlay.setAttribute('role','status');overlay.setAttribute('aria-live','polite');
    overlay.innerHTML='<div class="auth-loading-content"><div class="auth-loading-mark">'+this.logoMotion()+'</div><div class="auth-loading-label">MEIRISTA</div><h1>SKU Master</h1><p id="auth-loading-message">'+esc(message||'Memeriksa akun Anda…')+'</p><div class="auth-loading-track" aria-hidden="true"><i></i></div><div class="auth-loading-caption">Produk · Paket Penjualan · Kanal Penjualan</div></div><div class="auth-loading-footer">SKU Management System</div>';
    document.body.appendChild(overlay);var root=document.getElementById('app');if(root){root.inert=true;root.setAttribute('aria-busy','true');}
  },
  message:function(message){var node=document.getElementById('auth-loading-message');if(node)node.textContent=message;},
  finish:function(){
    var self=this,main=document.getElementById('main');this.message('Menyiapkan ruang kerja…');
    function ready(){if(!main||!main.querySelector('.loading')){self.complete();return true;}return false;}
    if(ready())return;
    this.observer=new MutationObserver(ready);this.observer.observe(main,{childList:true,subtree:true});
    // Bila data awal masih menunggu server, tampilkan halaman beserta indikator datanya.
    this.timer=setTimeout(function(){self.hide();},12000);
  },
  complete:function(){
    if(!document.getElementById('auth-loading'))return;
    if(this.observer){this.observer.disconnect();this.observer=null;}if(this.timer){clearTimeout(this.timer);this.timer=null;}
    var remaining=Math.max(0,this.minimumDuration-(Date.now()-this.startedAt)),self=this;
    if(!remaining)return this.hide();
    if(!this.minimumTimer)this.minimumTimer=setTimeout(function(){self.hide();},remaining);
  },
  hide:function(){
    if(this.observer){this.observer.disconnect();this.observer=null;}if(this.timer){clearTimeout(this.timer);this.timer=null;}
    if(this.minimumTimer){clearTimeout(this.minimumTimer);this.minimumTimer=null;}
    var overlay=document.getElementById('auth-loading');if(overlay)overlay.remove();var root=document.getElementById('app');if(root){root.inert=false;root.removeAttribute('aria-busy');}
  }
};
</script>
