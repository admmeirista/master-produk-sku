<script>
/* ============================================================================
 * Core: pemanggilan server, router, layout, komponen UI kecil.
 * ==========================================================================*/
const S = { token: null, user: null, perms: [], pending: 0 };
try { S.token = localStorage.getItem('rpm_token'); } catch (e) {}

function call(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler((r) => {
        if (r && r.ok) return resolve(r.data);
        const err = Object.assign(new Error((r && r.error && r.error.message) || 'Terjadi kesalahan'), (r && r.error) || {});
        if (err.code === 'UNAUTHENTICATED' && action !== 'auth.login') { setToken(null); S.user = null; renderLogin(err.message); }
        reject(err);
      })
      .withFailureHandler((e) => reject(new Error('Koneksi ke server gagal: ' + (e && e.message ? e.message : e))))
      .api(S.token, action, payload === undefined ? null : payload);
  });
}
function setToken(t) { S.token = t; try { t ? localStorage.setItem('rpm_token', t) : localStorage.removeItem('rpm_token'); } catch (e) {} }
const can = (p) => S.perms.indexOf(p) >= 0;

// ---------------------------------------------------------------- util
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const fmtRp = (v) => (v === null || v === undefined || v === '' ? '—' : 'Rp ' + Number(v).toLocaleString('id-ID'));
const fmtDate = (v) => (v ? new Date(v).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const uid = () => Math.random().toString(36).slice(2, 10);
function normCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

const LABELS = {
  draft: ['Draft', ''], pending_review: ['Menunggu Review', 'b-amber'], approved: ['Disetujui', 'b-blue'], active: ['Aktif', 'b-green'], rejected: ['Ditolak', 'b-red'],
  inactive: ['Nonaktif', 'b-violet'], archived: ['Diarsipkan', ''], pending: ['Menunggu persetujuan', 'b-amber'], applied: ['Diterapkan', 'b-green'], cancelled: ['Dibatalkan', ''],
  mapped: ['Dipetakan', 'b-blue'], exported: ['Diekspor', 'b-amber'], confirmed: ['Terkonfirmasi', 'b-green'], mismatch: ['Tidak cocok', 'b-red'], error: ['Error', 'b-red'],
  allocated: ['Dialokasikan', 'b-blue'], assigned: ['Dipakai', 'b-green'], retired: ['Dipensiunkan', ''], void: ['Void', 'b-red'], committed: ['Selesai', 'b-green'],
  valid: ['Valid', 'b-green'], warning: ['Peringatan', 'b-amber'], skipped: ['Dilewati', ''],
};
const badge = (s) => { const l = LABELS[s] || [s, '']; return `<span class="badge ${l[1]}">${esc(l[0])}</span>`; };
const B = (text, cls) => `<span class="badge ${cls || ''}">${esc(text)}</span>`;
const spinner = (t) => `<div class="spin">${esc(t || 'Memuat…')}</div>`;
const empty = (t, sub) => `<div class="empty"><b>${esc(t)}</b>${sub ? `<div class="small mt">${sub}</div>` : ''}</div>`;
const alertBox = (tone, title, body) => `<div class="alert ${tone}">${title ? `<b>${esc(title)}</b>` : ''}${body ? `<div${title ? ' style="margin-top:4px"' : ''}>${body}</div>` : ''}</div>`;
const card = (title, body, actions, flush) => `<section class="card">${title || actions ? `<div class="ch"><h2>${title || ''}</h2><div class="row">${actions || ''}</div></div>` : ''}<div class="cb ${flush ? 'flush' : ''}">${body}</div></section>`;
const head = (title, sub, actions) => `<div class="head"><div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="row">${actions || ''}</div></div>`;
const errHtml = (e) => alertBox('error', e.message, (e.details || []).length ? '<ul style="margin:4px 0 0 16px;padding:0">' + e.details.map((d) => `<li>${esc(d.message)}</li>`).join('') + '</ul>' : '');

function toast(tone, title, body) {
  const el = document.createElement('div');
  el.className = 'toast ' + tone;
  el.innerHTML = `<b>${esc(title)}</b>${body ? `<div class="small muted">${esc(body)}</div>` : ''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), tone === 'error' ? 7000 : 4000);
}

function pager(d, onPage) {
  const pages = Math.max(1, Math.ceil(d.total / d.pageSize));
  const id = 'pg' + uid();
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.querySelector('[data-p=prev]').onclick = () => onPage(d.page - 1);
    el.querySelector('[data-p=next]').onclick = () => onPage(d.page + 1);
  });
  return `<div class="row between small muted" id="${id}" style="padding:10px 14px"><span>${d.total ? `${(d.page - 1) * d.pageSize + 1}–${Math.min(d.page * d.pageSize, d.total)} dari ${d.total}` : '0 data'}</span>
    <span class="row"><button class="btn sec sm" data-p="prev" ${d.page <= 1 ? 'disabled' : ''}>Sebelumnya</button> ${d.page}/${pages} <button class="btn sec sm" data-p="next" ${d.page >= pages ? 'disabled' : ''}>Berikutnya</button></span></div>`;
}

// ---------------------------------------------------------------- modal
function openModal({ title, body, footer, size, onMount }) {
  const root = $('#modal-root');
  const wrap = document.createElement('div');
  wrap.className = 'modal-bg';
  wrap.innerHTML = `<div class="modal ${size || ''}"><div class="mh"><h2>${esc(title)}</h2><a data-x>✕</a></div><div class="mb">${body}</div>${footer ? `<div class="mf">${footer}</div>` : ''}</div>`;
  const close = () => wrap.remove();
  wrap.addEventListener('mousedown', (e) => e.target === wrap && close());
  wrap.querySelector('[data-x]').onclick = close;
  root.appendChild(wrap);
  if (onMount) onMount(wrap, close);
  return { el: wrap, close };
}

/** Konfirmasi tindakan berisiko; opsional alasan wajib. onConfirm(reason) boleh Promise (dialog menampilkan error bila gagal). */
function confirmDialog({ title, message, confirmLabel, tone, reason, reasonLabel, onConfirm }) {
  openModal({
    title,
    body: `${message ? `<div class="mb">${message}</div>` : ''}${reason !== undefined ? `<label class="f"><span class="${reason ? 'req' : ''}">${esc(reasonLabel || 'Alasan / catatan')}</span><textarea rows="3" data-reason></textarea></label>` : ''}<div data-err class="mt"></div>`,
    footer: `<button class="btn sec" data-cancel>Batal</button><button class="btn ${tone || ''}" data-ok>${esc(confirmLabel || 'Lanjutkan')}</button>`,
    onMount: (el, close) => {
      el.querySelector('[data-cancel]').onclick = close;
      const ok = el.querySelector('[data-ok]');
      ok.onclick = async () => {
        const r = el.querySelector('[data-reason]') ? el.querySelector('[data-reason]').value.trim() : '';
        if (reason && r.length < 3) return (el.querySelector('[data-err]').innerHTML = alertBox('error', 'Alasan wajib diisi'));
        ok.disabled = true;
        try { await onConfirm(r); close(); } catch (e) { el.querySelector('[data-err]').innerHTML = errHtml(e); ok.disabled = false; }
      };
    },
  });
}

// ---------------------------------------------------------------- combo (dropdown yang dapat dicari)
/** options: [{value,label,hint,badge}] ; mengembalikan HTML; inisialisasi lewat initCombos(container) */
const COMBOS = {};
function combo(id, options, value, placeholder, onChange) {
  COMBOS[id] = { options, onChange };
  const sel = options.find((o) => o.value === value);
  return `<div class="combo" data-combo="${id}"><input autocomplete="off" placeholder="${esc(placeholder || 'Pilih…')}" value="${sel ? esc(sel.label + (sel.hint ? ' · ' + sel.hint : '')) : ''}"><div class="list"></div></div>`;
}
function initCombos(root) {
  $$('[data-combo]', root).forEach((el) => {
    const cfg = COMBOS[el.dataset.combo];
    const input = el.querySelector('input');
    const list = el.querySelector('.list');
    let shown = [], act = 0;
    const draw = (q) => {
      const s = String(q || '').toLowerCase();
      shown = cfg.options.filter((o) => !s || (o.label + ' ' + (o.hint || '')).toLowerCase().indexOf(s) >= 0).slice(0, 200);
      act = 0;
      list.innerHTML = shown.length ? shown.map((o, i) => `<div class="opt ${i === 0 ? 'act' : ''}" data-i="${i}"><span>${esc(o.label)} <span class="muted small">${esc(o.hint || '')}</span></span>${o.badge || ''}</div>`).join('') : '<div class="opt muted">Tidak ada hasil</div>';
    };
    const pick = (o) => { input.value = o.label + (o.hint ? ' · ' + o.hint : ''); el.classList.remove('open'); cfg.onChange(o.value, o); };
    input.onfocus = () => { input.select(); draw(''); el.classList.add('open'); };
    input.oninput = () => { draw(input.value); el.classList.add('open'); };
    input.onkeydown = (e) => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = Math.max(0, Math.min(shown.length - 1, act + (e.key === 'ArrowDown' ? 1 : -1))); $$('.opt', list).forEach((x, i) => x.classList.toggle('act', i === act)); }
      if (e.key === 'Enter') { e.preventDefault(); if (shown[act]) pick(shown[act]); }
      if (e.key === 'Escape') el.classList.remove('open');
    };
    list.onmousedown = (e) => { const o = e.target.closest('.opt'); if (o && o.dataset.i !== undefined) { e.preventDefault(); pick(shown[Number(o.dataset.i)]); } };
    input.onblur = () => setTimeout(() => el.classList.remove('open'), 150);
  });
}

function barcodeSvg(code, h) {
  const id = 'bc' + uid();
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el || !window.JsBarcode) return;
    try { JsBarcode(el, code, { format: code.length === 13 ? 'EAN13' : code.length === 8 ? 'EAN8' : 'CODE128', height: h || 36, width: 1.4, fontSize: 12, margin: 2, background: 'transparent' }); }
    catch (e) { JsBarcode(el, code, { format: 'CODE128', height: h || 36, width: 1.2, fontSize: 12 }); }
  });
  return `<svg id="${id}"></svg>`;
}

/** Unduh tabel sebagai XLSX (kolom teks tetap teks) atau CSV. */
function downloadTable(d, format) {
  const aoa = [d.headers].concat(d.rows.map((r) => r.map((v, i) => ((d.textColumns || []).indexOf(i) >= 0 ? String(v === null || v === undefined ? '' : v) : v))));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  (d.textColumns || []).forEach((c) => { for (let r = 1; r < aoa.length; r++) { const a = XLSX.utils.encode_cell({ r, c }); if (ws[a]) { ws[a].t = 's'; ws[a].z = '@'; } } });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  if (d.note) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['CATATAN'], [d.note]]), 'CATATAN');
  XLSX.writeFile(wb, d.fileName + (format === 'csv' ? '.csv' : '.xlsx'), { bookType: format === 'csv' ? 'csv' : 'xlsx' });
}

// ---------------------------------------------------------------- layout & router
const NAV = [
  ['Utama', [['', 'Dashboard'], ['registrasi', 'Registrasi Produk', 'product.write'], ['produk', 'Direktori Produk'], ['persetujuan', 'Persetujuan', null, true]]],
  ['Master Data', [['referensi', 'Brand & Kategori'], ['barcode', 'Barcode'], ['sku', 'SKU & Kemasan'], ['kualitas', 'Kualitas Data']]],
  ['Integrasi', [['import', 'Import & Export', 'export.run'], ['mapping', 'Mapping BeeCloud/Shopee']]],
  ['Administrasi', [['audit', 'Audit Trail', 'audit.read'], ['pengguna', 'Pengguna', 'user.manage'], ['pengaturan', 'Pengaturan & Profil']]],
];
const ROUTES_UI = {};
function route(name, fn) { ROUTES_UI[name] = fn; }

function renderShell() {
  $('#root').innerHTML = `<div class="app">
    <aside class="side" id="side">
      <div class="logo"><div class="logo-box">▥</div><div><b>Master Produk</b><span>Toko Kosmetik</span></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="me"><div class="avatar">${esc(S.user.fullName.slice(0, 1))}</div><div class="grow"><div style="font-weight:500">${esc(S.user.fullName)}</div><div class="tiny muted">${esc({ admin: 'Admin', data_entry: 'Data Entry', reviewer: 'Reviewer', viewer: 'Viewer' }[S.user.role])}</div></div><a title="Keluar" id="logout">⎋</a></div>
    </aside>
    <div class="grow" style="min-width:0">
      <div class="topbar"><a id="burger" style="font-size:20px">☰</a><b>Master Produk</b></div>
      <main class="main" id="main"></main>
    </div></div>`;
  $('#logout').onclick = async () => { await call('auth.logout').catch(() => {}); setToken(null); S.user = null; renderLogin(); };
  $('#burger').onclick = () => $('#side').classList.toggle('open');
  drawNav();
  refreshPending();
}
function drawNav() {
  const cur = (location.hash.replace(/^#\/?/, '').split('/')[0]) || '';
  $('#nav').innerHTML = NAV.map(([g, items]) => {
    const vis = items.filter((i) => !i[2] || can(i[2]));
    return vis.length ? `<div class="grp">${g}</div>` + vis.map((i) => `<a href="#/${i[0]}" class="${cur === i[0] ? 'on' : ''}"><span>${i[1]}</span>${i[3] && S.pending ? `<span class="pill">${S.pending}</span>` : ''}</a>`).join('') : '';
  }).join('');
}
function refreshPending() { call('request.list', { status: 'pending_review' }).then((r) => { S.pending = r.length; drawNav(); }).catch(() => {}); }

function go(path) { location.hash = '#/' + path; }
async function router() {
  if (!S.user) return;
  if (!$('#main')) renderShell();
  $('#side').classList.remove('open');
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const fn = ROUTES_UI[parts[0] || ''] || ROUTES_UI[''];
  drawNav();
  const main = $('#main');
  main.innerHTML = spinner();
  try { await fn(main, parts.slice(1)); } catch (e) { main.innerHTML = errHtml(e) + `<button class="btn sec mt" onclick="router()">Coba lagi</button>`; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', router);

function renderLogin(msg) {
  $('#root').innerHTML = `<div class="login"><div class="card"><div class="cb">
    <div style="text-align:center;margin-bottom:16px"><div class="logo-box" style="margin:0 auto 8px;width:44px;height:44px">▥</div><h1>Master Produk & SKU</h1><div class="sub">Single source of truth untuk BeeCloud & Shopee</div></div>
    <form id="lf" class="grid"><label class="f"><span>Email</span><input type="email" id="le" required autocomplete="username"></label>
    <label class="f"><span>Password</span><input type="password" id="lp" required autocomplete="current-password"></label>
    <div id="lerr">${msg ? alertBox('warn', msg) : ''}</div><button class="btn" style="justify-content:center">Masuk</button></form>
    <div class="small muted mt" style="text-align:center">Lupa password? Hubungi Admin toko.</div></div></div></div>`;
  $('#lf').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#lf button'); btn.disabled = true;
    try {
      const r = await call('auth.login', { email: $('#le').value, password: $('#lp').value });
      setToken(r.token); S.user = r.user; S.perms = r.permissions; renderShell(); router();
    } catch (err) { $('#lerr').innerHTML = errHtml(err); btn.disabled = false; }
  };
}

window.addEventListener('load', async () => {
  if (!S.token) return renderLogin();
  try { const r = await call('auth.me'); S.user = r.user; S.perms = r.permissions; renderShell(); router(); }
  catch (e) { renderLogin(); }
});
</script>
