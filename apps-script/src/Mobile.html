<script>
/* ═════════════ Pengalaman operasional (HP-first): Scan, Aktivitas, Akun, Beranda HP ═════════════
 * Scan = fitur utama: kamera tetap menyala di halaman, decoding berhenti sementara setelah kode terbaca (tidak scan
 * berulang), hasil dicek ke server (barcode.lookup: konflik, barcode internal, check digit), lalu tindakan sesuai hasil.
 */

/**
 * Bunyi bip saat barcode terbaca (Web Audio, tanpa file suara). Browser HP baru mengizinkan suara setelah layar
 * disentuh, jadi audio "dibuka" pada sentuhan pertama. Bisa dimatikan dari tombol Bunyi di halaman Scan.
 */
var Beep = {
  ctx: null,
  on: function () { return Store.get('rpm_beep') !== '0'; },
  unlock: function () {
    try {
      if (!Beep.ctx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return; Beep.ctx = new A(); }
      if (Beep.ctx.state === 'suspended') Beep.ctx.resume();
    } catch (e) {}
  },
  play: function () {
    if (!Beep.on()) return;
    Beep.unlock();
    var c = Beep.ctx; if (!c) return;
    try {
      // meniru buzzer piezo scanner kasir: nada ~2,7 kHz, keras-datar ±110 ms, putus tegas (bukan memudar)
      var t = c.currentTime, d = 0.11, o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(2730, t);
      f.type = 'bandpass'; f.frequency.value = 2730; f.Q.value = 1.4; // resonansi piezo, harmonik kasar diredam
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5, t + 0.003);
      g.gain.setValueAtTime(0.5, t + d - 0.004); g.gain.linearRampToValueAtTime(0, t + d);
      o.connect(f); f.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.01);
    } catch (e) {}
  }
};
['pointerdown', 'touchend', 'keydown'].forEach(function (ev) { document.addEventListener(ev, Beep.unlock, { passive: true, capture: true }); });

/** Pemindai di dalam halaman. el = <video>. → { pause, resume, stop, torch(on), hasTorch } */
CamScan.mount = function (video, o) {
  var stream = null, reader = null, timer = null, stopped = false, paused = false, last = '', count = 0, track = null;
  var lastHit = '', coolUntil = 0, seenAt = {}; // mode terus-menerus (o.continuous)
  var ctl = { hasTorch: false };
  var accept = function (raw) {
    var code = String(raw || '').replace(/\s+/g, '').trim();
    if (!code || paused || stopped) return;
    var now = Date.now();
    if (o.continuous) {
      // barcode yang baru dibaca masih di depan kamera → abaikan; terbaca lagi setelah 1,5 dtk tidak terlihat
      var seen = seenAt[code] || 0; seenAt[code] = now;
      if (code === lastHit) { if (now - seen < 1500) return; lastHit = ''; }
      if (now < coolUntil) return;
    }
    if (code === last) count++; else { last = code; count = 1; }
    // EAN/UPC dengan check digit benar cukup sekali terbaca; kode lain dua kali sama → kurangi salah baca
    if (count < 2 && !gtinOk(code)) return;
    count = 0;
    if (o.continuous) { lastHit = code; coolUntil = now + 900; } else paused = true;
    Beep.play();
    if (navigator.vibrate) navigator.vibrate(60);
    o.onCode(code);
  };
  ctl.running = function () { return !!stream && !stopped; };
  ctl.pause = function () { paused = true; };
  ctl.resume = function () { paused = false; last = ''; count = 0; lastHit = ''; };
  ctl.stop = function () {
    stopped = true;
    clearTimeout(timer);
    try { if (reader) reader.reset(); } catch (e) {}
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null;
    try { video.srcObject = null; } catch (e) {}
  };
  ctl.torch = function (on) { if (track) return track.applyConstraints({ advanced: [{ torch: !!on }] }).catch(function () {}); };
  if (!CamScan.available()) { o.onState('unavailable', 'Kamera tidak tersedia di perangkat/browser ini. Ketik barcode di bawah.'); return ctl; }
  o.onState('starting', 'Menyalakan kamera…');
  navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } }).then(function (s) {
    if (stopped) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
    stream = s; video.srcObject = s;
    track = s.getVideoTracks()[0];
    var caps = track && track.getCapabilities ? track.getCapabilities() : {};
    ctl.hasTorch = !!caps.torch;
    if (o.onTorch) o.onTorch(ctl.hasTorch);
    return video.play().catch(function () {}).then(function () {
      o.onState('ready', 'Arahkan kamera ke barcode');
      if ('BarcodeDetector' in window) {
        return BarcodeDetector.getSupportedFormats().then(function (sup) {
          var det = new BarcodeDetector({ formats: CamScan.FORMATS.filter(function (f) { return sup.indexOf(f) >= 0; }) });
          var tick = function () {
            if (stopped) return;
            if (paused || video.readyState < 2) { timer = setTimeout(tick, 150); return; }
            det.detect(video).then(function (r) { if (r && r[0]) accept(r[0].rawValue); }).catch(function () {}).then(function () { if (!stopped) timer = setTimeout(tick, 60); });
          };
          tick();
        });
      }
      return CamScan.loadZxing().then(function () {
        if (stopped) return;
        var hints = new Map(), F = ZXing.BarcodeFormat;
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, CamScan.zxingFormats(F));
        reader = new ZXing.BrowserMultiFormatReader(hints, 80);
        reader.decodeFromStream(s, video, function (res) { if (res) accept(res.getText()); });
      });
    });
  }).catch(function (e) {
    var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    var none = e && (e.name === 'NotFoundError' || e.name === 'OverconstrainedError');
    o.onState(denied ? 'denied' : 'unavailable', denied ? 'Izin kamera ditolak. Izinkan kamera untuk aplikasi ini di pengaturan browser, atau ketik barcode di bawah.' : none ? 'Kamera tidak ditemukan di perangkat ini. Ketik barcode di bawah.' : 'Kamera tidak bisa dibuka. Ketik barcode di bawah.');
  });
  return ctl;
};

/** Penyimpanan besar di perangkat (IndexedDB; localStorage dibatasi ±5 MB). Gagal → diam-diam (tetap di memori). */
var IdbKV = {
  p: null,
  open: function () {
    if (IdbKV.p) return IdbKV.p;
    IdbKV.p = new Promise(function (res, rej) {
      try { var r = indexedDB.open('rpm', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; } catch (e) { rej(e); }
    });
    return IdbKV.p;
  },
  get: function (k) { return IdbKV.open().then(function (db) { return new Promise(function (res) { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; }); }).catch(function () { return null; }); },
  set: function (k, v) { return IdbKV.open().then(function (db) { db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); }).catch(function () {}); }
};
/** Cek digit GTIN (EAN-8, UPC-A, EAN-13, GTIN-14) di perangkat. */
function gtinOk(c) {
  if (!/^(\d{8}|\d{12,14})$/.test(c)) return false;
  var d = c.split('').reverse().map(Number), sum = 0;
  for (var i = 1; i < d.length; i++) sum += d[i] * (i % 2 ? 3 : 1);
  return (10 - (sum % 10)) % 10 === d[0];
}

/**
 * Indeks barcode di perangkat: hasil scan SKU terdaftar (termasuk barcode kemasan/BOX) tampil seketika tanpa menunggu
 * jaringan, lalu dipastikan server di belakang layar. Disimpan di IndexedDB per versi data dan dimuat sejak aplikasi
 * dibuka; server hanya mengirim ulang indeks bila datanya berubah. Bila indeks baru saja disinkronkan dan kode tidak
 * tercatat sama sekali, "belum terdaftar" tampil sementara sambil menunggu kepastian server.
 */
var ScanIndex = {
  map: null, known: null, version: '', pending: null, syncedAt: 0,
  key: function () { return 'rpm_bx_' + (App.me ? App.me.user.id : ''); },
  build: function (d) {
    var m = {};
    (d.rows || []).forEach(function (r) { r[0].split(' ').forEach(function (c) { var k = c.toUpperCase(); (m[k] = m[k] || []).push(r); }); });
    var kn = {};
    String(d.known || '').split(' ').forEach(function (c) { if (c) kn[c] = 1; });
    ScanIndex.map = m; ScanIndex.known = d.known !== undefined ? kn : null; ScanIndex.version = d.version;
  },
  /** Indeks dari perangkat (instan) → cek versi ke server (ringan bila tidak berubah). */
  load: function (force) {
    if (ScanIndex.pending) return ScanIndex.pending;
    if (!force && ScanIndex.map && Date.now() - ScanIndex.syncedAt < 60000) return Promise.resolve(null);
    var k = ScanIndex.key(), saved = null;
    var local = ScanIndex.map ? Promise.resolve(null) : IdbKV.get(k).then(function (d) {
      if (!d) { try { d = JSON.parse(Store.get(k) || 'null'); } catch (e) { d = null; } Store.del(k); } // pindahkan simpanan lama
      if (d && !ScanIndex.map) { saved = d; ScanIndex.build(d); }
    });
    ScanIndex.pending = local.then(function () {
      return api('barcode.index', { version: ScanIndex.map ? ScanIndex.version : '' }, { quiet: true, silent: true });
    }).then(function (d) {
      ScanIndex.syncedAt = Date.now();
      if (d.same) return d;
      ScanIndex.build(d);
      IdbKV.set(k, d);
      return d;
    }).catch(function () {}).then(function (x) { ScanIndex.pending = null; return x; });
    return ScanIndex.pending;
  },
  find: function (code) { return ScanIndex.map ? ScanIndex.map[String(code).toUpperCase()] || null : null; },
  /** true = kode pasti tidak tercatat menurut indeks yang baru disinkronkan (≤ 5 menit). */
  surelyNew: function (code) { return !!(ScanIndex.known && Date.now() - ScanIndex.syncedAt < 300000 && !ScanIndex.known[code] && !ScanIndex.find(code)); },
  /** Baris indeks → kartu hasil scan. */
  card: function (r) { return { via: r[8] ? 'Barcode ' + r[8] : 'Data di perangkat', productId: r[2], variantId: r[1], skuName: r[3], sku: r[4], childSku: r[4], gtin: r[5], imageUrl: r[6], productStatus: 'ACTIVE', variantStatus: r[7], conversion: r[8] ? { unitName: r[8], baseUnitEquivalent: r[9], gtin: r[5] } : null }; }
};

/* ───────── Halaman Scan Barcode ───────── */
Pages.scan = function (main, arg) {
  arg = arg || {};
  var seen = {}; // hasil lookup per kode dalam sesi ini (tidak memanggil server berulang)
  var cam = null, torchOn = false, busyCode = '', stTimer = null;
  main.innerHTML = '<div class="sc-head"><button type="button" class="icon-btn" id="sbk" aria-label="Kembali">' + icon('arrowLeft') + '</button><div><h2>Scan Barcode</h2><div class="muted">Arahkan kamera ke barcode produk (EAN / UPC / barcode internal).</div></div></div>' +
    '<div class="sc-stage"><video playsinline muted autoplay></video><div class="cam-frame"><i></i></div><div class="sc-state" id="sst" role="status" aria-live="polite">Menyalakan kamera…</div>' +
    '<button type="button" class="sc-torch hidden" id="stc" aria-pressed="false" aria-label="Senter">' + icon('zap') + '<span>Senter</span></button>' +
    '<button type="button" class="sc-snd" id="ssn" aria-pressed="' + Beep.on() + '" aria-label="Bunyi bip">' + icon(Beep.on() ? 'volume' : 'volumeX') + '</button></div>' +
    '<div id="sres" class="sc-res" aria-live="polite"></div>' +
    '<form class="sc-man" id="sman" autocomplete="off"><input class="in" name="c" inputmode="numeric" enterkeyhint="search" placeholder="Ketik barcode / SKU manual" spellcheck="false" aria-label="Barcode manual"><button class="btn" type="submit">' + icon('search') + 'Cari</button></form>';
  var video = $('video', main), st = $('#sst', main), res = $('#sres', main);
  var state = function (k, t) { st.textContent = t; st.className = 'sc-state ' + k; };
  var again = function () { busyCode = ''; res.innerHTML = ''; if (cam) { cam.resume(); state('ready', 'Arahkan kamera ke barcode'); } };
  var stop = function () { if (cam) cam.stop(); cam = null; };
  App.onLeave = stop; // kamera selalu dilepas saat pindah halaman
  $('#sbk', main).onclick = function () { if (isPhone()) App.back(); else App.go('products'); };

  var card = function (m) {
    var bc = m.conversion ? (m.conversion.gtin || m.conversion.internalBarcode) : (m.gtin || m.internalBarcode);
    return '<div class="sc-sku" data-skp="' + esc(m.productId) + '|' + esc(m.variantId) + '" role="button" tabindex="0">' + (m.imageUrl ? '<img class="ph-th" src="' + esc(m.imageUrl) + '" alt="" loading="lazy">' : '<span class="ph-th ph-none">' + icon('package') + '</span>') +
      '<div class="grow" style="min-width:0"><b>' + esc(m.skuName) + '</b><div class="sc-codes"><span class="sku">' + esc(m.childSku || m.sku) + '</span>' + (bc ? '<span class="code">' + esc(bc) + '</span>' : '') + '</div>' +
      '<div class="sc-meta">' + badge(m.productStatus === 'ACTIVE' ? m.variantStatus : m.productStatus) + '<span class="muted">' + esc(m.via) + (m.conversion ? ' · ' + esc(m.conversion.unitName) + ' isi ' + esc(m.conversion.baseUnitEquivalent) : '') + '</span></div></div>' +
      '<button type="button" class="icon-btn" data-copy="' + esc(m.childSku || m.sku) + '" aria-label="Salin kode SKU" title="Salin kode SKU">' + icon('copy') + '</button></div>';
  };
  var show = function (code, r, verifying) {
    var w = can('product.write'), next = '<div class="sc-next">' + icon('camera') + 'Arahkan kamera ke barcode berikutnya — scan otomatis</div>';
    var html;
    if (r.conflict) {
      html = '<div class="sc-box err">' + icon('alertCircle') + '<div><b>Barcode ' + esc(code) + ' terhubung ke lebih dari satu barang</b><span>Tidak ada data yang diubah. Laporkan ke Admin untuk ditinjau.</span><ul>' + (r.owners || []).map(function (o) { return '<li>' + esc(o.label || '') + '</li>'; }).join('') + '</ul></div></div>' + next;
    } else if (r.matches.length || r.bundles.length) {
      var ms = r.matches.slice(0, 6);
      html = '<div class="sc-box ok">' + icon('check') + '<div><b>' + (ms.length > 1 ? ms.length + ' SKU Produk ditemukan' : 'SKU Produk sudah terdaftar') + '</b><span>Periksa detail sebelum melanjutkan — tidak perlu registrasi ulang.</span></div></div>' +
        ms.map(card).join('') +
        r.bundles.map(function (b) { return '<div class="sc-sku"><span class="ph-th ph-none">' + icon('boxes') + '</span><div class="grow"><b>' + esc(b.bundleName) + '</b><div class="sc-codes"><span class="sku">' + esc(b.bundleSku) + '</span></div><div class="sc-meta">' + badge(b.type) + '<span class="muted">' + esc(b.via) + '</span></div></div></div>'; }).join('') +
        '<div class="sc-acts">' + (ms.length ? '<button type="button" class="st-cta" id="sdt">' + icon('eye') + 'Lihat Detail</button>' : r.bundles.length ? '<button type="button" class="st-cta" id="sbd">' + icon('eye') + 'Lihat Paket</button>' : '') + next + '</div>';
    } else if (r.kind === 'gtin') {
      html = '<div class="sc-box warn">' + icon('search') + '<div><b>Barcode belum terdaftar</b><span>GTIN ' + esc(code) + ' valid' + (r.validation && r.validation.symbology ? ' (' + esc(r.validation.symbology) + ')' : '') + ' tetapi belum dipakai SKU mana pun. ' + (w ? 'Buat registrasi SKU baru? Barcode langsung terisi.' : 'Minta Admin Data mendaftarkannya.') + '</span>' +
        (r.retired && r.retired.length ? '<span>Pernah dipakai lalu dipensiunkan — periksa riwayatnya bila ragu.</span>' : '') + '</div></div>' +
        '<div class="sc-acts">' + (w ? '<button type="button" class="st-cta" id="srg">' + icon('plus') + 'Registrasi SKU Baru</button>' : '') + next + '</div>';
    } else if (r.kind === 'internal') {
      html = '<div class="sc-box warn">' + icon('barcode') + '<div><b>Barcode internal ' + esc(code) + ' belum dipakai SKU</b><span>' + (r.reserved ? 'Sudah dicadangkan, belum ditempel ke barang.' : 'Barcode internal (awalan 2) dibuat oleh sistem saat registrasi SKU tanpa GTIN — tidak bisa didaftarkan sebagai GTIN.') + '</span></div></div>' + next;
    } else if (r.kind === 'invalid_numeric') {
      html = '<div class="sc-box err">' + icon('alertCircle') + '<div><b>Barcode tidak valid</b><span>' + esc(code) + ' — ' + esc((r.validation && r.validation.message) || 'check digit salah') + '. Scan ulang dengan lebih dekat & terang, atau ketik manual.</span></div></div>' + next;
    } else {
      html = '<div class="sc-box warn">' + icon('search') + '<div><b>Tidak ditemukan</b><span>Tidak ada SKU, barcode, atau nama produk yang cocok dengan "' + esc(code) + '".</span></div></div>' + next;
    }
    res.innerHTML = '<div class="sc-code">' + icon('barcode') + '<span class="code">' + esc(code) + '</span>' + (verifying ? '<span class="sc-verify"><span class="spinner"></span>memastikan…</span>' : '') + '</div>' + html;
    var b;
    if ((b = $('#snx', res))) b.onclick = again;
    // detail SKU dalam pop-up; kamera berhenti membaca selama pop-up terbuka
    var pop = function (mt) { if (cam) cam.pause(); skuDetail(mt.productId, mt.variantId, { img: mt.imageUrl, sku: mt.childSku || mt.sku, name: mt.skuName, gtin: mt.gtin, internal: mt.internalBarcode, status: mt.variantStatus, attrs: [] }, { onClose: function () { if (cam) cam.resume(); } }); };
    if ((b = $('#sdt', res))) b.onclick = function () { pop(r.matches[0]); };
    $$('[data-skp]', res).forEach(function (el, i) { el.onclick = function (e) { if (e.target.closest('[data-copy]')) return; pop(r.matches[i]); }; });
    if ((b = $('#sbd', res))) b.onclick = function () { App.go('bundle', r.bundles[0].bundleId); };
    if ((b = $('#srg', res))) b.onclick = function () { App.go('register', { gtin: code }); };
    $$('[data-copy]', res).forEach(function (x) { x.onclick = function () { copyText(x.getAttribute('data-copy')); }; });
  };
  var lookup = function (code) {
    if (busyCode === code) return; // kode yang sama sedang diproses
    busyCode = code;
    state('found', 'Barcode terbaca: ' + code);
    clearTimeout(stTimer);
    stTimer = setTimeout(function () { if (cam && cam.running()) state('ready', 'Siap scan barcode berikutnya'); }, 1800);
    if (seen[code]) return show(code, seen[code]);
    var local = ScanIndex.find(code);
    if (local) {
      show(code, { kind: 'local', conflict: false, matches: local.map(ScanIndex.card), bundles: [] }, true);
    } else if (/^\d+$/.test(code) && ScanIndex.surelyNew(code)) {
      // kode tidak tercatat di indeks yang baru disinkronkan → tampilkan hasilnya sekarang, server memastikan
      local = true;
      var valid = gtinOk(code), kind = valid ? (/^(2|02|04)/.test(code) ? 'internal' : 'gtin') : code.length >= 8 ? 'invalid_numeric' : 'text';
      show(code, { kind: kind, matches: [], bundles: [], validation: valid ? { ok: true } : { ok: false, message: 'check digit salah' } }, true);
    }
    if (!local) res.innerHTML = '<div class="sc-code">' + icon('barcode') + '<span class="code">' + esc(code) + '</span></div>' + loadingBox('Mencari di master SKU…');
    var current = function () { return busyCode === code; }; // jawaban lama tidak menimpa scan berikutnya
    api('barcode.lookup', { code: code }, { silent: true, quiet: true }).then(function (r) { seen[code] = r; if (current()) show(code, r); })
      .catch(function (e) {
        if (!current()) return;
        if (local) { var v = $('.sc-verify', res); if (v) v.innerHTML = icon('alert') + 'belum terverifikasi (offline)'; return; }
        busyCode = '';
        res.innerHTML = '<div class="sc-box err">' + icon('alertCircle') + '<div><b>Data belum berhasil dimuat</b><span>' + esc(e.code === 'FORBIDDEN' ? 'Anda tidak punya akses melihat data SKU.' : 'Periksa koneksi lalu coba lagi.') + '</span></div></div><div class="sc-acts"><button type="button" class="st-cta" id="srt">' + icon('refresh') + 'Coba Lagi</button><button type="button" class="btn big w100" id="snx">Scan Ulang</button></div>';
        $('#srt', res).onclick = function () { lookup(code); };
        $('#snx', res).onclick = again;
      });
  };
  $('#sman', main).onsubmit = function (e) { e.preventDefault(); var c = this.c.value.replace(/\s+/g, '').trim(); if (!c) return; this.c.blur(); busyCode = ''; lookup(c); };
  var tb = $('#stc', main);
  tb.onclick = function () { torchOn = !torchOn; if (cam) cam.torch(torchOn); tb.classList.toggle('on', torchOn); tb.setAttribute('aria-pressed', torchOn ? 'true' : 'false'); };
  ScanIndex.load(true); // indeks perangkat + cek versi ke server (sekaligus memanaskan indeks server)
  var sn = $('#ssn', main);
  sn.onclick = function () { var on = !Beep.on(); Store.set('rpm_beep', on ? '1' : '0'); sn.innerHTML = icon(on ? 'volume' : 'volumeX'); sn.setAttribute('aria-pressed', on ? 'true' : 'false'); toast(on ? 'Bunyi bip aktif' : 'Bunyi bip dimatikan'); if (on) Beep.play(); };
  var camOpts = { continuous: true, onCode: lookup, onState: state, onTorch: function (has) { tb.classList.toggle('hidden', !has); } };
  cam = CamScan.mount(video, camOpts);
  // aplikasi ke latar belakang → kamera dimatikan; kembali terlihat → hanya kamera yang dinyalakan lagi
  // (hasil scan di layar tetap; dialog izin kamera yang sempat menyembunyikan halaman tidak menghapus apa pun)
  var suspended = false;
  var onVis = function () {
    if (document.hidden) { if (cam && cam.running && cam.running()) { cam.stop(); cam = null; suspended = true; } }
    else if (suspended) { suspended = false; torchOn = false; tb.classList.remove('on'); cam = CamScan.mount(video, camOpts); }
  };
  document.addEventListener('visibilitychange', onVis);
  App.onLeave = function () { stop(); clearTimeout(stTimer); document.removeEventListener('visibilitychange', onVis); };
  if (arg.code) lookup(String(arg.code));
};
window.addEventListener('pagehide', function () { if (App.onLeave) { App.onLeave(); App.onLeave = null; } });

function copyText(t) {
  var done = function () { toast('Disalin: ' + t, 'ok'); };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(done).catch(function () { toast('Tidak bisa menyalin', 'err'); });
  var x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('Tidak bisa menyalin', 'err'); }
  x.remove();
}

/* ───────── Aktivitas (riwayat registrasi & perubahan) ───────── */
Pages.activity = function (main) {
  var f = { mine: true, page: 1 }, rows = [];
  main.innerHTML = '<div class="st-head"><h2>Aktivitas</h2></div><div class="st-chips" id="ac"><button type="button" data-m="1" class="on">Aktivitas saya</button><button type="button" data-m="0">Semua</button></div><div id="al">' + loadingBox() + '</div>';
  var link = function (a) { return a.entityType === 'product' ? a.entityId : ''; };
  var load = function (more) {
    if (!more) { f.page = 1; rows = []; $('#al', main).innerHTML = loadingBox(); }
    api('audit.list', { actor: f.mine ? App.me.user.email : '', page: f.page }, { quiet: true }).then(function (d) {
      rows = rows.concat(d.rows);
      $('#al', main).innerHTML = rows.length ? '<ul class="act-list">' + rows.map(function (a, i) {
        var pid = link(a);
        return '<li' + (pid ? ' data-pid="' + esc(pid) + '" role="button" tabindex="0"' : '') + '><span class="act-dot"></span><div class="grow"><b>' + esc(actionLabel(a.action)) + '</b><div class="muted">' + esc(String(a.actor || '').split('@')[0]) + ' · ' + fmtDate(a.createdAt) + '</div></div>' + (pid ? icon('arrowRight') : '') + '</li>';
      }).join('') + '</ul>' + (d.page < d.pages ? '<button class="btn big w100" id="amr" type="button">Muat lebih banyak</button>' : '') : emptyBox('Belum ada aktivitas', f.mine ? 'Registrasi & perubahan yang Anda lakukan akan muncul di sini.' : '', 'activity');
      $$('[data-pid]', main).forEach(function (li) { li.onclick = function () { App.go('product', li.getAttribute('data-pid')); }; });
      var m = $('#amr', main); if (m) m.onclick = function () { f.page++; m.disabled = true; load(true); };
    }).catch(function (e) { $('#al', main).innerHTML = errBox(e.code === 'FORBIDDEN' ? 'Riwayat aktivitas hanya untuk Admin & Admin Data.' : e.message); });
  };
  $$('#ac [data-m]', main).forEach(function (b) { b.onclick = function () { $$('#ac [data-m]', main).forEach(function (x) { x.classList.toggle('on', x === b); }); f.mine = b.getAttribute('data-m') === '1'; load(); }; });
  load();
};

/* ───────── Menu (HP): semua menu per kelompok + profil + keluar ───────── */
var MENU_GROUPS = [
  ['Manajemen Produk', [['register', 'Registrasi Produk', 'plus', 'product.write'], ['brands', 'Brand', 'tag'], ['categories', 'Kategori', 'layers'], ['bundles', 'Kemasan & Bundling', 'boxes'], ['photos', 'Foto Produk', 'image', 'photo.manage'], ['quality', 'Kualitas Data', 'shield'], ['barcodes', 'Barcode', 'barcode']]],
  ['Integrasi', [['mapping', 'Channel SKU Mapping', 'link'], ['io', 'Import & Export', 'upload', 'export.run']]],
  ['Sistem', [['users', 'Pengguna & Hak Akses', 'users', 'user.manage'], ['settings', 'Pengaturan', 'sliders'], ['audit', 'Audit Log', 'activity', 'audit.read']]]
];
Pages.account = function (main) {
  var u = App.me.user;
  var row = function (n) { return '<button type="button" data-go="' + n[0] + '">' + icon(n[2]) + '<span class="grow">' + esc(n[1]) + '</span>' + icon('arrowRight') + '</button>'; };
  main.innerHTML = '<div class="acc-card"><span class="avatar">' + esc(initials(u.fullName)) + '</span><div class="grow"><b>' + esc(u.fullName) + '</b><div class="muted">' + esc(u.email) + ' · ' + esc(STATUS_TXT[u.role] || u.role) + '</div></div></div>' +
    MENU_GROUPS.map(function (g) {
      var links = g[1].filter(function (n) { return can(n[3] || 'product.read'); });
      return links.length ? '<div class="acc-sec">' + esc(g[0]) + '</div><div class="acc-list">' + links.map(row).join('') + '</div>' : '';
    }).join('') +
    '<div class="acc-sec">Akun</div><div class="acc-list">' + row(['profile', 'Profil & ganti password', 'lock']) + '</div>' +
    '<button type="button" class="btn big w100" id="alo">' + icon('logout') + 'Keluar</button><div class="muted acc-ver">' + 'SMS · ' + esc(APP_NAME) + '</div>';
  $$('[data-go]', main).forEach(function (b) { b.onclick = function () { App.go(b.getAttribute('data-go')); }; });
  $('#alo', main).onclick = function () { ask('Keluar dari aplikasi?', 'Keluar').then(function (y) { if (y) App.logout(); }); };
};

/* ───────── Dashboard versi HP: angka & kelengkapan data sekilas ───────── */
function mobileHome(main, d) {
  var c = d.counts, L = d.logistics || {}, n = c.variants || 0, u = App.me.user;
  var pc = function (x) { return n ? Math.round((x || 0) / n * 100) : 0; };
  var hasBc = (c.withGtin || 0) + (c.withInternal || 0);
  var score = Math.round((pc(hasBc) + pc(L.photo) + pc(L.weight)) / 3);
  var tone = function (p) { return p >= 90 ? 'ok' : p >= 50 ? 'mid' : 'low'; };
  var kpi = function (ic, v, label, sub, go) { return '<button type="button" class="mk" data-go="' + go + '"><span class="mk-i">' + icon(ic) + '</span><b>' + fmtNum(v || 0) + '</b><span class="mk-l">' + label + '</span>' + (sub ? '<small>' + sub + '</small>' : '') + '</button>'; };
  var meter = function (label, have, missTxt, go) {
    var p = pc(have), miss = n - (have || 0);
    return '<button type="button" class="dmeter ' + tone(p) + '"' + (go ? ' data-cm="' + go + '"' : '') + '><div class="dm-h"><b>' + label + '</b><span class="dm-p">' + p + '%</span></div><div class="dm-t"><i style="width:' + p + '%"></i></div><div class="dm-s">' + (miss > 0 ? '<b class="tx-err">' + fmtNum(miss) + '</b> ' + missTxt : 'Semua lengkap') + '</div></button>';
  };
  var bars = function (list) {
    if (!list || !list.length) return '<div class="muted">Belum ada data.</div>';
    var max = Math.max.apply(null, list.map(function (b) { return b.n; }).concat([1]));
    return '<div class="dbrands">' + list.map(function (b) { return '<div class="dbr"><div class="dbr-n"><b>' + esc(b.name) + '</b>' + (b.parents ? '<span>' + fmtNum(b.parents) + ' SKU Induk</span>' : '') + '</div><div class="dbr-t"><i style="width:' + Math.max(3, Math.round(b.n / max * 100)) + '%"></i></div><b class="dbr-v">' + fmtNum(b.n) + '</b></div>'; }).join('') + '</div>';
  };
  var R = 34, CIRC = 2 * Math.PI * R;
  var donut = '<svg viewBox="0 0 80 80" class="mdonut ' + tone(score) + '"><circle cx="40" cy="40" r="' + R + '" class="tr"/><circle cx="40" cy="40" r="' + R + '" class="vl" stroke-dasharray="' + (CIRC * score / 100).toFixed(1) + ' ' + CIRC.toFixed(1) + '" transform="rotate(-90 40 40)"/><text x="40" y="46" text-anchor="middle">' + score + '%</text></svg>';
  main.innerHTML = '<div id="db-body" class="mh"><div class="mh-hello"><div class="muted">Halo, ' + esc(String(u.fullName || '').split(' (')[0]) + '</div><h2>Dashboard</h2></div>' +
    '<div class="mk4">' +
      kpi('tag', c.brands, 'Brand', '', 'brands') +
      kpi('package', c.products, 'SKU Induk', c.drafts ? fmtNum(c.drafts) + ' draft' : '', 'products') +
      kpi('layers', n, 'SKU Produk', c.skus > n ? '+' + fmtNum(c.skus - n) + ' SKU kemasan' : '', 'products') +
      kpi('grid', c.categories, 'Kategori', '', 'categories') +
    '</div>' +
    '<div class="mh-card"><div class="mc-h">' + donut + '<div><h3>Kelengkapan data</h3><div class="muted">Rata-rata barcode, foto &amp; berat dari ' + fmtNum(n) + ' SKU Produk aktif</div></div></div>' +
      '<div class="dmeters">' +
        meter('Barcode', hasBc, 'tanpa barcode', 'incomplete') +
        meter('Foto produk', L.photo, 'tanpa foto', 'photos') +
        meter('Berat satuan', L.weight, 'tanpa berat', 'noweight') +
        meter('Kemasan BOX', L.box, 'tanpa BOX (opsional)', '') +
      '</div></div>' +
    '<div class="mh-sec"><h3>Perlu tindakan</h3><div id="mhp">' + loadingBox() + '</div></div>' +
    '<div class="mh-card"><h3>SKU Produk per brand</h3>' + bars(d.byBrand) + '</div>' +
    '<div class="mh-card"><h3>SKU Produk per kategori</h3>' + bars(d.byCategory) + '</div></div>';
  $$('[data-go]', main).forEach(function (b) { b.onclick = function () { App.go(b.getAttribute('data-go')); }; });
  $$('[data-cm]', main).forEach(function (b) {
    var k = b.getAttribute('data-cm');
    b.onclick = function () { if (k === 'photos') App.go(can('photo.manage') ? 'photos' : 'products', { filter: 'none', completeness: 'nophoto' }); else App.go('products', { completeness: k }); };
  });
  var pend = [];
  if (c.drafts) pend.push(['edit', fmtNum(c.drafts) + ' SKU Induk masih draft', 'Selesaikan & verifikasi', function () { App.go('products', { status: 'DRAFT' }); }]);
  api('quality.get', {}, { quiet: true, silent: true }).then(function (q) {
    q.sections.filter(function (s) { return s.count && s.severity === 'error'; }).forEach(function (s) { pend.unshift(['alertCircle', s.label + ' (' + fmtNum(s.count) + ')', 'Harus diperbaiki', function () { App.go('quality'); }]); });
  }).catch(function () {}).then(function () {
    var el = $('#mhp', main); if (!el) return;
    el.innerHTML = pend.length ? '<div class="dtodo">' + pend.slice(0, 5).map(function (p, i) { return '<button type="button" class="dt warn" data-p="' + i + '"><span class="dt-i">' + icon(p[0]) + '</span><span class="dt-l"><b>' + esc(p[1]) + '</b><small>' + esc(p[2]) + '</small></span>' + icon('arrowRight') + '</button>'; }).join('') + '</div>'
      : '<div class="dempty ok">' + icon('check') + '<div><b>Semua beres</b><span>Tidak ada pekerjaan tertunda.</span></div></div>';
    $$('[data-p]', el).forEach(function (b) { b.onclick = pend[Number(b.getAttribute('data-p'))][3]; });
  });
}
</script>
