<script>
/* ═════════════ Halaman operasional: Data Quality, Packaging & Bundle, Channel SKU Mapping (modul supplier dihapus di v5; data lama tetap di sheet) ═════════════ */

/** Searchable dropdown SKU (SKU produk / kemasan / bundle aktif). */
function skuCombo(host, kinds, onChange, placeholder, value) {
  return combo(host, {
    value: value || null, placeholder: placeholder || 'Cari SKU, nama, atau barcode…',
    load: function (q) { return api('sku.search', { q: q, kinds: kinds }, { quiet: true, silent: true }); },
    label: function (it) { return it.sku + ' — ' + it.displayName; }, sub: function (it) { return (it.kind === 'bundle' ? 'Paket' : it.kind === 'pack' ? 'Kemasan' : 'SKU produk') + (it.barcode ? ' · ' + it.barcode : ''); },
    empty: 'Tidak ada SKU aktif yang cocok', onChange: onChange
  });
}
function feList(err) { return '<ul class="err-list">' + (err.details && err.details.length ? err.details : [{ message: err.message }]).map(function (d) { return '<li>' + icon('alertCircle') + '<div>' + esc(d.message) + '</div></li>'; }).join('') + '</ul>'; }

/* ───────── Data Quality ───────── */
Pages.quality = function (main) {
  main.innerHTML = pageHead('Master data', 'Kualitas Data', '<button class="btn" id="rq">' + icon('refresh') + 'Periksa ulang</button>', 'Deteksi duplikasi & inkonsistensi master data. Sistem hanya memberi rekomendasi — tidak ada merge otomatis.') + '<div id="qb">' + loadingBox('Memeriksa master data…') + '</div>';
  masterTabs(main, 'quality');
  var load = function () {
    $('#qb', main).innerHTML = loadingBox('Memeriksa master data…');
    api('quality.get').then(function (q) {
      var sev = { error: ['ERR', 'Harus diperbaiki'], warn: ['NONE', 'Perlu dicek'], info: ['CHECK', 'Info'] };
      $('#qb', main).innerHTML = '<div class="kpi4" style="grid-template-columns:repeat(3,minmax(0,1fr))">' +
        '<div class="kpi ' + (q.summary.error ? 'alert' : '') + '"><div class="top"><span class="chip">' + icon('alertCircle') + '</span>Harus diperbaiki</div><div class="v">' + fmtNum(q.summary.error) + '</div><div class="s">identitas ganda / konflik / tidak konsisten</div></div>' +
        '<div class="kpi"><div class="top"><span class="chip">' + icon('alert') + '</span>Perlu dicek</div><div class="v">' + fmtNum(q.summary.warn) + '</div><div class="s">kandidat duplikat, SKU tidak aktif terpakai</div></div>' +
        '<div class="kpi"><div class="top"><span class="chip">' + icon('barcode') + '</span>Info</div><div class="v">' + fmtNum(q.summary.info) + '</div><div class="s">kelengkapan data</div></div></div>' +
        q.sections.map(function (s, i) {
          var cols = s.rows.length ? Object.keys(s.rows[0]).filter(function (k) { return ['productId', 'productId2', 'bundleId'].indexOf(k) < 0; }) : [];
          return '<div class="vcard' + (s.count && s.severity !== 'info' ? ' open' : '') + '" data-q="' + i + '"><div class="vcard-h">' + icon('chevron', 'chev') + '<span class="badge b-' + sev[s.severity][0] + '">' + sev[s.severity][1] + '</span><span class="nm">' + esc(s.label) + '</span><span class="right"><b>' + s.count + '</b></span></div>' +
            '<div class="vcard-b"><div class="info-box">' + icon('zap') + '<span>' + esc(s.recommendation) + '</span></div>' +
            (s.count ? '<div class="tbl-x" style="margin-top:10px"><table class="t"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>' + s.rows.map(function (r) {
              return '<tr>' + cols.map(function (c) { return '<td>' + (c === 'status' ? badge(r[c]) : esc(r[c] === null || r[c] === undefined ? '' : r[c])) + '</td>'; }).join('') + '<td class="nowrap">' + (r.productId ? '<button class="btn sm ghost" data-p="' + esc(r.productId) + '">Buka</button>' : '') + (r.productId2 ? '<button class="btn sm ghost" data-p="' + esc(r.productId2) + '">Buka 2</button>' : '') + (r.bundleId ? '<button class="btn sm ghost" data-b="' + esc(r.bundleId) + '">Bundle</button>' : '') + '</td></tr>';
            }).join('') + '</tbody></table></div>' : '<div class="muted" style="margin-top:8px">Tidak ada temuan.</div>') + '</div></div>';
        }).join('') + '<div class="hint">Diperiksa ' + fmtDate(q.checkedAt) + '</div>';
      $$('.vcard-h', main).forEach(function (h) { h.onclick = function () { h.parentNode.classList.toggle('open'); }; });
      $$('[data-p]', main).forEach(function (b) { b.onclick = function () { App.go('product', b.getAttribute('data-p')); }; });
      $$('[data-b]', main).forEach(function (b) { b.onclick = function () { bundleEditor(b.getAttribute('data-b')); }; });
    }).catch(function (e) { $('#qb', main).innerHTML = errBox(e.message); });
  };
  $('#rq', main).onclick = load;
  load();
};

/* ───────── Packaging & Bundle ───────── */
Pages.bundles = function (main, arg) {
  var w = can('product.write');
  var tab = arg && arg.tab || 'bundle';
  main.innerHTML = pageHead('Operasional', 'Paket & Kemasan', w ? '<button class="btn pri" id="nb">' + icon('plus') + 'Buat paket</button>' : '',
    '') +
    '<div class="dtabs"><a data-t="bundle" class="' + (tab === 'bundle' ? 'on' : '') + '">Paket</a><a data-t="pack" class="' + (tab === 'pack' ? 'on' : '') + '">Konversi kemasan</a></div><div id="bb"></div>';
  $$('[data-t]', main).forEach(function (a) { a.onclick = function () { App.go('bundles', { tab: a.getAttribute('data-t') }); }; });
  if ($('#nb', main)) $('#nb', main).onclick = function () { bundleEditor(null); };
  var box = $('#bb', main);
  if (tab === 'pack') {
    box.innerHTML = loadingBox();
    return api('export.data', { kind: 'conversions' }).then(function (d) {
      var rows = d.rows.filter(function (r) { return r[10] !== 'Satuan dasar'; });
      box.innerHTML = '<div class="toolbar"><div class="search">' + icon('search') + '<input class="in" id="pq" placeholder="Cari produk / SKU / satuan…"></div><span class="muted right">' + rows.length + ' konfigurasi kemasan</span></div><div id="pt"></div>';
      var draw = function (q) {
        var list = q ? rows.filter(function (r) { return r.join(' ').toLowerCase().indexOf(q.toLowerCase()) >= 0; }) : rows;
        $('#pt', box).innerHTML = list.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Produk / varian</th><th>SKU produk</th><th>Kemasan</th><th>= satuan dasar</th><th>Jenis</th><th>Berlaku sejak</th><th>Status</th></tr></thead><tbody>' + list.slice(0, 500).map(function (r) {
          return '<tr><td><b>' + esc(r[2]) + '</b><div class="muted" style="font-size:11.5px">' + esc(r[3]) + ' · ' + esc(r[0]) + '</div></td><td class="sku">' + esc(r[4]) + '</td><td>1 ' + esc(r[5]) + ' = ' + r[6] + ' ' + esc(r[7]) + '</td><td><b>' + fmtNum(r[8]) + '</b> ' + esc(r[9]) + '</td><td>' + esc(r[10]) + (r[11] ? ' <span class="sku">' + esc(r[11]) + '</span>' : '') + '</td><td class="nowrap muted">' + fmtDate(r[13], false) + '</td><td>' + esc(r[14]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="tablewrap">' + emptyBox('Belum ada konfigurasi kemasan', 'Atur BOX/KARTON di Edit produk → Kemasan.', 'boxes') + '</div>';
      };
      $('#pq', box).oninput = debounce(function (e) { draw(e.target.value); }, 200);
      draw('');
    }).catch(function (e) { box.innerHTML = errBox(e.message); });
  }
  var f = { search: '', type: '', status: '', page: 1 };
  box.innerHTML = '<div class="filters"><div class="search">' + icon('search') + '<input class="in" id="bq" placeholder="Cari kode paket, nama, isi…"></div><select class="in" id="bt"><option value="">Semua jenis</option><option value="MULTIPACK">Paket Produk Sama</option><option value="MIXED">Paket Kombinasi</option><option value="REQUEST_MIX">Paket Pilih Sendiri</option></select><select class="in" id="bs"><option value="">Aktif & draft</option><option value="ACTIVE">Aktif</option><option value="INACTIVE">Nonaktif</option><option value="DISCONTINUED">Discontinued</option><option value="all">Semua</option></select></div><div id="bl"></div>';
  var load = function () {
    var bl = $('#bl', box); bl.innerHTML = loadingBox();
    api('bundle.list', f).then(function (d) {
      bl.innerHTML = d.rows.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Kode Paket</th><th>Nama</th><th>Jenis</th><th>Isi paket</th><th class="num">Total isi</th><th>Stok</th><th>Status</th><th></th></tr></thead><tbody>' + d.rows.map(function (b) {
        return '<tr' + (b.status !== 'ACTIVE' ? ' class="off"' : '') + '><td class="sku">' + esc(b.sku) + (b.barcode ? '<div class="code muted" style="font-size:11.5px">' + esc(b.barcode) + '</div>' : '') + '</td><td><b>' + esc(b.name) + '</b></td><td>' + badge(b.type) + (b.type === 'REQUEST_MIX' ? '<div class="muted" style="font-size:11.5px">pilih ' + b.pickQuantity + '</div>' : '') + '</td>' +
          '<td>' + b.components.map(function (c) { return '<div>' + (b.type === 'REQUEST_MIX' ? 'maks ' : '') + c.quantity + ' × <span class="sku">' + esc(c.sku) + '</span> ' + esc(c.name) + (c.skuStatus !== 'ACTIVE' ? ' ' + badge(c.skuStatus) : '') + '</div>'; }).join('') + '</td><td class="num">' + (b.type === 'REQUEST_MIX' ? b.pickQuantity : b.components.reduce(function (n, c) { return n + c.quantity; }, 0)) + '</td><td>' + badge(b.stockMode) + '</td><td>' + badge(b.status) + '</td><td><button class="btn sm" data-e="' + esc(b.id) + '">' + icon('eye') + 'Buka</button></td></tr>';
      }).join('') + '</tbody></table></div>' + pager(d, function (p) { f.page = p; load(); }) : '<div class="tablewrap">' + emptyBox('Belum ada paket', '', 'boxes') + '</div>';
      $$('[data-e]', bl).forEach(function (b) { b.onclick = function () { bundleEditor(b.getAttribute('data-e'), load); }; });
    }).catch(function (e) { bl.innerHTML = errBox(e.message); });
  };
  Pages.bundles.reload = load;
  $('#bq', box).oninput = debounce(function (e) { f.search = e.target.value; f.page = 1; load(); }, 300);
  $('#bt', box).onchange = function (e) { f.type = e.target.value; f.page = 1; load(); };
  $('#bs', box).onchange = function (e) { f.status = e.target.value; f.page = 1; load(); };
  load();
};
/** Editor bundle (baru / ubah) + ubah status + simulasi komposisi request mix. */
function bundleEditor(id, done) {
  var after = function () { if (done) done(); else if (App.page === 'bundles' && Pages.bundles.reload) Pages.bundles.reload(); };
  var open = function (b) {
    b = b || { type: 'MULTIPACK', stockMode: 'VIRTUAL', components: [], status: 'DRAFT' };
    var w = can('product.write') && b.status !== 'ARCHIVED';
    var comps = b.components.map(function (c) { return { variantId: c.variantId, sku: c.sku, displayName: c.name, quantity: c.quantity, skuStatus: c.skuStatus }; });
    var m = modal('<h3>' + (b.id ? 'Paket ' + esc(b.sku) : 'Paket baru') + (b.id ? ' ' + badge(b.status) : '') + '</h3>' +
      '<label class="f">Jenis</label><div class="seg" id="ty">' + [['MULTIPACK', 'Paket Produk Sama'], ['MIXED', 'Paket Kombinasi'], ['REQUEST_MIX', 'Paket Pilih Sendiri']].map(function (t) { return '<button type="button" data-ty="' + t[0] + '" class="' + (b.type === t[0] ? 'on' : '') + '"' + (b.id ? ' disabled' : '') + '>' + t[1] + '</button>'; }).join('') + '</div>' +
      '<label class="f">Nama paket <span class="req">*</span></label><input class="in w100" id="bn" value="' + esc(b.name || '') + '" placeholder="mis. Paket Viva Air Mawar 6 PCS">' +
      '<div class="fgrid"><div><label class="f">Mode stok</label><select class="in w100" id="sm"><option value="VIRTUAL"' + (b.stockMode === 'VIRTUAL' ? ' selected' : '') + '>Virtual — tanpa saldo sendiri</option><option value="PREASSEMBLED"' + (b.stockMode === 'PREASSEMBLED' ? ' selected' : '') + '>Dirakit — disimpan sebagai barang terpisah</option></select></div>' +
      '<div id="pkw"><label class="f">Jumlah isi dipilih customer</label><input class="in w100" id="pk" type="number" min="2" value="' + esc(b.pickQuantity || '') + '"></div></div>' +
      '<label class="f">Isi paket (Kode SKU Produk)</label><div id="cl"></div>' + (w ? '<div class="row" style="margin-top:6px"><div id="add" style="flex:1"></div></div>' : '') +
      '<label class="f">Barcode paket (opsional)</label><div class="seg" id="bm">' + [['none', 'Tidak ada'], ['gtin', 'GTIN produsen'], ['internal', 'Barcode internal']].map(function (t) { return '<button type="button" data-bm="' + t[0] + '" class="' + ((b.barcodeType === 'GTIN' ? 'gtin' : b.barcodeType === 'INTERNAL' ? 'internal' : 'none') === t[0] ? 'on' : '') + '">' + t[1] + '</button>'; }).join('') + '</div><input class="in w100 code" id="bg" style="margin-top:6px" placeholder="GTIN paket dari produsen" value="' + esc(b.barcodeType === 'GTIN' ? b.barcode : '') + '"><div class="hint" id="bgh"></div>' +
      '<div id="bx"></div>' + (b.id && b.type === 'REQUEST_MIX' && b.status === 'ACTIVE' ? '<div class="sect">Simulasi komposisi aktual (saat pemenuhan pesanan)</div><div id="sim"></div>' : '') +
      '<div class="row" style="margin-top:16px">' + (w ? '<button class="btn pri" id="sv">' + (b.id ? 'Simpan perubahan' : 'Simpan paket') + '</button>' + (!b.id ? '<button class="btn" id="sd">Simpan sebagai draft</button>' : '<button class="btn" id="st">' + icon('power') + 'Ubah status</button>') : '') + '<button class="btn ghost" data-close>Tutup</button></div>', { wide: true });
    var type = b.type, bmode = b.barcodeType === 'GTIN' ? 'gtin' : b.barcodeType === 'INTERNAL' ? 'internal' : 'none';
    var sync = function () {
      $('#pkw', m).style.display = type === 'REQUEST_MIX' ? '' : 'none';
      $('#sm', m).disabled = type === 'REQUEST_MIX' || !w;
      if (type === 'REQUEST_MIX') $('#sm', m).value = 'VIRTUAL';
      $('#bg', m).style.display = bmode === 'gtin' ? '' : 'none';
      $('#bgh', m).textContent = bmode === 'internal' ? (b.barcodeType === 'INTERNAL' ? 'Tersimpan: ' + b.barcode : 'Dialokasikan otomatis saat simpan (prefix 200).') : '';
      $('#cl', m).innerHTML = comps.length ? '<table class="t"><thead><tr><th>SKU</th><th>Nama</th><th>' + (type === 'REQUEST_MIX' ? 'Maks per paket' : 'Jumlah') + '</th><th></th></tr></thead><tbody>' + comps.map(function (c, i) {
        return '<tr><td class="sku">' + esc(c.sku) + (c.skuStatus && c.skuStatus !== 'ACTIVE' ? ' ' + badge(c.skuStatus) : '') + '</td><td>' + esc(c.displayName) + '</td><td style="width:110px"><input class="in sm" type="number" min="1" data-q="' + i + '" value="' + esc(c.quantity) + '"' + (w ? '' : ' disabled') + '></td><td>' + (w ? '<button class="btn sm ghost" data-rm="' + i + '" type="button">' + icon('trash') + '</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<div class="muted">Belum ada komponen — cari SKU produk di bawah.</div>';
      $$('[data-q]', m).forEach(function (inp) { inp.oninput = function () { comps[Number(inp.getAttribute('data-q'))].quantity = Number(inp.value); }; });
      $$('[data-rm]', m).forEach(function (x) { x.onclick = function () { comps.splice(Number(x.getAttribute('data-rm')), 1); sync(); }; });
    };
    $$('[data-ty]', m).forEach(function (x) { x.onclick = function () { type = x.getAttribute('data-ty'); $$('[data-ty]', m).forEach(function (y) { y.classList.toggle('on', y === x); }); if (type === 'MULTIPACK' && comps.length) comps = comps.slice(0, 1); sync(); }; });
    $$('[data-bm]', m).forEach(function (x) { x.onclick = function () { bmode = x.getAttribute('data-bm'); $$('[data-bm]', m).forEach(function (y) { y.classList.toggle('on', y === x); }); sync(); }; });
    if ($('#add', m)) { var adder = skuCombo($('#add', m), ['variant'], function (it) { if (!it) return; if (comps.some(function (c) { return c.variantId === it.variantId; })) return toast('Komponen sudah ada', 'warn'); if (type === 'MULTIPACK' && comps.length) return toast('Multipack hanya 1 SKU — ubah jumlahnya', 'warn'); comps.push({ variantId: it.variantId, sku: it.sku, displayName: it.displayName, quantity: type === 'MULTIPACK' ? 6 : type === 'REQUEST_MIX' ? (Number($('#pk', m).value) || 1) : 1 }); adder.set(null); sync(); }, '+ Tambah komponen: cari SKU produk…'); }
    sync();
    var payload = function (draft) { return { id: b.id, version: b.version, type: type, name: $('#bn', m).value, stockMode: $('#sm', m).value, pickQuantity: Number($('#pk', m).value) || null, components: comps.map(function (c) { return { variantId: c.variantId, quantity: Number(c.quantity) }; }), barcode: { mode: bmode, code: bmode === 'gtin' ? $('#bg', m).value : bmode === 'internal' && b.barcodeType === 'INTERNAL' ? b.barcode : '' }, barcodeChangeReason: b.barcode && (bmode === 'none' || (bmode === 'gtin' && $('#bg', m).value !== b.barcode)) ? 'Diubah di editor bundle' : '', saveAsDraft: !!draft, requestKey: uid() }; };
    var save = function (btn, draft) { $('#bx', m).innerHTML = ''; busy(btn, api('bundle.save', payload(draft), { silent: true })).then(function (r) { m.close(); toast((r.typeLabel || 'Bundle') + ' ' + r.sku + ' tersimpan', 'ok'); after(); }).catch(function (e) { $('#bx', m).innerHTML = feList(e); }); };
    if ($('#sv', m)) $('#sv', m).onclick = function () { save($('#sv', m), false); };
    if ($('#sd', m)) $('#sd', m).onclick = function () { save($('#sd', m), true); };
    if ($('#st', m)) $('#st', m).onclick = function () { lifecyclePrompt(b.sku, b.status).then(function (v) { if (!v) return; api('bundle.setStatus', { id: b.id, status: v.status, reason: v.reason }).then(function () { m.close(); toast('Status bundle diperbarui', 'ok'); after(); }).catch(function () {}); }); };
    if ($('#sim', m)) {
      $('#sim', m).innerHTML = '<div class="muted">Pilih isi sebanyak <b>' + b.pickQuantity + '</b> dari daftar komponen.</div>' + b.components.map(function (c) { return '<div class="row" style="margin-top:6px"><span class="sku" style="width:110px">' + esc(c.sku) + '</span><span class="grow">' + esc(c.name) + '</span><input class="in sm" type="number" min="0" max="' + c.quantity + '" value="0" data-sim="' + esc(c.sku) + '" style="width:80px"></div>'; }).join('') + '<div class="row" style="margin-top:8px"><button class="btn sm" id="sr">Validasi komposisi</button></div><div id="so"></div>';
      $('#sr', m).onclick = function () {
        var sel = $$('[data-sim]', m).map(function (x) { return { sku: x.getAttribute('data-sim'), quantity: Number(x.value) }; }).filter(function (x) { return x.quantity > 0; });
        api('bundle.resolve', { id: b.id, selections: sel }, { silent: true }).then(function (r) { $('#so', m).innerHTML = '<div class="ok-box">' + icon('check') + '<span>Valid. ' + esc(r.note) + '<br>' + r.components.map(function (c) { return c.quantity + ' × ' + esc(c.sku); }).join(', ') + '</span></div>'; }).catch(function (e) { $('#so', m).innerHTML = feList(e); });
      };
    }
  };
  if (!id) return open(null);
  api('bundle.get', { id: id }).then(open).catch(function () {});
}

/* Integrasi yang tersedia pada antarmuka hanya Shopee. */
var CHANNELS = [['shopee', 'Shopee']];
function isMarketplace(ch) { return ch === 'shopee'; }
function channelMapForm(preset) {
  App.go('mapping', { search: preset && preset.sku ? preset.sku.sku : '' });
  toast('Pilih listing Shopee, lalu periksa pasangan SKU master.', 'info');
}
</script>
