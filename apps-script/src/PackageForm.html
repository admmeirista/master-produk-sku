<script>
/** Satu renderer baris barang untuk registrasi paket dan pemetaan Shopee. */
function packageLines(host, options) {
  if(options.reviewCards)return packageReviewLines(host,options);
  var o=options, prefix=o.prefix, writable=o.writable,perBrand=o.type==='bundle',generation=host.packageGeneration=(host.packageGeneration||0)+1;
  host.innerHTML=o.lines.map(function(c,i){return '<div class="package-line'+(perBrand?' package-line-branded':'')+'">'+(perBrand?'<div class="package-brand-field"><label class="f" for="'+prefix+'Brand'+i+'">Brand</label>'+(writable?'<select class="in w100" id="'+prefix+'Brand'+i+'" aria-label="Brand barang '+(i+1)+'"><option value="">Semua brand</option></select>':'<div>'+esc(c.brandName||'—')+'</div>')+'</div>':'')+'<div class="package-sku-field"><label class="f" for="'+prefix+'Sku'+i+'">SKU barang</label><div id="'+prefix+'Line'+i+'">'+(!writable?'<span class="sku">'+esc(c.sku)+'</span>':'')+'</div></div><div class="package-qty-field"><label class="f" for="'+prefix+'Qty'+i+'">Qty</label><input class="in w100" id="'+prefix+'Qty'+i+'" type="number" min="'+(o.type==='multipack'?2:1)+'" max="1000" step="1" data-package-qty="'+i+'" value="'+esc(c.quantity)+'"'+(!writable||o.type==='single'?' disabled':'')+'></div>'+(writable&&o.type==='bundle'?'<button class="btn sm ghost package-remove" data-package-remove="'+i+'" aria-label="Hapus SKU barang">'+icon('trash')+'</button>':'<span></span>')+'</div>';}).join('');
  if(!writable)return;
  function bindSku(c,i){var box=$('#'+prefix+'Line'+i,host);skuCombo(box,['variant'],function(it){c.sku=it?it.sku:'';c.name=it?it.displayName:'';c.variantId=it?it.variantId:'';if(perBrand&&it&&it.brandId){c.brandId=it.brandId;c.brandName=it.brandName;$('#'+prefix+'Brand'+i,host).value=c.brandId;}o.changed();},'Cari SKU barang, nama, atau GTIN…',c.sku?{sku:c.sku,displayName:c.name||c.sku}:null,{brandId:perBrand?c.brandId||'':o.brandId||'',query:c.searchQuery||'',onQuery:function(q){c.searchQuery=q;}});var input=$('input',box);if(input)input.id=prefix+'Sku'+i;}
  o.lines.forEach(bindSku);
  if(perBrand&&typeof SkuPicker!=='undefined')SkuPicker.load().then(function(rows){if(host.packageGeneration!==generation)return;var brands={};rows.forEach(function(r){if(r.brandId)brands[r.brandId]=r.brandName||r.brandId;});var choices='<option value="">Semua brand</option>'+Object.keys(brands).sort(function(a,b){return brands[a].localeCompare(brands[b],'id');}).map(function(id){return '<option value="'+esc(id)+'">'+esc(brands[id])+'</option>';}).join('');o.lines.forEach(function(c,i){var selected=rows.find(function(r){return r.sku===c.sku;});if(selected){c.brandId=selected.brandId||'';c.brandName=selected.brandName||'';}var el=$('#'+prefix+'Brand'+i,host);el.innerHTML=choices;el.value=c.brandId||'';bindSku(c,i);el.onchange=function(){if(this.value===(c.brandId||''))return;c.brandId=this.value;c.brandName=brands[this.value]||'';c.searchQuery='';c.sku='';c.name='';c.variantId='';bindSku(c,i);o.changed();};});}).catch(function(){});
  $$('[data-package-qty]',host).forEach(function(el){el.oninput=function(){o.lines[Number(el.getAttribute('data-package-qty'))].quantity=Number(el.value);o.changed();};});
  $$('[data-package-remove]',host).forEach(function(el){el.onclick=function(){o.remove(Number(el.getAttribute('data-package-remove')));};});
}
/** Form pemeriksaan: nama barang terbaca penuh, pencarian dibuka saat mengganti barang. */
function packageReviewLines(host,o){
  function brandOf(c){return c.brandManual?(c.brandId||''):(c.brandId||(o.type!=='bundle'?o.brandId:'')||'');}
  var prefix=o.prefix,generation=host.packageGeneration=(host.packageGeneration||0)+1,rows=o.pickerRows||[],bySku={};rows.forEach(function(r){bySku[r.sku]=r;});
  o.lines.forEach(function(c){var r=bySku[c.sku];if(r){c.name=r.displayName;c.brandId=r.brandId||'';c.brandName=r.brandName||'';c.gtin=r.gtin||'';c.variantId=r.variantId||'';}});
  host.innerHTML=o.lines.map(function(c,i){var brand=brandOf(c);return '<article class="review-item"><div class="review-item-top"><div><label class="sr-only" for="'+prefix+'Brand'+i+'">Brand barang '+(i+1)+'</label>'+(o.writable?'<select class="in review-brand" id="'+prefix+'Brand'+i+'"><option value="'+esc(brand)+'">'+esc(c.brandName||(brand?'Menyiapkan brand…':'Semua brand'))+'</option></select>':'<span class="review-brand-label">'+esc(c.brandName||'Master produk')+'</span>')+'</div>'+(o.writable&&o.type==='bundle'?'<button class="btn sm ghost" data-review-remove="'+i+'" aria-label="Hapus barang '+(i+1)+'">'+icon('trash')+'</button>':'<span class="review-item-kind">SKU barang</span>')+'</div><div class="review-item-body"><div class="review-item-product"><span class="review-field-label">Barang</span><strong id="'+prefix+'Name'+i+'">'+esc(c.name||c.sku||'Pilih barang dari master')+'</strong>'+(o.writable?'<button class="review-change" data-review-change="'+i+'">'+(c.sku?'Ganti barang':'Cari nama, SKU, atau GTIN')+'</button>':'')+'<div id="'+prefix+'Search'+i+'" class="review-item-search'+(c.sku&&!c.searchQuery?' hidden':'')+'"><div id="'+prefix+'Line'+i+'"></div></div></div><label class="review-item-qty"><span class="review-field-label">Qty</span><input class="in w100" id="'+prefix+'Qty'+i+'" type="number" min="'+(o.type==='multipack'?2:1)+'" max="1000" step="1" value="'+esc(c.quantity)+'" data-review-qty="'+i+'"'+(!o.writable||o.type==='single'?' disabled':'')+'></label></div><div class="review-item-code" id="'+prefix+'Meta'+i+'"><b>'+esc(c.sku||'SKU belum dipilih')+'</b>'+(c.gtin?' · GTIN '+esc(c.gtin):'')+'</div></article>';}).join('');
  function metadata(c,i){var card=$('#'+prefix+'Line'+i,host);if(card&&card.closest)card.closest('.review-item').setAttribute('data-needs-item',String(!c.sku));$('#'+prefix+'Name'+i,host).textContent=c.name||c.sku||'Pilih barang dari master';$('#'+prefix+'Meta'+i,host).innerHTML='<b>'+esc(c.sku||'SKU belum dipilih')+'</b>'+(c.gtin?' · GTIN '+esc(c.gtin):'');}
  function bind(c,i){if(!o.writable)return;var box=$('#'+prefix+'Line'+i,host);skuCombo(box,['variant'],function(item){c.sku=item?item.sku:'';c.name=item?item.displayName:'';c.variantId=item?item.variantId:'';c.gtin=item?item.gtin||'':'';if(item){c.brandId=item.brandId||'';c.brandName=item.brandName||'';$('#'+prefix+'Brand'+i,host).value=c.brandId;}metadata(c,i);$('#'+prefix+'Search'+i,host).classList.toggle('hidden',!!item);o.changed();},'Cari nama, SKU, atau GTIN…',c.sku?{sku:c.sku,displayName:c.name||c.sku}:null,{brandId:brandOf(c),query:c.searchQuery||'',onQuery:function(q){c.searchQuery=q;}});var input=$('input',box);if(input)input.id=prefix+'Sku'+i;}
  o.lines.forEach(bind);
  $$('[data-review-change]',host).forEach(function(b){b.onclick=function(){var i=Number(b.getAttribute('data-review-change')),box=$('#'+prefix+'Search'+i,host);box.classList.toggle('hidden',false);var input=$('input',box);if(input&&input.focus)input.focus();};});
  $$('[data-review-qty]',host).forEach(function(input){input.oninput=function(){o.lines[Number(input.getAttribute('data-review-qty'))].quantity=Number(input.value);o.changed();};});
  $$('[data-review-remove]',host).forEach(function(b){b.onclick=function(){o.remove(Number(b.getAttribute('data-review-remove')));};});
  function brands(items){if(host.packageGeneration!==generation||host.isConnected===false)return;var brands={},lookup={};items.forEach(function(r){lookup[r.sku]=r;if(r.brandId)brands[r.brandId]=r.brandName||r.brandId;});var choices='<option value="">Semua brand</option>'+Object.keys(brands).sort(function(a,b){return brands[a].localeCompare(brands[b],'id');}).map(function(id){return '<option value="'+esc(id)+'">'+esc(brands[id])+'</option>';}).join('');o.lines.forEach(function(c,i){var item=lookup[c.sku];if(item){c.name=item.displayName;c.gtin=item.gtin||'';c.brandId=item.brandId||'';c.brandName=item.brandName||'';metadata(c,i);}if(!o.writable)return;var el=$('#'+prefix+'Brand'+i,host);el.innerHTML=choices;el.value=brandOf(c);bind(c,i);el.onchange=function(){c.brandManual=true;c.brandId=this.value;c.brandName=brands[this.value]||'';c.searchQuery='';c.sku='';c.name='';c.gtin='';c.variantId='';metadata(c,i);$('#'+prefix+'Search'+i,host).classList.toggle('hidden',false);bind(c,i);o.changed();};});}
  if(rows.length)brands(rows);else if(typeof SkuPicker!=='undefined')SkuPicker.load().then(brands).catch(function(){});
}
function packageBarcode(host, initial, writable, onChange) {
  var state,original,locked=false,prefix='pb'+uid().replace(/[^a-z0-9]/gi,'');
  function set(value,readOnly){original=value||{};state={mode:original.mode||(original.gtin?'gtin':original.internalBarcode?'internal':'none'),code:original.code||original.gtin||original.internalBarcode||''};locked=!!readOnly;draw();}
  function draw(){
    if(locked){host.innerHTML='<label class="f" for="'+prefix+'MasterGtin">GTIN barang</label><input class="in w100 code" id="'+prefix+'MasterGtin" value="'+esc(original.gtin||'')+'" placeholder="GTIN belum tersedia di master" readonly>'+(original.internalBarcode?'<label class="f" for="'+prefix+'MasterInternal">Barcode internal barang</label><input class="in w100 code" id="'+prefix+'MasterInternal" value="'+esc(original.internalBarcode)+'" readonly>':'')+'<div class="hint">Mengikuti SKU barang yang dipilih. Perubahan barcode dilakukan di master produk.</div>';return;}
    host.innerHTML='<label class="f">Barcode paket</label><select class="in w100" data-package-barcode aria-label="Barcode paket"'+(!writable||locked?' disabled':'')+'><option value="none">Tanpa barcode</option><option value="gtin">GTIN</option><option value="internal">Barcode internal</option></select><div data-package-code class="'+(state.mode==='gtin'?'':'hidden')+'"><label class="f" for="'+prefix+'Code">GTIN paket</label><input class="in w100 code" id="'+prefix+'Code" placeholder="GTIN paket dari produsen" value="'+esc(state.mode==='gtin'?state.code:'')+'"'+(!writable||locked?' readonly':'')+'></div><div class="hint" data-package-barcode-hint></div>';
    $('[data-package-barcode]',host).value=state.mode;
    $('[data-package-barcode-hint]',host).textContent=locked?'Barcode satuan mengikuti master barang.':state.mode==='internal'?(state.code?'Barcode internal: '+state.code:'Barcode internal dibuat otomatis saat disimpan.'):'GTIN paket tidak diambil dari GTIN barang komponennya.';
    $('[data-package-barcode]',host).onchange=function(){state.mode=this.value;state.code=state.mode==='gtin'?(original.gtin||''):state.mode==='internal'?(original.internalBarcode||''):'';$('[data-package-code]',host).classList.toggle('hidden',state.mode!=='gtin');$('#'+prefix+'Code',host).value=state.mode==='gtin'?state.code:'';$('[data-package-barcode-hint]',host).textContent=state.mode==='internal'?(state.code?'Barcode internal: '+state.code:'Barcode internal dibuat otomatis saat disimpan.'):'GTIN paket tidak diambil dari GTIN barang komponennya.';};
    var modeChange=$('[data-package-barcode]',host).onchange;$('[data-package-barcode]',host).onchange=function(){modeChange.call(this);if(onChange)onChange();};
    $('#'+prefix+'Code',host).oninput=function(){state.code=this.value.trim();if(onChange)onChange();};
  }
  set(initial,false);
  return {get:function(){return {mode:state.mode,code:state.code};},set:set,disable:function(value){writable=!value;draw();}};
}
function bundleRowsHtml(d){return d.rows.length?'<div class="tablewrap"><table class="t"><thead><tr><th>SKU Paket</th><th>Nama</th><th>Jenis</th><th>Komposisi SKU Barang</th><th>Total isi</th><th>Status</th><th></th></tr></thead><tbody>'+d.rows.map(function(b){return '<tr><td class="sku">'+esc(b.sku)+(b.barcode?'<small class="shopee-sub">'+esc(b.barcode)+'</small>':'')+'<small class="shopee-sub">Parent Produk: '+esc(Array.from(new Set(b.components.map(function(c){return c.parentSku;}).filter(Boolean))).join(', ')||'—')+'</small></td><td><b>'+esc(b.name)+'</b></td><td>'+esc(b.type==='MULTIPACK'?'MP':'BD')+'</td><td>'+b.components.map(function(c){return '<div>'+c.quantity+' × <span class="sku">'+esc(c.sku)+'</span> '+esc(c.name)+'</div>';}).join('')+'</td><td>'+b.components.reduce(function(n,c){return n+c.quantity;},0)+'</td><td>'+badge(b.status)+'</td><td><button class="btn sm" data-e="'+esc(b.id)+'">Buka</button></td></tr>';}).join('')+'</tbody></table></div>':emptyBox('Belum ada paket','','boxes');}
/** Form MP/BD yang sama dengan pemetaan Shopee, tanpa pilihan mode stok. */
function bundleEditor(id,done,snapshot){
  function after(){if(done)done();else if(App.page==='bundles'&&Pages.bundles.reload)Pages.bundles.reload();}
  function open(b){b=b||{type:'MULTIPACK',status:'DRAFT',components:[]};if(b.type==='REQUEST_MIX')return toast('Paket ini merupakan arsip lama. Gunakan MP atau BD.','warn');
    var w=can('product.write')&&b.status!=='ARCHIVED',locked=!!b.id&&b.status!=='DRAFT',type=b.type==='MULTIPACK'?'multipack':'bundle',lines=b.components.map(function(c){return {sku:c.sku,name:c.name,variantId:c.variantId,quantity:c.quantity,brandId:c.brandId,brandName:c.brandName};}),saving=false;
    if(!lines.length)lines=[{sku:'',quantity:2}];
    var m=modal('<h3>'+(b.id?'SKU Paket: '+esc(b.sku):'Paket baru')+'</h3><label class="f">Jenis paket</label><select class="in w100" id="bpType"'+(!w||b.id?' disabled':'')+'><option value="multipack">Paket produk sama (MP)</option><option value="bundle">Paket kombinasi (BD)</option></select><div class="sect">Komposisi SKU Barang</div><div id="bpLines"></div>'+(w&&!locked?'<button class="btn sm" id="bpAdd">Tambah SKU barang</button>':'')+(locked?'<div class="hint">Isi paket aktif tetap. Untuk isi berbeda, buat paket baru.</div>':'')+'<label class="f">Nama paket</label><input class="in w100" id="bpName" value="'+esc(b.name||'')+'" placeholder="Otomatis dari SKU dan qty jika dikosongkan"'+(!w?' readonly':'')+'><div id="bpBarcode"></div><div id="bpError"></div><div class="row shopee-review-actions" style="margin-top:16px">'+(w?'<button class="btn pri" id="bpSave">Simpan paket</button>'+(!b.id?'<button class="btn" id="bpDraft">Simpan sebagai draft</button>':'<button class="btn" id="bpStatus">Ubah status</button>'):'')+'<button class="btn" data-close>Tutup</button></div>',{wide:true});
    $('#bpType',m).value=type;
    var bc=packageBarcode($('#bpBarcode',m),{gtin:b.barcodeType==='GTIN'?b.barcode:'',internalBarcode:b.barcodeType==='INTERNAL'?b.barcode:''},w);
    function draw(){packageLines($('#bpLines',m),{prefix:'bp',lines:lines,type:type,writable:w&&!locked,changed:function(){},remove:function(i){if(saving)return;lines.splice(i,1);draw();}});if($('#bpAdd',m))$('#bpAdd',m).classList.toggle('hidden',type!=='bundle');}
    draw();if(!w)return m;
    $('#bpType',m).onchange=function(){type=this.value;if(type==='multipack'){lines=lines.slice(0,1);if(!lines.length)lines=[{sku:'',quantity:2}];lines[0].quantity=Math.max(2,Number(lines[0].quantity)||2);}else while(lines.length<2)lines.push({sku:'',quantity:1});draw();};
    if($('#bpAdd',m))$('#bpAdd',m).onclick=function(){if(saving)return;lines.push({sku:'',quantity:1});draw();};
    function save(btn,draft){if(saving)return;if(!shopeeSelectionValid(type,lines))return toast('Pilih SKU barang dan qty yang sesuai.','err');var barcode=bc.get(),name=$('#bpName',m).value.trim()||('Paket '+(type==='bundle'?'Kombinasi ':'')+lines.map(function(c){return c.quantity+' × '+(c.name||c.sku);}).join(' + ')).slice(0,120);
      saving=true;$('#bpError',m).innerHTML='';var p={id:b.id,version:b.version,type:type==='multipack'?'MULTIPACK':'MIXED',name:name,stockMode:b.stockMode||'VIRTUAL',components:lines.map(function(c){return {sku:c.sku,variantId:c.variantId,quantity:Number(c.quantity)};}),barcode:barcode,barcodeChangeReason:'Diperbarui melalui form paket',saveAsDraft:!!draft,requestKey:uid()};
      busy(btn,api('bundle.save',p,{silent:true})).then(function(saved){m.close();toast(saved.sku+' tersimpan.','ok');after();}).catch(function(e){saving=false;$('#bpError',m).innerHTML=feList(e);});
    }
    $('#bpSave',m).onclick=function(){save(this,false);};if($('#bpDraft',m))$('#bpDraft',m).onclick=function(){save(this,true);};if($('#bpStatus',m))$('#bpStatus',m).onclick=function(){lifecyclePrompt(b.sku,b.status).then(function(v){if(v)api('bundle.setStatus',{id:b.id,status:v.status,reason:v.reason}).then(function(){m.close();after();});});};return m;
  }
  if(!id||snapshot)return open(snapshot);
  fastRead('bundle.get',{id:id},function(b,meta){if(!meta.cached)open(b);}).catch(function(){});
}
</script>
