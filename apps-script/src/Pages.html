<script>
/* ============================================================================ Dashboard */
route('', async (main) => {
  const d = await call('dashboard.get');
  const c = d.counts;
  const stat = (l, v, h, tone, to) => `<div class="stat ${tone || ''}" onclick="go('${to}')"><div class="l">${l}</div><div class="v">${Number(v).toLocaleString('id-ID')}</div>${h ? `<div class="tiny muted">${h}</div>` : ''}</div>`;
  const max = Math.max(1, ...d.byBrand.map((b) => b.n));
  main.innerHTML = head(`Halo, ${esc(S.user.fullName.split(' ')[0])}`, 'Ringkasan kondisi master produk hari ini', can('product.write') ? `<button class="btn" onclick="go('registrasi')">+ Registrasi Produk</button>` : '') +
    `<div class="grid g4">
      ${stat('Brand aktif', c.brands, c.brands_pending ? c.brands_pending + ' usulan referensi menunggu' : '', '', 'referensi')}
      ${stat('Product master', c.products, `${c.products_active} aktif · ${c.products_draft} draft`, '', 'produk')}
      ${stat('Varian', c.variants, '', '', 'produk')}
      ${stat('SKU aktif', c.skus_active, '', 'indigo', 'sku')}
      ${stat('Menunggu persetujuan', c.pending_registrations + c.pending_changes, `${c.pending_registrations} registrasi · ${c.pending_changes} perubahan`, c.pending_registrations + c.pending_changes ? 'amber' : '', 'persetujuan')}
      ${stat('Varian tanpa GTIN resmi', c.variants_without_gtin, 'memakai barcode internal / belum ada', c.variants_without_gtin ? 'amber' : '', 'kualitas')}
      ${stat('Indikasi duplikasi', c.duplicate_candidates, 'nama produk mirip / identik', c.duplicate_candidates ? 'red' : 'green', 'kualitas')}
      ${stat('SKU belum sinkron BeeCloud', c.skus_not_synced_beecloud, c.mapping_problems ? c.mapping_problems + ' mapping bermasalah' : 'belum terkonfirmasi', c.skus_not_synced_beecloud ? 'amber' : 'green', 'mapping')}
    </div>
    <div class="grid g3 mt2">
      ${card('Menunggu persetujuan', d.pending.length ? d.pending.map((r) => `<div style="padding:6px 0;border-bottom:1px solid #f1f2f4"><a onclick="go('produk/${r.product_id}')">${esc(r.product_name)}</a><div class="tiny muted">${r.request_type === 'change' ? 'Perubahan' : 'Registrasi baru'} · ${esc(r.submitted_by)} · ${fmtDate(r.submitted_at)}</div></div>`).join('') : empty('Tidak ada antrian'), `<a onclick="go('persetujuan')" class="small">Lihat semua</a>`)}
      ${card('SKU aktif per brand', d.byBrand.length ? d.byBrand.map((b) => `<div class="small mb"><div class="row between"><span>${esc(b.name)}</span><span>${b.n}</span></div><div class="bar"><i style="width:${(b.n / max) * 100}%"></i></div></div>`).join('') + `<div class="tiny muted">${d.byStatus.map((s) => `${esc(s.label)}: <b>${s.n}</b>`).join(' · ')}</div>` : empty('Belum ada SKU aktif'))}
      ${card('Aktivitas terbaru', d.recent.map((a) => `<div class="small" style="padding:5px 0;border-bottom:1px solid #f1f2f4"><b>${esc(a.actor)}</b> ${esc(auditLabel(a.action))}<div class="tiny muted">${fmtDate(a.created_at)}</div></div>`).join(''))}
    </div>`;
});

const AUDIT_LABEL = { 'product.create_draft': 'membuat draft', 'product.update_draft': 'mengubah draft', 'product.submit': 'mengajukan review', 'product.approve': 'menyetujui registrasi', 'product.reject': 'menolak registrasi', 'product.activate': 'mengaktifkan produk', 'product.revise': 'merevisi', 'product.deactivate': 'menonaktifkan produk', 'product.archive': 'mengarsipkan', 'product.change_applied': 'menerapkan perubahan', 'change_request.create': 'mengajukan perubahan', 'change_request.approve': 'menyetujui perubahan', 'change_request.reject': 'menolak perubahan', 'barcode.allocate_internal': 'alokasi barcode internal', 'price.set': 'mengubah harga', 'mapping.create': 'membuat mapping', 'import.commit': 'import data', 'export.beecloud': 'ekspor BeeCloud', 'auth.login': 'login', 'user.create': 'membuat pengguna', 'settings.update': 'mengubah pengaturan' };
const auditLabel = (a) => AUDIT_LABEL[a] || a;

/* ============================================================================ Direktori */
const DIR = { search: '', brandId: '', categoryId: '', status: '', barcode: '', sort: 'updated_at', dir: 'desc', page: 1 };
route('produk', async (main, args) => {
  if (args[0]) return renderProduct(main, args[0]);
  const [brands, cats] = await Promise.all([call('ref.list', { kind: 'brand' }), call('ref.list', { kind: 'category' })]);
  main.innerHTML = head('Direktori Produk', 'Cari nama, kode produk, SKU, barcode, atau PRD-xxxxxx', `${can('export.run') ? `<button class="btn sec" id="exp">Ekspor Excel</button>` : ''}${can('product.write') ? `<button class="btn" onclick="go('registrasi')">+ Registrasi</button>` : ''}`) +
    `<section class="card"><div class="cb grid g4" style="grid-template-columns:2fr 1fr 1fr 1fr 1fr">
      <input id="q" placeholder="Cari…" value="${esc(DIR.search)}">
      ${combo('fb', [{ value: '', label: 'Semua brand' }].concat(brands.map((b) => ({ value: b.id, label: b.name, hint: b.code }))), DIR.brandId, 'Semua brand', (v) => { DIR.brandId = v; DIR.page = 1; load(); })}
      ${combo('fc', [{ value: '', label: 'Semua kategori' }].concat(cats.map((b) => ({ value: b.id, label: b.name, hint: b.code }))), DIR.categoryId, 'Semua kategori', (v) => { DIR.categoryId = v; DIR.page = 1; load(); })}
      <select id="st"><option value="">Semua status (tanpa arsip)</option>${Object.keys(LABELS).slice(0, 7).map((s) => `<option value="${s}" ${DIR.status === s ? 'selected' : ''}>${LABELS[s][0]}</option>`).join('')}<option value="all">Termasuk arsip</option></select>
      <select id="bf"><option value="">Semua barcode</option><option value="internal_only" ${DIR.barcode === 'internal_only' ? 'selected' : ''}>Memakai barcode internal</option><option value="none" ${DIR.barcode === 'none' ? 'selected' : ''}>Ada varian tanpa barcode</option></select>
    </div><div id="tbl">${spinner()}</div></section>`;
  initCombos(main);
  $('#q').oninput = debounce(() => { DIR.search = $('#q').value; DIR.page = 1; load(); }, 400);
  $('#st').onchange = () => { DIR.status = $('#st').value; DIR.page = 1; load(); };
  $('#bf').onchange = () => { DIR.barcode = $('#bf').value; DIR.page = 1; load(); };
  if ($('#exp')) $('#exp').onclick = async () => downloadTable(await call('export.master'), 'xlsx');
  async function load() {
    const d = await call('product.list', DIR);
    const sortTh = (k, l) => `<th><a data-sort="${k}">${l}${DIR.sort === k ? (DIR.dir === 'asc' ? ' ▲' : ' ▼') : ''}</a></th>`;
    $('#tbl').innerHTML = d.rows.length ? `<div class="tw"><table><thead><tr>${sortTh('product_no', 'ID')}${sortTh('name', 'Produk')}${sortTh('brand', 'Brand')}${sortTh('category', 'Kategori')}<th>Barcode</th>${sortTh('sku_count', 'Varian/SKU')}${sortTh('status', 'Status')}${sortTh('updated_at', 'Diubah')}</tr></thead><tbody>
      ${d.rows.map((r) => `<tr class="click" onclick="go('produk/${r.id}')"><td class="mono small muted">${r.productNo}</td><td><b>${esc(r.name)}</b><div class="row tiny"><span class="mono muted">${esc(r.product_code)}</span>${r.product_type === 'bundle' ? B('Bundle', 'b-violet') : ''}${r.is_legacy ? B('Migrasi') : ''}</div></td><td>${esc(r.brand_name)}</td><td>${esc(r.category_name)}</td><td class="mono small">${r.barcodes ? esc(r.barcodes.slice(0, 40)) : B('Belum ada', 'b-amber')} ${r.has_internal_barcode ? B('internal', 'b-blue') : ''}</td><td>${r.variant_count} / ${r.sku_count}</td><td>${badge(r.status)}</td><td class="tiny muted">${fmtDate(r.updated_at)}</td></tr>`).join('')}
      </tbody></table></div>` + pager(d, (p) => { DIR.page = p; load(); }) : empty('Produk tidak ditemukan', 'Ubah kata kunci atau filter.');
    $$('[data-sort]', $('#tbl')).forEach((a) => (a.onclick = () => { DIR.dir = DIR.sort === a.dataset.sort && DIR.dir === 'asc' ? 'desc' : 'asc'; DIR.sort = a.dataset.sort; load(); }));
  }
  load();
});

/* ============================================================================ Detail produk */
const WF_LABEL = { submit: 'Ajukan Review', approve: 'Setujui', reject: 'Tolak', activate: 'Aktifkan', revise: 'Revisi', deactivate: 'Nonaktifkan', reactivate: 'Aktifkan Kembali', archive: 'Arsipkan' };
const WF = { draft: ['submit', 'archive'], pending_review: ['approve', 'reject'], approved: ['activate', 'reject'], active: ['deactivate'], rejected: ['revise', 'archive'], inactive: ['reactivate', 'archive'], archived: [] };
const WF_PERM = { submit: 'product.submit', revise: 'product.write', approve: 'product.review', reject: 'product.review', activate: 'product.review', deactivate: 'product.lifecycle', reactivate: 'product.lifecycle', archive: 'product.lifecycle' };

async function renderProduct(main, id) {
  const p = await call('product.get', { id });
  const pending = p.requests.find((r) => r.status === 'pending_review');
  const actions = WF[p.status].filter((a) => can(WF_PERM[a]) || (a === 'archive' && ['draft', 'rejected'].indexOf(p.status) >= 0 && can('product.write')));
  const lastReject = p.history.find((h) => h.action === 'reject');
  const allSkus = [].concat(...p.variants.map((v) => v.skus));
  main.innerHTML = `<a onclick="history.back()" class="small">← Kembali</a>` +
    head(`${esc(p.name)} ${badge(p.status)} ${p.product_type === 'bundle' ? B('Bundle', 'b-violet') : ''} ${p.is_legacy ? B('Migrasi template lama') : ''}`,
      `<span class="mono">${p.productNo} · ${esc(p.brand_name)} (${esc(p.brand_code)}) · ${esc(p.category_name)} (${esc(p.category_code)}) · kode ${esc(p.product_code)}</span>`,
      `${p.status === 'draft' && can('product.write') ? `<button class="btn sec" onclick="go('registrasi/${p.id}')">Edit draft</button>` : ''}
       ${['approved', 'active', 'inactive'].indexOf(p.status) >= 0 && can('product.write') ? `<button class="btn sec" id="cr" ${pending ? 'disabled title="Masih ada permintaan yang menunggu review"' : ''}>Ajukan perubahan</button>` : ''}
       ${actions.map((a) => `<button class="btn ${['approve', 'activate', 'reactivate'].indexOf(a) >= 0 ? 'ok' : a === 'reject' ? 'danger' : a === 'submit' ? '' : 'sec'}" data-wf="${a}">${WF_LABEL[a]}</button>`).join('')}`) +
    (p.status === 'rejected' && lastReject ? alertBox('error', 'Registrasi ditolak', `${esc(lastReject.reason)} — ${esc(lastReject.actor)}, ${fmtDate(lastReject.created_at)}. Klik "Revisi" untuk memperbaiki lalu ajukan ulang.`) + '<div class="mt"></div>' : '') +
    (pending ? alertBox('warn', pending.request_type === 'change' ? `Perubahan #${pending.request_no} menunggu review` : 'Registrasi menunggu review', `Diajukan ${esc(pending.submitted_by)} pada ${fmtDate(pending.submitted_at)}.${(pending.payload_json && pending.payload_json.duplicateWarnings || []).length ? ' ⚠ Pengaju mengabaikan peringatan nama mirip.' : ''}`) + '<div class="mt"></div>' : '') +
    (p.brand_status !== 'active' || p.category_status !== 'active' ? alertBox('warn', null, 'Brand/kategori produk ini belum aktif — produk belum dapat diajukan/disetujui.') + '<div class="mt"></div>' : '') +
    `<div class="tabs"><a class="on" data-tab="ov">Varian, SKU & Barcode</a><a data-tab="hi">Riwayat & Audit</a></div><div id="tab"></div>`;
  const ov = () => `<div class="grid g4 mb">
      ${[['Varian', p.variants.length], ['SKU', allSkus.length], ['SKU aktif', allSkus.filter((s) => s.status === 'active').length], ['BeeCloud terkonfirmasi', allSkus.filter((s) => s.mappings.some((m) => m.system === 'beecloud' && m.status === 'confirmed')).length]].map((x) => `<div class="soft"><div class="tiny muted">${x[0]}</div><div style="font-size:18px;font-weight:600">${x[1]}</div></div>`).join('')}
    </div>` + p.variants.map((v) => card(`${p.has_variants ? esc(v.name || '(tanpa nama)') : 'Varian default'} ${v.variant_code ? `<span class="mono tiny muted">${esc(v.variant_code)}</span>` : ''} ${(v.attributes || []).map((a) => B(a.type + ': ' + a.value, 'b-indigo')).join(' ')}`,
      `<div class="row" style="padding:12px 16px;border-bottom:1px solid #f1f2f4">${v.barcode ? `${barcodeSvg(v.barcode.code)}<div class="small"><b class="mono">${esc(v.barcode.code)}</b><div class="muted">${v.barcode.type === 'gtin' ? 'GTIN produsen' : 'Barcode internal (bukan GTIN resmi)'}${v.barcode.type === 'gtin' ? (v.barcode.verifiedOfficial ? ' · terverifikasi' : ' · belum diverifikasi fisik') : ''}</div><a onclick="barcodeHistoryModal('${v.barcode.code}')">Riwayat barcode</a></div>` : B('Belum ada barcode', 'b-amber')}</div>
       <div class="tw"><table><thead><tr><th>Kemasan</th><th>SKU</th><th>Harga beli</th><th>Harga jual</th><th>BeeCloud</th><th>Shopee</th><th>Status</th><th></th></tr></thead><tbody>
       ${v.skus.map((s) => { const bee = s.mappings.find((m) => m.system === 'beecloud'); const shp = s.mappings.filter((m) => m.system === 'shopee'); return `<tr>
         <td>${s.sku_type === 'bundle' ? 'Bundle' : s.pack_qty === 1 ? 'Satuan' : 'Isi ' + s.pack_qty} <span class="tiny muted">${esc(s.sales_unit)}</span>${s.components.length ? `<div class="tiny muted">${s.components.map((c) => `${c.quantity}× <span class="mono">${esc(c.skuCode)}</span>`).join('<br>')}<br><b>Biaya komponen: ${fmtRp(s.components.reduce((a, c) => a + (c.purchasePrice || 0) * c.quantity, 0))}</b></div>` : ''}</td>
         <td class="mono small">${s.sku_code ? esc(s.sku_code) : '<span class="warnt">belum terbentuk</span>'}${s.sku_source === 'legacy_import' ? '<div class="tiny muted">SKU lama dipertahankan</div>' : s.sku_source === 'manual' ? '<div class="tiny muted">override manual</div>' : ''}</td>
         <td>${fmtRp(s.purchase_price)}</td><td>${fmtRp(s.selling_price)} ${s.purchase_price !== null && s.selling_price !== null && s.selling_price < s.purchase_price ? B('rugi', 'b-red') : ''}</td>
         <td>${bee ? badge(bee.status) : '—'}</td><td>${shp.length ? shp.map((m) => badge(m.status)).join(' ') : '—'}</td><td>${badge(s.status)}</td>
         <td><button class="btn ghost sm" onclick="priceModal('${s.id}','${esc(s.sku_code || s.display_name)}','${s.status}')">Harga & histori</button></td></tr>`; }).join('')}
       </tbody></table></div>`, '', true) + '<div class="mt"></div>').join('');
  const hi = async () => {
    const audit = await call('product.audit', { id });
    return `<div class="grid g2">${card('Riwayat persetujuan', p.history.length ? p.history.map((h) => `<div class="small" style="padding:6px 0;border-bottom:1px solid #f1f2f4"><b>${esc(h.action)}</b> ${h.from_status ? `· ${esc(h.from_status)} → ${esc(h.to_status)}` : ''}<div class="tiny muted">${esc(h.actor)} · ${fmtDate(h.created_at)}</div>${h.reason ? `<div class="soft tiny">"${esc(h.reason)}"</div>` : ''}</div>`).join('') : empty('Belum ada riwayat'))}
      ${card('Permintaan', p.requests.length ? p.requests.map((r) => `<div class="small" style="padding:6px 0;border-bottom:1px solid #f1f2f4"><div class="row between"><b>#${r.request_no} ${r.request_type === 'change' ? 'Perubahan' : 'Registrasi baru'}</b>${badge(r.status)}</div><div class="tiny muted">${esc(r.submitted_by)} · ${fmtDate(r.submitted_at)} ${r.reviewed_by ? '· diputuskan ' + esc(r.reviewed_by) : ''}</div>${r.reason ? `<div class="tiny">Alasan: ${esc(r.reason)}</div>` : ''}${r.review_reason ? `<div class="tiny">Catatan reviewer: ${esc(r.review_reason)}</div>` : ''}${r.payload_json && r.payload_json.operations ? opsList(r.payload_json.operations) : ''}</div>`).join('') : empty('Belum ada permintaan'))}</div>
      <div class="mt">${card('Audit log', audit.map((a) => `<div class="row between small" style="padding:5px 0;border-bottom:1px solid #f1f2f4"><span><b>${esc(a.actor)}</b> — ${esc(auditLabel(a.action))}${a.meta_json && a.meta_json.reason ? ` ("${esc(a.meta_json.reason)}")` : ''}</span><span class="tiny muted">${fmtDate(a.created_at)}</span></div>`).join('') || empty('Kosong'))}</div>`;
  };
  const showTab = async (t) => { $$('[data-tab]').forEach((x) => x.classList.toggle('on', x.dataset.tab === t)); $('#tab').innerHTML = t === 'ov' ? ov() : spinner(); if (t === 'hi') $('#tab').innerHTML = await hi(); };
  $$('[data-tab]').forEach((a) => (a.onclick = () => showTab(a.dataset.tab)));
  showTab('ov');
  $$('[data-wf]').forEach((b) => (b.onclick = () => workflowDialog(p, b.dataset.wf)));
  if ($('#cr')) $('#cr').onclick = () => changeRequestModal(p);
}

function workflowDialog(p, action, acknowledgeWarnings) {
  const needReason = ['reject', 'deactivate', 'archive', 'reactivate'].indexOf(action) >= 0;
  confirmDialog({
    title: `${WF_LABEL[action]} — ${p.name}`,
    message: { approve: 'Pastikan data, barcode (cocok dengan kemasan fisik), dan harga sudah benar.', archive: 'Produk diarsipkan (soft delete). SKU & barcode tetap tercatat dan tidak dapat dipakai ulang.', deactivate: 'Semua SKU produk ini dinonaktifkan dan tidak ikut ekspor.' }[action] || '',
    confirmLabel: WF_LABEL[action],
    tone: ['reject', 'archive', 'deactivate'].indexOf(action) >= 0 ? 'danger' : ['approve', 'activate', 'reactivate'].indexOf(action) >= 0 ? 'ok' : '',
    reason: needReason,
    reasonLabel: action === 'reject' ? 'Alasan penolakan (dilihat pengaju)' : 'Alasan / catatan',
    onConfirm: async (reason) => {
      try {
        const r = await call('product.workflow', { id: p.id, action, reason, version: p.version, acknowledgeWarnings: !!acknowledgeWarnings });
        toast('success', `${WF_LABEL[action]} berhasil`, 'Status: ' + (LABELS[r.status] || [r.status])[0]);
        refreshPending(); router();
      } catch (e) {
        if (e.code === 'DUPLICATE_WARNING') { setTimeout(() => duplicateWarnModal(e.details.map((d) => d.data), () => workflowDialog(p, action, true))); return; }
        throw e;
      }
    },
  });
}

function duplicateList(items) {
  return items.map((d) => `<div class="box mb" style="border-color:${d.severity === 'block' ? '#fecdd3' : '#fde68a'}"><b>${d.severity === 'block' ? '⛔' : '⚠'} ${esc(d.message)}</b>
    ${d.existing ? `<div class="grid g2 mt small"><div class="soft"><div class="tiny muted">Sudah ada — ${esc(d.existing.productNo)} (${esc(d.existing.status)})</div>${esc(d.existing.name)}<div class="mono tiny muted">${esc(d.existing.brandName)} · ${esc(d.existing.productCode)}<br>${esc(d.existing.barcodes.join(', '))}<br>${esc(d.existing.skuCodes.slice(0, 3).join(', '))}</div><a onclick="go('produk/${d.existing.id}')">buka</a></div><div class="soft tiny">💡 ${esc(d.recommendation)}</div></div>` : `<div class="tiny mt">💡 ${esc(d.recommendation)}</div>`}</div>`).join('');
}
function duplicateWarnModal(items, onProceed) {
  openModal({ title: 'Kemungkinan produk duplikat', size: 'lg', body: `<p class="small">Sistem menemukan produk dengan nama mirip. Produk <b>tidak digabung otomatis</b>; reviewer akan melihat peringatan ini.</p>${duplicateList(items)}`,
    footer: `<button class="btn sec" data-c>Periksa lagi</button><button class="btn danger" data-p>Produk berbeda — tetap ajukan</button>`,
    onMount: (el, close) => { el.querySelector('[data-c]').onclick = close; el.querySelector('[data-p]').onclick = () => { close(); onProceed(); }; } });
}

function opsList(ops) {
  const d = (o) => ({ update_product: () => 'Ubah produk' + (o.name ? `: nama → "${o.name}"` : ''), update_variant: () => 'Ubah varian ' + (o.name || ''), add_variant: () => `Tambah varian ${o.variant.variantCode} ${o.variant.name || ''}`, add_sku: () => `Tambah kemasan isi ${o.sku.packQty}`, change_barcode: () => `Ganti barcode → ${o.barcode.mode} ${o.barcode.code || '(alokasi otomatis)'}`, change_sku_code: () => 'Ubah kode SKU → ' + o.newCode, set_sku_status: () => 'Status SKU → ' + o.status }[o.op] || (() => o.op))();
  return `<ul class="tiny" style="margin:4px 0 0 16px;padding:0">${ops.map((o) => `<li>${esc(d(o))}</li>`).join('')}</ul>`;
}

async function priceModal(skuId, label, status) {
  const m = openModal({ title: 'Harga & histori — ' + label, size: 'lg', body: spinner() });
  const draw = async () => {
    const h = await call('sku.history', { id: skuId });
    m.el.querySelector('.mb').innerHTML = (can('price.write') && status !== 'archived' ? `<div class="box mb grid" style="grid-template-columns:130px 150px 1fr auto"><select id="pt"><option value="selling">Harga jual</option><option value="purchase">Harga beli</option></select><input id="pa" inputmode="numeric" placeholder="Nominal"><input id="pr" placeholder="Alasan perubahan (wajib)"><button class="btn" id="ps">Simpan</button></div>` : '') +
      `<div class="tw"><table><thead><tr><th>Jenis</th><th>Nominal</th><th>Berlaku</th><th>Alasan</th><th>Oleh</th></tr></thead><tbody>${h.prices.map((x) => `<tr style="${x.effective_to ? 'color:#9ca3af' : ''}"><td>${x.price_type === 'selling' ? 'Jual' : 'Beli'}</td><td>${fmtRp(x.amount)}</td><td class="tiny">${fmtDate(x.effective_from)} → ${x.effective_to ? fmtDate(x.effective_to) : B('berlaku', 'b-green')}</td><td class="tiny">${esc(x.reason)}</td><td class="tiny">${esc(x.created_by)}</td></tr>`).join('') || '<tr><td colspan=5 class="muted">Belum ada harga</td></tr>'}</tbody></table></div>` +
      (h.codeHistory.length ? `<div class="mt small"><b>Histori kode SKU</b>${h.codeHistory.map((c) => `<div class="mono tiny">${esc(c.old_code)} → ${esc(c.new_code)} · ${esc(c.changed_by)} · ${fmtDate(c.changed_at)} · "${esc(c.reason)}"</div>`).join('')}</div>` : '');
    if ($('#ps', m.el)) $('#ps', m.el).onclick = async () => {
      try { const r = await call('sku.setPrice', { id: skuId, priceType: $('#pt', m.el).value, amount: Number($('#pa', m.el).value.replace(/\D/g, '')), reason: $('#pr', m.el).value }); toast('success', r.changed ? 'Harga diperbarui' : 'Harga sama, tidak ada perubahan'); draw(); }
      catch (e) { toast('error', e.message); }
    };
  };
  draw();
}

async function barcodeHistoryModal(code) {

        <label class="f"><span>${system === 'shopee' ? 'Seller SKU di Shopee' : 'SKU di BeeCloud'}</span><input id="mext" class="mono"><div class="hint">Seharusnya SAMA PERSIS dengan SKU master.</div></label><div id="merr"></div></div>`,
      footer: '<button class="btn sec" data-c>Batal</button><button class="btn" data-s>Simpan</button>',
      onMount: (el, close) => { initCombos(el); el.querySelector('[data-c]').onclick = close; el.querySelector('[data-s]').onclick = async () => { try { await call('mapping.create', { skuId, system, externalSku: $('#mext', el).value, externalProductId: $('#mpid', el) ? $('#mpid', el).value : '', externalVariationId: $('#mvid', el) ? $('#mvid', el).value : '' }); toast('success', 'Mapping dibuat', 'Status: Dipetakan'); close(); load(); } catch (e) { $('#merr', el).innerHTML = errHtml(e); } }; } });
  };
  load();
});

/* ============================================================================ Audit */
route('audit', async (main) => {
  const F = { entityType: '', action: '', page: 1 };
  main.innerHTML = head('Audit Trail', 'Semua tindakan penting beserta nilai sebelum & sesudah') + `<section class="card"><div class="cb row"><select id="ae" style="width:auto"><option value="">Semua entitas</option>${['product', 'request', 'brand', 'category', 'barcode', 'sku', 'mapping', 'import', 'export', 'user', 'settings'].map((x) => `<option>${x}</option>`).join('')}</select><input id="aa" placeholder="Filter aksi" style="max-width:220px"></div><div id="al"></div></section>`;
  const load = async () => {
    const d = await call('audit.list', F);
    $('#al').innerHTML = d.rows.length ? `<div class="tw"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Entitas</th><th></th></tr></thead><tbody>${d.rows.map((a, i) => `<tr><td class="tiny">${fmtDate(a.created_at)}</td><td>${esc(a.actor)}</td><td>${esc(auditLabel(a.action))}${a.meta_json && a.meta_json.reason ? `<div class="tiny muted">"${esc(a.meta_json.reason)}"</div>` : ''}</td><td class="mono tiny">${esc(a.entity_type)} ${esc(String(a.entity_id).slice(0, 8))}</td><td>${a.before_json || a.after_json || a.meta_json ? `<a data-ad="${i}">Detail</a>` : ''}</td></tr>`).join('')}</tbody></table></div>` + pager(d, (p) => { F.page = p; load(); }) : empty('Tidak ada log');
    $$('[data-ad]').forEach((x) => (x.onclick = () => { const a = d.rows[Number(x.dataset.ad)]; openModal({ title: auditLabel(a.action), size: 'lg', body: `<div class="grid g2"><div><b class="small">Sebelum</b><pre class="json">${esc(JSON.stringify(a.before_json, null, 2))}</pre></div><div><b class="small">Sesudah</b><pre class="json">${esc(JSON.stringify(a.after_json, null, 2))}</pre></div></div>${a.meta_json ? `<pre class="json">${esc(JSON.stringify(a.meta_json, null, 2))}</pre>` : ''}` }); }));
  };
  $('#ae').onchange = () => { F.entityType = $('#ae').value; F.page = 1; load(); };
  $('#aa').oninput = debounce(() => { F.action = $('#aa').value; F.page = 1; load(); }, 400);
  load();
});

/* ============================================================================ Pengguna */
const ROLE_LABEL_UI = { admin: 'Admin', data_entry: 'Data Entry', reviewer: 'Reviewer', viewer: 'Viewer' };
route('pengguna', async (main) => {
  const users = await call('user.list');
  main.innerHTML = head('Pengguna & Hak Akses', 'Role-based access control — diterapkan di server', '<button class="btn" id="uadd">+ Tambah pengguna</button>') +
    card('', `<div class="tw"><table><thead><tr><th>Nama</th><th>Role</th><th>Status</th><th>Login terakhir</th><th></th></tr></thead><tbody>${users.map((u) => `<tr><td>${esc(u.fullName)}<div class="tiny muted">${esc(u.email)}</div></td><td>${B(ROLE_LABEL_UI[u.role], 'b-indigo')}</td><td>${u.isActive ? B('Aktif', 'b-green') : B('Nonaktif', 'b-red')}</td><td class="tiny muted">${fmtDate(u.lastLoginAt)}</td><td><button class="btn ghost sm" data-u="${u.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`, '', true) +
    `<div class="mt">${alertBox('info', 'Matriks hak akses', 'Admin: semua · Data Entry: buat/ubah draft, ajukan, usulkan referensi, alokasi barcode, harga, mapping, import/export · Reviewer: setujui/tolak/aktifkan, kelola referensi, lifecycle, audit · Viewer: lihat & ekspor.')}</div>`;
  const form = (u) => openModal({ title: u ? 'Edit pengguna' : 'Tambah pengguna',
    body: `<div class="grid"><label class="f"><span class="req">Email</span><input id="ue" type="email" value="${esc(u ? u.email : '')}" ${u ? 'disabled' : ''}></label><label class="f"><span class="req">Nama lengkap</span><input id="un" value="${esc(u ? u.fullName : '')}"></label>
      <label class="f"><span>Role</span><select id="ur" ${u && u.id === S.user.id ? 'disabled' : ''}>${Object.keys(ROLE_LABEL_UI).map((r) => `<option value="${r}" ${u && u.role === r ? 'selected' : ''}>${ROLE_LABEL_UI[r]}</option>`).join('')}</select></label>
      <label class="f"><span class="${u ? '' : 'req'}">${u ? 'Password baru (kosongkan bila tidak diganti)' : 'Password awal'}</span><input id="up" type="password" autocomplete="new-password"><div class="hint">Minimal 10 karakter</div></label>
      ${u && u.id !== S.user.id ? `<label class="row small"><input type="checkbox" id="ua" style="width:auto" ${u.isActive ? 'checked' : ''}> Akun aktif</label>` : ''}<div id="uerr"></div></div>`,
    footer: '<button class="btn sec" data-c>Batal</button><button class="btn" data-s>Simpan</button>',
    onMount: (el, close) => { el.querySelector('[data-c]').onclick = close; el.querySelector('[data-s]').onclick = async () => {
      try { if (u) await call('user.update', { id: u.id, fullName: $('#un', el).value, role: $('#ur', el).value, isActive: $('#ua', el) ? $('#ua', el).checked : undefined, password: $('#up', el).value || undefined }); else await call('user.create', { email: $('#ue', el).value, fullName: $('#un', el).value, role: $('#ur', el).value, password: $('#up', el).value }); toast('success', 'Pengguna disimpan'); close(); router(); }
      catch (e) { $('#uerr', el).innerHTML = errHtml(e); } }; } });
  $('#uadd').onclick = () => form(null);
  $$('[data-u]').forEach((b) => (b.onclick = () => form(users.find((x) => x.id === b.dataset.u))));
});

/* ============================================================================ Pengaturan & profil */
route('pengaturan', async (main) => {
  const s = await call('settings.get');
  const ed = can('settings.manage');
  main.innerHTML = head('Pengaturan & Profil', ed ? 'Aturan bisnis (Admin)' : 'Hanya Admin yang dapat mengubah pengaturan') + `<div class="grid g2">
    ${card('Format SKU bisnis', `<label class="f"><span>Template</span><input id="stpl" class="mono" value="${esc(s.sku_template)}" ${ed ? '' : 'disabled'}><div class="hint">Token: {BRAND} {CATEGORY} {PRODUCT} {VARIANT} {BARCODE} {QTY}</div></label>
      <div class="row mt"><button class="btn sec sm" data-tpl="{BRAND}-{CATEGORY}-{PRODUCT}{VARIANT}-{BARCODE}-{QTY}" ${ed ? '' : 'disabled'}>Format existing (dengan barcode)</button><button class="btn sec sm" data-tpl="{BRAND}-{CATEGORY}-{PRODUCT}{VARIANT}-{QTY}" ${ed ? '' : 'disabled'}>Format stabil (tanpa barcode)</button></div>
      <div class="soft mt mono small" id="sprev"></div><div class="mt">${alertBox('warn', null, 'Perubahan template hanya berlaku untuk SKU baru. SKU yang sudah ada (termasuk SKU lama di BeeCloud/Shopee) tidak pernah diubah otomatis.')}</div>`)}
    ${card('Kontrol internal', `<label class="row small"><input type="checkbox" id="smc" style="width:auto" ${s.maker_checker ? 'checked' : ''} ${ed ? '' : 'disabled'}><span><b>Maker-checker</b> — pembuat/pengaju tidak boleh menyetujui miliknya sendiri</span></label>
      <label class="row small mt"><input type="checkbox" id="saa" style="width:auto" ${s.auto_activate_on_approve ? 'checked' : ''} ${ed ? '' : 'disabled'}><span><b>Aktifkan otomatis saat disetujui</b></span></label>
      <label class="f mt"><span>Ambang kemiripan nama (0.5–0.99)</span><input id="sft" type="number" step="0.01" value="${s.fuzzy_threshold}" ${ed ? '' : 'disabled'}></label>
      <label class="f mt"><span>Prefix barcode internal</span><input class="mono" value="${esc(s.internal_barcode_prefix)}" disabled></label>${ed ? '<button class="btn mt" id="ssave">Simpan pengaturan</button>' : ''}`)}
    ${card('Ganti password saya', `<div class="grid"><label class="f"><span>Password lama</span><input type="password" id="po"></label><label class="f"><span>Password baru (min. 10)</span><input type="password" id="pn" autocomplete="new-password"></label><button class="btn sec" id="pchg">Ganti password</button></div>`)}
  </div>`;
  const prev = () => { const t = $('#stpl').value.toUpperCase(); const f = (o) => t.replace('{BRAND}', o.b).replace('{CATEGORY}', o.c).replace('{PRODUCT}', o.p).replace('{VARIANT}', o.v).replace('{BARCODE}', o.bc).replace('{QTY}', o.q).replace(/-{2,}/g, '-'); $('#sprev').innerHTML = esc(f({ b: 'VIV', c: 'TON', p: 'VAM100', v: '', bc: '8992796011501', q: '6' })) + '<br>' + esc(f({ b: 'PXY', c: 'PWR', p: 'UPCR', v: 'NO', bc: '2000000000046', q: '1' })); };
  $('#stpl').oninput = prev; prev();
  $$('[data-tpl]').forEach((b) => (b.onclick = () => { $('#stpl').value = b.dataset.tpl; prev(); }));
  if ($('#ssave')) $('#ssave').onclick = async () => { try { await call('settings.save', { sku_template: $('#stpl').value, maker_checker: $('#smc').checked, auto_activate_on_approve: $('#saa').checked, fuzzy_threshold: Number($('#sft').value) }); toast('success', 'Pengaturan disimpan'); } catch (e) { toast('error', e.message); } };
  $('#pchg').onclick = async () => { try { await call('user.changePassword', { oldPassword: $('#po').value, newPassword: $('#pn').value }); toast('success', 'Password diganti'); $('#po').value = $('#pn').value = ''; } catch (e) { toast('error', e.message); } };
});
</script>
