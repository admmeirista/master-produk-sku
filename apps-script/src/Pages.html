<script>
/* ═════════════ Halaman: dashboard, scan, master produk, detail, master brand/kategori, barcode, mapping, ekspor, import, sistem ═════════════ */

var ACTION_LABEL = {
  'product.create': 'Produk baru disimpan', 'product.update': 'Produk diubah', 'product.activate': 'Produk diaktifkan', 'product.deactivate': 'Produk dinonaktifkan',
  'variant.activate': 'Varian diaktifkan', 'variant.deactivate': 'Varian dinonaktifkan', 'barcode.change': 'Barcode diganti', 'barcode.allocate_internal': 'Barcode internal dialokasikan',
  'barcode.void': 'Barcode di-void', 'barcode.verify': 'GTIN diverifikasi', 'brand.create': 'Brand ditambahkan', 'brand.rename': 'Nama brand diubah', 'brand.activate': 'Brand diaktifkan', 'brand.deactivate': 'Brand dinonaktifkan', 'brand.delete': 'Brand dihapus',
  'category.create': 'Kategori ditambahkan', 'category.rename': 'Nama kategori diubah', 'category.activate': 'Kategori diaktifkan', 'category.deactivate': 'Kategori dinonaktifkan', 'category.delete': 'Kategori dihapus',
  'auth.login': 'Login', 'user.create': 'Pengguna dibuat', 'user.update': 'Pengguna diubah', 'user.change_password': 'Password diganti', 'settings.update': 'Pengaturan diubah',
  'mapping.create': 'Mapping dibuat', 'export.beecloud': 'Ekspor BeeCloud', 'export.to_sheet': 'Ekspor ke tab spreadsheet', 'migration.legacy': 'Migrasi data versi lama',
  'import.reference': 'Import referensi brand & kategori', 'import.channel_listing': 'Import listing marketplace', 'import.supplier_mapping': 'Import kode supplier', 'brand.import': 'Import Excel Master Brand', 'category.import': 'Import Excel Master Kategori', 'variant.rename': 'Nama Produk SKU diubah', 'product.status': 'Status produk diubah', 'variant.status': 'Status SKU produk diubah', 'variant.deprecate': 'SKU di-deprecate', 'bundle.create': 'Bundle dibuat', 'bundle.update': 'Bundle diubah', 'bundle.status': 'Status bundle diubah', 'supplier.create': 'Supplier ditambahkan', 'supplier.update': 'Supplier diubah', 'supplier_map.create': 'Kode supplier dipetakan', 'supplier_map.update': 'Mapping supplier diubah', 'attribute.create': 'Nilai atribut ditambahkan', 'import.master': 'Import master produk lama', 'import.internal_barcodes': 'Import barcode internal'
};
function actionLabel(a) { return ACTION_LABEL[a] || a; }
function cellStr(v) { return v === null || v === undefined ? '' : typeof v === 'number' ? (Number.isInteger(v) ? v.toFixed(0) : String(v)) : String(v); }

/* ───────── Cari SKU / Scan barcode (komponen bersama) ─────────
 * Scanner USB = keyboard: kode diketik cepat lalu Enter → langsung dicari. Hanya menampilkan identitas produk
 * (mis. untuk stock opname) — tidak mencatat transaksi apa pun. */
function scanBox(host, opts) {
  opts = opts || {};
  host.innerHTML = '<div class="scanbox"><div class="k">Cari SKU</div><div class="t">Scan GTIN / barcode internal, atau ketik SKU / nama produk</div>' +
    '<form autocomplete="off"><input class="in" name="q" placeholder="' + (isPhone() ? 'Ketik / scan GTIN, SKU, nama' : 'Arahkan scanner ke sini, atau ketik lalu Enter') + '" inputmode="text" spellcheck="false"><button class="btn pri" type="submit">' + icon('search') + 'Cari</button></form>' +
    '<div class="hint">GTIN, barcode internal, Kode SKU Produk, Kode Produk Induk, atau nama produk<span class="hide-m"> · <span class="kbd">F2</span></span></div></div><div class="scan-res"></div>';
  var f = $('form', host), res = $('.scan-res', host);
  f.onsubmit = function (e) {
    e.preventDefault();
    var q = f.q.value.trim(); if (!q) return f.q.focus();
    res.innerHTML = loadingBox('Mencari ' + q + '…');
    api('barcode.lookup', { code: q }, { silent: true }).then(function (r) { renderScan(res, r); f.q.select(); }).catch(function (e2) { res.innerHTML = errBox(e2.message); });
  };
  if (opts.focus !== false) setTimeout(function () { f.q.focus(); }, 30);
  if (opts.code) { f.q.value = opts.code; f.onsubmit(new Event('submit')); }
}
function renderScan(res, r) {
  if (r.conflict) {
    res.innerHTML = '<div class="hit bad"><span class="ico">' + icon('alert') + '</span><div><div class="nm">Konflik identitas: barcode <span class="code">' + esc(r.code) + '</span> aktif di ' + r.owners.length + ' barang</div>' +
      '<div class="meta"><span>Sistem tidak memilih salah satu. Perbaiki di Data Quality / Edit produk: ' + r.owners.map(function (o) { return esc(o.label); }).join('; ') + '</span></div></div></div>';
    return;
  }
  if (r.found) {
    res.innerHTML = (r.bundles || []).map(function (b) {
      return '<div class="hit"><span class="ico">' + icon('boxes') + '</span><div style="min-width:0"><div class="nm">' + esc(b.bundleName) + '</div><div class="meta"><span class="badge b-GTIN">Terdaftar · ' + esc(b.via) + '</span>' + badge(b.type) + badge(b.stockMode) + '<span class="sku">' + esc(b.bundleSku) + '</span>' + (b.status !== 'ACTIVE' ? badge(b.status) : '') + '</div></div><div class="acts"><button class="btn sm pri" data-bundle="' + esc(b.bundleId) + '">' + icon('eye') + 'Lihat bundle</button></div></div>';
    }).join('') + r.matches.map(function (m) {
      var st = m.productStatus !== 'ACTIVE' ? m.productStatus : m.variantStatus;
      var bc = m.conversion ? (m.conversion.gtin || m.conversion.internalBarcode) : (m.gtin || m.internalBarcode);
      return '<div class="hit idc">' + (m.imageUrl ? '<img class="vthumb" style="width:56px;height:56px;flex-basis:56px" src="' + esc(m.imageUrl) + '" alt="" referrerpolicy="no-referrer" onerror="this.remove()">' : '<span class="ico">' + icon('check') + '</span>') + '<div style="min-width:0;flex:1"><div class="nm">' + esc(m.skuName) + (m.conversion ? ' · ' + esc(m.conversion.unitName) + ' (isi ' + m.conversion.baseUnitEquivalent + ' ' + esc(m.baseUnit) + ')' : '') + '</div>' +
        '<div class="idg"><div><small>Kode SKU Produk</small><span class="sku">' + esc(m.childSku) + '</span></div><div><small>Kode Produk Induk</small><span class="sku">' + esc(m.parentSku) + '</span></div><div><small>Barcode</small><span class="code">' + esc(bc || '—') + '</span></div>' +
        '<div><small>Satuan dasar</small><b>' + esc(m.baseUnit || '—') + '</b></div><div><small>Status</small>' + badge(st) + '</div></div>' +
        '<div class="meta"><span class="badge b-GTIN">Ditemukan lewat ' + esc(m.via) + '</span><span class="muted">' + esc(m.brandName || '') + '</span></div></div>' +
        '<div class="acts"><button class="btn sm pri" data-open="' + esc(m.productId) + '">' + icon('eye') + 'Detail</button>' + (can('product.write') ? '<button class="btn sm" data-edit="' + esc(m.productId) + '">' + icon('edit') + 'Edit</button>' : '') + '</div></div>';
    }).join('');
  } else if (r.kind === 'gtin') {
    res.innerHTML = '<div class="hit new"><span class="ico">' + icon('alert') + '</span><div><div class="nm">Unknown Barcode — GTIN <span class="code">' + esc(r.code) + '</span> belum terdaftar</div><div class="meta"><span class="badge b-GTIN">GTIN valid · ' + esc(r.validation.symbology) + '</span>' +
      (r.retired.length ? '<span class="badge b-ERR">Pernah dipakai: ' + esc(r.retired[0].owner ? r.retired[0].owner.label : '') + ' — tidak boleh dipakai barang lain</span>' : '') + '</div></div>' +
      (can('product.write') && !r.retired.length ? '<div class="acts"><button class="btn sm pri" data-new="gtin">' + icon('plus') + 'Registrasi produk baru</button><button class="btn sm" data-new="variant">' + icon('layers') + 'Tambah sebagai varian produk lain</button></div>' : '') + '</div>';
  } else {
    var why = r.kind === 'internal' ? 'Kode berprefix 2xx = barcode internal toko' + (r.reserved ? ' (dicadangkan, belum dipakai barang)' : ', belum terdaftar') : r.kind === 'text' ? 'Tidak cocok dengan Kode SKU Produk, Kode Produk Induk, atau nama produk mana pun' : 'Bukan GTIN valid: ' + (r.validation.message || 'format/check digit salah');
    res.innerHTML = '<div class="hit bad"><span class="ico">' + icon('alert') + '</span><div><div class="nm">Unknown Barcode — ' + esc(r.code) + ' tidak ditemukan</div><div class="meta"><span>' + esc(why) + '.</span></div></div>' +
      (can('product.write') ? '<div class="acts"><button class="btn sm" data-new="manual">' + icon('plus') + 'Registrasi produk</button></div>' : '') + '</div>';
  }
  $$('[data-open]', res).forEach(function (b) { b.onclick = function () { App.go('product', b.getAttribute('data-open')); }; });
  $$('[data-bundle]', res).forEach(function (b) { b.onclick = function () { bundleEditor(b.getAttribute('data-bundle')); }; });
  $$('[data-edit]', res).forEach(function (b) { b.onclick = function () { App.go('register', { productId: b.getAttribute('data-edit') }); }; });
  $$('[data-new]', res).forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-new');
      if (k === 'gtin') return App.go('register', { gtin: r.code });
      if (k === 'manual') return App.go('register');
      pickProduct('Tambahkan GTIN ' + r.code + ' sebagai varian baru di produk…').then(function (p) { if (p) App.go('register', { productId: p.id, addGtin: r.code }); });
    };
  });
}
/** Modal pilih produk (searchable dropdown). */
function pickProduct(title) {
  return new Promise(function (resolve) {
    var picked = null;
    var m = modal('<h3>' + esc(title) + '</h3><div id="pp"></div><div class="row" style="margin-top:16px"><button class="btn pri" id="ppok">Pilih</button><button class="btn" data-close>Batal</button></div>', { onClose: function () { resolve(picked); } });
    var cb = combo($('#pp', m), { placeholder: 'Cari nama / kode produk / SKU…', load: function (q) { return q && q.length >= 2 ? api('product.search', { q: q }, { quiet: true, silent: true }) : []; }, label: function (it) { return it.name; }, sub: function (it) { return it.brandName; }, code: function (it) { return it.code; }, empty: 'Ketik minimal 2 huruf' });
    cb.focus();
    $('#ppok', m).onclick = function () { picked = cb.get(); if (!picked) return toast('Pilih produk dulu', 'err'); m.close(); };
  });
}

/* ───────── Dashboard ───────── */
Pages.dashboard = function (main) {
  main.innerHTML = pageHead('Ringkasan', 'Dashboard', can('product.write') ? '<button class="btn pri hide-m" data-go="register">' + icon('plus') + 'Registrasi Produk</button>' : '') + '<div id="db-scan" style="margin-bottom:16px"></div><div id="db-body">' + loadingBox() + '</div>';
  scanBox($('#db-scan', main), { focus: false });
  $$('[data-go]', main).forEach(function (b) { b.onclick = function () { App.go(b.getAttribute('data-go')); }; });
  api('dashboard.get', {}, { quiet: true }).then(function (d) {
    var c = d.counts;
    var kpi = function (ic, label, v, sub, cls, go) { return '<div class="kpi ' + (cls || '') + '"' + (go ? ' data-go2="' + go + '" style="cursor:pointer"' : '') + '><div class="top"><span class="chip">' + icon(ic) + '</span>' + esc(label) + '</div><div class="v">' + fmtNum(v) + '</div><div class="s">' + sub + '</div></div>'; };
    var max = Math.max.apply(null, d.byBrand.map(function (b) { return b.n; }).concat([1]));
    var pct = c.variants ? Math.round((c.withGtin + c.withInternal) / c.variants * 100) : 0;
    var chRows = Object.keys(d.channels || {}).map(function (k) { var x = d.channels[k]; return '<tr><td><b>' + esc(STATUS_TXT[k] || k) + '</b></td><td class="num">' + fmtNum(x.unmapped || 0) + '</td><td class="num">' + fmtNum(x.mapped || 0) + '</td><td class="num">' + fmtNum(x.exported || 0) + '</td><td class="num">' + fmtNum(x.confirmed || 0) + '</td><td class="num">' + fmtNum((x.error || 0) + (x.mismatch || 0)) + '</td></tr>'; }).join('');
    $('#db-body', main).innerHTML = '<div class="kpi4">' + kpi('package', 'Produk induk aktif', c.products, fmtNum(c.brands) + ' brand · ' + fmtNum(c.categories) + ' kategori' + (c.drafts ? ' · ' + c.drafts + ' draft' : ''), 'dark', 'products') +
      kpi('layers', 'Kode SKU Produk aktif', c.variants, fmtNum(c.bundles) + ' paket aktif', '', 'products') +
      kpi('barcode', 'Kelengkapan barcode', pct, '% SKU produk · ' + fmtNum(c.withGtin) + ' GTIN, ' + fmtNum(c.withInternal) + ' internal', '', 'barcodes') +
      kpi('boxes', 'Data kemasan lengkap', c.variants ? Math.round(c.packagingComplete / c.variants * 100) : 0, '% SKU produk · ' + fmtNum(c.variants - c.packagingComplete) + ' belum lengkap (opsional)', '', 'quality') + '</div>' +
      '<div class="dash2"><div style="display:flex;flex-direction:column;gap:16px"><div class="panel"><div class="panel-h"><h3>Status mapping kanal</h3><button class="btn sm ghost right" data-go2="mapping">Buka ' + icon('arrowRight') + '</button></div>' +
      (chRows ? '<div class="tablewrap"><table class="t"><thead><tr><th>Kanal</th><th class="num">Belum</th><th class="num">Dipetakan</th><th class="num">Diekspor</th><th class="num">Terkonfirmasi</th><th class="num">Error</th></tr></thead><tbody>' + chRows + '</tbody></table></div>' : '<div class="muted">Belum ada mapping kanal. Import listing dari Seller Center atau petakan manual.</div>') + '</div>' +
      '<div class="panel"><div class="panel-h"><h3>Data quality</h3><button class="btn sm ghost right" data-go2="quality">Periksa ' + icon('arrowRight') + '</button></div><div id="dq" class="muted">Memuat…</div></div>' +
      '<div class="panel"><div class="panel-h"><h3>Produk terbaru</h3><button class="btn sm ghost right" data-go2="products">Lihat semua ' + icon('arrowRight') + '</button></div>' +
      (d.recentProducts.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Produk</th><th>Brand</th><th class="num">Varian</th><th>Dibuat</th></tr></thead><tbody>' + d.recentProducts.map(function (p) {
        return '<tr class="click" data-id="' + esc(p.id) + '"><td><b>' + esc(p.name) + '</b><div class="sku" style="font-size:11.5px">' + esc(p.productNo) + '</div></td><td>' + esc(p.brandName) + '</td><td class="num">' + p.variants + '</td><td class="nowrap">' + fmtDate(p.createdAt) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : emptyBox('Belum ada produk', 'Scan barcode di atas atau mulai dari Registrasi Produk.')) + '</div></div>' +
      '<div style="display:flex;flex-direction:column;gap:16px"><div class="panel"><div class="panel-h"><h3>SKU produk aktif per brand</h3></div>' +
      (d.byBrand.length ? '<div class="bars">' + d.byBrand.map(function (b) { return '<div class="bar"><span>' + esc(b.name) + '</span><span class="t"><i style="width:' + Math.round(b.n / max * 100) + '%"></i></span><b class="num">' + b.n + '</b></div>'; }).join('') + '</div>' : '<div class="muted">Belum ada data.</div>') + '</div>' +
      '<div class="panel"><div class="panel-h"><h3>Aktivitas terbaru</h3></div><ul class="feed">' + (d.recent.length ? d.recent.map(function (a) { return '<li><span class="dot"></span><div><b>' + esc(actionLabel(a.action)) + '</b><div class="muted">' + esc(a.actor) + ' · ' + fmtDate(a.createdAt) + '</div></div></li>'; }).join('') : '<li class="muted">Belum ada aktivitas.</li>') + '</ul></div></div></div>';
    $$('[data-go2]', main).forEach(function (b) { b.onclick = function () { App.go(b.getAttribute('data-go2')); }; });
    $$('tr[data-id]', main).forEach(function (r) { r.onclick = function () { App.go('product', r.getAttribute('data-id')); }; });
    api('quality.get', {}, { quiet: true, silent: true }).then(function (q) {
      var el = $('#dq', main); if (!el) return;
      el.innerHTML = '<div class="row"><span class="badge b-ERR">Harus diperbaiki: ' + q.summary.error + '</span><span class="badge b-NONE">Perlu dicek: ' + q.summary.warn + '</span><span class="badge b-CHECK">Info: ' + q.summary.info + '</span></div>' +
        '<ul class="feed" style="margin-top:8px">' + q.sections.filter(function (s) { return s.count; }).slice(0, 5).map(function (s) { return '<li><span class="dot"></span><div><b>' + esc(s.label) + '</b> — ' + s.count + '</div></li>'; }).join('') + '</ul>';
    }).catch(function () { var el = $('#dq', main); if (el) el.textContent = 'Gagal memuat.'; });
  }).catch(function (e) { $('#db-body', main).innerHTML = errBox(e.message); });
};

/* ───────── Cari SKU / Scan ───────── */
Pages.scan = function (main, arg) {
  main.innerHTML = pageHead('Lookup', 'Cari SKU / Scan', '', '') + '<div id="sc" style="max-width:860px"></div>';
  scanBox($('#sc', main), { code: arg && arg.code });
};

/* ───────── Master Produk (direktori) ───────── */
Pages.products = function (main) {
  var f = { search: '', brandId: '', categoryId: '', status: 'ACTIVE', completeness: '', page: 1, sort: 'updatedAt', dir: 'desc' };
  main.innerHTML = pageHead('Master data', 'Master Produk', (can('export.run') ? '<button class="btn" id="ex">' + icon('download') + 'Ekspor</button>' : '') + (can('product.write') ? '<button class="btn pri hide-m" id="np">' + icon('plus') + 'Registrasi Produk</button>' : '')) +
    '<div class="filters"><div class="search">' + icon('search') + '<input class="in" id="fq" placeholder="Cari Kode Produk Induk, Kode SKU Produk, GTIN, barcode internal, nama…"></div><div id="fb" style="width:190px"></div><div id="fc" style="width:190px"></div>' +
    '<select class="in" id="fs"><option value="ACTIVE">Aktif</option><option value="DRAFT">Draft</option><option value="INACTIVE">Nonaktif</option><option value="DISCONTINUED">Discontinued</option><option value="ARCHIVED">Diarsipkan</option><option value="all">Semua status</option></select>' +
    '<select class="in" id="fk"><option value="">Semua</option><option value="incomplete">GTIN belum didata</option><option value="complete">Barcode lengkap</option></select></div><div id="pl"></div>';
  if ($('#np', main)) $('#np', main).onclick = function () { App.go('register'); };
  if ($('#ex', main)) $('#ex', main).onclick = function () {
    var b = $('#ex', main);
    busy(b, api('export.data', { kind: 'master' })).then(function (d) { if (!window.XLSX) return toast('Pustaka Excel belum termuat, coba lagi.', 'err'); downloadTable(d, 'xlsx'); toast(d.rows.length + ' SKU diekspor', 'ok'); }).catch(function () {});
  };
  var load = function () {
    var box = $('#pl', main);
    box.innerHTML = loadingBox();
    api('product.list', f).then(function (d) {
      if (!d.rows.length) { box.innerHTML = '<div class="tablewrap">' + emptyBox('Tidak ada produk', f.search ? 'Coba kata kunci lain, atau scan barcodenya di menu Scan Barcode.' : 'Produk yang disimpan langsung muncul di sini.') + '</div>'; return; }
      if (isPhone()) {
        box.innerHTML = '<div class="pcards">' + d.rows.map(function (r) {
          return '<div class="pcard' + (r.status !== 'ACTIVE' ? ' off' : '') + '" data-id="' + esc(r.id) + '"><div class="pc-top"><span class="sku">' + esc(r.productCode) + '</span>' + badge(r.status) + '</div>' +
            '<div class="pc-nm">' + esc(withBrand(r.brandName, r.name)) + '</div><div class="muted pc-sub">' + esc(r.categoryName) + ' · ' + r.variantCount + ' SKU produk</div>' +
            (r.complete ? '' : '<div style="margin-top:6px">' + badge('NONE', (r.activeVariants - r.withBarcode) + ' GTIN belum didata') + '</div>') +
            '<div class="pc-act"><button class="btn sm" data-exp>' + icon('chevron') + 'Lihat SKU</button>' + (can('product.write') ? '<button class="btn sm ghost" data-edit>' + icon('edit') + 'Edit</button><button class="btn sm ghost danger pc-del" data-delp title="Hapus produk">' + icon('trash') + '</button>' : '') + '</div><div class="pc-sk"></div></div>';
        }).join('') + '</div>' + pager(d, function (p2) { f.page = p2; load(); });
        $$('.pcard', box).forEach(function (c) {
          var id = c.getAttribute('data-id');
          $('.pc-nm', c).onclick = function () { App.go('product', id); };
          if ($('[data-edit]', c)) $('[data-edit]', c).onclick = function () { App.go('register', { productId: id }); };
          if ($('[data-delp]', c)) $('[data-delp]', c).onclick = function () { var r = d.rows.find(function (x) { return x.id === id; }); deleteProduct({ id: id, name: withBrand(r.brandName, r.name), productCode: r.productCode, status: r.status }, load); };
          $('[data-exp]', c).onclick = function () {
            var sk = $('.pc-sk', c);
            if (sk.innerHTML) { sk.innerHTML = ''; return; }
            sk.innerHTML = loadingBox();
            api('product.get', { id: id }, { quiet: true }).then(function (pd) {
              sk.innerHTML = pd.variants.map(function (v) { return '<div class="pc-v"><div><span class="sku">' + esc(v.sku) + '</span> ' + (v.status !== 'ACTIVE' ? badge(v.status) : '') + '</div><div>' + esc(v.skuName) + '</div><div class="muted">' + (v.gtin ? 'GTIN ' + esc(v.gtin) : v.internalBarcode ? 'Internal ' + esc(v.internalBarcode) : '<span style="color:var(--warn)">GTIN belum didata</span>') + '</div></div>'; }).join('');
            }).catch(function (e) { sk.innerHTML = errBox(e.message); });
          };
        });
        return;
      }
      var th = function (k, t, cls) { return '<th class="' + (cls || '') + '" data-sort="' + k + '" style="cursor:pointer">' + t + (f.sort === k ? (f.dir === 'asc' ? ' ↑' : ' ↓') : '') + '</th>'; };
      box.innerHTML = '<div class="tablewrap" style="max-height:none"><table class="t"><thead><tr><th style="width:36px"></th>' + th('productNo', 'Kode Produk Induk') + th('name', 'Nama Produk Induk') + th('brand', 'Brand') + th('category', 'Kategori') + th('skus', 'Jumlah Varian', 'num') + '<th>Barcode</th><th>Status</th><th></th></tr></thead><tbody>' +
        d.rows.map(function (r) {
          return '<tr data-id="' + esc(r.id) + '"' + (r.status !== 'ACTIVE' ? ' class="off"' : '') + '><td><button class="exp" data-exp title="Lihat varian & kemasan">' + icon('chevron') + '</button></td>' +
            '<td class="sku nowrap">' + esc(r.productCode) + '</td><td><div class="pcell"><b>' + esc(r.name) + '</b>' + (r.legacyCode ? '<small>kode lama ' + esc(r.legacyCode) + '</small>' : '') + '</div></td>' +
            '<td>' + esc(r.brandName) + '</td><td>' + esc(r.categoryName) + '</td><td class="num">' + r.variantCount + (r.skuCount > r.variantCount ? ' <span class="muted">+' + (r.skuCount - r.variantCount) + ' kemasan</span>' : '') + '</td>' +
            '<td>' + (r.complete ? badge('GTIN', 'Lengkap') : badge('NONE', (r.activeVariants - r.withBarcode) + ' GTIN belum didata')) + '</td><td>' + badge(r.status) + '</td>' +
            '<td><div class="ra"><button class="btn sm ghost" data-open title="Detail">' + icon('eye') + '</button>' + (can('product.write') ? '<button class="btn sm ghost" data-edit title="Edit">' + icon('edit') + '</button><button class="btn sm ghost" data-dup title="Duplikat produk">' + icon('copy') + '</button><button class="btn sm ghost danger" data-delp title="Hapus produk">' + icon('trash') + '</button>' : '') + '</div></td></tr>';

/** Dimensi & berat per satuan (cm, gram). */

/** Searchable dropdown brand/kategori. includeInactive untuk filter. */
/** Kelompok kategori Shopee: "Perawatan Wajah > Treatment Mata > Cream Mata" → "Perawatan Wajah › Treatment Mata". */
function catGroup(it) { return it && it.path ? it.path.split(' > ').slice(0, -1).join(' › ') : ''; }
function refCombo(host, kind, value, onChange, placeholder, includeInactive, disabled) {
  var cat = kind === 'category', dup = {};
  return combo(host, {
    value: value, placeholder: placeholder, disabled: disabled,
    load: function (q) {
      return Ref.get(kind).then(function (rows) {
        // kategori: hanya kategori akhir (seperti Shopee); kategori lama di belakang
        var list = rows.filter(function (r) { return (includeInactive || r.status === 'ACTIVE') && (!cat || r.leaf !== false); });
        if (!cat) return filterLocal(list, q, ['name', 'code']);
        dup = {}; list.forEach(function (r) { dup[r.name] = (dup[r.name] || 0) + 1; });
        var k = String(q || '').toLowerCase().trim();
        return filterLocal(list, q, ['name', 'path']).sort(function (a, b) {
          var sa = (a.source === 'LOCAL' ? 2 : 0) + (k && a.name.toLowerCase().indexOf(k) !== 0 ? 1 : 0), sb = (b.source === 'LOCAL' ? 2 : 0) + (k && b.name.toLowerCase().indexOf(k) !== 0 ? 1 : 0);
          return sa - sb || (a.path || a.name).localeCompare(b.path || b.name, 'id');
        });
      });
    },
    label: function (it) { return cat && it.path && dup[it.name] > 1 ? it.name + ' (' + catGroup(it).split(' › ')[0] + ')' : it.name; },
    sub: function (it) {
      var info = it.status !== 'ACTIVE' ? 'Nonaktif' : '';
      if (cat) return [it.source === 'LOCAL' ? 'Kategori lama · di luar standar Shopee' : catGroup(it), info].filter(Boolean).join(' · ');
      return info || (it.productCount ? it.productCount + ' produk' : '');
    },
    empty: cat ? 'Kategori tidak ditemukan. Coba kata lain, mis. toner, serum, lipstik, sabun.' : 'Tidak ditemukan. Tambahkan di Master Brand.', onChange: onChange
  });
}

      $('#hi', main).innerHTML = h.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Waktu</th><th>Jenis</th><th>File</th><th class="num">Baris</th><th class="num">Dibuat</th><th class="num">Dilewati</th><th class="num">Ditolak</th><th>Oleh</th></tr></thead><tbody>' + h.map(function (b) {
        return '<tr><td class="nowrap">' + fmtDate(b.createdAt) + '</td><td>' + esc(b.label || b.type) + '</td><td>' + esc(b.fileName) + '</td><td class="num">' + b.totalRows + '</td><td class="num">' + b.createdRows + '</td><td class="num">' + b.skippedRows + '</td><td class="num">' + b.errorRows + '</td><td>' + esc(b.createdBy) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="muted">Belum ada import.</div>';
    }).catch(function (e) { $('#hi', main).innerHTML = errBox(e.message); });
  };
  $$('[data-t]', main).forEach(function (c) { c.onclick = function () { $$('.imp-card', main).forEach(function (x) { x.classList.remove('on'); }); c.classList.add('on'); st.type = c.getAttribute('data-t'); $('#rp', main).innerHTML = ''; pickSheet(); }; });
  $('#fi', main).onchange = function (e) {
    var file = e.target.files[0]; if (!file) return;
    if (!window.XLSX) return toast('Pustaka Excel belum termuat, coba lagi.', 'err');
    var rd = new FileReader();
    rd.onload = function () { try { st.wb = XLSX.read(rd.result, { type: 'array' }); st.file = file.name; $('#fn', main).textContent = file.name; pickSheet(); } catch (err) { toast('File tidak dapat dibaca: ' + err.message, 'err'); } };
    rd.readAsArrayBuffer(file);
  };
  $('#sh', main).onchange = loadRows;
  $('#pv', main).onclick = function () {
    busy($('#pv', main), api('import.preview', payload())).then(function (r) {
      st.preview = r; $('#go', main).disabled = false;
      $('#rp', main).innerHTML = '<div class="info-box" style="margin-top:12px">' + icon('eye') + '<span><b>Pratinjau (dry-run)</b> — belum ada yang tersimpan. Periksa hasil & catatan, lalu klik <b>Import</b>.</span></div>' + report(r);
    }).catch(function () {});
  };
  $('#go', main).onclick = function () {
    ask('Import ' + fmtNum(st.preview.totalRows) + ' baris dari "' + st.sheet + '"? Data lama tidak dihapus; baris yang sudah pernah diimpor otomatis dilewati.', 'Import').then(function (y) {
      if (!y) return;
      busy($('#go', main), api('import.commit', Object.assign(payload(), { requestKey: uid() }))).then(function (r) {
        $('#go', main).disabled = true; Ref.data = {};
        $('#rp', main).innerHTML = '<div class="ok-box" style="margin-top:12px">' + icon('check') + '<span>Import selesai.</span></div>' + report(r);
        bindDl(r); toast('Import ' + r.label + ' selesai', 'ok'); history();
      }).catch(function () {});
    });
  };
  history();
};

/* ───────── Pengguna ───────── */
Pages.users = function (main) {
  main.innerHTML = pageHead('Sistem', 'Pengguna', '<button class="btn pri" id="nu">' + icon('plus') + 'Tambah pengguna</button>', 'Admin: semua akses · Admin Data: registrasi & master data · Viewer: hanya melihat & ekspor. Hak akses dicek di server.') + '<div id="ul">' + loadingBox() + '</div>';
  var roles = cfg().roles || [];
  var roleSel = function (v) { return '<select class="in w100" id="ro">' + roles.map(function (r) { return '<option value="' + r.id + '"' + (r.id === v ? ' selected' : '') + '>' + esc(r.label) + '</option>'; }).join('') + '</select>'; };
  var load = function () {
    api('user.list').then(function (rows) {
      $('#ul', main).innerHTML = '<div class="tablewrap"><table class="t"><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Login terakhir</th><th></th></tr></thead><tbody>' + rows.map(function (u) {
        return '<tr' + (u.isActive ? '' : ' class="off"') + '><td><b>' + esc(u.fullName) + '</b></td><td>' + esc(u.email) + '</td><td>' + badge(u.role) + '</td><td>' + badge(u.isActive ? 'ACTIVE' : 'INACTIVE') + '</td><td class="muted">' + fmtDate(u.lastLoginAt) + '</td><td><button class="btn sm" data-u="' + esc(u.id) + '">' + icon('edit') + 'Ubah</button></td></tr>';
      }).join('') + '</tbody></table></div>';
      $$('[data-u]', main).forEach(function (b) {
        b.onclick = function () {
          var u = rows.find(function (x) { return x.id === b.getAttribute('data-u'); });
          var m = modal('<h3>Ubah pengguna</h3><div class="muted">' + esc(u.email) + '</div><label class="f">Nama</label><input class="in w100" id="fn" value="' + esc(u.fullName) + '"><label class="f">Role</label>' + roleSel(u.role) +
            '<label class="f">Reset password (opsional, min. 10 karakter)</label><input class="in w100" id="pw" type="text" autocomplete="off"><label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="ac"' + (u.isActive ? ' checked' : '') + '> Akun aktif</label>' +
            '<div class="row" style="margin-top:16px"><button class="btn pri" id="go">Simpan</button><button class="btn" data-close>Batal</button></div>');
          $('#go', m).onclick = function () { busy($('#go', m), api('user.update', { id: u.id, fullName: $('#fn', m).value, role: $('#ro', m).value, password: $('#pw', m).value || undefined, isActive: $('#ac', m).checked })).then(function () { m.close(); toast('Pengguna diperbarui', 'ok'); load(); }).catch(function () {}); };
        };
      });
    }).catch(function (e) { $('#ul', main).innerHTML = errBox(e.message); });
  };
  $('#nu', main).onclick = function () {
    var m = modal('<h3>Tambah pengguna</h3><label class="f">Nama lengkap</label><input class="in w100" id="fn"><label class="f">Email (untuk login)</label><input class="in w100" id="em" type="email"><label class="f">Role</label>' + roleSel('data_entry') +
      '<label class="f">Password awal (min. 10 karakter)</label><input class="in w100" id="pw" type="text" autocomplete="off"><div class="hint">Sampaikan langsung ke pengguna; minta segera diganti di menu Profil.</div><div class="row" style="margin-top:16px"><button class="btn pri" id="go">Simpan</button><button class="btn" data-close>Batal</button></div>');
    $('#go', m).onclick = function () { busy($('#go', m), api('user.create', { fullName: $('#fn', m).value, email: $('#em', m).value, role: $('#ro', m).value, password: $('#pw', m).value })).then(function () { m.close(); toast('Pengguna ditambahkan', 'ok'); load(); }).catch(function () {}); };
  };
  load();
};

/* ───────── Settings ───────── */
Pages.settings = function (main) {
  var w = can('settings.manage');
  Promise.all([api('settings.get'), api('attribute.list', {}, { quiet: true })]).then(function (res) {
    var s = res[0], attrs = res[1];
    var row = function (t, d, ctl) { return '<div class="cfg-row"><div><div class="t">' + t + '</div><div class="d">' + d + '</div></div><div>' + ctl + '</div></div>'; };
    var dis = w ? '' : ' disabled';
    main.innerHTML = pageHead('Sistem', 'Settings', '', w ? '' : 'Hanya Admin yang dapat mengubah pengaturan.') + '<div class="cfg">' +
      row('Format kode', 'Dibuat otomatis oleh sistem, berurutan, permanen, tidak dipakai ulang. Brand, kategori, barcode, nama, dan kemasan tidak memengaruhi kode.', '<div class="row"><span class="chip-code">PRD000001</span><span class="chip-code">PRD000001-001</span><span class="chip-code">MP000001</span><span class="chip-code">BD000001</span></div>') +
      row('Pencarian GTIN eksternal', 'Saat GTIN baru dipindai, cari detail produk di Open Beauty Facts (API publik, data ODbL) sebagai usulan auto-fill. Hasil di-cache; selalu diperiksa user sebelum disimpan.', '<label class="chk"><span class="sw"><input type="checkbox" id="gl"' + (s.gtin_lookup_enabled ? ' checked' : '') + dis + '><i></i></span>Aktif</label>') +
      row('Satuan dasar (stok)', 'Pilihan satuan stok saat registrasi. Pisahkan dengan koma.', '<textarea class="in w100" rows="2" id="bu"' + dis + '>' + esc(s.base_units.join(', ')) + '</textarea>') +
      row('Satuan kemasan', 'Pilihan satuan kemasan / beli (isi diatur per SKU produk).', '<textarea class="in w100" rows="2" id="pu"' + dis + '>' + esc(s.pack_units.join(', ')) + '</textarea>') +
      row('Jenis atribut varian', 'Pilihan cepat di generator varian.', '<textarea class="in w100" rows="2" id="at"' + dis + '>' + esc(s.attribute_types.join(', ')) + '</textarea>') +
      row('Ambang kemiripan nama', 'Skor ≥ nilai ini ditandai sebagai kandidat duplikat (0.50–0.99).', '<input class="in" id="fz" type="number" step="0.01" min="0.5" max="0.99" value="' + esc(s.fuzzy_threshold) + '"' + dis + '>') +
      row('Prefix barcode internal', 'Namespace GS1 "restricted circulation" (prefix 200) — tidak bentrok dengan GTIN produsen.', '<span class="chip-code">' + esc(s.internal_barcode_prefix) + '</span>') +
      (w ? '<div class="row" style="margin-top:14px"><button class="btn pri" id="sv">Simpan pengaturan</button></div>' : '') + '</div>' +
      '<div class="sect">Master nilai atribut (opsional)</div><div class="cfg"><div class="muted" style="margin:10px 0">Nilai standar dipakai sebagai saran di generator varian dan menyeragamkan penulisan saat disimpan (mis. "100ML" → "100 ml").</div>' +
      (can('master.write') ? '<div class="row"><select class="in" id="an">' + s.attribute_types.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select><input class="in" id="av" placeholder="Nilai, mis. Ocean Blue / 100 ml"><button class="btn" id="aa">' + icon('plus') + 'Tambah</button></div>' : '') +
      '<div id="al" style="margin-top:12px"></div></div>';
    var drawAttrs = function () {
      var g = {}; attrs.forEach(function (a) { (g[a.name] = g[a.name] || []).push(a); });
      $('#al', main).innerHTML = Object.keys(g).length ? Object.keys(g).map(function (k) { return '<div style="margin:6px 0"><b>' + esc(k) + '</b> ' + g[k].map(function (a) { return '<span class="vchip">' + esc(a.value) + (can('master.write') ? '<button type="button" data-ad="' + esc(a.id) + '">' + icon('x') + '</button>' : '') + '</span>'; }).join(' ') + '</div>'; }).join('') : '<div class="muted">Belum ada nilai standar.</div>';
      $$('[data-ad]', main).forEach(function (b) { b.onclick = function () { api('attribute.delete', { id: b.getAttribute('data-ad') }).then(function () { attrs = attrs.filter(function (x) { return x.id !== b.getAttribute('data-ad'); }); drawAttrs(); }).catch(function () {}); }; });
    };
    drawAttrs();
    if ($('#aa', main)) $('#aa', main).onclick = function () { busy($('#aa', main), api('attribute.save', { name: $('#an', main).value, value: $('#av', main).value })).then(function (a) { attrs.push(a); $('#av', main).value = ''; drawAttrs(); }).catch(function () {}); };
    if (w) $('#sv', main).onclick = function () {
      busy($('#sv', main), api('settings.save', { master_code_length: Number($('#cl', main).value), gtin_lookup_enabled: $('#gl', main).checked, base_units: $('#bu', main).value, pack_units: $('#pu', main).value, attribute_types: $('#at', main).value, fuzzy_threshold: Number($('#fz', main).value) }))
        .then(function () { toast('Pengaturan disimpan', 'ok'); return api('auth.me', {}, { quiet: true }); }).then(function (me) { if (me) App.remember(me); }).catch(function () {});
    };
  }).catch(function (e) { main.innerHTML = errBox(e.message); });
};

/* ───────── Audit log ───────── */
Pages.audit = function (main) {
  var f = { action: '', actor: '', entityType: '', page: 1 };
  main.innerHTML = pageHead('Sistem', 'Audit Log', '', 'Catatan perubahan data penting: siapa, kapan, nilai sebelum & sesudah.') +
    '<div class="filters"><select class="in" id="et"><option value="">Semua entitas</option><option value="product">Produk</option><option value="variant">Varian</option><option value="brand">Brand</option><option value="category">Kategori</option><option value="barcode">Barcode</option><option value="mapping">Mapping</option><option value="import">Import</option><option value="user">Pengguna</option><option value="settings">Pengaturan</option></select>' +
    '<input class="in" id="ac" placeholder="Filter aksi (mis. product)"><input class="in" id="us" placeholder="Filter pengguna"></div><div id="al"></div>';
  var load = function () {
    var box = $('#al', main); box.innerHTML = loadingBox();
    api('audit.list', f).then(function (d) {
      box.innerHTML = d.rows.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Waktu</th><th>Aksi</th><th>Oleh</th><th>Entitas</th><th>Detail</th></tr></thead><tbody>' + d.rows.map(function (a, i) {
        return '<tr><td class="nowrap">' + fmtDate(a.createdAt) + '</td><td><b>' + esc(actionLabel(a.action)) + '</b><div class="muted" style="font-size:11px">' + esc(a.action) + '</div></td><td>' + esc(a.actor) + '</td><td>' + esc(a.entityType) + (a.entityType === 'product' && a.entityId ? ' <a class="link-btn" data-p="' + esc(a.entityId) + '">buka</a>' : '') + '</td><td>' + (a.before || a.after || a.meta ? '<button class="btn sm ghost" data-i="' + i + '">Lihat</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' + pager(d, function (p) { f.page = p; load(); }) : '<div class="tablewrap">' + emptyBox('Tidak ada catatan', '', 'activity') + '</div>';
      $$('[data-p]', box).forEach(function (a) { a.onclick = function () { App.go('product', a.getAttribute('data-p')); }; });
      $$('[data-i]', box).forEach(function (b) {
        b.onclick = function () {
          var a = d.rows[Number(b.getAttribute('data-i'))];
          var pre = function (t, v) { return v ? '<div class="sect" style="margin:12px 0 6px">' + t + '</div><pre class="json" style="max-width:none">' + esc(JSON.stringify(v, null, 2)) + '</pre>' : ''; };
          modal('<h3>' + esc(actionLabel(a.action)) + '</h3><div class="muted">' + esc(a.actor) + ' · ' + fmtDate(a.createdAt) + '</div>' + pre('Sebelum', a.before) + pre('Sesudah', a.after) + pre('Keterangan', a.meta) + '<div class="row" style="margin-top:16px"><button class="btn" data-close>Tutup</button></div>', { wide: true });
        };
      });
    }).catch(function (e) { box.innerHTML = errBox(e.message); });
  };
  $('#et', main).onchange = function (e) { f.entityType = e.target.value; f.page = 1; load(); };
  $('#ac', main).oninput = debounce(function (e) { f.action = e.target.value; f.page = 1; load(); }, 300);
  $('#us', main).oninput = debounce(function (e) { f.actor = e.target.value; f.page = 1; load(); }, 300);
  load();
};

Pages.profile = function (main) {

  main.innerHTML = pageHead('Akun', 'Profil & Password') + '<div class="card" style="max-width:520px"><div class="kv"><div>Nama</div><div><b>' + esc(u.fullName) + '</b></div><div>Email</div><div>' + esc(u.email) + '</div><div>Role</div><div>' + badge(u.role) + '</div></div>' +

    '<label class="f">Password baru (min. 10 karakter)</label><div class="pw"><input class="in w100" type="password" name="n" autocomplete="new-password" minlength="10" required><button type="button" class="eye" tabindex="-1">' + icon('eye') + '</button></div>' +
    '<label class="f">Ulangi password baru</label><input class="in w100" type="password" name="n2" autocomplete="new-password" required><div class="row" style="margin-top:16px"><button class="btn pri" type="submit">Simpan password</button></div></form></div>';
  var f = $('#pf', main); App.bindEye(f);

};
