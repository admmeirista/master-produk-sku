<script>
/* ═════════════ Halaman: dashboard, direktori, detail, master brand/kategori, barcode, mapping, ekspor, sistem ═════════════ */

/* ───────── Dashboard ───────── */
Pages.dashboard = function (main) {
  api('dashboard.get').then(function (d) {
    var c = d.counts;
    var kpi = function (ic, label, v, sub, cls) { return '<div class="kpi ' + (cls || '') + '"><div class="top"><span class="chip">' + icon(ic) + '</span>' + esc(label) + '</div><div class="v">' + fmtNum(v) + '</div><div class="s">' + sub + '</div></div>'; };
    var max = Math.max.apply(null, d.byBrand.map(function (b) { return b.n; }).concat([1]));
    var pct = c.variants ? Math.round((c.withGtin + c.withInternal) / c.variants * 100) : 0;
    main.innerHTML = pageHead('Ringkasan', 'Dashboard', can('product.write') ? '<button class="btn pri" data-go="register">' + icon('plus') + 'Registrasi Produk</button>' : '') +
      '<div class="kpi4">' + kpi('package', 'Produk aktif', c.products, fmtNum(c.brands) + ' brand · ' + fmtNum(c.categories) + ' kategori', 'dark') +
      kpi('layers', 'Varian aktif', c.variants, fmtNum(c.skus) + ' SKU (varian + kemasan)') +
      kpi('barcode', 'Kelengkapan barcode', pct, '% varian · ' + fmtNum(c.withGtin) + ' GTIN, ' + fmtNum(c.withInternal) + ' internal') +
      kpi('alert', 'Varian tanpa barcode', c.withoutBarcode, 'Lengkapi lewat Edit produk', c.withoutBarcode ? 'alert' : '') + '</div>' +
      '<div class="dash2"><div class="panel"><div class="panel-h"><h3>Produk terbaru</h3><span class="sub">langsung tersedia di direktori</span><button class="btn sm ghost right" data-go="products">Lihat semua ' + icon('arrowRight') + '</button></div>' +
      (d.recentProducts.length ? '<table class="t"><thead><tr><th>Produk</th><th>Brand</th><th class="num">Varian</th><th>Dibuat</th></tr></thead><tbody>' + d.recentProducts.map(function (p) {
        return '<tr class="click" data-id="' + esc(p.id) + '"><td><b>' + esc(p.name) + '</b><div class="muted" style="font-size:11.5px">' + esc(p.productNo) + '</div></td><td>' + esc(p.brandName) + '</td><td class="num">' + p.variants + '</td><td class="nowrap">' + fmtDate(p.createdAt) + '</td></tr>';
      }).join('') + '</tbody></table>' : emptyBox('Belum ada produk', 'Mulai dari Master Brand & Kategori, lalu Registrasi Produk.')) + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:16px"><div class="panel"><div class="panel-h"><h3>Varian aktif per brand</h3></div>' +
      (d.byBrand.length ? '<div class="bars">' + d.byBrand.map(function (b) { return '<div class="bar"><span>' + esc(b.name) + '</span><span class="t"><i style="width:' + Math.round(b.n / max * 100) + '%"></i></span><b class="num">' + b.n + '</b></div>'; }).join('') + '</div>' : '<div class="muted">Belum ada data.</div>') + '</div>' +
      '<div class="panel"><div class="panel-h"><h3>Aktivitas terbaru</h3></div><ul class="feed">' + (d.recent.length ? d.recent.map(function (a) { return '<li><span class="dot"></span><div><b>' + esc(actionLabel(a.action)) + '</b><div class="muted">' + esc(a.actor) + ' · ' + fmtDate(a.createdAt) + '</div></div></li>'; }).join('') : '<li class="muted">Belum ada aktivitas.</li>') + '</ul></div></div></div>';
    $$('[data-go]', main).forEach(function (b) { b.onclick = function () { App.go(b.getAttribute('data-go')); }; });
    $$('tr[data-id]', main).forEach(function (r) { r.onclick = function () { App.go('product', r.getAttribute('data-id')); }; });
  }).catch(function (e) { main.innerHTML = errBox(e.message); });
};

var ACTION_LABEL = {
  'product.create': 'Produk baru disimpan', 'product.update': 'Produk diubah', 'product.activate': 'Produk diaktifkan', 'product.deactivate': 'Produk dinonaktifkan',
  'variant.activate': 'Varian diaktifkan', 'variant.deactivate': 'Varian dinonaktifkan', 'barcode.change': 'Barcode diganti', 'barcode.allocate_internal': 'Barcode internal dialokasikan',
  'barcode.void': 'Barcode di-void', 'barcode.verify': 'GTIN diverifikasi', 'brand.create': 'Brand ditambahkan', 'brand.rename': 'Nama brand diubah', 'brand.activate': 'Brand diaktifkan', 'brand.deactivate': 'Brand dinonaktifkan',
  'category.create': 'Kategori ditambahkan', 'category.rename': 'Nama kategori diubah', 'category.activate': 'Kategori diaktifkan', 'category.deactivate': 'Kategori dinonaktifkan',
  'auth.login': 'Login', 'user.create': 'Pengguna dibuat', 'user.update': 'Pengguna diubah', 'user.change_password': 'Password diganti', 'settings.update': 'Pengaturan diubah',
  'mapping.create': 'Mapping dibuat', 'export.beecloud': 'Ekspor BeeCloud', 'export.to_sheet': 'Ekspor ke tab spreadsheet', 'migration.legacy': 'Migrasi data versi lama'
};
function actionLabel(a) { return ACTION_LABEL[a] || a; }

/* ───────── Direktori produk ───────── */
Pages.products = function (main) {
  var f = { search: '', brandId: '', categoryId: '', status: 'ACTIVE', completeness: '', page: 1, sort: 'updatedAt', dir: 'desc' };
  main.innerHTML = pageHead('Master data', 'Direktori Produk', can('product.write') ? '<button class="btn pri" id="np">' + icon('plus') + 'Registrasi Produk</button>' : '') +
    '<div class="filters"><div class="search">' + icon('search') + '<input class="in" id="fq" placeholder="Cari nama, kode, SKU, GTIN…"></div><div id="fb" style="width:200px"></div><div id="fc" style="width:200px"></div>' +
    '<select class="in" id="fs"><option value="ACTIVE">Aktif</option><option value="INACTIVE">Nonaktif</option><option value="all">Semua status</option></select>' +
    '<select class="in" id="fk"><option value="">Semua kelengkapan</option><option value="incomplete">Barcode belum lengkap</option><option value="complete">Barcode lengkap</option></select></div><div id="pl"></div>';
  if ($('#np', main)) $('#np', main).onclick = function () { App.go('register'); };
  var load = function () {
    var box = $('#pl', main);
    box.innerHTML = loadingBox();
    api('product.list', f).then(function (d) {
      if (!d.rows.length) { box.innerHTML = '<div class="tablewrap">' + emptyBox('Tidak ada produk', f.search ? 'Coba kata kunci lain.' : 'Produk yang disimpan langsung muncul di sini.') + '</div>'; return; }
      var th = function (k, t, cls) { return '<th class="' + (cls || '') + '" data-sort="' + k + '" style="cursor:pointer">' + t + (f.sort === k ? (f.dir === 'asc' ? ' ↑' : ' ↓') : '') + '</th>'; };
      box.innerHTML = '<div class="tablewrap"><table class="t"><thead><tr>' + th('name', 'Produk') + th('brand', 'Brand') + th('category', 'Kategori') + '<th>Kode</th><th>Satuan</th>' + th('skus', 'SKU', 'num') + '<th>Barcode</th><th>Status</th></tr></thead><tbody>' +
        d.rows.map(function (r) {
          return '<tr class="click' + (r.status !== 'ACTIVE' ? ' off' : '') + '" data-id="' + esc(r.id) + '"><td><b>' + esc(r.name) + '</b><div class="muted" style="font-size:11.5px">' + esc(r.productNo) + ' · ' + r.variantCount + ' varian</div></td>' +
            '<td>' + esc(r.brandName) + ' <span class="chip-code ghost">' + esc(r.brandCode) + '</span></td><td>' + esc(r.categoryName) + '</td><td class="code">' + esc(r.productCode) + '</td><td>' + esc(r.baseUnit) + '</td>' +
            '<td class="num">' + r.skuCount + '</td><td>' + (r.complete ? badge('GTIN', r.withBarcode + '/' + r.activeVariants + ' lengkap') : badge('NONE', r.withBarcode + '/' + r.activeVariants + ' varian')) + '</td><td>' + badge(r.status) + '</td></tr>';
        }).join('') + '</tbody></table></div>' + pager(d, function (p) { f.page = p; load(); });
      $$('tr[data-id]', box).forEach(function (tr) { tr.onclick = function () { App.go('product', tr.getAttribute('data-id')); }; });
      $$('th[data-sort]', box).forEach(function (h) { h.onclick = function () { var k = h.getAttribute('data-sort'); f.dir = f.sort === k && f.dir === 'asc' ? 'desc' : 'asc'; f.sort = k; load(); }; });
    }).catch(function (e) { box.innerHTML = errBox(e.message); });
  };
  $('#fq', main).oninput = debounce(function (e) { f.search = e.target.value; f.page = 1; load(); }, 300);
  $('#fs', main).onchange = function (e) { f.status = e.target.value; f.page = 1; load(); };
  $('#fk', main).onchange = function (e) { f.completeness = e.target.value; f.page = 1; load(); };
  refCombo($('#fb', main), 'brand', null, function (it) { f.brandId = it ? it.id : ''; f.page = 1; load(); }, 'Semua brand', true);
  refCombo($('#fc', main), 'category', null, function (it) { f.categoryId = it ? it.id : ''; f.page = 1; load(); }, 'Semua kategori', true);
  load();
};

/** Searchable dropdown brand/kategori. includeInactive untuk filter. */
function refCombo(host, kind, value, onChange, placeholder, includeInactive, disabled) {
  return combo(host, {
    value: value, placeholder: placeholder, disabled: disabled,
    load: function (q) { return Ref.get(kind).then(function (rows) { return filterLocal(rows.filter(function (r) { return includeInactive || r.status === 'ACTIVE'; }), q, ['name', 'code']); }); },
    label: function (it) { return it.name; }, code: function (it) { return it.code; },
    sub: function (it) { return it.status !== 'ACTIVE' ? 'Nonaktif' : it.productCount ? it.productCount + ' produk' : ''; },
    empty: 'Tidak ditemukan. Tambahkan di Master ' + (kind === 'brand' ? 'Brand' : 'Kategori') + '.', onChange: onChange
  });
}

/* ───────── Detail produk ───────── */
Pages.product = function (main, id) {
  api('product.get', { id: id }).then(function (p) {
    var act = '';
    if (can('product.write')) act = '<button class="btn pri" id="ed">' + icon('edit') + 'Edit / Tambah varian</button>' +
      (p.status === 'ACTIVE' ? '<button class="btn" id="st">' + icon('power') + 'Nonaktifkan</button>' : '<button class="btn ok" id="st">' + icon('power') + 'Aktifkan</button>');
    var unit = p.baseUnit;
    main.innerHTML = '<button class="back" id="bk">' + icon('arrowLeft') + 'Direktori Produk</button>' +
      '<div class="dt-head"><div class="grow"><div class="eyebrow">' + esc(p.productNo) + '</div><h2>' + esc(p.name) + '</h2><div class="dt-meta">' + badge(p.status) +
      '<span class="chip-code ghost">' + esc(p.brand.code) + '</span>' + esc(p.brand.name) + ' · <span class="chip-code ghost">' + esc(p.category.code) + '</span>' + esc(p.category.name) + '</div></div><div class="row">' + act + '</div></div>' +
      '<div class="grid2" style="margin-bottom:16px"><div class="panel"><div class="panel-h"><h3>Identifikasi produk</h3></div><div class="kv">' +
      '<div>Kode produk</div><div class="code">' + esc(p.productCode) + '</div><div>Satuan dasar</div><div><b>' + esc(unit) + '</b></div>' +
      '<div>Jumlah varian</div><div>' + p.variants.length + ' (' + p.variants.filter(function (v) { return v.status === 'ACTIVE'; }).length + ' aktif)</div>' +
      '<div>Dibuat</div><div>' + fmtDate(p.createdAt) + ' · ' + esc(p.createdBy) + '</div><div>Terakhir diubah</div><div>' + fmtDate(p.updatedAt) + ' · ' + esc(p.updatedBy) + '</div></div></div>' +
      '<div class="panel"><div class="panel-h"><h3>Kalkulator konversi</h3><span class="sub">kuantitas ekuivalen dalam ' + esc(unit) + '</span></div>' + calcHtml(p.variants) + '</div></div>' +
      '<div class="sect">Varian, SKU & barcode</div><div class="tablewrap" style="max-height:none"><table class="t"><thead><tr><th>Varian</th><th>SKU</th><th>Barcode</th><th>Satuan kemasan</th><th>Status</th>' + (can('product.write') ? '<th></th>' : '') + '</tr></thead><tbody>' +
      p.variants.map(function (v) {
        var packs = v.conversions.filter(function (c) { return !c.isBaseUnit; });
        return '<tr' + (v.status !== 'ACTIVE' ? ' class="off"' : '') + '><td><b>' + esc(v.name) + '</b><div>' + v.attributes.map(function (a) { return '<span class="attr-pill"><i>' + esc(a.name) + '</i>' + esc(a.value) + '</span>'; }).join('') + '</div></td>' +
          '<td class="sku">' + esc(v.sku) + '</td><td>' + bcCell(v.gtin, v.internalBarcode) + '</td><td>' +
          (packs.length ? packs.map(function (c) { return '<div style="margin:2px 0"><b>1 ' + esc(c.unitName) + '</b> = ' + c.factor + ' ' + esc(c.containsUnit) + (c.containsUnit !== unit ? ' <span class="muted">(' + c.baseUnitEquivalent + ' ' + esc(unit) + ')</span>' : '') + (c.sku ? ' <span class="sku">' + esc(c.sku) + '</span>' : '') + (c.gtin || c.internalBarcode ? ' ' + bcCell(c.gtin, c.internalBarcode) : '') + (c.status !== 'ACTIVE' ? ' ' + badge('INACTIVE') : '') + '</div>'; }).join('') : '<span class="muted">Hanya ' + esc(unit) + '</span>') +
          '</td><td>' + badge(v.status) + '</td>' + (can('product.write') ? '<td><button class="btn sm" data-vs="' + esc(v.id) + '" data-to="' + (v.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE') + '">' + (v.status === 'ACTIVE' ? 'Nonaktifkan' : 'Aktifkan') + '</button></td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="sect">Riwayat perubahan</div><div id="hist">' + loadingBox() + '</div>';
    $('#bk', main).onclick = function () { App.go('products'); };
    bindCalc(main, p.variants, unit);
    $$('[data-bc]', main).forEach(function (b) { b.onclick = function () { showBarcode(b.getAttribute('data-bc')); }; });
    if ($('#ed', main)) $('#ed', main).onclick = function () { App.go('register', { productId: p.id }); };
    if ($('#st', main)) $('#st', main).onclick = function () {
      var to = p.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
      var go = function (reason) { busy($('#st', main), api('product.setStatus', { id: p.id, status: to, reason: reason })).then(function () { toast(to === 'ACTIVE' ? 'Produk diaktifkan' : 'Produk dinonaktifkan', 'ok'); App.go('product', p.id); }).catch(function () {}); };
      if (to === 'ACTIVE') go(''); else promptText('Nonaktifkan produk', 'Alasan (wajib, min. 5 karakter)', { min: 5, ok: 'Nonaktifkan', danger: true }).then(function (r) { if (r) go(r); });
    };
    $$('[data-vs]', main).forEach(function (b) {
      b.onclick = function () {
        var to = b.getAttribute('data-to');
        ask(to === 'ACTIVE' ? 'Aktifkan varian ini?' : 'Nonaktifkan varian ini? SKU & barcode tetap tercatat dan tidak dipakai ulang.', to === 'ACTIVE' ? 'Aktifkan' : 'Nonaktifkan', to !== 'ACTIVE').then(function (y) {
          if (y) busy(b, api('variant.setStatus', { id: b.getAttribute('data-vs'), status: to })).then(function () { toast('Status varian diperbarui', 'ok'); App.go('product', p.id); }).catch(function () {});
        });
      };
    });
    api('product.audit', { id: p.id }, { quiet: true }).then(function (rows) {
      $('#hist', main).innerHTML = rows.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Waktu</th><th>Aksi</th><th>Oleh</th><th>Keterangan</th></tr></thead><tbody>' + rows.map(function (a) {
        var m = a.meta_json || {};
        return '<tr><td class="nowrap">' + fmtDate(a.created_at) + '</td><td><b>' + esc(actionLabel(a.action)) + '</b></td><td>' + esc(a.actor) + '</td><td class="muted">' + esc(m.reason || (a.action === 'barcode.change' ? (a.before_json || {}).code + ' → ' + (a.after_json || {}).code : '')) + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="muted">Belum ada riwayat.</div>';
    }).catch(function () { $('#hist', main).innerHTML = ''; });
  }).catch(function (e) { main.innerHTML = '<button class="back" onclick="App.go(\'products\')">' + icon('arrowLeft') + 'Direktori Produk</button>' + errBox(e.message); });
};
function bcCell(gtin, internal) {
  if (gtin) return '<a class="link-btn code" data-bc="' + esc(gtin) + '">' + esc(gtin) + '</a> ' + badge('GTIN', 'GTIN');
  if (internal) return '<a class="link-btn code" data-bc="' + esc(internal) + '">' + esc(internal) + '</a> ' + badge('INTERNAL', 'Internal');
  return badge('NONE', 'Belum ada');
}
function showBarcode(code) {
  var m = modal('<h3>Barcode</h3><div style="text-align:center;padding:10px;background:#fff"><svg id="bcsvg"></svg></div><div class="row" style="margin-top:12px"><button class="btn" data-close>Tutup</button><button class="btn ghost" id="bh">' + icon('clock') + 'Histori</button></div>');
  try { JsBarcode($('#bcsvg', m), code, { format: code.length === 13 ? 'EAN13' : code.length === 8 ? 'EAN8' : code.length === 12 ? 'UPC' : 'CODE128', height: 70, fontSize: 16 }); } catch (e) { $('#bcsvg', m).outerHTML = '<div class="code" style="font-size:20px">' + esc(code) + '</div>'; }
  $('#bh', m).onclick = function () { m.close(); barcodeHistory(code); };
}
/** Kalkulator: jumlah × satuan → ekuivalen satuan dasar (dihitung di browser dari data konversi tersimpan). */
function calcHtml(variants) {
  var act = variants.filter(function (v) { return v.status === 'ACTIVE'; });
  if (!act.length) return '<div class="muted">Tidak ada varian aktif.</div>';
  return '<div class="calc" id="calc"><select class="in" id="cv">' + act.map(function (v, i) { return '<option value="' + i + '">' + esc(v.name) + '</option>'; }).join('') + '</select>' +
    '<input class="in" id="cq" type="number" min="0" value="1"><select class="in" id="cu"></select><span>=</span><span class="res" id="cr">—</span></div><div class="hint">Contoh: 3 BOX (isi 24) = 72 satuan dasar. Konversi berbasis kuantitas, bukan volume.</div>';
}
function bindCalc(root, variants, unit) {
  var act = variants.filter(function (v) { return v.status === 'ACTIVE'; });
  if (!act.length || !$('#calc', root)) return;
  var fillUnits = function () {
    var v = act[Number($('#cv', root).value)];
    $('#cu', root).innerHTML = v.conversions.filter(function (c) { return c.status === 'ACTIVE'; }).map(function (c) { return '<option value="' + c.baseUnitEquivalent + '">' + esc(c.unitName) + '</option>'; }).join('');
    var big = $('#cu', root).options.length - 1; $('#cu', root).selectedIndex = Math.max(0, Math.min(1, big));
    calc();
  };
  var calc = function () { var q = Number($('#cq', root).value) || 0; $('#cr', root).textContent = fmtNum(q * Number($('#cu', root).value || 0)) + ' ' + unit; };
  $('#cv', root).onchange = fillUnits; $('#cq', root).oninput = calc; $('#cu', root).onchange = calc;
  fillUnits();
}

/* ───────── Master Brand & Master Kategori ───────── */
Pages.brands = function (main) { masterPage(main, 'brand'); };
Pages.categories = function (main) { masterPage(main, 'category'); };
function masterPage(main, kind) {
  var L = kind === 'brand' ? { t: 'Master Brand', one: 'brand', ex: 'Contoh: Viva → VIV, Hanasui → HAN, Purbasari → PUR' } : { t: 'Master Kategori', one: 'kategori', ex: 'Contoh: Parfum → PAR, Lipstick → LIP, Body Lotion → BOD' };
  var w = can('master.write');
  var f = { q: '', status: 'ACTIVE' };
  main.innerHTML = pageHead('Master data', L.t, w ? '<button class="btn" id="bulk">' + icon('list') + 'Tambah banyak</button>' : '', 'Cukup isi nama — kode ' + L.one + ' dibuat otomatis (3 huruf), unik, dan permanen.') +
    (w ? '<div class="card" style="margin-bottom:16px"><div class="add-card"><div><label class="f" style="margin-top:0">Nama ' + (kind === 'brand' ? 'Brand' : 'Kategori') + ' <span class="req">*</span></label><input class="in w100" id="nm" placeholder="Ketik nama ' + L.one + ', lalu Enter" maxlength="60" autocomplete="off"></div>' +
      '<button class="btn pri" id="sv" style="height:40px">' + icon('plus') + 'Simpan</button></div><div class="code-preview" id="pv"><span>' + esc(L.ex) + '</span></div><div id="pw"></div></div>' : '') +
    '<div class="toolbar"><div class="search">' + icon('search') + '<input class="in" id="q" placeholder="Cari nama atau kode…"></div><div class="seg" id="sg"><button data-s="ACTIVE" class="on">Aktif</button><button data-s="INACTIVE">Nonaktif</button><button data-s="">Semua</button></div><span class="muted right" id="cnt"></span></div><div id="ml">' + loadingBox() + '</div>';
  var rows = [];
  var render = function () {
    var list = filterLocal(rows.filter(function (r) { return !f.status || r.status === f.status; }), f.q, ['name', 'code']);
    $('#cnt', main).textContent = list.length + ' dari ' + rows.length + ' ' + L.one;
    $('#ml', main).innerHTML = list.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Kode</th><th>Nama</th><th class="num">Produk</th><th>Status</th><th>Dibuat</th>' + (w ? '<th></th>' : '') + '</tr></thead><tbody>' + list.map(function (r) {
      return '<tr' + (r.status !== 'ACTIVE' ? ' class="off"' : '') + '><td><span class="chip-code">' + esc(r.code) + '</span></td><td><b>' + esc(r.name) + '</b></td><td class="num">' + r.productCount + '</td><td>' + badge(r.status) + '</td><td class="nowrap muted">' + fmtDate(r.createdAt, false) + '</td>' +
        (w ? '<td class="nowrap"><button class="btn sm" data-rn="' + esc(r.id) + '">' + icon('edit') + 'Ubah nama</button> <button class="btn sm ghost" data-st="' + esc(r.id) + '">' + (r.status === 'ACTIVE' ? 'Nonaktifkan' : 'Aktifkan') + '</button></td>' : '') + '</tr>';
    }).join('') + '</tbody></table></div>' : '<div class="tablewrap">' + emptyBox(rows.length ? 'Tidak ada yang cocok' : 'Belum ada ' + L.one, rows.length ? '' : 'Tambahkan ' + L.one + ' pertama di atas.', kind === 'brand' ? 'tag' : 'layers') + '</div>';
    $$('[data-rn]', main).forEach(function (b) { b.onclick = function () { rename(rows.find(function (r) { return r.id === b.getAttribute('data-rn'); })); }; });
    $$('[data-st]', main).forEach(function (b) {
      b.onclick = function () {
        var r = rows.find(function (x) { return x.id === b.getAttribute('data-st'); });
        var to = r.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
        var go = function () { busy(b, api(kind + '.setStatus', { id: r.id, status: to })).then(function () { toast((kind === 'brand' ? 'Brand ' : 'Kategori ') + r.name + (to === 'ACTIVE' ? ' diaktifkan' : ' dinonaktifkan'), 'ok'); reload(); }).catch(function () {}); };
        if (to === 'ACTIVE') go(); else ask('Nonaktifkan ' + r.name + ' (' + r.code + ')? ' + L.one.charAt(0).toUpperCase() + L.one.slice(1) + ' nonaktif tidak bisa dipilih saat registrasi produk baru. Produk lama tidak berubah.', 'Nonaktifkan', true).then(function (y) { if (y) go(); });
      };
    });
  };
  var reload = function () { Ref.drop(kind); return Ref.get(kind, true).then(function (r) { rows = r; render(); }).catch(function (e) { $('#ml', main).innerHTML = errBox(e.message); }); };
  var rename = function (r) {

          var u = rows.find(function (x) { return x.id === b.getAttribute('data-u'); });
          var m = modal('<h3>Ubah pengguna</h3><div class="muted">' + esc(u.email) + '</div><label class="f">Nama</label><input class="in w100" id="fn" value="' + esc(u.fullName) + '"><label class="f">Role</label>' + roleSel(u.role) +
            '<label class="f">Reset password (opsional, min. 10 karakter)</label><input class="in w100" id="pw" type="text" autocomplete="off"><label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" id="ac"' + (u.isActive ? ' checked' : '') + '> Akun aktif</label>' +
            '<div class="row" style="margin-top:16px"><button class="btn pri" id="go">Simpan</button><button class="btn" data-close>Batal</button></div>');
          $('#go', m).onclick = function () { busy($('#go', m), api('user.update', { id: u.id, fullName: $('#fn', m).value, role: $('#ro', m).value, password: $('#pw', m).value || undefined, isActive: $('#ac', m).checked })).then(function () { m.close(); toast('Pengguna diperbarui', 'ok'); load(); }).catch(function () {}); };
        };
      });
    }).catch(function (e) { $('#ul', main).innerHTML = errBox(e.message); });
  };
  $('#nu', main).onclick = function () {
    var m = modal('<h3>Tambah pengguna</h3><label class="f">Nama lengkap</label><input class="in w100" id="fn"><label class="f">Email (untuk login)</label><input class="in w100" id="em" type="email"><label class="f">Role</label>' + roleSel('data_entry') +
      '<label class="f">Password awal (min. 10 karakter)</label><input class="in w100" id="pw" type="text" autocomplete="off"><div class="hint">Sampaikan langsung ke pengguna; minta segera diganti di menu Profil.</div><div class="row" style="margin-top:16px"><button class="btn pri" id="go">Simpan</button><button class="btn" data-close>Batal</button></div>');
    $('#go', m).onclick = function () { busy($('#go', m), api('user.create', { fullName: $('#fn', m).value, email: $('#em', m).value, role: $('#ro', m).value, password: $('#pw', m).value })).then(function () { m.close(); toast('Pengguna ditambahkan', 'ok'); load(); }).catch(function () {}); };
  };
  load();
};

/* ───────── Pengaturan ───────── */
Pages.settings = function (main) {
  var w = can('settings.manage');
  api('settings.get').then(function (s) {
    var row = function (t, d, ctl) { return '<div class="cfg-row"><div><div class="t">' + t + '</div><div class="d">' + d + '</div></div><div>' + ctl + '</div></div>'; };
    var dis = w ? '' : ' disabled';
    main.innerHTML = pageHead('Sistem', 'Pengaturan', '', w ? '' : 'Hanya Admin yang dapat mengubah pengaturan.') + '<div class="cfg">' +
      row('Template SKU varian', 'Token: {BRAND} {CATEGORY} {PRODUCT} {VARIANT}. Wajib memuat {BRAND}, {PRODUCT}, {VARIANT}. Hanya berlaku untuk SKU baru — SKU tersimpan tidak pernah berubah. SKU kemasan = SKU varian + satuan + isi (mis. -BOX24).', '<input class="in w100 code" id="tp" value="' + esc(s.sku_template) + '"' + dis + '><div class="hint" id="tpx"></div>') +
      row('Panjang kode brand & kategori', 'Default 3 huruf kapital. Kode yang sudah dibuat tidak berubah.', '<select class="in" id="cl"' + dis + '><option value="3"' + (s.master_code_length === 3 ? ' selected' : '') + '>3 karakter</option><option value="4"' + (s.master_code_length === 4 ? ' selected' : '') + '>4 karakter</option></select>') +
      row('Satuan dasar', 'Pilihan satuan dasar saat registrasi (unit stok terkecil). Pisahkan dengan koma.', '<textarea class="in w100" rows="2" id="bu"' + dis + '>' + esc(s.base_units.join(', ')) + '</textarea>') +
      row('Satuan kemasan', 'Pilihan satuan kemasan di langkah Satuan & Konversi. Isi per kemasan diatur per varian.', '<textarea class="in w100" rows="2" id="pu"' + dis + '>' + esc(s.pack_units.join(', ')) + '</textarea>') +
      row('Jenis atribut varian', 'Pilihan cepat di generator varian (user tetap boleh menambah jenis lain).', '<textarea class="in w100" rows="2" id="at"' + dis + '>' + esc(s.attribute_types.join(', ')) + '</textarea>') +
      row('Ambang kemiripan nama', 'Nama produk/brand dengan skor kemiripan ≥ nilai ini ditampilkan sebagai peringatan duplikasi (0.50–0.99).', '<input class="in" id="fz" type="number" step="0.01" min="0.5" max="0.99" value="' + esc(s.fuzzy_threshold) + '"' + dis + '>') +
      row('Prefix barcode internal', 'Namespace GS1 "restricted circulation" — tidak bentrok dengan GTIN resmi produsen.', '<span class="chip-code">' + esc(s.internal_barcode_prefix) + '</span>') +
      (w ? '<div class="row" style="margin-top:14px"><button class="btn pri" id="sv">Simpan pengaturan</button></div>' : '') + '</div>';
    var ex = function () { var t = $('#tp', main).value.toUpperCase(); $('#tpx', main).innerHTML = 'Contoh: <span class="sku">' + esc(t.replace('{BRAND}', 'SCA').replace('{CATEGORY}', 'PAR').replace('{PRODUCT}', 'PEDP').replace('{VARIANT}', 'OB50')) + '</span>'; };
    $('#tp', main).oninput = ex; ex();
    if (w) $('#sv', main).onclick = function () {
      busy($('#sv', main), api('settings.save', { sku_template: $('#tp', main).value, master_code_length: Number($('#cl', main).value), base_units: $('#bu', main).value, pack_units: $('#pu', main).value, attribute_types: $('#at', main).value, fuzzy_threshold: Number($('#fz', main).value) }))
        .then(function () { toast('Pengaturan disimpan', 'ok'); return api('auth.me', {}, { quiet: true }); }).then(function (me) { if (me) App.remember(me); }).catch(function () {});
    };
  }).catch(function (e) { main.innerHTML = errBox(e.message); });
};

/* ───────── Audit log ───────── */
Pages.audit = function (main) {
  var f = { action: '', actor: '', entityType: '', page: 1 };
  main.innerHTML = pageHead('Sistem', 'Audit Log', '', 'Catatan perubahan data penting: siapa, kapan, nilai sebelum & sesudah.') +
    '<div class="filters"><select class="in" id="et"><option value="">Semua entitas</option><option value="product">Produk</option><option value="variant">Varian</option><option value="brand">Brand</option><option value="category">Kategori</option><option value="barcode">Barcode</option><option value="mapping">Mapping</option><option value="user">Pengguna</option><option value="settings">Pengaturan</option></select>' +
    '<input class="in" id="ac" placeholder="Filter aksi (mis. product)"><input class="in" id="us" placeholder="Filter pengguna"></div><div id="al"></div>';
  var load = function () {
    var box = $('#al', main); box.innerHTML = loadingBox();
    api('audit.list', f).then(function (d) {
      box.innerHTML = d.rows.length ? '<div class="tablewrap"><table class="t"><thead><tr><th>Waktu</th><th>Aksi</th><th>Oleh</th><th>Entitas</th><th>Detail</th></tr></thead><tbody>' + d.rows.map(function (a, i) {
        return '<tr><td class="nowrap">' + fmtDate(a.created_at) + '</td><td><b>' + esc(actionLabel(a.action)) + '</b><div class="muted" style="font-size:11px">' + esc(a.action) + '</div></td><td>' + esc(a.actor) + '</td><td>' + esc(a.entity_type) + (a.entity_type === 'product' && a.entity_id ? ' <a class="link-btn" data-p="' + esc(a.entity_id) + '">buka</a>' : '') + '</td><td>' + (a.before_json || a.after_json || a.meta_json ? '<button class="btn sm ghost" data-i="' + i + '">Lihat</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' + pager(d, function (p) { f.page = p; load(); }) : '<div class="tablewrap">' + emptyBox('Tidak ada catatan', '', 'activity') + '</div>';
      $$('[data-p]', box).forEach(function (a) { a.onclick = function () { App.go('product', a.getAttribute('data-p')); }; });
      $$('[data-i]', box).forEach(function (b) {
        b.onclick = function () {
          var a = d.rows[Number(b.getAttribute('data-i'))];
          var pre = function (t, v) { return v ? '<div class="sect" style="margin:12px 0 6px">' + t + '</div><pre class="json" style="max-width:none">' + esc(JSON.stringify(v, null, 2)) + '</pre>' : ''; };
          modal('<h3>' + esc(actionLabel(a.action)) + '</h3><div class="muted">' + esc(a.actor) + ' · ' + fmtDate(a.created_at) + '</div>' + pre('Sebelum', a.before_json) + pre('Sesudah', a.after_json) + pre('Keterangan', a.meta_json) + '<div class="row" style="margin-top:16px"><button class="btn" data-close>Tutup</button></div>', { wide: true });
        };
      });
    }).catch(function (e) { box.innerHTML = errBox(e.message); });
  };
  $('#et', main).onchange = function (e) { f.entityType = e.target.value; f.page = 1; load(); };
  $('#ac', main).oninput = debounce(function (e) { f.action = e.target.value; f.page = 1; load(); }, 300);
  $('#us', main).oninput = debounce(function (e) { f.actor = e.target.value; f.page = 1; load(); }, 300);
  load();
};

/* ───────── Profil ───────── */
Pages.profile = function (main) {
  var u = App.me.user;
  main.innerHTML = pageHead('Akun', 'Profil & Password') + '<div class="card" style="max-width:520px"><div class="kv"><div>Nama</div><div><b>' + esc(u.fullName) + '</b></div><div>Email</div><div>' + esc(u.email) + '</div><div>Role</div><div>' + badge(u.role) + '</div></div>' +
    '<div class="sect">Ganti password</div><form id="pf"><label class="f">Password lama</label><div class="pw"><input class="in w100" type="password" name="o" autocomplete="current-password" required><button type="button" class="eye" tabindex="-1">' + icon('eye') + '</button></div>' +
    '<label class="f">Password baru (min. 10 karakter)</label><div class="pw"><input class="in w100" type="password" name="n" autocomplete="new-password" minlength="10" required><button type="button" class="eye" tabindex="-1">' + icon('eye') + '</button></div>' +
    '<label class="f">Ulangi password baru</label><input class="in w100" type="password" name="n2" autocomplete="new-password" required><div class="row" style="margin-top:16px"><button class="btn pri" type="submit">Simpan password</button></div></form></div>';
  var f = $('#pf', main); App.bindEye(f);
  f.onsubmit = function (e) {
    e.preventDefault();
    if (f.n.value !== f.n2.value) return toast('Ulangan password baru tidak sama', 'err');
    busy($('button[type=submit]', f), api('user.changePassword', { oldPassword: f.o.value, newPassword: f.n.value })).then(function () { toast('Password berhasil diganti', 'ok'); f.reset(); }).catch(function () {});
  };
};
</script>
