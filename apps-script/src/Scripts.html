/* ───────── progress global, toast, modal (sama dengan FMS) ───────── */
var Net = { pending: 0 };
function netStart(quiet) {
  if (quiet) return;
  Net.pending++;
  var b = document.getElementById('topbar');
  if (!b) { b = document.createElement('div'); b.id = 'topbar'; document.body.appendChild(b); }
  b.className = ''; void b.offsetWidth; b.className = 'on';
}
function netEnd(quiet) {
  if (quiet) return;
  Net.pending = Math.max(0, Net.pending - 1);
  var b = document.getElementById('topbar');
  if (b && !Net.pending) b.className = 'done';
}
function toast(msg, kind, ms) {
  var box = document.getElementById('toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  var t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = icon(kind === 'ok' ? 'check' : kind === 'err' ? 'alertCircle' : kind === 'warn' ? 'alert' : 'zap') + '<span>' + esc(msg) + '</span>';
  box.appendChild(t);
  setTimeout(function () { t.remove(); }, ms || (kind === 'err' ? 6500 : 3500));
}
function modal(html, opts) {
  opts = opts || {};
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = '<div class="modal ' + (opts.wide ? 'wide' : '') + '">' + html + '</div>';
  document.body.appendChild(bg);
  var m = bg.firstChild;
  m.close = function () { bg.remove(); if (opts.onClose) opts.onClose(); };
  bg.addEventListener('mousedown', function (e) { if (e.target === bg && !opts.sticky) m.close(); });
  $$('[data-close]', m).forEach(function (b) { b.onclick = m.close; });
  return m;
}
function ask(msg, okLabel, danger) {
  return new Promise(function (resolve) {
    var answered = false;
    var m = modal('<h3>Konfirmasi</h3><p style="color:#4e5751;margin:0">' + esc(msg) + '</p><div class="row" style="margin-top:20px"><button class="btn ' + (danger ? 'err' : 'pri') + '" id="ask-ok">' + esc(okLabel || 'Ya') + '</button><button class="btn" data-close>Batal</button></div>',
      { onClose: function () { if (!answered) resolve(false); } });
    $('#ask-ok', m).onclick = function () { answered = true; m.close(); resolve(true); };
  });
}
function promptText(title, label, opts) {
  opts = opts || {};

    var done = false;
    var m = modal('<h3>' + esc(title) + '</h3>' + (opts.html || '') + '<label class="f">' + esc(label) + '</label>' +
      (opts.multiline === false ? '<input class="in w100" id="pt" value="' + esc(opts.value || '') + '">' : '<textarea class="in w100" rows="3" id="pt">' + esc(opts.value || '') + '</textarea>') +
      '<div class="row" style="margin-top:16px"><button class="btn ' + (opts.danger ? 'err' : 'pri') + '" id="pok">' + esc(opts.ok || 'Simpan') + '</button><button class="btn" data-close>Batal</button></div>', { onClose: function () { if (!done) resolve(null); } });
    var t = $('#pt', m); t.focus(); if (t.select) t.select();
    var go = function () { var v = t.value.trim(); if ((opts.min || 0) > v.length) { toast('Wajib diisi (min. ' + opts.min + ' karakter).', 'err'); return; } done = true; m.close(); resolve(v); };

function busy(btn, promise) {
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }

  return promise.then(function (v) { end(); return v; }, function (e) { end(); throw e; });
}

/* ───────── transport API ─────────
 * Di dalam Apps Script: google.script.run.api(token, action, payload).
 * Di luar (GitHub Pages): fetch POST ke URL Web App (doPost) — window.RPM_API_URL.
 * opts: silent (tanpa toast error), quiet (tanpa progress bar). Error: { code, message, details }. */
function api(action, payload, opts) {
  opts = opts || {};
  netStart(opts.quiet);
  return new Promise(function (resolve, reject) {
    var done = function (r) {
      netEnd(opts.quiet);
      if (typeof r === 'string') { try { r = JSON.parse(r); } catch (e) { r = null; } }
      if (r && r.ok) return resolve(r.data);
      var e = (r && r.error) || { message: 'Respon server tidak valid.', code: 'BAD_RESPONSE' };
      var err = { code: e.code || 'ERROR', message: e.message || 'Terjadi kesalahan.', details: e.details || [] };
      if (err.code === 'UNAUTHENTICATED' && action !== 'auth.login') { App.forget(); App.showLogin(err.message); }
      else if (!opts.silent) toast(err.message, 'err');
      reject(err);
    };
    var fail = function (e) { done({ ok: false, error: { code: 'NETWORK', message: 'Koneksi ke server gagal: ' + (e && e.message || e) } }); };
    var body = payload === undefined ? null : payload;
    if (window.RPM_API_URL) {
      fetch(window.RPM_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: App.token, action: action, payload: body }), redirect: 'follow' })
        .then(function (res) { return res.text(); }).then(done, fail);
    } else {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(App.token, action, body);
    }
  });
}

  var render = function () {
    list.innerHTML = items.length ? items.map(function (it, i) {
      return '<div class="cb-opt' + (i === active ? ' on' : '') + '" data-i="' + i + '"><div style="min-width:0"><div class="t">' + esc(o.label(it)) + '</div>' + (o.sub && o.sub(it) ? '<div class="s">' + esc(o.sub(it)) + '</div>' : '') + '</div>' + (o.code && o.code(it) ? '<span class="chip-code ghost">' + esc(o.code(it)) + '</span>' : '') + '</div>';
    }).join('') : '<div class="cb-empty">' + (o.empty || 'Tidak ada hasil') + '</div>';
    $$('.cb-opt', list).forEach(function (el) { el.onmousedown = function (e) { e.preventDefault(); pick(items[Number(el.getAttribute('data-i'))]); }; });
    var on = $('.cb-opt.on', list); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  };
  var query = function (q) {
    var my = ++seq;
    Promise.resolve(o.load(q)).then(function (res) { if (my !== seq) return; items = res || []; active = items.length ? 0 : -1; render(); }).catch(function () {});
  };
  var openList = function () { if (o.disabled) return; open = true; list.classList.remove('hidden'); query(input.value && cur && input.value === o.label(cur) ? '' : input.value); };
  var close = function () { open = false; list.classList.add('hidden'); show(); };
  var pick = function (it) { cur = it; close(); if (o.onChange) o.onChange(it); };
  input.onfocus = function () { input.select(); openList(); };
  input.oninput = debounce(function () { if (!open) openList(); else query(input.value); }, 120);
  input.onblur = function () { setTimeout(close, 120); };
  input.onkeydown = function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) openList(); active = Math.min(items.length - 1, active + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); render(); }
    else if (e.key === 'Enter') { if (open && items[active]) { e.preventDefault(); pick(items[active]); } }
    else if (e.key === 'Escape') { input.blur(); }
  };
  if (clear) clear.onmousedown = function (e) { e.preventDefault(); cur = null; show(); if (o.onChange) o.onChange(null); };
  show();
  return { get: function () { return cur; }, set: function (it) { cur = it; show(); }, focus: function () { input.focus(); }, input: input };
}
/** Saring daftar lokal untuk combo: cocokkan nama atau kode, abaikan huruf besar/kecil. */
function filterLocal(list, q, fields) {
  q = String(q || '').toLowerCase().trim();
  if (!q) return list.slice(0, 200);
  return list.filter(function (x) { return fields.some(function (f) { return String(x[f] || '').toLowerCase().indexOf(q) >= 0; }); }).slice(0, 200);
}

/* ───────── unduh XLSX (kolom SKU/barcode tetap teks) ───────── */
function downloadTable(d, format) {
  var aoa = [d.headers].concat(d.rows);
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  (d.textColumns || []).forEach(function (c) { for (var r = 1; r < aoa.length; r++) { var a = XLSX.utils.encode_cell({ r: r, c: c }); if (ws[a]) { ws[a].t = 's'; ws[a].v = String(ws[a].v); ws[a].z = '@'; } } });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  if (d.note) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['CATATAN'], [d.note]]), 'CATATAN');
  XLSX.writeFile(wb, d.fileName + (format === 'csv' ? '.csv' : '.xlsx'), { bookType: format === 'csv' ? 'csv' : 'xlsx' });
}

/** Pilihan ubah status lifecycle (transisi eksplisit dari server) → Promise<{status, reason}|null>. */
function lifecyclePrompt(label, from) {
  var nexts = ((cfg().lifecycle || {})[from] || []);
  if (!nexts.length) { toast('Status ' + (STATUS_TXT[from] || from) + ' tidak dapat diubah lagi', 'warn'); return Promise.resolve(null); }
  return new Promise(function (resolve) {
    var done = false;
    var m = modal('<h3>Ubah status — ' + esc(label) + '</h3><div class="muted">Status sekarang: ' + badge(from) + '</div><label class="f">Status baru</label><select class="in w100" id="ls">' + nexts.map(function (n) { return '<option value="' + n + '">' + esc(STATUS_TXT[n] || n) + '</option>'; }).join('') + '</select>' +
      '<div class="hint" id="lh"></div><label class="f">Alasan</label><textarea class="in w100" rows="2" id="lr" placeholder="Wajib untuk Nonaktif, Discontinued, Diarsipkan"></textarea><div class="row" style="margin-top:16px"><button class="btn pri" id="lok">Simpan status</button><button class="btn" data-close>Batal</button></div>', { onClose: function () { if (!done) resolve(null); } });
    var H = { ACTIVE: 'Dipakai sistem downstream (pembelian, penjualan, stock opname).', INACTIVE: 'Tidak untuk penggunaan baru (sementara).', DISCONTINUED: 'Tidak untuk pembelian baru; tetap tertelusur untuk histori & sisa stok.', ARCHIVED: 'Referensi historis saja — tidak bisa diubah lagi.' };
    var upd = function () { $('#lh', m).textContent = H[$('#ls', m).value] || ''; };
    $('#ls', m).onchange = upd; upd();
    $('#lok', m).onclick = function () { done = true; var v = { status: $('#ls', m).value, reason: $('#lr', m).value.trim() }; m.close(); resolve(v); };
  });
}

function pageHead(eyebrow, title, actions, sub) {

}
