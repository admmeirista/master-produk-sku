/* Judul kolom ditempel ke tiap sel (data-l) → CSS menampilkannya sebagai "label : nilai". Berlaku untuk semua table.t kecuali yang punya tata letak sendiri. */
function labelTables(root) {
  $$('table.t:not(.lvt)', root || document).forEach(function (t) {
    var heads = [], hr = t.tHead && t.tHead.rows[t.tHead.rows.length - 1];
    if (hr) Array.prototype.forEach.call(hr.cells, function (c) { for (var k = 0; k < (c.colSpan || 1); k++) heads.push(c.textContent.replace(/\s+/g, ' ').trim()); });
    var sig = heads.join('|') + '#' + t.rows.length;
    if (t.getAttribute('data-lb') === sig) return;
    t.setAttribute('data-lb', sig); t.classList.add('mt');
    Array.prototype.forEach.call(t.tBodies, function (tb) {
      Array.prototype.forEach.call(tb.rows, function (r) {
        var col = 0;
        Array.prototype.forEach.call(r.cells, function (c) {
          var n = c.colSpan || 1;
          if (n > 1 || !heads.length) c.classList.add('full');
          else if (heads[col]) c.setAttribute('data-l', heads[col]);
          // isi sel dibungkus satu elemen agar label & nilai tetap dua kolom
          if (c.getAttribute('data-l') && !(c.childNodes.length === 1 && c.firstChild.className === 'cv')) {
            var w = document.createElement('div'); w.className = 'cv';
            while (c.firstChild) w.appendChild(c.firstChild);
            c.appendChild(w);
          }
          col += n;
        });
      });
    });
  });
}

})();

/** Perkecil foto di browser (sisi terpanjang maks. px, JPEG) sebelum diunggah → data URL. */

  return new Promise(function (resolve, reject) {
    if (String(file.type).indexOf("image/") !== 0) return reject(new Error('File harus berupa gambar'));
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, maxPx / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };

      img.src = rd.result;
    };

    $app().innerHTML = '<div class="auth"><section class="auth-art"><div class="art-top">' + brand() + '</div>' +
      '<div class="art-mid"><div class="eyebrow eb">Single source of truth produk</div>' +
      '<h1>Satu master,<br>SKU <em>pasti.</em></h1>' +
      '<p class="lead">Registrasi produk kosmetik yang rapi — dari brand hingga kemasan karton — siap dipakai BeeCloud dan Shopee.</p>' +
      '<ol class="flow">' + flow.map(function (f, i) { return '<li><div class="node">' + icon(f[0]) + '</div><div><div class="k">Tahap ' + (i + 1) + '</div><div class="v">' + f[1] + '</div><div class="d">' + f[2] + '</div></div></li>'; }).join('') + '</ol></div>' +
      '<div class="foot"><span>© ' + new Date().getFullYear() + ' Meirista</span><span class="sep"></span>' + icon('lock') + '<span>Akses individual · tercatat di audit trail</span></div></section>' +
      '<section class="auth-form"><div class="box"><div class="auth-logo">' + brandLogo() + '</div>' + formHtml + '</div><div class="auth-tag">' + APP_NAME.toUpperCase() + '</div></section></div>';
  },
  showLogin: function (msg) {
    App.page = null;
    App.authShell('<form id="lf" autocomplete="on"><div class="mobile-brand">' + brand('dark') + '</div><div class="eyebrow">Selamat datang</div><h2>Masuk ke akun Anda</h2><div class="sub">Gunakan email dan password yang diberikan administrator.</div>' +
      '<label class="f">Username</label><input class="in" name="email" type="text" placeholder="mis. adm.meirista" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>' +
      '<label class="f">Password</label><div class="pw"><input class="in" type="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required><button type="button" class="eye" tabindex="-1" aria-label="Tampilkan password">' + icon('eye') + '</button></div>' +
      '<div id="lerr">' + (msg ? errBox(msg) : '') + '</div>' +
      '<button class="cta" type="submit"><span>Masuk</span>' + icon('arrowRight') + '</button>' +
      '<div class="auth-help">' + icon('shield') + '<div>Lupa password?<b>Hubungi Admin toko untuk reset password akun Anda.</b></div></div></form>');
    var f = document.getElementById('lf');
    App.bindEye(f);
    f.email.focus();
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var b = $('.cta', f); b.classList.add('busy'); b.disabled = true;
      $('#lerr').innerHTML = '';
      api('auth.login', { email: f.email.value, password: f.password.value }, { silent: true })
        .then(function (r) {
          App.token = r.token; Store.set('rpm_token', r.token);
          return api('auth.me', {}, { silent: true });
        })
        .then(function (me) { App.remember(me); App.enter(me); })
        .catch(function (e) { $('#lerr').innerHTML = errBox(e.message); b.classList.remove('busy'); b.disabled = false; f.password.value = ''; f.password.focus(); });
    };
  },
  bindEye: function (root) {
    $$('.pw', root).forEach(function (w) {
      var i = $('input', w), b = $('.eye', w);
      b.onclick = function () { var show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = icon(show ? 'eyeOff' : 'eye'); i.focus(); };
    });
  },

  enter: function (me) {
    App.remember(me);
    setTimeout(Ref.warm, 0);
    PullRefresh.init();
    var u = me.user;
    var nav = function (n) { return can(n[3] || 'product.read') ? '<a class="nv" data-nav="' + n[0] + '" data-tip="' + esc(n[1]) + '" title="' + esc(n[1]) + '">' + icon(n[2]) + '<span class="grow">' + n[1] + '</span></a>' : ''; };
    var closed = {};
    try { closed = JSON.parse(Store.get('rpm_nav') || '{}'); } catch (e) { closed = {}; }
    document.body.classList.toggle('side-mini', Store.get('rpm_mini') === '1');
    $app().innerHTML = '<div class="adm"><div class="mtop"><button class="icon-btn" id="m-open" aria-label="Menu">' + icon('menu') + '</button>' + brand('sm') + '</div>' +
      '<div class="side-bg" id="side-bg"></div><nav class="side" id="side">' + brand() + '<button type="button" class="side-mini-btn" id="side-mini" title="Ciutkan / lebarkan menu" aria-label="Ciutkan menu">' + icon('chevDown') + '</button>' +
      NAV.map(function (s, i) { var links = s[1].map(nav).join(''); return links ? '<div class="navgrp' + (closed[s[0]] ? ' closed' : '') + '"><button type="button" class="sec" data-grp="' + s[0] + '"' + (i ? ' style="margin-top:6px"' : '') + '>' + s[0] + icon('chevDown', 'gch') + '</button><div class="grp-links">' + links + '</div></div>' : ''; }).join('') +
      '<div class="me"><a class="avatar" data-nav="profile" style="cursor:pointer" title="Profil & password">' + esc(initials(u.fullName)) + '</a><div style="min-width:0;cursor:pointer" data-nav="profile"><div class="n">' + esc(u.fullName) + '</div><div class="r">' + esc(STATUS_TXT[u.role] || u.role) + '</div></div><button id="adm-out" title="Keluar">' + icon('logout') + '</button></div></nav><main class="main" id="main"></main>' + App.tabbar() + '</div>';
    $$('[data-nav]').forEach(function (a) { a.onclick = function () { App.go(a.getAttribute('data-nav')); }; });
    $$('[data-grp]').forEach(function (b) { b.onclick = function () { var g = b.parentNode; g.classList.toggle('closed'); closed[b.getAttribute('data-grp')] = g.classList.contains('closed'); Store.set('rpm_nav', JSON.stringify(closed)); }; });
    $('#side-mini').onclick = function () { var on = !document.body.classList.contains('side-mini'); document.body.classList.toggle('side-mini', on); Store.set('rpm_mini', on ? '1' : '0'); };
    $('#adm-out').onclick = function () { ask('Keluar dari aplikasi?', 'Keluar').then(function (y) { if (y) App.logout(); }); };
    var side = $('#side'), bg = $('#side-bg');
    $('#m-open').onclick = function () { side.classList.add('open'); bg.classList.add('open'); };
    $$('#tabbar [data-tab]').forEach(function (b) { b.onclick = function () { var t = b.getAttribute('data-tab'); if (t === 'menu') { side.classList.add('open'); bg.classList.add('open'); } else App.go(t); }; });
    bg.onclick = function () { side.classList.remove('open'); bg.classList.remove('open'); };
    App.go(App.page || 'dashboard', App.pageArg);
    if (!App.keysBound) {
      App.keysBound = true;
      // F2 = langsung ke Master Produk › Cari SKU / Scan (scanner USB cukup ditembakkan setelahnya)
      document.addEventListener('keydown', function (e) { if (e.key === 'F2' && App.me) { e.preventDefault(); App.go('products', { focus: true }); } });
    }
  },
  /** Pindah halaman. arg diteruskan ke halaman (mis. id produk). */
  go: function (page, arg, opts) {
    if (App.leaveGuard && !(opts && opts.force)) {
      var g = App.leaveGuard;
      if (!g()) return ask('Isian registrasi belum disimpan. Tinggalkan halaman ini? (Isian tetap tersimpan sebagai draf di perangkat ini.)', 'Tinggalkan').then(function (y) { if (y) { App.leaveGuard = null; App.go(page, arg); } });
    }
    App.leaveGuard = null;
    // Cari SKU / Scan sekarang tab di Master Produk (tautan lama tetap jalan)
    if (page === 'scan') { arg = { search: (arg && arg.code) || '', focus: true }; page = 'products'; }
    if (!Pages[page]) page = 'dashboard';
    App.page = page; App.pageArg = arg;
    var navOf = NAV_PARENT[page] || page;
    $$('.side a.nv').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-nav') === navOf); });
    document.body.setAttribute('data-page', page);
    var tabOf = NAV_PARENT[page] || page;
    $$('#tabbar [data-tab]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tabOf || (b.getAttribute('data-tab') === 'menu' && ['dashboard', 'register', 'products', 'bundles'].indexOf(tabOf) < 0)); });
    var side = $('#side'); if (side) { side.classList.remove('open'); $('#side-bg').classList.remove('open'); }
    var main = $('#main');
    main.innerHTML = loadingBox();
    window.scrollTo(0, 0);
    try { Pages[page](main, arg); } catch (e) { main.innerHTML = errBox('Halaman gagal dimuat: ' + e.message); console.error(e); }
  },
  /** Navigasi bawah untuk tampilan HP (≤ 760 px). */
  tabbar: function () {
    var t = [['dashboard', 'grid', 'Beranda'], ['products', 'package', 'Produk'], can('product.write') ? ['register', 'plus', 'Registrasi'] : null, ['bundles', 'boxes', 'Kemasan'], ['menu', 'menu', 'Menu']].filter(Boolean);
    return '<nav class="tabbar" id="tabbar">' + t.map(function (x) { return '<button type="button" data-tab="' + x[0] + '"' + (x[0] === 'register' ? ' class="fab"' : '') + '><span class="ti">' + icon(x[1]) + '</span><span class="tl">' + x[2] + '</span></button>'; }).join('') + '</nav>';
  },
  logout: function () {
    api('auth.logout', {}, { silent: true }).catch(function () {});
    App.forget(); App.page = null; App.showLogin();
  }
};
/** Pilihan ubah status lifecycle (transisi eksplisit dari server) → Promise<{status, reason}|null>. */
function lifecyclePrompt(label, from) {
  var nexts = ((cfg().lifecycle || {})[from] || []);
  if (!nexts.length) { toast('Status ' + (STATUS_TXT[from] || from) + ' tidak dapat diubah lagi', 'warn'); return Promise.resolve(null); }
  return new Promise(function (resolve) {
    var done = false;
    var m = modal('<h3>Ubah status — ' + esc(label) + '</h3><div class="muted">Status sekarang: ' + badge(from) + '</div><label class="f">Status baru</label><select class="in w100" id="ls">' + nexts.map(function (n) { return '<option value="' + n + '">' + esc(STATUS_TXT[n] || n) + '</option>'; }).join('') + '</select>' +
      '<div class="hint" id="lh"></div><label class="f">Alasan</label><textarea class="in w100" rows="2" id="lr" placeholder="Wajib untuk Nonaktif, Discontinued, Diarsipkan"></textarea><div class="row" style="margin-top:16px"><button class="btn pri" id="lok">Simpan status</button><button class="btn" data-close>Batal</button></div>', { onClose: function () { if (!done) resolve(null); } });
    var H = { ACTIVE: 'Dipakai sistem downstream (pembelian, penjualan, stock opname).', INACTIVE: 'Tidak untuk penggunaan baru (sementara).', DISCONTINUED: 'Tidak untuk pembelian baru; tetap tertelusur untuk histori & sisa stok.', ARCHIVED: 'Referensi historis saja — tidak bisa diubah lagi.' };
    var upd = function () { $('#lh', m).textContent = H[$('#ls', m).value] || ''; };
    $('#ls', m).onchange = upd; upd();
    $('#lok', m).onclick = function () { done = true; var v = { status: $('#ls', m).value, reason: $('#lr', m).value.trim() }; m.close(); resolve(v); };
  });
}
/** Header halaman gaya FMS. */
function pageHead(eyebrow, title, actions, sub) {
  var c = crumb(App.page);
  var bc = c ? '<nav class="crumbs" aria-label="Breadcrumb"><a data-crumb="dashboard">Beranda</a><span>›</span><span>' + esc(c[0].charAt(0) + c[0].slice(1).toLowerCase()) + '</span>' + (c[1] !== title ? '<span>›</span><a data-crumb="' + esc(App.page === 'product' ? 'products' : App.page) + '">' + esc(c[1]) + '</a>' : '') + '<span>›</span><b>' + esc(title) + '</b></nav>' : '<div class="eyebrow">' + esc(eyebrow) + '</div>';
  setTimeout(function () { $$('[data-crumb]').forEach(function (x) { x.onclick = function () { App.go(x.getAttribute('data-crumb')); }; }); });
  return '<div class="ph"><div>' + bc + '<h2>' + esc(title) + '</h2>' + (sub ? '<div class="muted" style="margin-top:4px">' + sub + '</div>' : '') + '</div><div class="act">' + (actions || '') + '</div></div>';
}
</script>
