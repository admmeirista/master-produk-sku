<script>
var SHOPEE_STATUS = { unmapped: 'Tidak tersedia', suggested: 'Perlu diverifikasi', needs_review: 'Perlu diverifikasi', approved: 'Disetujui', mismatch: 'Perlu diverifikasi', ignored: 'Tidak tersedia', verify: 'Perlu diverifikasi', unavailable: 'Tidak tersedia' };
var SHOPEE_KIND = { single: 'Satuan', multipack: 'Paket produk sama (MP)', bundle: 'Paket kombinasi (BD)', unclear: 'Isi belum pasti' };
function shopeeDisplayStatus(r) { return r.status === 'approved' ? 'approved' : r.target && r.target.active ? 'verify' : 'unavailable'; }
function shopeeBadge(st) { return '<span class="badge shopee-status-' + st + '">' + esc(SHOPEE_STATUS[st] || st) + '</span>'; }
function shopeeFields(items) { return '<dl class="shopee-fields">' + items.map(function (x) { return '<div><dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1] || '—') + '</dd></div>'; }).join('') + '</dl>'; }
function shopeeBom(cs) { return (cs || []).map(function (c) { return '<div><b>' + esc(c.quantity) + ' × <span class="sku">' + esc(c.sku) + '</span></b><small class="shopee-sub">' + esc(c.name || '') + (c.gtin ? ' · GTIN ' + esc(c.gtin) : '') + '</small></div>'; }).join(''); }

function shopeeReviewDialog(row, done) {
  // Daftar sudah membawa detail SKU, GTIN, komposisi dan version/signature.
  // Buka sinkron tanpa round trip; server tetap memvalidasi ulang saat menyimpan.
  if (row && typeof row === 'object') return shopeeOpenReview(row, done);
  var shell = modal('<h3>Periksa pasangan SKU Shopee</h3><div id="svLoading">' + loadingBox('Memuat detail produk…') + '</div><div class="row"><button class="btn" data-close>Tutup</button></div>');
  var closed = false, close = shell.close;
  shell.close = function () { closed = true; close(); };
  api('shopee.get', { id: row }, { silent: true }).then(function (r) {
    if (closed || !shell.isConnected) return;
    shell.close(); shopeeOpenReview(r, done);
  }).catch(function (e) { if (!closed && shell.isConnected) $('#svLoading', shell).innerHTML = errBox(e.message); });
  return shell;
}
/** Mengambil hanya kolom tarikan Shopee, bukan instruksi atau formula dalam workbook. */
function shopeeReadRows(aoa) {
  var header = -1, cols;
  for (var i = 0; i < Math.min(20, aoa.length); i++) {
    var h = aoa[i].map(function (s) { return String(s || '').trim().toLowerCase(); });
    if (h.indexOf('kode produk') >= 0 && h.indexOf('nama produk') >= 0) { header = i; cols = h; break; }
  }
  if (header < 0) throw new Error('Gunakan template mass update Shopee yang memiliki Kode Produk, Nama Produk, Kode Variasi, dan SKU.');
  ['kode produk', 'nama produk', 'kode variasi', 'nama variasi', 'sku induk', 'sku', 'harga', 'stok'].forEach(function (k) { if (cols.indexOf(k) < 0) throw new Error('Kolom template Shopee belum lengkap: ' + k); });
  function at(r, name) { var i = cols.indexOf(name); return i >= 0 ? r[i] : ''; }
  var seen = {}, rows = [];
  aoa.slice(header + 1).forEach(function (r, i) {
    var raw = at(r, 'kode produk'); if (raw === '' || raw === undefined || raw === null) return;
    if (typeof raw === 'number' && !Number.isSafeInteger(raw)) throw new Error('ID produk melebihi batas angka aman; simpan sebagai teks.');
    var pid = String(raw).trim(); if (!/^\d+$/.test(pid)) throw new Error('Kode produk tidak valid pada baris ' + (header + i + 2));
    var vid = at(r, 'kode variasi'); if (typeof vid === 'number' && !Number.isSafeInteger(vid)) throw new Error('ID variasi harus disimpan sebagai teks.');
    vid = String(vid === undefined || vid === null ? '' : vid).trim();
    if (vid && !/^\d+$/.test(vid)) throw new Error('Kode variasi tidak valid pada baris ' + (header + i + 2));
    var key = JSON.stringify([pid, vid]); if (seen[key]) throw new Error('ID produk/variasi berulang: ' + pid + '/' + vid); seen[key] = true;
    rows.push({ productId: pid, variationId: vid, name: String(at(r, 'nama produk') || ''), variationName: String(at(r, 'nama variasi') || ''), parentSku: String(at(r, 'sku induk') || ''), sellerSku: String(at(r, 'sku') || ''), gtin: String(at(r, 'gtin') || ''), price: at(r, 'harga'), stock: at(r, 'stok'), sourceRow: header + i + 2 });
  });
  if (!rows.length) throw new Error('Tidak ada baris produk Shopee.'); return rows;
}
</script>
