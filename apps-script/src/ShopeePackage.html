<script>
function shopeeSelectionKey(type, lines) {
  return JSON.stringify([type, lines.map(function (c) { return [c.sku, Number(c.quantity)]; }).sort(function (a,b) { return a[0].localeCompare(b[0]); })]);
}
function shopeeSelectionValid(type, lines) {
  if (['single','multipack','bundle'].indexOf(type) < 0 || !lines.length || lines.some(function(c) { return !c.sku || !Number.isInteger(Number(c.quantity)) || c.quantity < 1 || c.quantity > 1000; })) return false;
  if (new Set(lines.map(function(c) { return c.sku; })).size !== lines.length) return false;
  return type === 'single' ? lines.length === 1 && Number(lines[0].quantity) === 1 : type === 'multipack' ? lines.length === 1 && Number(lines[0].quantity) >= 2 : lines.length >= 2;
}
function shopeeOpenReview(r, done) {
  var w = can('mapping.write'), type = r.saleType || 'unclear', target = r.target, seq = 0, saving = false, resolved = null, brandId = '', brandManual=false, pickerRows=[], lastRequest=null;
  var lines = (r.expectedComponents && r.expectedComponents.length ? r.expectedComponents : target ? target.components : []).map(function(c) { var detail=target&&target.components.find(function(x){return x.sku===c.sku;});return {sku:c.sku,quantity:c.quantity,name:c.name||detail&&detail.name||''}; });
  if (!lines.length) lines = [{sku:'',quantity:type === 'multipack' ? Number(r.quantity)||2 : 1}];
  var m = modal('<header class="sh-review-header"><h3>Periksa pasangan SKU Shopee</h3><p class="muted">Bandingkan produk, pilih SKU barang dan jumlah, lalu setujui.</p></header><div class="sh-review-workspace"><aside class="sh-review-context"><div class="sh-review-context-summary"><b>'+esc(r.name)+'</b><small>'+esc(r.variationName||'Tanpa variasi')+'</small></div><details class="sh-review-comparison" open><summary>Lihat perbandingan Shopee dan master</summary><div class="shopee-compare"><section><div class="eyebrow">SHOPEE</div>' + shopeeFields([['Nama Produk',r.name],['Variasi',r.variationName],['SKU Induk',r.parentSku],['SKU',r.sellerSku],['GTIN',r.gtin]]) + '</section><section><div class="eyebrow">MASTER SISTEM</div><div id="svTarget"></div></section></div></details></aside><section class="sh-review-form"><h4>Pemetaan penjualan</h4>' +
    '<label class="f">Jenis penjualan Shopee</label><select class="in w100" id="svType"' + (!w?' disabled':'') + '><option value="unclear">Pilih jenis penjualan</option><option value="single">Satuan</option><option value="multipack">Paket produk sama (MP)</option><option value="bundle">Paket kombinasi (BD)</option></select>' +
    '<label class="f" for="svBrand">Filter brand (opsional)</label><select class="in w100" id="svBrand" disabled><option value="">Semua brand</option></select><div id="svPickerStatus" class="hint" role="status"></div><div class="sect">SKU barang dan jumlah per pembelian</div><div id="svLines"></div>' + (w?'<button class="btn sm" id="svAdd">Tambah SKU barang</button>':'') + '<div id="svResolution" class="hint" role="status"></div>' +
    '<div id="svBarcode"></div><details class="sh-review-note"><summary>Catatan pemeriksaan (opsional)</summary><label class="f">Catatan pemeriksaan (opsional)</label><textarea class="in w100" id="svNote" rows="2"' + (!w?' readonly':'') + '>' + esc(r.note) + '</textarea></details><div id="svError"></div></section></div>' +
    '<div class="row shopee-review-actions" style="margin-top:16px"><div id="svSaveStatus" class="shopee-save-status" role="status" aria-live="polite"></div>' + (w?'<button class="btn pri" id="svApprove" disabled>Setujui pasangan SKU</button><button class="btn pri" id="svApproveNext" disabled>Setujui & berikutnya</button><button class="btn pri hidden" id="svCreate" disabled>Buat paket baru & setujui</button><button class="btn" id="svReview">Simpan untuk diverifikasi</button>':'') + '<button class="btn" data-close>Tutup</button></div>', {wide:true,className:'sh-review-modal'});
  if(typeof window!=='undefined'&&window.matchMedia&&window.matchMedia('(max-width:900px)').matches)$('.sh-review-comparison',m).removeAttribute('open');
  $('#svType',m).value = type;
  var barcodeForm=packageBarcode($('#svBarcode',m),target||{},w&&can('product.write'));
  barcodeForm.set(target||{},type==='single');
  function drawTarget() {
    var shown=target||(typeof shopeeSelectionPreview!=='undefined'?shopeeSelectionPreview(type,lines,pickerRows):null);
    $('#svTarget',m).innerHTML = shopeeFields([['Nama Produk',shown&&(shown.productName||shown.name)],['Variasi',shown&&shown.variationName],['SKU Parent',shown&&shown.parentSku],['SKU',shown&&shown.sku],['GTIN',shown&&shown.gtin]]) + (shown&&shown.kind!=='single'?'<div class="shopee-bom">'+shopeeBom(shown.components)+'</div>':'');
    if(shown&&shown.preview)$('#svTarget',m).innerHTML+='<div class="hint">Pratinjau pilihan'+(type==='single'?'':' · SKU dan GTIN paket mengikuti paket yang ditemukan atau dibuat')+'.</div>';
  }
  function selection() { return {saleType:type,components:lines.map(function(c){return {sku:c.sku,quantity:Number(c.quantity)};}),preferredSku:r.targetSku || r.target && r.target.sku || ''}; }
  function buttons() {
    if (!w) return;
    var fresh = resolved && resolved.key === shopeeSelectionKey(type,lines), missing = fresh && !resolved.target && !resolved.blocked;
    $('#svApprove',m).disabled = saving || !fresh || !resolved.target || !!resolved.blocked;
    $('#svApprove',m).classList.toggle('hidden',!!missing);
    $('#svCreate',m).classList.toggle('hidden',!missing || !can('product.write'));
    $('#svCreate',m).disabled = saving || !missing;
    $('#svApproveNext',m).disabled=saving||!fresh||!!resolved.blocked||(!resolved.target&&!can('product.write'));
    $('#svApproveNext',m).textContent=missing?'Buat paket, setujui & berikutnya':'Setujui & berikutnya';
    $('#svReview',m).disabled = saving;
  }
  function accept(result,key) {
    resolved = result; resolved.key = key; target = result.target; barcodeForm.set(target||{},type==='single'); drawTarget();
    $('#svResolution',m).textContent = result.blocked || (target ? 'Menggunakan SKU yang sudah ada: '+target.sku+' · Total '+result.quantity+' unit per pembelian.' : 'Paket belum ada. '+(can('product.write')?'Buat dan setujui langsung; paket akan tersimpan di Paket Penjualan.':'Akun ini belum memiliki izin membuat paket.'));
    buttons();
  }
  var lookup = debounce(function(mine,key,p) {
    if (mine!==seq || !m.isConnected) return;
    api('shopee.packageResolve',p,{silent:true,quiet:true}).then(function(result) { if(mine!==seq || !m.isConnected||saving)return;accept(result,key); }).catch(function(e) { if(mine!==seq || !m.isConnected)return;$('#svResolution',m).textContent='';$('#svError',m).innerHTML=feList(e);buttons(); });
  },150);
  function updateBrand(){if(brandManual||!pickerRows.length||typeof shopeeAutoBrand==='undefined')return;var next=shopeeAutoBrand(pickerRows,r,lines);if(next!==brandId){brandId=next;$('#svBrand',m).value=brandId;drawLines();}}
  function changed() {
    if (!w || saving) return;
    updateBrand();++seq; resolved=null;target=null;barcodeForm.set({},type==='single');drawTarget();$('#svError',m).innerHTML='';buttons();
    if (!shopeeSelectionValid(type,lines)) {$('#svResolution',m).textContent=type==='bundle'?'Pilih minimal dua SKU barang berbeda dan jumlahnya.':'Pilih SKU barang dan jumlah yang sesuai (satuan 1, MP minimal 2).';return;}
    $('#svResolution',m).textContent='Mencari paket dengan isi yang sama…';
    lookup(seq,shopeeSelectionKey(type,lines),selection());
  }
  function drawLines() {
    packageLines($('#svLines',m),{prefix:'sv',lines:lines,type:type,writable:w&&!saving,brandId:brandId,changed:changed,remove:function(i){if(saving)return;lines.splice(i,1);drawLines();changed();}});
    if(w)$('#svAdd',m).classList.toggle('hidden',type!=='bundle');
  }
  drawTarget();drawLines();
  if(!w)return m;
  $('#svBrand',m).onchange=function(){brandManual=true;brandId=this.value;drawLines();};
  if(typeof SkuPicker!=='undefined'){
    $('#svPickerStatus',m).textContent='Menyiapkan pilihan SKU…';
    SkuPicker.load().then(function(rows){if(!m.isConnected)return;pickerRows=rows;var brands={};rows.forEach(function(item){if(item.brandId)brands[item.brandId]=item.brandName;});$('#svBrand',m).innerHTML='<option value="">Semua brand</option>'+Object.keys(brands).sort(function(a,b){return brands[a].localeCompare(brands[b],'id');}).map(function(id){return '<option value="'+esc(id)+'">'+esc(brands[id])+'</option>';}).join('');updateBrand();drawTarget();$('#svBrand',m).value=brandId;$('#svBrand',m).disabled=saving;$('#svPickerStatus',m).textContent='Cari langsung, atau persempit pilihan dengan brand.';}).catch(function(){if(m.isConnected)$('#svPickerStatus',m).textContent='Pilihan belum termuat. Klik kolom SKU untuk mencoba lagi.';});
  }
  $('#svType',m).onchange=function(){if(saving)return;type=this.value;if(type==='single'||type==='multipack'){lines=lines.slice(0,1);if(!lines.length)lines=[{sku:'',quantity:1}];lines[0].quantity=type==='single'?1:Math.max(2,Number(lines[0].quantity)||2);}else if(type==='bundle'){while(lines.length<2)lines.push({sku:'',quantity:1});}drawLines();changed();};
  $('#svAdd',m).onclick=function(){if(saving)return;lines.push({sku:'',quantity:1});drawLines();changed();};
  // Usulan yang sudah membawa target & BOM lengkap langsung dapat disetujui.
  if(target && target.active && shopeeSelectionValid(type,lines) && shopeeSelectionKey(type,lines)===shopeeSelectionKey(target.kind,target.components)) {
    resolved={target:target,key:shopeeSelectionKey(type,lines),signature:null};buttons();
  } else changed();
  function save(action,create,btn,advance) {
    if(saving)return;
    if(action==='approve' && (!resolved || resolved.key!==shopeeSelectionKey(type,lines) || resolved.blocked))return;
    var p={id:r.id,version:r.version,action:action,note:$('#svNote',m).value,requestKey:uid()};
    if(action==='approve') {
      if(type!=='single'&&can('product.write'))p.barcode=barcodeForm.get();
      if(target) Object.assign(p,{sku:target.sku,targetSignature:target.signature,saleType:type,quantity:lines.reduce(function(n,c){return n+Number(c.quantity);},0),components:selection().components});
      else {p.selection=selection();p.selection.signature=resolved.signature;p.createPackage=!!create;if(target){p.sku=target.sku;p.targetSignature=target.signature;}}
    }
    if(action==='needs_review')p.draft={saleType:type,components:lines.filter(function(c){return !!c.sku;}).map(function(c){return {sku:c.sku,quantity:Number(c.quantity)};}),targetSku:target&&target.sku||'',targetSignature:target&&target.signature||''};
    var requestSignature=JSON.stringify(Object.assign({},p,{requestKey:''}));if(lastRequest&&lastRequest.signature===requestSignature)p.requestKey=lastRequest.key;else lastRequest={signature:requestSignature,key:p.requestKey};
    var previousLabel=btn.textContent;++seq;saving=true;$('#svSaveStatus',m).textContent='Menyimpan pemetaan…';buttons();btn.textContent='Menyimpan…';$('#svType',m).disabled=true;$('#svBrand',m).disabled=true;$$('#svLines input, #svLines button, #svAdd',m).forEach(function(el){el.disabled=true;});$('#svError',m).innerHTML='';
    busy(btn,api('shopee.review',p,{silent:true})).then(function(updated){m.close();toast(updated.packageCreated?'Paket baru tersimpan di Paket Penjualan dan pemetaan disetujui.':action==='approve'?'Pasangan SKU disetujui.':'Pemetaan tersimpan sebagai Perlu diverifikasi. Klik Setujui agar dapat diekspor.','ok');done(updated,!!advance);}).catch(function(e){saving=false;btn.textContent=previousLabel;$('#svSaveStatus',m).textContent=e.code==='NETWORK'?'Penyimpanan belum dapat dikonfirmasi. Coba lagi untuk memeriksa hasilnya.':'Belum tersimpan. Perbaiki pesan di formulir, lalu coba lagi.';$('#svType',m).disabled=false;$('#svBrand',m).disabled=false;drawLines();buttons();$('#svError',m).innerHTML=feList(e);if($('#svError',m).scrollIntoView)$('#svError',m).scrollIntoView({block:'nearest'});});
  }
  $('#svApprove',m).onclick=function(){save('approve',false,this);};
  $('#svApproveNext',m).onclick=function(){save('approve',!!(resolved&&!resolved.target),this,true);};
  $('#svCreate',m).onclick=function(){save('approve',true,this);};
  $('#svReview',m).onclick=function(){save('needs_review',false,this);};
  return m;
}
</script>
