<script>
// Antrean per akun: popup ditutup segera, status final menunggu konfirmasi server.
var ShopeeReviewJobs={account:null,jobs:[],running:false,onChange:null,
  key:function(){return 'meirista_shopee_reviews:'+((typeof App!=='undefined'&&App.me&&App.me.user&&(App.me.user.id||App.me.user.email))||'session');},
  init:function(){var key=this.key();if(this.account===key)return;this.account=key;this.jobs=[];this.running=false;try{this.jobs=JSON.parse(sessionStorage.getItem(key)||'[]');if(!Array.isArray(this.jobs))this.jobs=[];this.jobs.forEach(function(j){j.account=key;j.state='error';j.error={code:'NETWORK',message:'Penyimpanan sebelumnya belum dikonfirmasi. Klik Coba lagi untuk memeriksa hasilnya.'};});}catch(e){}},
  persist:function(){try{sessionStorage.setItem(this.account,JSON.stringify(this.jobs.filter(function(j){return j.state!=='saved';})));}catch(e){}},
  get:function(id){this.init();return this.jobs.find(function(j){return j.row.id===id&&j.state!=='saved';});},
  pending:function(){this.init();return this.jobs.some(function(j){return j.state==='saving'||j.state==='queued';});},
  decorate:function(data){if(!data)return;this.init();var saved={},pending={},changed=false;this.jobs.forEach(function(j){if(j.state==='saved'&&j.updated){if(!saved[j.updated.id]||Number(saved[j.updated.id].version)<Number(j.updated.version))saved[j.updated.id]=j.updated;}else pending[j.row.id]=j.state;});data.rows=data.rows.map(function(r){var updated=saved[r.id];if(updated&&(Number(r.version)||0)<Number(updated.version)){r=Object.assign({},r,updated);changed=true;}r.reviewJobState=pending[r.id]||'';return r;});if(changed)ShopeeWorkspace.update(data,{});},
  emit:function(job){if(job.account!==this.account)return;this.persist();if(this.onChange)this.onChange(job);},
  enqueue:function(row,p,resume){this.init();if(this.get(row.id))return false;var job={account:this.account,row:row,payload:p,resume:resume,state:'queued'};this.jobs.push(job);if(this.running)this.emit(job);else{this.persist();this.pump();}return true;},
  retry:function(job){if(job.state!=='error')return;job.state='queued';job.error=null;this.emit(job);this.pump();},
  discard:function(job){if(job.state!=='error')return false;this.jobs=this.jobs.filter(function(j){return j!==job;});this.emit(job);return true;},
  pump:function(){var self=this;if(this.running)return;var job=this.jobs.find(function(j){return j.state==='queued';});if(!job)return;this.running=true;job.state='saving';this.emit(job);
    api('shopee.review',job.payload,{silent:true,quiet:true}).then(function(updated){job.state='saved';job.updated=updated;self.emit(job);}).catch(function(e){job.state='error';job.error=e;self.emit(job);}).finally(function(){if(self.account===job.account){self.running=false;self.pump();}});
  }
};
function shopeeSelectionKey(type, lines) {
  return JSON.stringify([type, lines.map(function (c) { return [c.sku, Number(c.quantity)]; }).sort(function (a,b) { return a[0].localeCompare(b[0]); })]);
}
function shopeeSelectionValid(type, lines) {
  if (['single','multipack','bundle'].indexOf(type) < 0 || !lines.length || lines.some(function(c) { return !c.sku || !Number.isInteger(Number(c.quantity)) || c.quantity < 1 || c.quantity > 1000; })) return false;
  if (new Set(lines.map(function(c) { return c.sku; })).size !== lines.length) return false;
  return type === 'single' ? lines.length === 1 && Number(lines[0].quantity) === 1 : type === 'multipack' ? lines.length === 1 && Number(lines[0].quantity) >= 2 : lines.length >= 2;
}
function shopeeOpenReview(r, done, navigation) {
  var w = can('mapping.write'), type = r.saleType || 'unclear', target = r.target, seq = 0, saving = false, resolved = null, brandId = r.reviewBrandId||'', brandManual=!!r.reviewBrandManual, pickerRows=[], lastRequest=null;
  var lines = (r.expectedComponents && r.expectedComponents.length ? r.expectedComponents : target ? target.components : []).map(function(c) { var detail=target&&target.components.find(function(x){return x.sku===c.sku;});return {sku:c.sku,quantity:c.quantity,name:c.name||detail&&detail.name||'',brandId:c.brandId||''}; });
  if (!lines.length) lines = [{sku:'',quantity:type === 'multipack' ? Number(r.quantity)||2 : 1}];
  var initialSelectionKey=shopeeSelectionKey(type,lines);
  var m = modal('<header class="sh-review-header"><div class="sh-review-title"><h3>Periksa pasangan SKU Shopee</h3><p class="muted">'+esc(r.name||'Bandingkan pasangan SKU')+'</p></div><button class="sh-review-close" data-close aria-label="Tutup pemeriksaan">×</button><div class="sh-review-current-status" aria-label="Status pemetaan">'+shopeeBadge(shopeeDisplayStatus(r))+'<div class="sh-review-current-confidence"><span>Kecocokan</span><span id="svHeaderConfidence">'+shopeeMatchScore(r)+'</span></div></div></header><nav class="sh-review-jump" aria-label="Bagian pemeriksaan"><button type="button" data-review-jump="form">Pemetaan SKU</button><button type="button" data-review-jump="context">Bandingkan</button></nav><div class="sh-review-workspace"><section class="sh-review-context" data-compare-view="source"><div class="sh-review-mobile-tabs" role="group" aria-label="Tampilan perbandingan"><button type="button" data-compare-view="source" aria-pressed="true">Shopee</button><button type="button" data-compare-view="master" aria-pressed="false">Master Sistem</button><button type="button" data-compare-view="export" aria-pressed="false">Hasil Ekspor</button></div><div class="sh-review-comparison"><table class="sh-review-compare-table"><caption class="sr-only">Perbandingan data Shopee, master sistem, dan hasil ekspor</caption><colgroup><col class="sh-review-field-col"><col><col><col></colgroup><thead><tr><th scope="col">Data</th><th scope="col">Shopee Saat Ini</th><th scope="col">Master Sistem</th><th scope="col">Hasil Ekspor Shopee</th></tr></thead><tbody id="svTarget"></tbody></table><div id="svCompareHint" class="hint" role="status"></div><div id="svComposition" class="sh-review-composition"></div></div></section><section class="sh-review-form"><h4>Pemetaan penjualan</h4>' +
    '<div class="sh-review-filter-grid"><div><label class="f">Jenis penjualan Shopee</label><select class="in w100" id="svType"' + (!w?' disabled':'') + '><option value="unclear">Pilih jenis penjualan</option><option value="single">Satuan</option><option value="multipack">Paket produk sama (MP)</option><option value="bundle">Paket kombinasi (BD)</option></select>' +
    '</div><div id="svBrandField"><label class="f" for="svBrand">Filter brand (opsional)</label><select class="in w100" id="svBrand" disabled><option value="">Semua brand</option></select></div></div><div id="svPickerStatus" class="hint" role="status"></div><div class="sect">SKU barang dan jumlah per pembelian</div><div id="svLines"></div>' + (w?'<button class="btn sm" id="svAdd">Tambah SKU barang</button>':'') + '<div id="svResolution" class="hint" role="status"></div>' +
    '<div id="svBarcode"></div><div id="svError"></div></section></div>' +
    '<footer class="shopee-review-actions">'+(navigation?'<div class="sh-review-navigation"><button class="btn" id="svPrevious"'+(!navigation.canPrevious?' disabled':'')+'>Sebelumnya</button><span class="sh-review-position">'+navigation.position+' / '+navigation.total+'</span><button class="btn" id="svNext"'+(!navigation.canNext?' disabled':'')+'>Berikutnya</button></div>':'')+'<div id="svSaveStatus" class="shopee-save-status" role="status" aria-live="polite"></div><div class="sh-review-submit"><p id="svActionHint" class="sh-review-action-hint" aria-live="polite"></p>'+(w?'<button class="btn pri" id="svApproveNext" disabled>Setujui & berikutnya</button>':'')+'<div class="sh-review-secondary">'+(w?'<button class="btn" id="svApprove" disabled>Setujui & tutup</button><button class="btn hidden" id="svCreate" disabled>Buat paket & tutup</button><button class="btn" id="svReview">Simpan untuk diverifikasi</button>':'')+'</div></div></footer>', {wide:true,className:'sh-review-modal'});
  $$('[data-compare-view]',m).filter(function(b){return b.tagName==='BUTTON';}).forEach(function(button){button.onclick=function(){var view=button.getAttribute('data-compare-view');$('.sh-review-context',m).setAttribute('data-compare-view',view);$$('.sh-review-mobile-tabs button',m).forEach(function(b){b.setAttribute('aria-pressed',String(b===button));});};});
  $$('[data-review-jump]',m).forEach(function(b){b.onclick=function(){var part=$('.sh-review-'+b.getAttribute('data-review-jump'),m);if(part)part.scrollIntoView({block:'start',behavior:'smooth'});};});
  if(navigation){
    function move(direction){if(saving||!m.isConnected)return;var draft=Object.assign({},r,{saleType:type,expectedComponents:lines.map(function(c){return {sku:c.sku,quantity:Number(c.quantity),name:c.name,brandId:c.brandId};}),target:target,targetSku:target&&target.sku||'',pendingBarcode:type==='single'?null:barcodeForm.get(),reviewBrandId:brandId,reviewBrandManual:brandManual,match:shopeeSelectionKey(type,lines)===initialSelectionKey?r.match:null});navigation.move(direction,draft,function(){m.close();});}
    $('#svPrevious',m).onclick=function(){move(-1);};$('#svNext',m).onclick=function(){move(1);};
  }
  $('#svType',m).value = type;
  var barcodeForm=packageBarcode($('#svBarcode',m),target||{},w&&can('product.write'));
  barcodeForm.set(target||{},type==='single');
  function drawTarget() {
    $('#svHeaderConfidence',m).innerHTML=shopeeSelectionKey(type,lines)===initialSelectionKey?shopeeMatchScore(r):'<span class="muted" title="Pilihan berubah; skor usulan awal tidak berlaku untuk pilihan ini.">—</span>';
    var shown=target||(typeof shopeeSelectionPreview!=='undefined'?shopeeSelectionPreview(type,lines,pickerRows):null);
    if(type==='single')barcodeForm.set(shown&&shown.kind==='single'?shown:{},true);
    var preview=typeof ShopeePlacement!=='undefined'?ShopeePlacement.preview(r.listingShape,shown):{ready:false,reason:'Template asli belum tersedia.'};
    $('#svTarget',m).innerHTML=shopeeComparisonRows(r,shown,preview);
    $('#svCompareHint',m).textContent=preview.ready&&preview.parentPolicy!=='preserve_original'?'':preview.reason||'Pilih SKU master untuk melengkapi hasil ekspor.';
    $('#svComposition',m).innerHTML='';

  }
  function selection() { return {saleType:type,components:lines.map(function(c){return {sku:c.sku,quantity:Number(c.quantity)};}),preferredSku:r.targetSku || r.target && r.target.sku || ''}; }
  function buttons() {
    if (!w) return;
    var fresh = resolved && resolved.key === shopeeSelectionKey(type,lines), missing = fresh && !resolved.target && !resolved.blocked;
    $('#svApprove',m).disabled = saving || !fresh || !resolved.target || !!resolved.blocked;
    $('#svApprove',m).classList.toggle('hidden',!!missing);
    $('#svCreate',m).classList.toggle('hidden',!missing || !can('product.write'));
    $('#svCreate',m).disabled = saving || !missing;
    $('#svApproveNext',m).disabled=saving||!fresh||!!resolved.blocked||(!resolved.target&&!can('product.write'));
    $('#svApproveNext',m).textContent=missing?'Buat paket, setujui & berikutnya':'Setujui & berikutnya';
    $('#svActionHint',m).textContent=missing?'Paket baru akan dibuat dan disimpan ke Paket Penjualan.':fresh&&target?'Menggunakan SKU '+target.sku+' yang sudah tersedia.':'Pilih SKU dan qty untuk memeriksa kecocokan.';
    $('#svReview',m).disabled = saving;
  }
  function accept(result,key) {
    resolved = result; resolved.key = key; target = result.target; barcodeForm.set(type==='single'?(target||{}):(r.pendingBarcode||target||{}),type==='single');r.pendingBarcode=null; drawTarget();
    $('#svResolution',m).textContent = result.blocked || (target ? 'Menggunakan SKU yang sudah ada: '+target.sku+' · Total '+result.quantity+' unit per pembelian.' : 'Paket belum ada. '+(can('product.write')?'Buat dan setujui langsung; paket akan tersimpan di Paket Penjualan.':'Akun ini belum memiliki izin membuat paket.'));
    buttons();
  }
  var lookup = debounce(function(mine,key,p) {
    if (mine!==seq || !m.isConnected) return;
    api('shopee.packageResolve',p,{silent:true,quiet:true}).then(function(result) { if(mine!==seq || !m.isConnected||saving)return;accept(result,key); }).catch(function(e) { if(mine!==seq || !m.isConnected)return;$('#svResolution',m).textContent='';$('#svError',m).innerHTML=feList(e);buttons(); });
  },150);
  function updateBrand(){if(brandManual||!pickerRows.length||typeof shopeeAutoBrand==='undefined')return;var next=shopeeAutoBrand(pickerRows,r,lines);if(next!==brandId){brandId=next;$('#svBrand',m).value=brandId;drawLines();}}
  function changed() {
    if (!w || saving) return;
    updateBrand();++seq; resolved=null;target=null;barcodeForm.set({},type==='single');drawTarget();$('#svError',m).innerHTML='';buttons();
    if (!shopeeSelectionValid(type,lines)) {$('#svResolution',m).textContent=type==='bundle'?'Pilih minimal dua SKU barang berbeda dan jumlahnya.':'Pilih SKU barang dan jumlah yang sesuai (satuan 1, MP minimal 2).';return;}
    $('#svResolution',m).textContent=type==='single'?'Memeriksa SKU barang…':'Mencari paket dengan isi yang sama…';
    lookup(seq,shopeeSelectionKey(type,lines),selection());
  }
  function drawLines() {
    $('#svBrandField',m).classList.toggle('hidden',type==='bundle');
    packageLines($('#svLines',m),{prefix:'sv',lines:lines,type:type,writable:w&&!saving,brandId:brandId,changed:changed,remove:function(i){if(saving)return;lines.splice(i,1);drawLines();changed();}});
    if(w)$('#svAdd',m).classList.toggle('hidden',type!=='bundle');
  }
  drawTarget();drawLines();
  if(!w)return m;
  $('#svBrand',m).onchange=function(){brandManual=true;brandId=this.value;drawLines();};
  if(typeof SkuPicker!=='undefined'){
    $('#svPickerStatus',m).textContent='Menyiapkan pilihan SKU…';
    SkuPicker.load().then(function(rows){if(!m.isConnected)return;pickerRows=rows;var brands={};rows.forEach(function(item){if(item.brandId)brands[item.brandId]=item.brandName;});$('#svBrand',m).innerHTML='<option value="">Semua brand</option>'+Object.keys(brands).sort(function(a,b){return brands[a].localeCompare(brands[b],'id');}).map(function(id){return '<option value="'+esc(id)+'">'+esc(brands[id])+'</option>';}).join('');updateBrand();drawTarget();$('#svBrand',m).value=brandId;$('#svBrand',m).disabled=saving;$('#svPickerStatus',m).textContent=type==='bundle'?'Setiap barang dapat memakai brand berbeda.':'Cari langsung, atau persempit pilihan dengan brand.';}).catch(function(){if(m.isConnected)$('#svPickerStatus',m).textContent='Pilihan belum termuat. Klik kolom SKU untuk mencoba lagi.';});
  }
  $('#svType',m).onchange=function(){if(saving)return;type=this.value;if(type==='single'||type==='multipack'){lines=lines.slice(0,1);if(!lines.length)lines=[{sku:'',quantity:1}];lines[0].quantity=type==='single'?1:Math.max(2,Number(lines[0].quantity)||2);}else if(type==='bundle'){while(lines.length<2)lines.push({sku:'',quantity:1});}drawLines();changed();};
  $('#svAdd',m).onclick=function(){if(saving)return;lines.push({sku:'',quantity:1});drawLines();changed();};
  // Usulan yang sudah membawa target & BOM lengkap langsung dapat disetujui.
  if(target && target.active && shopeeSelectionValid(type,lines) && shopeeSelectionKey(type,lines)===shopeeSelectionKey(target.kind,target.components)) {
    resolved={target:target,key:shopeeSelectionKey(type,lines),signature:null};buttons();
  } else changed();
  if(type!=='single'&&r.pendingBarcode&&resolved){barcodeForm.set(r.pendingBarcode,type==='single');r.pendingBarcode=null;}
  function save(action,create,btn,advance) {
    if(saving)return;
    if(action==='approve' && (!resolved || resolved.key!==shopeeSelectionKey(type,lines) || resolved.blocked))return;
    var p={id:r.id,version:r.version,action:action,note:r.note||'',requestKey:uid()};
    if(action==='approve') {
      if(type!=='single'&&can('product.write'))p.barcode=barcodeForm.get();
      if(target) Object.assign(p,{sku:target.sku,targetSignature:target.signature,saleType:type,quantity:lines.reduce(function(n,c){return n+Number(c.quantity);},0),components:selection().components});
      else {p.selection=selection();p.selection.signature=resolved.signature;p.createPackage=!!create;if(target){p.sku=target.sku;p.targetSignature=target.signature;}}
    }
    if(action==='needs_review')p.draft={saleType:type,components:lines.filter(function(c){return !!c.sku;}).map(function(c){return {sku:c.sku,quantity:Number(c.quantity)};}),targetSku:target&&target.sku||'',targetSignature:target&&target.signature||''};
    var requestSignature=JSON.stringify(Object.assign({},p,{requestKey:''}));if(lastRequest&&lastRequest.signature===requestSignature)p.requestKey=lastRequest.key;else lastRequest={signature:requestSignature,key:p.requestKey};
    ++seq;saving=true;buttons();
    var resume=Object.assign({},r,{saleType:type,expectedComponents:selection().components,target:target,targetSku:target&&target.sku||'',note:p.note,pendingBarcode:p.barcode||null});
    if(ShopeeReviewJobs.get(r.id)){saving=false;buttons();return toast('Produk ini masih berada di antrean penyimpanan.','warn');}
    m.close();ShopeeReviewJobs.enqueue(r,p,resume);done(r,!!advance,'pending');
  }
  $('#svApprove',m).onclick=function(){save('approve',false,this);};
  $('#svApproveNext',m).onclick=function(){save('approve',!!(resolved&&!resolved.target),this,true);};
  $('#svCreate',m).onclick=function(){save('approve',true,this);};
  $('#svReview',m).onclick=function(){save('needs_review',false,this);};
  return m;
}
</script>
