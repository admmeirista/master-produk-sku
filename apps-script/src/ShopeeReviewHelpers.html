<script>
function shopeeAutoBrand(rows,listing,lines){
  var selected=lines.map(function(c){return rows.find(function(r){return r.sku===c.sku;});}).filter(Boolean),ids=Array.from(new Set(selected.map(function(r){return r.brandId;}).filter(Boolean)));
  if(ids.length)return ids.length===1?ids[0]:'';
  function words(s){return ' '+String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()+' ';}
  var title=words(listing.name+' '+(listing.variationName||'')),brands={};rows.forEach(function(r){if(r.brandId&&r.brandName)brands[r.brandId]=r.brandName;});
  var matches=Object.keys(brands).filter(function(id){return new RegExp('(?:^|\\s)'+words(brands[id]).trim().split(/\s+/).join('\\s*')+'(?=\\s|$)').test(title);});
  if(matches.length===1)return matches[0];
  if(matches.length>1){matches.sort(function(a,b){return brands[b].length-brands[a].length;});if(matches.every(function(id){return words(brands[matches[0]]).indexOf(words(brands[id]))>=0;}))return matches[0];}
  return '';
}
function shopeeSelectionPreview(type,lines,rows){
  var chosen=lines.map(function(c){var r=rows.find(function(r){return r.sku===c.sku;});return r?{row:r,quantity:Number(c.quantity)||1}:null;}).filter(Boolean);
  if(!chosen.length)return null;
  if(type==='single'){var r=chosen[0].row;return {preview:true,kind:'single',name:r.displayName,productName:r.productName||r.displayName,variationName:r.variationName,parentSku:r.parentSku,sku:r.sku,gtin:r.gtin,internalBarcode:r.internalBarcode,components:[]};}
  var names=chosen.map(function(c){return c.quantity+' × '+c.row.displayName;}),parents=Array.from(new Set(chosen.map(function(c){return c.row.parentSku;}).filter(Boolean)));
  return {preview:true,kind:type,name:names.join(' + '),productName:names.join(' + '),variationName:Array.from(new Set(chosen.map(function(c){return c.row.variationName;}).filter(Boolean))).join(' + '),parentSku:parents.length===1?parents[0]:parents.length>1?'Beberapa parent':'',sku:'Belum ditentukan ('+(type==='multipack'?'MP':'BD')+')',gtin:'',components:chosen.map(function(c){return {sku:c.row.sku,name:c.row.displayName,quantity:c.quantity,gtin:c.row.gtin};})};
}
function shopeeReviewShell(r,w,navigation){
  var pos=navigation?navigation.position+' / '+navigation.total:'Pemeriksaan produk';
  return '<header class="sh-review-header"><div class="sh-review-title"><h3>Periksa pasangan SKU</h3><p class="muted">Shopee · '+esc(r.store||'Pemetaan produk')+' · '+pos+'</p></div><button class="sh-review-close" data-close aria-label="Tutup pemeriksaan">×</button><div class="sh-review-current-status" aria-label="Status pemetaan">'+shopeeBadge(shopeeDisplayStatus(r))+'<div class="sh-review-current-confidence"><span>Kecocokan</span><span id="svHeaderConfidence">'+shopeeMatchScore(r)+'</span></div></div></header>'+
    '<div class="review-mobile-source"><span>Shopee</span><b>'+esc(r.name)+'</b><small>'+esc(r.variationName||'Tanpa variasi')+'</small></div><nav class="review-panel-tabs" aria-label="Bagian pemeriksaan"><button type="button" data-review-panel="mapping" aria-pressed="true">Pemetaan</button><button type="button" data-review-panel="compare" aria-pressed="false">Perbandingan</button></nav>'+
    '<div class="sh-review-workspace"><section class="sh-review-context"><div class="review-source-card"><div class="review-eyebrow">Shopee saat ini</div><h4>'+esc(r.name)+'</h4><div class="review-source-variation"><span>Variasi</span><b>'+esc(r.variationName||'Tanpa variasi')+'</b></div></div><div class="review-match-evidence">'+esc(r.match&&r.match.reason||'Bandingkan barang yang dijual dengan master sistem.')+'</div><div class="sh-review-comparison"><h4>Hasil ekspor Shopee</h4><table class="review-export-table"><caption class="sr-only">Perbandingan nilai Shopee saat ini dan hasil ekspor Shopee</caption><thead><tr><th scope="col">Kolom</th><th scope="col">Saat ini</th><th scope="col">Hasil pemetaan</th></tr></thead><tbody id="svTarget"></tbody></table><div id="svCompareHint" class="hint" role="status"></div></div></section>'+
    '<section class="sh-review-form"><div class="review-eyebrow review-master-title">Master Sistem</div><label class="f">Jenis penjualan</label><div class="review-sale-types" role="group" aria-label="Jenis penjualan Shopee">'+[['single','Satuan'],['multipack','Paket sama · MP'],['bundle','Kombinasi · BD']].map(function(x){return '<button type="button" data-sale-type="'+x[0]+'" aria-pressed="false"'+(!w?' disabled':'')+'>'+x[1]+'</button>';}).join('')+'</div><select id="svType" class="hidden" aria-label="Jenis penjualan Shopee"><option value="unclear">Pilih jenis penjualan</option><option value="single">Satuan</option><option value="multipack">Paket produk sama (MP)</option><option value="bundle">Paket kombinasi (BD)</option></select><div id="svBrandField" class="hidden"><select id="svBrand" disabled><option value="">Semua brand</option></select></div><p id="svPickerStatus" class="hint" role="status"></p><div class="sect">Barang yang dijual</div><div id="svLines"></div>'+(w?'<button class="btn sm ghost review-add-item" id="svAdd">'+icon('plus')+' Tambah barang dari brand lain</button>':'')+'<div class="review-total"><span>Total per pembelian</span><b id="svTotal"></b></div><div id="svResolution" class="review-resolution" role="status"></div><details class="review-master-details"><summary>Detail master & komposisi</summary><div id="svMasterDetails"></div><div id="svComposition"></div></details><details id="svBarcodeDetails" class="review-barcode"><summary id="svBarcodeLabel">Atur barcode paket</summary><div id="svBarcode"></div></details><div id="svError"></div></section></div>'+
    '<footer class="shopee-review-actions">'+(navigation?'<div class="sh-review-navigation"><button class="btn" id="svPrevious"'+(!navigation.canPrevious?' disabled':'')+'>Sebelumnya</button><span class="sh-review-position">'+pos+'</span><button class="btn" id="svNext"'+(!navigation.canNext?' disabled':'')+'>Lewati</button></div>':'')+'<div id="svSaveStatus" class="shopee-save-status" role="status" aria-live="polite"></div><div class="sh-review-submit"><p id="svActionHint" class="sh-review-action-hint" aria-live="polite"></p>'+(w?'<button class="btn pri" id="svApproveNext" disabled>Setujui & berikutnya</button>':'')+'<details class="review-extra-actions"><summary>Aksi lainnya</summary><div class="sh-review-secondary">'+(w?'<button class="btn" id="svApprove" disabled>Setujui & tutup</button><button class="btn hidden" id="svCreate" disabled>Buat paket & tutup</button><button class="btn" id="svReview">Simpan untuk diverifikasi</button>':'')+'</div></details></div></footer>';
}
function shopeeReviewExportRows(row,target,preview,pendingLabel){
  var parent=preview.parentSku||'',sku=preview.sku||'',gtin=preview.gtin||'';
  if(pendingLabel){if(preview.kind==='single')parent=pendingLabel;else if(preview.kind==='variants')sku=pendingLabel;}
  if(!/^PRD\d{6}$/.test(parent)&&parent==='Beberapa parent')parent='';
  var values=[['SKU Induk',row.parentSku||'',parent],['SKU',row.sellerSku||'',sku],['GTIN',row.gtin||'',gtin]];
  return values.map(function(v,i){var changed=String(v[1])!==String(v[2]),label=i===1&&preview.kind==='single'?'Kosong (tanpa variasi)':v[2]||'—';return '<tr><th scope="row">'+v[0]+'</th><td>'+esc(v[1]||'—')+'</td><td'+(changed?' class="review-export-changed"':'')+'>'+esc(label)+(changed?'':'<small class="review-export-same">Sama</small>')+'</td></tr>';}).join('');
}
</script>
