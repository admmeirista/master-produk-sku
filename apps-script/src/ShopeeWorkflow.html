<script>
// Workbook asli hanya disimpan di memori tab ini, sehingga format template tetap utuh.
var SHOPEE_WORKFILE = null;
Pages.mapping = function (main, arg) {
  var f = { search: arg && arg.search || '', status: arg && arg.status || '', page: 1, pageSize: 30 }, sequence = 0, w = can('mapping.write');
  main.innerHTML = pageHead('Integrasi', 'SKU Mapping Shopee', can('export.run') ? '<button class="btn pri" id="slExportSelected" disabled>'+icon('download')+'Ekspor terpilih (0)</button><button class="btn" id="slClearSelection" disabled>Bersihkan pilihan</button>' : '', 'Periksa pasangan SKU Shopee dan pilih variasi yang sudah disetujui untuk ekspor mass update.') +
    '<div id="slSummary" class="shopee-status-cards"></div><div class="toolbar shopee-filters"><div class="search">'+icon('search')+'<input class="in" id="slSearch" placeholder="Cari produk, variasi atau SKU" value="'+esc(f.search)+'"></div><select class="in" id="slStatus" aria-label="Status pemeriksaan"><option value="">Semua status</option><option value="verify">Perlu diverifikasi</option><option value="approved">Disetujui</option><option value="unavailable">Tidak tersedia</option></select></div><div id="slSelectionInfo" class="hint"></div><div id="slRows"></div>';
  $('#slStatus',main).value=f.status;
  function selectionInfo(){var count=Object.keys(SHOPEE_SELECTED).length,button=$('#slExportSelected',main);if(button){button.disabled=!count;button.innerHTML=icon('download')+'Ekspor terpilih ('+count+')';}var clear=$('#slClearSelection',main);if(clear)clear.disabled=!count;var info=$('#slSelectionInfo',main);if(info)info.textContent=count?count+' variasi dipilih. Pilihan tetap tersimpan saat berpindah halaman atau filter.':'Centang variasi berstatus Disetujui untuk ekspor. Unggah template tersedia di Import & Export.';}

  function load(cached) {
    var mine = ++sequence, box = $('#slRows', main);
    if (!box) return;
    box.innerHTML=loadingBox('Memuat produk…');
    var request=cached?Promise.resolve(cached):null;
    function render(d) {
      if (mine !== sequence || !$('#slRows', main)) return;
      var s = d.summary;
      $('#slSummary',main).innerHTML=shopeeStatusCards(s,f.status);
      $$('[data-status-card]',main).forEach(function(button){button.onclick=function(){f.status=button.getAttribute('data-status-card');$('#slStatus',main).value=f.status;f.page=1;load();};});
      d.rows.forEach(function(r){if(r.status!=='approved')delete SHOPEE_SELECTED[r.id];});
      box.innerHTML = d.rows.length ? '<div class="tablewrap shopee-simple"><table class="t"><thead><tr><th class="shopee-selection"><input type="checkbox" id="slSelectPage" aria-label="Pilih semua variasi disetujui pada halaman ini"></th><th class="sh-source shopee-product">Produk Shopee</th><th class="sh-source">Variasi</th><th class="sh-source">SKU Shopee</th><th class="sh-master">SKU sistem</th><th>Status</th><th></th></tr></thead><tbody>' + d.rows.map(function (r) {
        return '<tr><td class="shopee-selection"><input type="checkbox" data-select-listing="'+esc(r.id)+'" aria-label="Pilih '+esc(r.name)+' '+esc(r.variationName||'')+'"'+(r.status!=='approved'||!can('export.run')?' disabled':'')+(SHOPEE_SELECTED[r.id]?' checked':'')+'></td><td class="sh-source shopee-product"><b>' + esc(r.name) + '</b></td><td class="sh-source shopee-variation-cell">' + esc(r.variationName || '—') + '</td><td class="sh-source shopee-seller-sku sku">' + esc(r.sellerSku || '—') + '</td><td class="sh-master">' + (r.target ? '<b class="sku">' + esc(r.target.sku) + '</b><small class="shopee-sub">' + esc(r.target.name) + '</small>' : '<span class="muted">Tidak tersedia</span>') + '</td><td>' + shopeeBadge(shopeeDisplayStatus(r)) + '</td><td><button class="btn sm" data-review="' + esc(r.id) + '">' + (w ? 'Periksa' : 'Lihat') + '</button></td></tr>';
      }).join('') + '</tbody></table></div>' + pager(d, function (p) { f.page = p; load(); }) : emptyBox('Tidak ada produk', 'Ubah pencarian atau impor template melalui Import & Export.', 'search');
      $$('[data-select-listing]',box).forEach(function(input){input.onchange=function(){var id=input.getAttribute('data-select-listing'),row=d.rows.find(function(r){return r.id===id;});if(this.checked&&row&&row.status==='approved')SHOPEE_SELECTED[id]=true;else delete SHOPEE_SELECTED[id];selectionInfo();};});
      var selectPage=$('#slSelectPage',box),eligible=d.rows.filter(function(r){return r.status==='approved';});
      if(selectPage){selectPage.disabled=!eligible.length||!can('export.run');selectPage.checked=!!eligible.length&&eligible.every(function(r){return !!SHOPEE_SELECTED[r.id];});selectPage.onchange=function(){var checked=this.checked;eligible.forEach(function(r){if(checked)SHOPEE_SELECTED[r.id]=true;else delete SHOPEE_SELECTED[r.id];});render(d);};}
      selectionInfo();
      $$('[data-review]', box).forEach(function (b) { b.onclick = function () {
        var id = b.getAttribute('data-review'), before = d.rows.find(function (r) { return r.id === id; });
        shopeeReviewDialog(before, function (updated) {
          if (!updated) return;
          if(updated.status!=='approved')delete SHOPEE_SELECTED[updated.id];
          var oldStatus = shopeeDisplayStatus(before), newStatus = shopeeDisplayStatus(updated);
          d.summary[oldStatus]--; d.summary[newStatus]++;
          d.rows = d.rows.map(function (r) { return r.id === updated.id ? updated : r; });
          if (f.status && newStatus !== f.status) { d.rows = d.rows.filter(function (r) { return r.id !== updated.id; }); d.total--; }
          FastReadCache.put(FastReadCache.key('shopee.list',f),JSON.parse(JSON.stringify(d)));
          load(d);
        });
      }; });
    }
    if(request)request.then(render).catch(function(e){if(mine===sequence)box.innerHTML=errBox(e.message);});
    else fastRead('shopee.list',f,render).catch(function(e){if(mine===sequence&&$('#slRows',main))box.innerHTML=errBox(e.message);});
  }
  $('#slSearch', main).oninput = debounce(function (e) { f.search = e.target.value; f.page = 1; load(); }, 250);
  $('#slStatus', main).onchange = function (e) { f.status = e.target.value; f.page = 1; load(); };
  if($('#slExportSelected',main))$('#slExportSelected',main).onclick=function(){shopeeSelectedDownloadDialog(selectionInfo);};
  if($('#slClearSelection',main))$('#slClearSelection',main).onclick=function(){SHOPEE_SELECTED=Object.create(null);load();};
  load();
};

function shopeeImportDialog(done) {
  var m = modal('<h3>Unggah template Shopee</h3><p>Pilih file .xlsx dari menu mass edit Shopee. Susunan kolom, petunjuk, dan format asli akan dipertahankan saat diunduh.</p><label class="f">Toko / akun</label><input class="in w100" id="siStore" value="Meirista"><label class="f">Template mass edit (.xlsx)</label><input class="in w100" id="siFile" type="file" accept=".xlsx"><div id="siInfo" class="hint"></div><div id="siError"></div><div class="row" style="margin-top:16px"><button class="btn pri" id="siGo" disabled>Tampilkan & cocokkan SKU</button><button class="btn" data-close id="siCancel">Batal</button></div>');
  var fileState, reading = 0, running = false;
  $('#siFile', m).onchange = function () {
    fileState = null; $('#siGo', m).disabled = true; $('#siError', m).innerHTML = ''; var seq = ++reading, file = this.files[0]; if (!file) return;
    if (!/\.xlsx$/i.test(file.name)) { $('#siError', m).innerHTML = errBox('Gunakan template asli berformat .xlsx.'); return; }
    if (!window.XLSX || !window.JSZip) return toast('Pustaka Excel belum termuat. Muat ulang halaman.', 'err');
    var rd = new FileReader(); rd.onerror = function () { $('#siError', m).innerHTML = errBox('File tidak dapat dibaca.'); };
    rd.onload = function () {
      if (seq !== reading) return;
      try {
        fileState=shopeeReadTemplate(rd.result,file.name);var found={rows:fileState.rows};
        $('#siInfo', m).textContent = fmtNum(found.rows.length) + ' variasi siap dicocokkan dengan master SKU.'; $('#siGo', m).disabled = false;
      } catch (e) { $('#siError', m).innerHTML = errBox(e.message); }
    }; rd.readAsArrayBuffer(file);
  };
  $('#siGo', m).onclick = function () {
    if (running || !fileState) return; var store = $('#siStore', m).value.trim(); if (!store) return toast('Isi toko/akun.', 'err');
    running = true; fileState.store = store; fileState.views = []; var offset = 0;
    ['siGo', 'siFile', 'siStore', 'siCancel'].forEach(function (k) { $('#' + k, m).disabled = true; });
    function next() {
      if (offset >= fileState.rows.length) { SHOPEE_WORKFILE = fileState; m.close(); toast('Template siap diperiksa. Setujui pasangan SKU sebelum mengunduh hasil.', 'ok'); done(); return; }
      $('#siInfo', m).textContent = 'Mencocokkan ' + Math.min(offset, fileState.rows.length) + ' / ' + fileState.rows.length + ' variasi…';
      api('shopee.import', { store: store, fileName: fileState.name, rows: fileState.rows.slice(offset, offset + 150), requestKey: uid() }, { silent: true }).then(function (r) { fileState.views = fileState.views.concat(r.rows); offset += 150; next(); }).catch(function (e) { running = false; ['siGo', 'siFile', 'siStore', 'siCancel'].forEach(function (k) { $('#' + k, m).disabled = false; }); $('#siError', m).innerHTML = errBox(e.message + ' Unggah ulang file yang sama untuk melanjutkan; listing tidak digandakan.'); });
    } next();
  };
}

// Hanya kolom terotorisasi yang diubah. SKU induk diisi bila SELURUH variasi produk
// dalam file sudah disetujui dan mengarah ke satu parent yang sama.
function shopeeExportChanges(file, results) {
  var header;
  // Petunjuk Shopee dapat berada di antara header dan baris data pertama.
  header = file.aoa.slice(0, 20).find(function (r) { return r.some(function (v) { return String(v).trim().toLowerCase() === 'kode produk'; }) && r.some(function (v) { return String(v).trim().toLowerCase() === 'nama produk'; }); });
  var cols = header.map(function (v) { return String(v || '').trim().toLowerCase(); }), index = {}, groups = {}, changes = [];
  results.forEach(function (r) { index[JSON.stringify([String(r.productId), String(r.variationId || '')])] = r; });
  file.rows.forEach(function (r) { (groups[r.productId] = groups[r.productId] || []).push(index[JSON.stringify([r.productId, r.variationId])] || { eligible: false }); });
  function put(row, name, value) { var col = cols.indexOf(name); if (col >= 0) changes.push({ row: row.sourceRow, col: col, value: String(value || '') }); }
  var eligible = 0;
  file.rows.forEach(function (r) {
    var x = index[JSON.stringify([r.productId, r.variationId])]; if (!x || !x.eligible) return; eligible++;
    put(r, 'sku', x.sku); put(r, 'gtin', x.gtin);
    var group = groups[r.productId]; if (x.parentSku && group.every(function (g) { return g.eligible && g.parentSku === x.parentSku; })) put(r, 'sku induk', x.parentSku);
  });
  return { changes: changes, eligible: eligible, unchanged: file.rows.length - eligible };
}

/** Patch XML di dalam ZIP asli, bukan membangun ulang workbook dengan konversi tabel. */
async function shopeePatchWorkbook(file, changes, selectedRows) {
  var zip = await JSZip.loadAsync(file.buffer), parser = new DOMParser(), serializer = new XMLSerializer();
  function parse(text) { var d = parser.parseFromString(text, 'application/xml'); if (d.getElementsByTagName('parsererror').length) throw new Error('Struktur template Excel tidak valid.'); return d; }
  var wb = parse(await zip.file('xl/workbook.xml').async('string'));
  var sheet = Array.from(wb.getElementsByTagNameNS('*', 'sheet')).find(function (s) { return s.getAttribute('name') === file.sheetName; });
  if (!sheet) throw new Error('Lembar produk tidak ditemukan.');
  var id = sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
  var rels = parse(await zip.file('xl/_rels/workbook.xml.rels').async('string'));
  var rel = Array.from(rels.getElementsByTagNameNS('*', 'Relationship')).find(function (r) { return r.getAttribute('Id') === id; });
  if (!rel || rel.getAttribute('TargetMode') === 'External') throw new Error('Referensi lembar tidak didukung.');
  var parts = (rel.getAttribute('Target').charAt(0) === '/' ? rel.getAttribute('Target').slice(1) : 'xl/' + rel.getAttribute('Target')).split('/'), normalized = [];
  parts.forEach(function (p) { if (p === '..') normalized.pop(); else if (p !== '.') normalized.push(p); });
  var path = normalized.join('/'); if (!zip.file(path)) throw new Error('XML lembar produk tidak ditemukan.');
  var doc = parse(await zip.file(path).async('string')), ns = doc.documentElement.namespaceURI, rowIndex = {};
  Array.from(doc.getElementsByTagNameNS(ns, 'row')).forEach(function (r) { rowIndex[r.getAttribute('r')] = r; });
  changes.forEach(function (change) {
    var row = rowIndex[change.row]; if (!row) throw new Error('Baris template hilang: ' + change.row);
    var ref = XLSX.utils.encode_col(change.col) + change.row, cells = Array.from(row.getElementsByTagNameNS(ns, 'c')), cell = cells.find(function (c) { return c.getAttribute('r') === ref; });
    if (!cell) { cell = doc.createElementNS(ns, 'c'); cell.setAttribute('r', ref); var after = cells.find(function (c) { return XLSX.utils.decode_cell(c.getAttribute('r')).c > change.col; }); row.insertBefore(cell, after || null); }
    while (cell.firstChild) cell.removeChild(cell.firstChild);
    cell.setAttribute('t', 'inlineStr'); var is = doc.createElementNS(ns, 'is'), text = doc.createElementNS(ns, 't'); text.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve'); text.textContent = change.value; is.appendChild(text); cell.appendChild(is);
  });
  if(selectedRows){
    var selected=new Set(selectedRows.map(Number)),dataStart=Math.min.apply(null,file.rows.map(function(r){return r.sourceRow;}));
    if(!selected.size||selectedRows.length!==selected.size||selectedRows.some(function(n){return !rowIndex[n]||n<dataStart;}))throw new Error('Pilihan baris template tidak valid.');
    var outputRow=dataStart;
    Array.from(doc.getElementsByTagNameNS(ns,'row')).forEach(function(row){var old=Number(row.getAttribute('r'));if(old<dataStart)return;if(!selected.has(old)){row.parentNode.removeChild(row);return;}
      row.setAttribute('r',String(outputRow));Array.from(row.getElementsByTagNameNS(ns,'c')).forEach(function(cell){var coord=XLSX.utils.decode_cell(cell.getAttribute('r'));cell.setAttribute('r',XLSX.utils.encode_col(coord.c)+outputRow);
        // Mass update membutuhkan nilai snapshot. Bekukan rumus agar referensi baris lama tidak bergeser ke barang lain.
        Array.from(cell.getElementsByTagNameNS(ns,'f')).forEach(function(formula){if(!cell.getElementsByTagNameNS(ns,'v').length)throw new Error('Rumus pada template belum memiliki hasil tersimpan. Simpan ulang file asli di Excel sebelum ekspor.');cell.removeChild(formula);});
      });outputRow++;
    });
    var dimension=doc.getElementsByTagNameNS(ns,'dimension')[0];if(dimension){var range=XLSX.utils.decode_range(dimension.getAttribute('ref'));range.e.r=outputRow-2;Array.from(doc.getElementsByTagNameNS(ns,'c')).forEach(function(cell){range.e.c=Math.max(range.e.c,XLSX.utils.decode_cell(cell.getAttribute('r')).c);});dimension.setAttribute('ref',XLSX.utils.encode_range(range));}
    Array.from(doc.getElementsByTagNameNS(ns,'autoFilter')).forEach(function(filter){var range=XLSX.utils.decode_range(filter.getAttribute('ref'));range.e.r=outputRow-2;filter.setAttribute('ref',XLSX.utils.encode_range(range));});
    // Buang string produk yang tidak ikut diekspor, termasuk salinan yang tersembunyi di sharedStrings.
    if(zip.file('xl/sharedStrings.xml')){
      var shared=parse(await zip.file('xl/sharedStrings.xml').async('string')),strings=Array.from(shared.getElementsByTagNameNS('*','si')),sheets={};sheets[path]=doc;
      var used=new Set(),refs=[];
      for(var sheetPath of Object.keys(zip.files).filter(function(name){return /^xl\/worksheets\/[^/]+\.xml$/.test(name);})){var sheetDoc=sheets[sheetPath]||parse(await zip.file(sheetPath).async('string'));sheets[sheetPath]=sheetDoc;Array.from(sheetDoc.getElementsByTagNameNS('*','c')).forEach(function(cell){if(cell.getAttribute('t')!=='s')return;var v=cell.getElementsByTagNameNS('*','v')[0];if(v){used.add(Number(v.textContent));refs.push(v);}});}
      var ordered=Array.from(used).sort(function(a,b){return a-b;}),remap={};ordered.forEach(function(old,i){if(!strings[old])throw new Error('Referensi string Excel tidak valid.');remap[old]=i;});refs.forEach(function(v){v.textContent=String(remap[Number(v.textContent)]);});
      var root=shared.documentElement;while(root.firstChild)root.removeChild(root.firstChild);ordered.forEach(function(old){root.appendChild(strings[old]);});root.setAttribute('count',String(refs.length));root.setAttribute('uniqueCount',String(ordered.length));zip.file('xl/sharedStrings.xml',serializer.serializeToString(shared));
      Object.keys(sheets).forEach(function(name){zip.file(name,serializer.serializeToString(sheets[name]));});
    }
  }
  zip.file(path, serializer.serializeToString(doc));
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', compression: 'DEFLATE' });
}
</script>
