<script>
/* ═════════════ Registrasi Produk v5 — satu alur, tiga tahap ═════════════
 * 1 Identifikasi Produk → 2 Varian & Barcode → 3 Kemasan & Logistik (opsional) → Simpan.
 * User tidak mengisi kode apa pun: Parent SKU (BRAND-KATEGORI-0001), SKU produk (PARENT_SKU-BARCODE), barcode internal,
 * dan Nama Produk SKU dibentuk otomatis (pratinjau di browser; nilai final ditetapkan server saat disimpan, di dalam lock).
 * Validasi di browser hanya umpan balik cepat; validasi final & penyimpanan atomik ada di server.
 * Isian produk baru tersimpan otomatis sebagai draf di perangkat ini (bukan "Simpan Draft" di server). */

function norm(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9+]/g, ''); }
function titleCase(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase().replace(/(^|\s)\S/g, function (m) { return m.toUpperCase(); }).slice(0, 30); }
function attrKey(attrs) { return (attrs || []).filter(function (a) { return String(a.value || '').trim(); }).map(function (a) { return norm(a.name) + '=' + norm(fmtAttr(a.value)); }).sort().join('|'); }
function cleanBc(s) { return String(s || '').replace(/[\s-]/g, '').replace(/^'/, ''); }
/** Validasi GTIN produsen di browser: angka, panjang 8/12/13/14, check digit, bukan prefix kupon/internal. */
function checkGtin(raw) {
  var c = cleanBc(raw);
  if (!c) return { ok: false, msg: 'GTIN belum diisi' };
  if (!/^\d+$/.test(c)) return { ok: false, msg: 'GTIN hanya angka' };
  if ([8, 12, 13, 14].indexOf(c.length) < 0) return { ok: false, msg: 'Panjang ' + c.length + ' digit (harus 8/12/13/14)' };
  var sum = 0; for (var i = c.length - 2, w = 3; i >= 0; i--, w = w === 3 ? 1 : 3) sum += Number(c[i]) * w;
  var cd = (10 - (sum % 10)) % 10;
  if (cd !== Number(c[c.length - 1])) return { ok: false, msg: 'Check digit salah (seharusnya ' + cd + ')' };
  if (c.length === 13 && (c.indexOf('99') === 0 || (Number(c.slice(0, 3)) >= 981 && Number(c.slice(0, 3)) <= 984))) return { ok: false, msg: 'Prefix kupon, bukan GTIN produk' };
  if (c.length === 13 && (c[0] === '2' || c.indexOf('02') === 0 || c.indexOf('04') === 0)) return { ok: false, msg: 'Prefix 2/02/04 = kode internal, bukan GTIN produsen' };
  return { ok: true, code: c };
}
/** Ekuivalen satuan dasar (konversi bertingkat; satuan isi harus didefinisikan di atasnya). Isi harus > 0. */
function computeEq(base, rows) {
  var eq = {}; eq[base] = 1;
  return rows.map(function (r) {
    var u = normCode(r.unitName), f = Number(r.factor), cu = normCode(r.containsUnit) || base, e = null, err = '';
    if (!/^[A-Z][A-Z0-9]{1,11}$/.test(u)) err = 'Pilih satuan';
    else if (u === base) err = u + ' adalah satuan dasar';
    else if (eq[u] !== undefined) err = 'Satuan ' + u + ' ganda';
    else if (!(f >= 1 && f <= 100000 && Math.floor(f) === f)) err = 'Isi harus bilangan bulat > 0';
    else if (eq[cu] === undefined) err = 'Satuan isi ' + cu + ' belum ada di atasnya';
    else e = f * eq[cu];
    if (u && eq[u] === undefined && e) eq[u] = e;
    return { eq: e, err: err };
  });
}

/* ---- Nama Produk SKU (sama dengan aturan server: Lib.gs buildSkuName) ---- */
var UNIT_FMT = [[/^(ml|mls|mililiter|milliliter)$/i, 'ml'], [/^(l|lt|ltr|liter|litre)$/i, 'L'], [/^(g|gr|grs|grm|gram|grams)$/i, 'g'], [/^(kg|kgs|kilogram|kilograms)$/i, 'kg'], [/^(mg|miligram|milligram)$/i, 'mg'], [/^(oz)$/i, 'oz'], [/^(pcs|pc|pieces?)$/i, 'pcs']];
/** Huruf awal kapital untuk tiap kata yang diketik huruf kecil (sama dengan Lib.gs properCase). */
function properCase(v) {
  var s = String(v === null || v === undefined ? '' : v).replace(/\s+/g, ' ').trim();
  if (!s) return s;
  return s.split(' ').map(function (t, i) { return /[A-Z]/.test(t) || /^(ml|g|gr|kg|mg|oz|pcs|x)$/.test(t) || /^\d/.test(t) || (i > 0 && /^(de|du|la|le|et|of|the|and|with|for|dan|di|ke|untuk|dengan)$/.test(t)) ? t : t.replace(/(^|[-/(&+.])([a-z])/g, function (m, p, c) { return p + c.toUpperCase(); }); }).join(' ');
}
function fmtAttr(v) {
  var s = properCase(v);
  s = s.replace(/(\d)\s*([a-zA-Z]+)\b/g, function (m, d, u) { for (var i = 0; i < UNIT_FMT.length; i++) if (UNIT_FMT[i][0].test(u)) return d + ' ' + UNIT_FMT[i][1]; return m; });
  return s.replace(/\b(ml|L|g|kg|mg|oz|pcs)(\s+\1\b)+/gi, '$1').replace(/\s+/g, ' ').trim();
}
function nameKey(name) {
  var s = String(name || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/[’'`]/g, '').replace(/[^a-z0-9+]+/g, ' ').replace(/(\d)([a-z])/g, '$1 $2');
  [[/\b(mililiter|milliliter|mls?)\b/g, 'ml'], [/\b(liter|litre|ltr|lt)\b/g, 'l'], [/\b(grams?|gram|grm|gr|grs|g)\b/g, 'g'], [/\b(kilograms?|kgs?)\b/g, 'kg'], [/\b(pieces?|pcs?|pc)\b/g, 'pcs']].forEach(function (x) { s = s.replace(x[0], x[1]); });
  return s.replace(/(\d)\s+(ml|l|g|kg|pcs)\b/g, '$1$2').replace(/\s+/g, ' ').trim();
}
function orderAttrs(attrs) {
  var types = (cfg().attributeTypes || []).map(nameKey);
  return (attrs || []).map(function (a, i) { var p = types.indexOf(nameKey(a.name)); return { a: a, i: i, p: p < 0 ? 1000 + i : p }; }).sort(function (x, y) { return x.p - y.p || x.i - y.i; }).map(function (x) { return x.a; });
}
function skuNameOf(brand, parent, attrs) {
  brand = properCase(brand); parent = fmtAttr(parent);
  var parts = [], contains = function (t) { var k = nameKey(t); return !!k && (' ' + nameKey(parts.join(' ')) + ' ').indexOf(' ' + k + ' ') >= 0; };
  var nb = nameKey(brand), np = nameKey(parent);
  if (brand && !(np === nb || np.indexOf(nb + ' ') === 0)) parts.push(brand);
  if (parent && !contains(parent)) parts.push(parent);
  orderAttrs(attrs).forEach(function (a) { var v = fmtAttr(a.value); if (v && !contains(v)) parts.push(v); });
  return parts.join(' ').replace(/\b(\S+)(\s+\1\b)+/gi, '$1').replace(/\s+/g, ' ').trim();
}

var Wiz = {
  st: null, main: null, checks: {}, open3: {},
  key: function () { return 'rpm_wiz5_' + App.me.user.id; },
  defaultBase: function () { var b = cfg().baseUnits || []; return b.indexOf('PCS') >= 0 ? 'PCS' : b[0] || 'PCS'; },
  fresh: function () {
    return { v: 5, step: 1, productId: null, version: null, productCode: '', status: '', single: true, skuFrozen: false, brand: null, category: null, name: '', description: '', imageUrl: '', dataSource: '', baseUnit: Wiz.defaultBase(),
      attrs: [{ name: '', values: [] }], variants: [Wiz.newVariant([])], similar: [], ack: false, errors: {}, savedAt: null, note: '', reqKey: uid(), lookup: null, preview: null };
  },
  newVariant: function (attrs) {
    return { key: uid(), id: null, saved: false, attributes: attrs || [], sku: '', status: 'ACTIVE', savedStatus: '', statusReason: '', barcode: { mode: 'gtin', code: '' }, orig: null, reason: '',
      nameOverride: '', overrideReason: '', savedOverride: '', baseUnit: '', conversions: [], dims: {}, imageUrl: '', imageFileId: '' };
  },
  newConv: function (unit, factor, contains) { return { key: uid(), id: null, saved: false, unitName: unit || '', factor: factor || '', containsUnit: contains || '', isTradeItem: false, tradeSaved: false, sku: '', status: 'ACTIVE', barcode: { mode: 'gtin', code: '' }, orig: null, reason: '' }; },
  dimsFrom: function (list) { var o = {}; (list || []).forEach(function (d) { o[d.unit] = { l: d.lengthCm || '', w: d.widthCm || '', h: d.heightCm || '', wt: d.grossWeightGrams || '', wu: 'g' }; }); return o; },

  open: function (main, arg) {
    arg = arg || {};
    Wiz.main = main; Wiz.checks = {}; Wiz.open3 = {}; Wiz.done = false;
    var src = arg.productId || arg.duplicateOf;
    if (src) {
      main.innerHTML = loadingBox('Memuat produk…');
      return api('product.get', { id: src }).then(function (p) {
        Wiz.st = arg.duplicateOf ? Wiz.fromDuplicate(p) : Wiz.fromProduct(p);
        if (arg.step) Wiz.st.step = Number(arg.step);
        if (arg.addGtin) {
          var s = Wiz.st, names = s.attrs.filter(function (a) { return a.name; }).map(function (a) { return a.name; });
          if (!names.length) names = ['Varian'];
          var nv = Wiz.newVariant(names.map(function (n) { return { name: n, value: '' }; })); nv.barcode = { mode: 'gtin', code: arg.addGtin }; nv.manual = true;
          if (!s.attrs.some(function (a) { return a.name; })) s.attrs = [{ name: 'Varian', values: [] }];
          s.variants.push(nv); s.step = 2; s.note = 'GTIN ' + arg.addGtin + ' ditambahkan sebagai SKU produk baru (baris terakhir). Isi atribut pembedanya, lalu simpan.';
        }
        Wiz.restored = false; Wiz.guard(); Wiz.render();
      }).catch(function (e) { main.innerHTML = errBox(e.message); });
    }
    var draft = null;
    try { draft = JSON.parse(Store.get(Wiz.key()) || 'null'); } catch (e) { draft = null; }
    var useDraft = draft && draft.v === 5 && draft.single !== undefined && !arg.gtin && (draft.name || draft.brand || draft.variants.some(function (v) { return v.barcode.code || v.attributes.length; }));
    Wiz.st = useDraft ? draft : Wiz.fresh();
    Wiz.restored = !!useDraft;
    Wiz.guard();
    Wiz.render();
    if (arg.gtin) { Wiz.placeGtin(cleanBc(arg.gtin)); Wiz.st.note = 'GTIN ' + cleanBc(arg.gtin) + ' sudah dimasukkan ke tahap 2.'; Wiz.render(); }
  },
  guard: function () { App.leaveGuard = function () { var s = Wiz.st; return !s || Wiz.done || !(s.name || s.brand || s.variants.some(function (v) { return v.barcode.code; })); }; },
  persist: debounce(function () { var s = Wiz.st; if (!s || s.productId || Wiz.done) return; s.savedAt = new Date().toISOString(); Store.set(Wiz.key(), JSON.stringify(s)); }, 400),
  attrsFrom: function (variants) {
    var names = [], vals = {};
    variants.forEach(function (v) { v.attributes.forEach(function (a) { if (names.indexOf(a.name) < 0) { names.push(a.name); vals[a.name] = []; } if (vals[a.name].indexOf(a.value) < 0) vals[a.name].push(a.value); }); });
    return names.length ? names.map(function (n) { return { name: n, values: vals[n] }; }) : [{ name: '', values: [] }];
  },
  fromProduct: function (p) {
    var s = Wiz.fresh();
    var bcOf = function (g, i) { return g ? { mode: 'gtin', code: g } : i ? { mode: 'internal', code: i } : { mode: 'none', code: '' }; };
    Object.assign(s, {
      productId: p.id, version: p.version, productCode: p.productCode, status: p.status, single: p.variants.length === 1, skuFrozen: p.skuFrozen, brand: p.brand, category: p.category, name: p.name, baseUnit: p.baseUnit, step: 2,
      description: p.description, imageUrl: p.imageUrl, dataSource: p.dataSource,
      attrs: Wiz.attrsFrom(p.variants),
      variants: p.variants.map(function (v) {
        var b = bcOf(v.gtin, v.internalBarcode);
        return { key: uid(), id: v.id, saved: true, attributes: v.attributes, sku: v.sku, status: v.status, savedStatus: v.status, statusReason: '', barcode: Object.assign({}, b), orig: b, reason: '',
          nameOverride: v.nameOverride || '', overrideReason: '', savedOverride: v.nameOverride || '', baseUnit: v.baseUnit, dims: Wiz.dimsFrom(v.dimensions), imageUrl: v.imageUrl || '', imageFileId: '',
          conversions: v.conversions.filter(function (c) { return !c.isBaseUnit; }).map(function (c) {
            var cb = bcOf(c.gtin, c.internalBarcode);
            return { key: uid(), id: c.id, saved: true, unitName: c.unitName, factor: c.factor, containsUnit: c.containsUnit, isTradeItem: c.isTradeItem, tradeSaved: c.isTradeItem, sku: c.sku, status: c.status, barcode: Object.assign({}, cb.mode === 'none' ? { mode: 'gtin', code: '' } : cb), orig: cb, reason: '' };
          }) };
      })
    });
    return s;
  },
  /** Duplikat produk: salin brand, kategori, atribut, kemasan & dimensi — TANPA ID, SKU, atau barcode. */
  fromDuplicate: function (p) {
    var s = Wiz.fresh();
    var act = p.variants.filter(function (v) { return v.status === 'ACTIVE' || v.status === 'DRAFT'; });
    Object.assign(s, {
      brand: p.brand.status === 'ACTIVE' ? p.brand : null, category: p.category.status === 'ACTIVE' ? p.category : null, name: p.name, baseUnit: p.baseUnit, step: 1, description: p.description,
      attrs: Wiz.attrsFrom(act),
      note: 'Duplikat dari ' + p.name + ' (' + p.productCode + '). ID, SKU, dan barcode tidak disalin — ubah nama/atribut, lalu isi GTIN masing-masing varian.',
      variants: act.map(function (v) {
        var nv = Wiz.newVariant(v.attributes.map(function (a) { return { name: a.name, value: a.value }; }));
        nv.baseUnit = v.baseUnit; nv.dims = Wiz.dimsFrom(v.dimensions);
        nv.conversions = v.conversions.filter(function (c) { return !c.isBaseUnit && c.status === 'ACTIVE'; }).map(function (c) { var n = Wiz.newConv(c.unitName, c.factor, c.containsUnit); n.isTradeItem = c.isTradeItem; return n; });
        return nv;
      })
    });
    if (!s.variants.length) s.variants = [Wiz.newVariant([])];
    return s;
  },

  /* ---------- turunan ---------- */
  vBase: function (v) { return v.baseUnit || Wiz.st.baseUnit || 'PCS'; },
  convCalc: function (v) { return computeEq(Wiz.vBase(v), v.conversions.filter(function (c) { return c.status === 'ACTIVE'; })); },
  isDraft: function () { return !Wiz.st.productId || Wiz.st.status === 'DRAFT'; },
  hasAttrs: function () { return Wiz.st.variants.length > 1 || Wiz.st.variants.some(function (v) { return v.attributes.some(function (a) { return String(a.value).trim(); }); }); },
  autoName: function (v) { var s = Wiz.st; return skuNameOf(s.brand ? s.brand.name : '', s.name, v.attributes.filter(function (a) { return String(a.value).trim(); })); },
  displayName: function (v) { return v.nameOverride || Wiz.autoName(v); },
  parentSku: function () {
    var s = Wiz.st;
    return s.productCode || (s.preview && s.preview.parentSku) || 'PRD……';
  },
  /** Pratinjau urutan Kode SKU Produk baris baru (nilai final dialokasikan server saat disimpan). */
  childSeq: function (v) {
    var s = Wiz.st, max = 0;
    s.variants.forEach(function (x) { var m = /-(\d{3,})$/.exec(x.sku || ''); if (x.saved && m) max = Math.max(max, Number(m[1])); });
    var fresh = s.variants.filter(function (x) { return !x.saved; });
    return String(max + fresh.indexOf(v) + 1).padStart(3, '0');
  },
  childSku: function (v) {
    if (v.saved && v.sku) return v.sku;
    return Wiz.parentSku() + '-' + Wiz.childSeq(v);
  },
  pkBadge: function (v) { return Wiz.dimComplete(v) ? '<span class="badge b-GTIN">Data kemasan lengkap</span>' : '<span class="badge b-NONE">Data kemasan belum lengkap</span>'; },
  dimComplete: function (v) { var d = v.dims[Wiz.vBase(v)]; return !!(d && Number(d.l) > 0 && Number(d.w) > 0 && Number(d.h) > 0 && Number(d.wt) > 0); },
  bcState: function (row, target) {
    var b = row.barcode, chk = Wiz.checks[target];
    if (b.mode === 'none' || (b.mode === 'gtin' && !b.code)) return { cls: 'NONE', txt: 'GTIN belum didata' };
    if (b.mode === 'internal') return { cls: 'INTERNAL', txt: row.orig && row.orig.mode === 'internal' && (!b.code || b.code === row.orig.code) ? 'Barcode internal' : 'Internal (dibuat saat simpan)' };
    var g = checkGtin(b.code);
    if (!g.ok) return { cls: 'ERR', txt: g.msg };
    if (Wiz.dupBarcode(g.code) > 1) return { cls: 'ERR', txt: 'GTIN dipakai baris lain' };
    if (chk && chk.code === g.code && chk.state === 'err') return { cls: 'ERR', txt: chk.msg };
    if (chk && chk.code === g.code && chk.state === 'checking') return { cls: 'CHECK', txt: 'Memeriksa…' };
    return { cls: 'GTIN', txt: 'GTIN valid' };
  },
  dupBarcode: function (code) {
    var n = 0;
    Wiz.st.variants.forEach(function (v) {
      if (v.barcode.mode === 'gtin' && cleanBc(v.barcode.code) === code) n++;
      v.conversions.forEach(function (c) { if (c.isTradeItem && c.status === 'ACTIVE' && c.barcode.mode === 'gtin' && cleanBc(c.barcode.code) === code) n++; });
    });
    return n;
  },
  bcChanged: function (row) { return row.orig && row.orig.mode !== 'none' && !(row.barcode.mode === row.orig.mode && cleanBc(row.barcode.code) === row.orig.code) && !(row.barcode.mode === 'internal' && row.orig.mode === 'internal' && !row.barcode.code); },

  /* ---------- error dari server ---------- */
  fe: function (path) { var m = Wiz.st.errors[path]; return m ? '<div class="fe" data-fe="' + esc(path) + '">' + icon('alertCircle') + '<span>' + esc(m) + '</span></div>' : ''; },
  errCls: function (path) { return Wiz.st.errors[path] ? ' err' : ''; },
  clearErr: function (path) { if (Wiz.st.errors[path]) { delete Wiz.st.errors[path]; var el = $('[data-fe="' + path + '"]', Wiz.main); if (el) el.remove(); Wiz.renderSide(); } },
  stepOf: function (path) { return /^variants\.\d+\.(conversions|dimensions|baseUnit)/.test(path) ? 3 : /^variants/.test(path) ? 2 : path === 'baseUnit' ? 3 : 1; },
  pathLabel: function (path) {
    var s = Wiz.st, m = /^variants\.(\d+)(?:\.(conversions|dimensions)\.(\d+))?(?:\.(\w+))?/.exec(path);
    var F = { imageUrl: 'Foto', brandId: 'Brand', categoryId: 'Kategori', name: 'Nama Produk Induk', baseUnit: 'Satuan dasar', attributes: 'Atribut', barcode: 'GTIN / barcode', unitName: 'Satuan', factor: 'Isi', containsUnit: 'Satuan referensi', status: 'Status', isTradeItem: 'Identitas kemasan', nameOverride: 'Nama Produk SKU', lengthCm: 'Panjang', widthCm: 'Lebar', heightCm: 'Tinggi', weight: 'Berat', unit: 'Satuan' };
    if (!m) return 'Identifikasi · ' + (F[path] || path);
    var v = s.variants[Number(m[1])];
    var vl = 'Varian ' + (Number(m[1]) + 1) + (v ? ' (' + Wiz.displayName(v) + ')' : '');
    if (m[2]) return vl + ' · ' + (m[2] === 'conversions' ? 'Kemasan ' : 'Dimensi ') + (Number(m[3]) + 1) + (m[4] ? ' · ' + (F[m[4]] || m[4]) : '');
    return vl + (m[4] ? ' · ' + (F[m[4]] || m[4]) : '');
  },

  /* ---------- kerangka ---------- */
  render: function () {
    var s = Wiz.st, main = Wiz.main;
    var steps = ['Identifikasi Produk', 'Varian & Barcode', 'Kemasan & Logistik'];
    var bad = [0, 0, 0, 0]; Object.keys(s.errors).forEach(function (p) { bad[Wiz.stepOf(p)]++; });
    main.innerHTML = pageHead(s.productId ? 'Edit produk · ' + s.productCode : 'Master data', s.productId ? (s.brand ? s.brand.name + ' ' : '') + s.name : 'Registrasi Produk',
      s.productId ? '<button class="btn" id="wz-cancel">' + icon('x') + 'Batal</button>' : (Wiz.restored ? '<button class="btn ghost" id="wz-reset">' + icon('refresh') + 'Mulai dari awal</button>' : ''),
      s.productId ? (s.skuFrozen ? 'SKU terkunci' : 'Draft') : '') +
      (s.note ? '<div class="info-box" style="margin:-8px 0 14px">' + icon('copy') + '<span>' + esc(s.note) + '</span></div>' : '') +
      (Wiz.restored && !s.productId ? '<div class="info-box" style="margin:-8px 0 14px">' + icon('clock') + '<span>Melanjutkan isian terakhir' + (s.savedAt ? ' · ' + fmtDate(s.savedAt) : '') + '</span></div>' : '') +
      '<div class="stepper s3">' + steps.map(function (n, i) {
        var k = i + 1; return '<button class="stp' + (s.step === k ? ' on' : s.step > k ? ' done' : '') + (bad[k] ? ' bad' : '') + '" data-step="' + k + '"><span class="n">' + (bad[k] ? '!' : s.step > k ? '✓' : k) + '</span><span><span class="k">' + (k === 3 ? 'Opsional' : 'Tahap ' + k) + '</span><span class="v">' + n + '</span><span class="vs">' + ['Produk', 'Varian', 'Kemasan'][i] + '</span></span></button>';
      }).join('') + '</div>' +
      '<div class="wz-grid"><div id="wz-body"></div><aside class="wz-side" id="wz-side"></aside></div>';
    $$('[data-step]', main).forEach(function (b) { b.onclick = function () { Wiz.goStep(Number(b.getAttribute('data-step'))); }; });
    if ($('#wz-cancel', main)) $('#wz-cancel', main).onclick = function () { Wiz.done = true; App.go('product', s.productId, { force: true }); };
    if ($('#wz-reset', main)) $('#wz-reset', main).onclick = function () { ask('Hapus isian ini dan mulai registrasi baru?', 'Mulai baru', true).then(function (y) { if (y) { Store.del(Wiz.key()); Wiz.restored = false; Wiz.st = Wiz.fresh(); Wiz.render(); } }); };
    var body = $('#wz-body', main);
    if (s.step === 1) Wiz.step1(body); else if (s.step === 2) Wiz.step2(body); else Wiz.step3(body);
    Wiz.renderSide();
    Wiz.persist();
  },
  goStep: function (k) {
    var s = Wiz.st;
    if (k > s.step) {
      for (var i = s.step; i < k; i++) { var issues = Wiz.issues(i); if (issues.length) { toast(issues[0], 'err'); if (i !== s.step) { s.step = i; Wiz.render(); } return; } }
    }
    s.step = k; Wiz.render(); window.scrollTo(0, 0);
  },
  /** Pemeriksaan cepat sebelum pindah tahap / simpan (server tetap memvalidasi ulang). */
  issues: function (step) {
    var s = Wiz.st, out = [];
    if (step === 1) {
      if (!s.brand) out.push('Pilih Brand');
      if (!s.category) out.push('Pilih Kategori Produk');
      if (String(s.name).trim().length < 3) out.push('Nama Produk Parent minimal 3 karakter');
    }

        $('[data-rm]', row).onclick = function () {
          if (!c.saved) { v.conversions.splice(j, 1); s.errors = {}; return redraw(); }
          if (c.tradeSaved) { c.status = c.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'; Wiz.clearErr(p + '.status'); return redraw(); }
          ask('Hapus satuan ' + c.unitName + ' dari varian ini? Tercatat di audit log.', 'Hapus', true).then(function (y) { if (y) { c.status = 'DELETED'; Wiz.clearErr(p + '.status'); redraw(); } });
        };
      });
      $('[data-add]', card).onclick = function () {
        var used = v.conversions.filter(function (c) { return c.status === 'ACTIVE'; }).map(function (c) { return c.unitName; });
        var last = used[used.length - 1];
        var order = ['INNER', 'BOX', 'KARTON'].concat(cfg().packUnits || []);
        var next = order.find(function (u) { return used.indexOf(u) < 0 && (cfg().packUnits || []).indexOf(u) >= 0; }) || '';
        v.conversions.push(Wiz.newConv(next, '', last || Wiz.vBase(v))); redraw();
      };
      var cp = $('[data-copy]', card);
      if (cp) cp.onclick = function () {
        var src = v.conversions.filter(function (c) { return c.status === 'ACTIVE'; });
        ask('Terapkan satuan, ' + src.length + ' tingkat kemasan' + (src.length ? ' (' + src.map(function (c) { return c.unitName + ' isi ' + c.factor + ' ' + (c.containsUnit || Wiz.vBase(v)); }).join(', ') + ')' : '') + ', serta dimensi & berat ke semua varian lain? Kemasan yang sudah tersimpan di varian lain tidak diubah.', 'Terapkan').then(function (y) {
          if (!y) return;
          s.variants.forEach(function (o) {
            if (o === v || (o.status !== 'ACTIVE' && o.status !== 'DRAFT')) return;
            if (!o.conversions.some(function (c) { return c.saved && c.status !== 'DELETED'; })) o.baseUnit = v.baseUnit;
            var savedNames = o.conversions.filter(function (c) { return c.saved && c.status !== 'DELETED'; }).map(function (c) { return c.unitName; });
            o.conversions = o.conversions.filter(function (c) { return c.saved; }).concat(src.filter(function (c) { return savedNames.indexOf(c.unitName) < 0; }).map(function (c) { return Wiz.newConv(c.unitName, c.factor, c.containsUnit); }));
            o.dims = JSON.parse(JSON.stringify(v.dims));
          });
          s.errors = {}; toast('Diterapkan ke semua varian', 'ok'); Wiz.renderConvs(); Wiz.renderSide(); Wiz.persist();
        });
      };
    });
    Wiz.updateStatus();
  },

  /** Barcode-first: scan GTIN → cek internal → (Open Beauty Facts) → usulan auto-fill untuk direview. */
  lookup: function (raw) {
    var s = Wiz.st, el = $('#wz-gl', Wiz.main);
    if (el) el.innerHTML = loadingBox('Mencari ' + raw + ' di master' + (cfg().gtinLookup ? ' & Open Beauty Facts' : '') + '…');
    api('gtin.lookup', { gtin: raw }, { silent: true }).then(function (r) {
      s.lookup = r;
      if (r.valid && r.stage !== 'internal') Wiz.placeGtin(r.gtin);
      Wiz.render();
    }).catch(function (e) { if (el) el.innerHTML = errBox(e.message); });
  },
  /** Masukkan GTIN hasil scan ke baris SKU produk pertama yang belum punya barcode. */
  placeGtin: function (code) {
    var s = Wiz.st;
    if (s.variants.some(function (x) { return x.barcode.mode === 'gtin' && cleanBc(x.barcode.code) === code; })) return;
    var v = s.variants.find(function (x) { return !x.saved && x.barcode.mode !== 'internal' && !x.barcode.code; });
    if (!v) { v = Wiz.newVariant(Wiz.attrCols().map(function (n) { return { name: n, value: '' }; })); v.manual = true; s.variants.push(v); }
    v.barcode = { mode: 'gtin', code: code };
  },
  renderLookup: function () {
    var s = Wiz.st, el = $('#wz-gl', Wiz.main), r = s.lookup;
    if (!el || !r) return;
    if (r.stage === 'internal') {
      el.innerHTML = '<div class="gl found"><div class="gl-h">' + icon('check') + '<div><div class="t">Sudah terdaftar — jangan buat produk baru</div><div class="muted">Kode ' + esc(r.gtin) + ' sudah dipakai SKU produk di bawah. Buka produknya untuk melihat atau menambah varian.</div></div><button class="btn sm ghost right" id="gx">Tutup</button></div><div class="scan-res" id="gr"></div></div>';
      renderScan($('#gr', el), r.internal);
    } else if (r.stage === 'invalid') {
      el.innerHTML = '<div class="gl manual"><div class="gl-h">' + icon('alert') + '<div><div class="t">' + esc(r.gtin) + ' bukan GTIN produsen yang valid</div><div class="muted">' + esc(r.message || '') + '. Kode ini tidak dipakai sebagai GTIN resmi. Bila barang tidak punya GTIN, pilih <b>Tidak Memiliki GTIN</b> di tahap 2.</div></div><button class="btn sm ghost right" id="gx">Tutup</button></div></div>';
    } else if (r.stage === 'external' && r.suggestion) {
      var g = r.suggestion, x = r.external;
      el.innerHTML = '<div class="gl"><div class="gl-h">' + (g.imageUrl ? '<img class="thumb" src="' + esc(g.imageUrl) + '" alt="" onerror="this.remove()">' : icon('sparkles')) + '<div class="grow"><div class="t">Usulan isian untuk GTIN ' + esc(r.gtin) + '</div><div class="muted">Belum ada di master. Data internet hanya usulan — periksa & edit sebelum menyimpan.</div></div><button class="btn sm ghost" id="gx">Abaikan</button></div>' +
        '<div class="gl-grid"><div>Nama</div><div><b>' + esc(g.name || '—') + '</b></div><div></div>' +
        '<div>Brand</div><div>' + (g.brand ? esc(g.brand.name) : '<span class="muted">' + (g.brandText ? '"' + esc(g.brandText) + '" belum ada di Master Brand' : 'tidak terdeteksi') + '</span>') + '</div><div>' + (!g.brand && g.brandText && can('master.write') ? '<button class="btn sm ghost" id="gnb">Tambah brand</button>' : '') + '</div>' +
        '<div>Kategori</div><div>' + (g.category ? esc(g.category.name) : '<span class="muted">' + (g.categoryText ? 'tidak cocok: ' + esc(g.categoryText) : 'tidak terdeteksi') + '</span>') + '</div><div></div>' +
        '<div>Ukuran</div><div>' + (g.attributes.length ? g.attributes.map(function (a) { return '<span class="attr-pill"><i>' + esc(a.name) + '</i>' + esc(a.value) + '</span>'; }).join('') : '<span class="muted">tidak terdeteksi</span>') + '</div><div></div></div>' +
        (g.similarParents.length ? '<div class="warn-box">' + icon('alert') + '<span>Produk induk yang mirip sudah ada: ' + g.similarParents.map(function (p) { return '<a class="link-btn" data-pp="' + esc(p.id) + '">' + esc(p.name) + ' (' + esc(p.productCode) + ')</a>'; }).join(', ') + '. Bila ini variannya, tambahkan GTIN sebagai varian di produk tersebut.</span></div>' : '') +
        '<div class="row" style="margin-top:10px"><button class="btn pri" id="gapply">' + icon('check') + 'Pakai usulan</button><span class="gl-src">Sumber: ' + esc(x.providerLabel) + (x.cached ? ' (cache)' : '') + ' · ' + fmtDate(x.fetchedAt) + ' · ' + esc(x.license || '') + (x.url ? ' · <a href="' + esc(x.url) + '" target="_blank" rel="noopener">lihat sumber</a>' : '') + '</span></div></div>';
      $('#gapply', el).onclick = function () { Wiz.applySuggestion(r); };
      $$('[data-pp]', el).forEach(function (a) { a.onclick = function () { Wiz.done = true; App.go('register', { productId: a.getAttribute('data-pp'), addGtin: r.gtin }, { force: true }); }; });
      if ($('#gnb', el)) $('#gnb', el).onclick = function () { busy($('#gnb', el), api('brand.create', { name: g.brandText }, { silent: true })).then(function (b) { Ref.drop('brand'); g.brand = { id: b.id, name: b.name }; toast('Brand ' + b.name + ' ditambahkan', 'ok'); Wiz.renderLookup(); }).catch(function (e) { toast(e.message, 'err'); }); };
    } else {
      var x2 = r.external || {};
      el.innerHTML = '<div class="gl manual"><div class="gl-h">' + icon('search') + '<div><div class="t">GTIN ' + esc(r.gtin) + ' belum terdaftar</div><div class="muted">' + esc(x2.status === 'NOT_FOUND' ? 'Tidak ditemukan di ' + (x2.providerLabel || 'penyedia eksternal') + '.' : x2.message || 'Pencarian eksternal tidak tersedia.') + ' GTIN sudah dimasukkan ke tahap 2 — lanjutkan isi manual.</div></div><button class="btn sm ghost right" id="gx">Tutup</button></div></div>';
    }
    var gx = $('#gx', el); if (gx) gx.onclick = function () { s.lookup = null; el.innerHTML = ''; };
  },
  /** Terapkan usulan (user tetap bisa mengedit semuanya sebelum menyimpan). Nama Parent disimpan tanpa brand. */
  applySuggestion: function (r) {
    var s = Wiz.st, g = r.suggestion;
    if (g.brand) s.brand = g.brand;
    if (g.category) s.category = g.category;
    if (g.name) {
      var nm = String(g.name).replace(/\s+/g, ' ').trim(), bn = s.brand ? s.brand.name : g.brandText || '';
      if (bn && nameKey(nm).indexOf(nameKey(bn) + ' ') === 0) nm = nm.split(' ').slice(bn.split(' ').length).join(' ');
      s.name = nm.charAt(0).toUpperCase() + nm.slice(1);
    }
    if (g.imageUrl) s.imageUrl = g.imageUrl;
    s.dataSource = g.dataSource;
    if (g.attributes.length) {
      var v = s.variants.find(function (x) { return x.barcode.code === r.gtin; });
      g.attributes.forEach(function (a) {
        var at = s.attrs.find(function (x) { return titleCase(x.name) === a.name; });
        if (!at) { at = s.attrs[0] && !s.attrs[0].name ? s.attrs[0] : null; if (at) at.name = a.name; else { at = { name: a.name, values: [] }; s.attrs.push(at); } }
        if (at.values.indexOf(a.value) < 0) at.values.push(a.value);
        if (v) { var va = v.attributes.find(function (x) { return x.name === a.name; }); if (va) va.value = a.value; else v.attributes.push({ name: a.name, value: a.value }); }
      });
    }
    s.lookup = null; s.step = 1;
    toast('Usulan diterapkan — periksa sebelum menyimpan', 'ok');
    Wiz.check();
    Wiz.render();
  },

  /* ---------- panel ringkasan samping ---------- */
  renderSide: function () {
    var s = Wiz.st, side = $('#wz-side', Wiz.main); if (!side || !s) return;
    var act = s.variants.filter(function (v) { return v.status === 'ACTIVE' || v.status === 'DRAFT'; });
    var stat = { GTIN: 0, INTERNAL: 0, NONE: 0, ERR: 0 };
    if (Wiz.isSingle()) act = act.slice(0, 1);
    act.forEach(function (v) { var b = Wiz.bcState(v, String(s.variants.indexOf(v))).cls; b = b === 'CHECK' ? 'GTIN' : b; stat[b] = (stat[b] || 0) + 1; });
    var packs = 0; s.variants.forEach(function (v) { v.conversions.forEach(function (c) { if (c.status === 'ACTIVE') packs++; }); });
    var dimOk = act.filter(function (v) { return Wiz.dimComplete(v); }).length;
    var errs = Object.keys(s.errors);
    var newP = !s.productId;
    side.innerHTML = '<div class="panel"><div class="panel-h"><h3>Ringkasan</h3>' + (s.status ? badge(s.status) : '') + '</div><div class="sum-kv">' +
      '<div>Produk induk</div><div>' + (s.name ? '<b>' + esc(skuNameOf(s.brand ? s.brand.name : '', s.name, [])) + '</b>' : '<span class="muted">—</span>') + '</div>' +
      '<div>Kode induk</div><div class="sku">' + esc(Wiz.parentSku()) + '</div>' +
      '<div>SKU produk</div><div>' + act.length + (Wiz.isSingle() ? ' (tanpa variasi)' : '') + '</div>' +
      '<div>Barcode</div><div>' + stat.GTIN + ' GTIN · ' + stat.INTERNAL + ' internal' + (stat.NONE ? ' · <span style="color:var(--warn)">' + stat.NONE + ' GTIN belum didata</span>' : '') + (stat.ERR ? ' · <span style="color:var(--err)">' + stat.ERR + ' bermasalah</span>' : '') + '</div>' +
      '<div>Satuan terkecil</div><div>' + esc(s.variants[0] ? Wiz.vBase(s.variants[0]) : s.baseUnit) + '</div>' +
      '<div>Foto</div><div>' + act.filter(function (v) { return v.imageUrl; }).length + '/' + act.length + '</div>' +
      '<div>Kemasan</div><div>' + (packs ? packs + ' satuan' : '<span class="muted">tidak ada (opsional)</span>') + '</div>' +
      '<div>Data logistik</div><div>' + dimOk + '/' + act.length + ' lengkap' + (dimOk < act.length ? ' <span class="muted">(opsional)</span>' : '') + '</div></div>' +
      (s.similar.length ? '<div class="warn-box">' + icon('alert') + '<span>' + s.similar.length + ' Produk induk mirip.' + (s.ack ? ' <b>Dikonfirmasi berbeda.</b>' : ' Konfirmasi di tahap 1.') + '</span></div>' : '') +
      (errs.length ? '<div class="sect" style="margin:14px 0 4px;color:var(--err)">' + errs.length + ' masalah perlu diperbaiki</div><ul class="err-list">' + errs.slice(0, 30).map(function (p) { return '<li data-ep="' + esc(p) + '">' + icon('alertCircle') + '<div><small>' + esc(Wiz.pathLabel(p)) + '</small>' + esc(s.errors[p]) + '</div></li>'; }).join('') + '</ul>' : '') +
      (s.step > 1 ? '<button class="btn pri w100" id="sv" style="margin-top:14px;height:44px">' + icon('check') + (newP ? 'Simpan Produk' : 'Simpan Perubahan') + '</button>' + (newP ? '<button class="btn w100" id="svd" style="margin-top:8px">Simpan Draft</button>' : '') : '') + '</div>' +
      '';
    $$('[data-ep]', side).forEach(function (li) { li.onclick = function () { var p = li.getAttribute('data-ep'), k = Wiz.stepOf(p); if (k !== s.step) { s.step = k; Wiz.render(); } var el = $('[data-fe="' + p + '"]', Wiz.main); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }; });
    if ($('#sv', side)) $('#sv', side).onclick = function () { Wiz.save($('#sv', side)); };
    if ($('#svd', side)) $('#svd', side).onclick = function () { Wiz.save($('#svd', side), false, true); };
  },

  /* ---------- simpan ---------- */
  payload: function () {
    var s = Wiz.st;
    return {
      productId: s.productId || undefined, version: s.version || undefined,
      brandId: s.brand && s.brand.id, categoryId: s.category && s.category.id, name: s.name, baseUnit: s.baseUnit, acknowledgeSimilar: s.ack,
      description: s.description, imageUrl: s.imageUrl, dataSource: s.dataSource,
      variants: (Wiz.isSingle() ? s.variants.slice(0, 1) : s.variants).map(function (v) {
        var base = Wiz.vBase(v);
        var units = [base].concat(v.conversions.filter(function (c) { return c.status === 'ACTIVE' && c.unitName; }).map(function (c) { return c.unitName; }));
        return { id: v.id || undefined, attributes: v.attributes.filter(function (a) { return String(a.value).trim(); }), status: v.status,
          barcode: v.barcode.mode === 'gtin' && !cleanBc(v.barcode.code) ? { mode: 'none' } : { mode: v.barcode.mode, code: v.barcode.code }, barcodeChangeReason: v.reason, statusReason: v.statusReason,
          nameOverride: v.nameOverride, nameOverrideReason: v.overrideReason, baseUnit: v.baseUnit || s.baseUnit, imageUrl: v.imageUrl || '', imageFileId: v.imageFileId || '',
          conversions: v.conversions.filter(function (c) { return c.saved || c.status === 'ACTIVE'; }).map(function (c) { return { id: c.id || undefined, unitName: c.unitName, factor: Number(c.factor), containsUnit: c.containsUnit || base, isTradeItem: !!c.isTradeItem, status: c.status, barcode: c.isTradeItem ? { mode: c.barcode.mode, code: c.barcode.code } : { mode: 'none' }, barcodeChangeReason: c.reason }; }),
          dimensions: units.filter(function (u) { return v.dims[u]; }).map(function (u) { var d = v.dims[u]; return { unit: u, lengthCm: d.l, widthCm: d.w, heightCm: d.h, weight: d.wt, weightUnit: d.wu || 'g' }; }) };
      })
    };
  },
  save: function (btn, dryRun, asDraft) {
    var s = Wiz.st;
    for (var k = 1; k <= 3; k++) { var iss = Wiz.issues(k); if (iss.length) { toast(iss[0], 'err'); if (s.step !== k) { s.step = k; Wiz.render(); } return; } }
    if (s.similar.length && !s.ack && !dryRun) { toast('Ada Produk induk mirip. Tambahkan varian ke Parent tersebut, atau centang "Lanjutkan — ini produk induk yang berbeda".', 'warn'); if (s.step !== 1) { s.step = 1; Wiz.render(); } return; }
    s.variants.forEach(function (v) { v.conversions = v.conversions.filter(function (c) { return c.saved || c.status === 'ACTIVE'; }); });
    var input = Wiz.payload();
    if (asDraft) input.saveAsDraft = true;
    // requestKey: kirim ulang / klik ganda tidak menyimpan dua kali (server mengembalikan hasil pertama)
    busy(btn, api(dryRun ? 'product.validate' : 'product.save', { input: input, requestKey: dryRun ? undefined : s.reqKey + (s.productId ? ':' + s.version : '') + (asDraft ? ':d' : '') }, { silent: true })).then(function (d) {
      s.errors = {};
      if (dryRun) { Wiz.renderSide(); return toast('Data valid — ' + d.variants.length + ' SKU produk siap disimpan', 'ok'); }
      Wiz.done = true; App.leaveGuard = null;
      if (!s.productId) Store.del(Wiz.key());
      Wiz.success(d, !!s.productId);
    }).catch(function (e) {
      if (e.code === 'VALIDATION_FAILED' || e.code === 'SIMILAR_EXISTS') {
        s.errors = {};
        if (e.code === 'SIMILAR_EXISTS') { s.similar = e.details.map(function (d) { return d.data; }).filter(Boolean); s.ack = false; toast(e.message, 'warn'); s.step = 1; Wiz.render(); return; }
        e.details.forEach(function (d) { var p = d.path || 'variants'; if (!s.errors[p]) s.errors[p] = d.message; });
        toast(e.message, 'err');
        s.step = Math.min.apply(null, Object.keys(s.errors).map(Wiz.stepOf));
        Wiz.render();
        var el = $('.fe', Wiz.main); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else if (e.code === 'STALE_VERSION') {
        ask(e.message + ' Muat ulang data produk sekarang? (perubahan yang belum disimpan hilang)', 'Muat ulang').then(function (y) { if (y) { Wiz.done = true; App.go('register', { productId: s.productId }, { force: true }); } });
      } else toast(e.message, 'err');
    });
  },
  success: function (d, edited) {
    var rows = [];
    d.variants.forEach(function (v) { rows.push([v.sku, v.skuName, v.gtin || v.internalBarcode || 'GTIN belum didata', v.gtin ? 'GTIN' : v.internalBarcode ? 'Internal' : '', v.packagingComplete]); v.conversions.forEach(function (c) { if (c.sku) rows.push([c.sku, v.skuName + ' · ' + c.unitName + ' isi ' + c.baseUnitEquivalent, c.gtin || c.internalBarcode || '—', 'Kemasan', null]); }); });
    var draft = d.status === 'DRAFT', incomplete = d.variants.filter(function (v) { return !v.packagingComplete && (v.status === 'ACTIVE' || v.status === 'DRAFT'); }).length;
    Wiz.main.innerHTML = '<div class="success"><div class="ring">' + icon('check') + '</div><div class="eyebrow">Kode Produk Induk ' + esc(d.productCode) + ' · ' + esc(STATUS_TXT[d.status] || d.status) + '</div><h2>' + (edited ? 'Perubahan tersimpan' : draft ? 'Draft tersimpan' : 'Produk tersimpan') + '</h2>' +
      '<p class="muted">' + esc(d.displayName || d.name) + ' · ' + d.variants.length + ' Kode SKU Produk. ' + (edited ? '' : draft ? 'Draft — aktifkan dari halaman detail bila sudah lengkap.' : '') + (incomplete ? ' <span class="badge b-NONE">Data kemasan belum lengkap: ' + incomplete + '</span>' : '') + '</p>' +
      '<div class="tbl-x" style="text-align:left;margin:16px 0"><table class="t"><thead><tr><th>Kode SKU Produk</th><th>Nama Produk</th><th>Barcode</th><th>Data kemasan</th></tr></thead><tbody>' + rows.slice(0, 60).map(function (r) { return '<tr><td class="sku">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="code">' + esc(r[2]) + ' <span class="muted">' + esc(r[3]) + '</span></td><td>' + (r[4] === null ? '' : r[4] ? badge('GTIN', 'Lengkap') : badge('NONE', 'Belum lengkap')) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="row" style="justify-content:center"><button class="btn pri" id="s2">' + icon('plus') + 'Registrasi produk lain</button><button class="btn" id="s1">' + icon('package') + 'Lihat produk</button>' + (incomplete ? '<button class="btn" id="s4">' + icon('boxes') + 'Lengkapi kemasan</button>' : '') + '</div></div>';
    toast(edited ? 'Perubahan produk tersimpan' : 'Produk ' + (d.displayName || d.name) + ' tersimpan', 'ok');
    $('#s1', Wiz.main).onclick = function () { App.go('product', d.id); };
    $('#s2', Wiz.main).onclick = function () { App.go('register', {}, { force: true }); };
    if ($('#s4', Wiz.main)) $('#s4', Wiz.main).onclick = function () { App.go('register', { productId: d.id, step: 3 }, { force: true }); };
    setTimeout(function () { var b = $('#s2', Wiz.main); if (b) b.focus(); }, 50);
  }
};
Pages.register = function (main, arg) {
  Wiz.open(main, arg);
};
</script>
