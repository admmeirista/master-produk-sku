<script>
/* ═════════════ Registrasi Produk: Identifikasi → Varian → Satuan & Konversi → Simpan Produk ═════════════
 * Validasi di browser hanya membantu (umpan balik cepat). Validasi final & penyimpanan atomik tetap di server.
 * Isian produk baru disimpan otomatis sebagai draf di perangkat ini (localStorage) sampai produk tersimpan. */

/* ---- aturan yang sama dengan server (Lib.gs) untuk pratinjau ---- */
var UNIT_WORDS = { ML: 1, L: 1, LT: 1, LTR: 1, G: 1, GR: 1, GRAM: 1, KG: 1, MG: 1, OZ: 1, CC: 1, PCS: 1, PC: 1 };
function asciiUp(s) { return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toUpperCase(); }
function attrValueCode(v) {
  var up = asciiUp(v), num = up.match(/\d+(?:[.,]\d+)?/g);
  if (num) return up.replace(/\d+(?:[.,]\d+)?[A-Z]*/g, ' ').split(/[^A-Z]+/).filter(function (w) { return w && !UNIT_WORDS[w]; }).slice(0, 2).map(function (w) { return w[0]; }).join('') + num.join('').replace(/[.,]/g, '');
  var words = up.split(/[^A-Z0-9]+/).filter(Boolean);
  if (!words.length) return '';
  return words.length === 1 ? words[0].slice(0, 2) : words.slice(0, 3).map(function (w) { return w[0]; }).join('');
}
function suggestVariantCode(attrs) { return attrs.map(function (a) { return attrValueCode(a.value); }).join('').slice(0, 12); }
function uniquify(code, used) { if (!used(code)) return code; for (var i = 2; i < 1000; i++) { var c = code.slice(0, 12 - String(i).length) + i; if (!used(c)) return c; } return code; }
function attrKey(attrs) { return attrs.filter(function (a) { return String(a.value || '').trim(); }).map(function (a) { return norm(a.name) + '=' + norm(a.value); }).sort().join('|'); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9+]/g, ''); }
function titleCase(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase().replace(/(^|\s)\S/g, function (m) { return m.toUpperCase(); }).slice(0, 30); }
function buildSkuJs(tpl, p) {
  var map = { BRAND: normCode(p.brand), CATEGORY: normCode(p.category), PRODUCT: normCode(p.product), VARIANT: normCode(p.variant) };
  return String(tpl || '{BRAND}-{CATEGORY}-{PRODUCT}-{VARIANT}').replace(/\{([A-Z]+)\}/g, function (_, t) { return map[t] || ''; }).replace(/([-_.\/])[-_.\/]+/g, '$1').replace(/^[-_.\/]+|[-_.\/]+$/g, '');
}
function cleanBc(s) { return String(s || '').replace(/[\s-]/g, '').replace(/^'/, ''); }
/** Validasi GTIN produsen di browser: angka, panjang 8/12/13/14, check digit, bukan prefix kupon/internal. */
function checkGtin(raw) {
  var c = cleanBc(raw);
  if (!c) return { ok: false, msg: 'GTIN belum diisi' };
  if (!/^\d+$/.test(c)) return { ok: false, msg: 'GTIN hanya angka' };
  if ([8, 12, 13, 14].indexOf(c.length) < 0) return { ok: false, msg: 'Panjang ' + c.length + ' digit (harus 8/12/13/14)' };
  var sum = 0; for (var i = c.length - 2, w = 3; i >= 0; i--, w = w === 3 ? 1 : 3) sum += Number(c[i]) * w;
  var cd = (10 - (sum % 10)) % 10;
  if (cd !== Number(c[c.length - 1])) return { ok: false, msg: 'Check digit salah (seharusnya ' + cd + ')' };
  if (c.length === 13 && (c.indexOf('99') === 0 || (Number(c.slice(0, 3)) >= 981 && Number(c.slice(0, 3)) <= 984))) return { ok: false, msg: 'Prefix kupon, bukan GTIN produk' };
  if (c.length === 13 && (c[0] === '2' || c.indexOf('02') === 0 || c.indexOf('04') === 0)) return { ok: false, msg: 'Prefix 2/02/04 = kode internal, bukan GTIN produsen' };
  return { ok: true, code: c };
}
/** Hitung ekuivalen satuan dasar (konversi bertingkat; satuan isi harus didefinisikan di atasnya). */
function computeEq(base, rows) {
  var eq = {}; eq[base] = 1;
  return rows.map(function (r) {
    var u = normCode(r.unitName), f = Number(r.factor), cu = normCode(r.containsUnit) || base, e = null, err = '';
    if (!/^[A-Z][A-Z0-9]{1,11}$/.test(u)) err = 'Pilih satuan';
    else if (u === base) err = u + ' adalah satuan dasar';
    else if (eq[u] !== undefined) err = 'Satuan ' + u + ' ganda';
    else if (!(f >= 2 && f <= 100000 && Math.floor(f) === f)) err = 'Isi 2–100.000';
    else if (eq[cu] === undefined) err = 'Satuan isi ' + cu + ' belum ada di atasnya';
    else e = f * eq[cu];
    if (u && eq[u] === undefined && e) eq[u] = e;
    return { eq: e, err: err };
  });
}

var Wiz = {
  st: null, main: null, checks: {},
  key: function () { return 'rpm_wiz_' + App.me.user.id; },
  fresh: function () {
    return { step: 1, productId: null, version: null, locked: false, brand: null, category: null, name: '', productCode: '', codeTouched: false, baseUnit: '', hasVariants: true,
      attrs: [{ name: '', values: [] }], variants: [], similar: [], ack: false, errors: {}, savedAt: null };
  },
  newVariant: function (attrs) {
    return { key: uid(), id: null, saved: false, attributes: attrs || [], name: (attrs || []).map(function (a) { return a.value; }).join(' '), nameTouched: false, code: '', codeTouched: false,
      sku: '', status: 'ACTIVE', barcode: { mode: 'gtin', code: '' }, orig: null, reason: '', conversions: [] };
  },
  newConv: function (unit, factor, contains) { return { key: uid(), id: null, saved: false, unitName: unit || '', factor: factor || '', containsUnit: contains || '', isTradeItem: false, tradeSaved: false, sku: '', status: 'ACTIVE', barcode: { mode: 'gtin', code: '' }, orig: null, reason: '' }; },

  open: function (main, arg) {
    Wiz.main = main; Wiz.checks = {};
    if (arg && arg.productId) {
      main.innerHTML = loadingBox('Memuat produk…');
      return api('product.get', { id: arg.productId }).then(function (p) { Wiz.st = Wiz.fromProduct(p); Wiz.st.step = arg.step || 2; Wiz.guard(); Wiz.render(); }).catch(function (e) { main.innerHTML = errBox(e.message); });
    }
    var draft = null;
    try { draft = JSON.parse(Store.get(Wiz.key()) || 'null'); } catch (e) { draft = null; }
    Wiz.st = draft && draft.v === 2 ? draft.st : Wiz.fresh();
    Wiz.restored = !!(draft && draft.v === 2 && (draft.st.name || draft.st.brand || draft.st.variants.length));
    Wiz.guard();
    Wiz.render();
  },
  guard: function () { App.leaveGuard = function () { var s = Wiz.st; return !s || !(s.name || s.brand || s.variants.length) || Wiz.done; }; Wiz.done = false; },
  persist: debounce(function () { var s = Wiz.st; if (!s || s.productId || Wiz.done) return; s.savedAt = new Date().toISOString(); Store.set(Wiz.key(), JSON.stringify({ v: 2, st: s })); }, 400),
  fromProduct: function (p) {
    var s = Wiz.fresh();
    var names = [], vals = {};
    p.variants.forEach(function (v) { v.attributes.forEach(function (a) { if (names.indexOf(a.name) < 0) { names.push(a.name); vals[a.name] = []; } if (vals[a.name].indexOf(a.value) < 0) vals[a.name].push(a.value); }); });
    var bcOf = function (g, i) { return g ? { mode: 'gtin', code: g } : i ? { mode: 'internal', code: i } : { mode: 'none', code: '' }; };
    Object.assign(s, {
      productId: p.id, version: p.version, locked: true, productNo: p.productNo, brand: p.brand, category: p.category, name: p.name, productCode: p.productCode, codeTouched: true, baseUnit: p.baseUnit, hasVariants: p.hasVariants,
      attrs: names.length ? names.map(function (n) { return { name: n, values: vals[n] }; }) : [{ name: '', values: [] }],
      variants: p.variants.map(function (v) {
        var b = bcOf(v.gtin, v.internalBarcode);
        return { key: uid(), id: v.id, saved: true, attributes: v.attributes, name: v.name, nameTouched: true, code: v.code, codeTouched: true, sku: v.sku, status: v.status, barcode: Object.assign({}, b), orig: b, reason: '',
          conversions: v.conversions.filter(function (c) { return !c.isBaseUnit; }).map(function (c) {
            var cb = bcOf(c.gtin, c.internalBarcode);
            return { key: uid(), id: c.id, saved: true, unitName: c.unitName, factor: c.factor, containsUnit: c.containsUnit, isTradeItem: c.isTradeItem, tradeSaved: c.isTradeItem, sku: c.sku, status: c.status, barcode: Object.assign({}, cb.mode === 'none' ? { mode: 'gtin', code: '' } : cb), orig: cb, reason: '' };
          }) };
      })
    });
    return s;
  },

  /* ---------- turunan ---------- */
  skuOf: function (v) {
    var s = Wiz.st;
    if (v.saved) return v.sku;
    if (!s.brand || !s.category || !s.productCode) return '';
    return buildSkuJs(cfg().skuTemplate, { brand: s.brand.code, category: s.category.code, product: s.productCode, variant: s.hasVariants ? v.code : '' });
  },
  convCalc: function (v) { return computeEq(Wiz.st.baseUnit || 'PCS', v.conversions.filter(function (c) { return c.status === 'ACTIVE'; })); },
  packSkuOf: function (v, c, eq) { if (c.saved && c.tradeSaved) return c.sku; var b = Wiz.skuOf(v); return b && eq ? b + '-' + normCode(c.unitName) + eq : ''; },
  /** Status kelengkapan identitas barcode satu baris. */
  bcState: function (row, target) {
    var b = row.barcode, chk = Wiz.checks[target];
    if (b.mode === 'none') return { cls: 'NONE', txt: 'Belum ada barcode' };
    if (b.mode === 'internal') return { cls: 'INTERNAL', txt: b.code && row.orig && row.orig.code === b.code ? 'Lengkap · Internal' : 'Internal (dialokasikan saat simpan)' };
    var g = checkGtin(b.code);
    if (!g.ok) return { cls: b.code ? 'ERR' : 'NONE', txt: b.code ? g.msg : 'GTIN belum diisi' };
    if (Wiz.dupBarcode(g.code) > 1) return { cls: 'ERR', txt: 'GTIN dipakai baris lain' };
    if (chk && chk.code === g.code && chk.state === 'err') return { cls: 'ERR', txt: chk.msg };
    if (chk && chk.code === g.code && chk.state === 'checking') return { cls: 'CHECK', txt: 'Memeriksa…' };
    return { cls: 'GTIN', txt: 'Lengkap · GTIN' };
  },
  dupBarcode: function (code) {
    var n = 0;
    Wiz.st.variants.forEach(function (v) {
      if (v.barcode.mode !== 'none' && cleanBc(v.barcode.code) === code) n++;
      v.conversions.forEach(function (c) { if (c.isTradeItem && c.status === 'ACTIVE' && c.barcode.mode !== 'none' && cleanBc(c.barcode.code) === code) n++; });
    });
    return n;
  },
  bcChanged: function (row) { return row.orig && row.orig.mode !== 'none' && !(row.barcode.mode === row.orig.mode && cleanBc(row.barcode.code) === row.orig.code) && !(row.barcode.mode === 'internal' && row.orig.mode === 'internal' && !row.barcode.code); },

  /* ---------- error dari server ---------- */
  fe: function (path) { var m = Wiz.st.errors[path]; return m ? '<div class="fe" data-fe="' + esc(path) + '">' + icon('alertCircle') + '<span>' + esc(m) + '</span></div>' : ''; },
  errCls: function (path) { return Wiz.st.errors[path] ? ' err' : ''; },
  clearErr: function (path) { if (Wiz.st.errors[path]) { delete Wiz.st.errors[path]; var el = $('[data-fe="' + path + '"]', Wiz.main); if (el) el.remove(); Wiz.renderSide(); } },
  stepOf: function (path) { return /^variants\.\d+\.conversions/.test(path) ? 3 : /^variants/.test(path) ? 2 : 1; },
  pathLabel: function (path) {
    var s = Wiz.st, m = /^variants\.(\d+)(?:\.conversions\.(\d+))?(?:\.(\w+))?/.exec(path);
    var F = { brandId: 'Nama Brand', categoryId: 'Nama Kategori', name: 'Nama Produk', productCode: 'Kode Produk', baseUnit: 'Satuan Dasar', attributes: 'Atribut', variantCode: 'Kode varian', barcode: 'Barcode', sku: 'SKU', unitName: 'Satuan', factor: 'Isi', containsUnit: 'Satuan isi', status: 'Status', isTradeItem: 'SKU kemasan' };
    if (!m) return 'Identifikasi · ' + (F[path] || path);
    var v = s.variants[Number(m[1])];
    var vl = 'Varian ' + (Number(m[1]) + 1) + (v && v.name ? ' (' + v.name + ')' : '');
    if (m[2] !== undefined) { var c = v && v.conversions[Number(m[2])]; return vl + ' · Kemasan ' + (c && c.unitName ? c.unitName : Number(m[2]) + 1) + (m[3] ? ' · ' + (F[m[3]] || m[3]) : ''); }
    return vl + (m[3] ? ' · ' + (F[m[3]] || m[3]) : '');
  },

  /* ---------- kerangka ---------- */
  render: function () {
    var s = Wiz.st, main = Wiz.main;
    var stepNames = ['Identifikasi Produk', 'Registrasi Varian', 'Satuan & Konversi'];
    var bad = [0, 0, 0, 0]; Object.keys(s.errors).forEach(function (p) { bad[Wiz.stepOf(p)]++; });
    main.innerHTML = pageHead(s.productId ? 'Edit produk · ' + (s.productNo || '') : 'Master data', s.productId ? s.name : 'Registrasi Produk',
      s.productId ? '<button class="btn" id="wz-cancel">' + icon('x') + 'Batal</button>' : (Wiz.restored ? '<button class="btn ghost" id="wz-reset">' + icon('refresh') + 'Mulai dari awal</button>' : ''),
      s.productId ? 'Tambah varian / kemasan, lengkapi barcode, atau perbaiki nama. Identitas yang sudah tersimpan (kode, atribut, SKU) bersifat permanen.' : 'Tiga langkah, lalu <b>Simpan Produk</b>. Produk langsung aktif di Direktori — tanpa approval.') +
      (Wiz.restored && !s.productId ? '<div class="info-box" style="margin:-8px 0 14px">' + icon('clock') + '<span>Melanjutkan draf yang belum disimpan' + (s.savedAt ? ' (' + fmtDate(s.savedAt) + ')' : '') + '. Draf hanya tersimpan di perangkat ini.</span></div>' : '') +
      (!s.productId ? '<div class="toolbar"><span class="muted" style="font-weight:700">Menambah varian ke produk yang sudah ada?</span><div id="wz-find" style="width:340px;max-width:100%"></div></div>' : '') +
      '<div class="stepper">' + stepNames.map(function (n, i) {
        var k = i + 1; return '<button class="stp' + (s.step === k ? ' on' : s.step > k ? ' done' : '') + (bad[k] ? ' bad' : '') + '" data-step="' + k + '"><span class="n">' + (bad[k] ? '!' : s.step > k ? '✓' : k) + '</span><span><span class="k">Langkah ' + k + '</span><span class="v" style="display:block">' + n + '</span></span></button>';
      }).join('') + '</div>' +
      '<div class="wz-grid"><div id="wz-body"></div><aside class="wz-side" id="wz-side"></aside></div>';
    $$('[data-step]', main).forEach(function (b) { b.onclick = function () { Wiz.goStep(Number(b.getAttribute('data-step'))); }; });
    if ($('#wz-cancel', main)) $('#wz-cancel', main).onclick = function () { Wiz.done = true; App.go('product', s.productId, { force: true }); };
    if ($('#wz-reset', main)) $('#wz-reset', main).onclick = function () { ask('Hapus draf dan mulai registrasi baru?', 'Mulai baru', true).then(function (y) { if (y) { Store.del(Wiz.key()); Wiz.restored = false; Wiz.st = Wiz.fresh(); Wiz.render(); } }); };
    if ($('#wz-find', main)) combo($('#wz-find', main), {
      placeholder: 'Cari produk (nama, kode, SKU)…', load: function (q) { return q && q.length >= 2 ? api('product.search', { q: q }, { quiet: true, silent: true }) : []; },
      label: function (it) { return it.name; }, sub: function (it) { return it.brandName + ' · ' + it.productNo; }, code: function (it) { return it.code; }, empty: 'Ketik minimal 2 huruf',
      onChange: function (it) { if (it) App.go('register', { productId: it.id }); }
    });
    var body = $('#wz-body', main);
    if (s.step === 1) Wiz.step1(body); else if (s.step === 2) Wiz.step2(body); else Wiz.step3(body);
    Wiz.renderSide();
    Wiz.persist();
  },
  goStep: function (k) {
    var s = Wiz.st;
    if (k > s.step) {
      for (var i = s.step; i < k; i++) { var issues = Wiz.issues(i); if (issues.length) { toast(issues[0], 'err'); if (i !== s.step) { s.step = i; Wiz.render(); } return; } }
    }
    s.step = k; Wiz.render(); window.scrollTo(0, 0);
  },
  /** Pemeriksaan cepat sebelum pindah langkah (server tetap memvalidasi ulang). */
  issues: function (step) {
    var s = Wiz.st, out = [];
    if (step === 1) {
      if (!s.brand) out.push('Pilih Nama Brand');
      if (!s.category) out.push('Pilih Nama Kategori');
      if (String(s.name).trim().length < 3) out.push('Nama Produk minimal 3 karakter');
      if (!/^[A-Z0-9]{2,16}$/.test(s.productCode)) out.push('Kode Produk 2–16 huruf/angka');
      if (!s.baseUnit) out.push('Pilih Satuan Dasar');
    }
    if (step === 2) {
      if (!s.variants.length) out.push(s.hasVariants ? 'Buat kombinasi varian terlebih dahulu' : 'Varian default belum ada');
      var codes = {};
      s.variants.forEach(function (v, i) {
        if (s.hasVariants && !v.saved && !v.attributes.length) out.push('Varian ' + (i + 1) + ': belum ada atribut');
        if (s.hasVariants && !v.saved) { if (!v.code) out.push('Varian ' + (i + 1) + ': kode varian kosong'); else if (codes[v.code]) out.push('Kode varian ' + v.code + ' ganda'); codes[v.code] = 1; }
        if (v.barcode.mode === 'gtin' && v.barcode.code && !checkGtin(v.barcode.code).ok) out.push('Varian ' + (i + 1) + ': ' + checkGtin(v.barcode.code).msg);
        if (v.barcode.mode === 'gtin' && !v.barcode.code && !v.saved) out.push('Varian ' + (i + 1) + ': GTIN belum diisi — pilih "Internal" atau "Belum ada" bila tidak punya GTIN');
        if (Wiz.bcChanged(v) && String(v.reason).trim().length < 5) out.push('Varian ' + (i + 1) + ': isi alasan perubahan barcode');
      });
    }
    if (step === 3) {
      s.variants.forEach(function (v, i) {
        Wiz.convCalc(v).forEach(function (r, j) { if (r.err) out.push('Varian ' + (i + 1) + ' kemasan ' + (j + 1) + ': ' + r.err); });
      });
    }
    return out;
  },

  /* ---------- langkah 1 ---------- */
  step1: function (body) {
    var s = Wiz.st, L = s.locked, lock = L ? '<span class="lock-note">' + icon('lock') + 'permanen</span>' : '';
    body.innerHTML = '<div class="card"><div class="sec-h"><h3>Identifikasi Produk</h3><span class="sub">Satu Product Master menjadi induk seluruh variasi produk.</span></div><div class="fgrid">' +
      '<div class="fld"><label class="f">1. Nama Brand <span class="req">*</span>' + lock + '</label><div id="f-brand"></div><div class="hint" id="h-brand"></div>' + Wiz.fe('brandId') + '</div>' +
      '<div class="fld"><label class="f">2. Nama Kategori <span class="req">*</span>' + lock + '</label><div id="f-cat"></div><div class="hint" id="h-cat"></div>' + Wiz.fe('categoryId') + '</div>' +
      '<div class="fld full"><label class="f">3. Nama Produk <span class="req">*</span></label><input class="in w100' + Wiz.errCls('name') + '" id="f-name" maxlength="120" placeholder="Contoh: Parfum Eau de Parfum" value="' + esc(s.name) + '">' +
      '<div class="hint">Nama umum / product family — bukan nama setiap varian (aroma, shade, ukuran diisi di langkah 2).</div>' + Wiz.fe('name') + '<div id="f-sim"></div></div>' +
      '<div class="fld"><label class="f">4. Kode Produk <span class="req">*</span>' + lock + '</label><div class="row"><input class="in code' + Wiz.errCls('productCode') + '" id="f-code" maxlength="16" placeholder="Contoh: PEDP" value="' + esc(s.productCode) + '"' + (L ? ' disabled' : '') + '>' +
      (L ? '' : '<button class="btn" id="f-sug" type="button" title="Rekomendasi otomatis">' + icon('sparkles') + 'Rekomendasi</button>') + '</div>' +
      '<div class="hint">' + (L ? 'Kode produk tidak dapat diubah setelah tersimpan.' : 'Alfanumerik, unik per brand. Boleh diubah sebelum produk pertama kali disimpan.') + '</div>' + Wiz.fe('productCode') + '</div>' +
      '<div class="fld"><label class="f">5. Satuan Dasar <span class="req">*</span>' + lock + '</label><select class="in w100' + Wiz.errCls('baseUnit') + '" id="f-unit"' + (L ? ' disabled' : '') + '><option value="">Pilih satuan…</option>' +
      (cfg().baseUnits || []).concat(s.baseUnit && (cfg().baseUnits || []).indexOf(s.baseUnit) < 0 ? [s.baseUnit] : []).map(function (u) { return '<option' + (u === s.baseUnit ? ' selected' : '') + '>' + esc(u) + '</option>'; }).join('') + '</select>' +
      '<div class="hint">Unit stok terkecil untuk menghitung persediaan. Contoh: parfum → BOTOL, lipstik → PCS.</div>' + Wiz.fe('baseUnit') + '</div>' +
      '</div><div class="wz-foot">' + (s.productId ? '' : '<span class="muted" style="font-size:12.5px">Draf tersimpan otomatis di perangkat ini.</span>') + '<button class="btn pri right" id="nx">Lanjut: Registrasi Varian ' + icon('arrowRight') + '</button></div></div>';
    var hint = function () {
      $('#h-brand', body).innerHTML = s.brand ? 'Kode brand: <span class="chip-code">' + esc(s.brand.code) + '</span>' : 'Belum ada? Tambahkan di <a class="link-btn" data-go="brands">Master Brand</a>.';
      $('#h-cat', body).innerHTML = s.category ? 'Kode kategori: <span class="chip-code">' + esc(s.category.code) + '</span>' : 'Belum ada? Tambahkan di <a class="link-btn" data-go="categories">Master Kategori</a>.';
      $$('[data-go]', body).forEach(function (a) { a.onclick = function () { App.go(a.getAttribute('data-go')); }; });
    };
    refCombo($('#f-brand', body), 'brand', s.brand, function (it) { s.brand = it ? { id: it.id, code: it.code, name: it.name } : null; Wiz.clearErr('brandId'); hint(); Wiz.check(); Wiz.renderSide(); Wiz.persist(); }, 'Cari brand…', false, L);
    refCombo($('#f-cat', body), 'category', s.category, function (it) { s.category = it ? { id: it.id, code: it.code, name: it.name } : null; Wiz.clearErr('categoryId'); hint(); Wiz.renderSide(); Wiz.persist(); }, 'Cari kategori…', false, L);
    hint();
    $('#f-name', body).oninput = function (e) { s.name = e.target.value; Wiz.clearErr('name'); Wiz.check(); Wiz.renderSide(); Wiz.persist(); };
    $('#f-code', body).oninput = function (e) { var c = normCode(e.target.value); if (c !== e.target.value) e.target.value = c; s.productCode = c; s.codeTouched = !!c; Wiz.clearErr('productCode'); Wiz.renderSide(); Wiz.persist(); };

    Wiz.open3 = Wiz.open3 || {};
    box.innerHTML = s.variants.map(function (v, i) {
      if (v.status !== 'ACTIVE' && !v.conversions.length) return '';
      var calc = Wiz.convCalc(v), k = 0, actives = v.conversions.filter(function (c) { return c.status === 'ACTIVE'; });
      var hasErr = Object.keys(s.errors).some(function (p) { return p.indexOf('variants.' + i + '.conversions') === 0; }) || calc.some(function (r) { return r.err; });
      var isOpen = Wiz.open3[v.key] !== undefined ? Wiz.open3[v.key] : (i < 3 || hasErr);
      return '<div class="vcard' + (isOpen ? ' open' : '') + '" data-v="' + i + '"><div class="vcard-h">' + icon('chevron', 'chev') + '<span class="nm">' + esc(v.name || 'Varian ' + (i + 1)) + '</span><span class="sku">' + esc(Wiz.skuOf(v)) + '</span>' +
        (v.status !== 'ACTIVE' ? badge('INACTIVE') : '') + (hasErr ? '<span class="badge b-ERR">Perlu dicek</span>' : '') + '<span class="muted right">' + (actives.length ? actives.map(function (c, j) { var r = calc[j]; return esc(c.unitName) + (r && r.eq ? ' (' + r.eq + ')' : ''); }).join(' · ') : 'hanya ' + esc(base)) + '</span></div>' +
        '<div class="vcard-b"><div class="cv-row base"><span>1 ' + esc(base) + '</span><span class="lbl">=</span><span>1</span><span>' + esc(base) + '</span><span class="eq">satuan dasar</span><span></span><span></span></div>' +
        v.conversions.map(function (c, j) {
          var p = 'variants.' + i + '.conversions.' + j, active = c.status === 'ACTIVE', r = active ? calc[k++] : null, locked = c.saved && c.tradeSaved;
          var prev = [base].concat(v.conversions.slice(0, j).filter(function (x) { return x.status === 'ACTIVE' && x.unitName; }).map(function (x) { return x.unitName; }));
          var opts = units.concat(c.unitName && units.indexOf(c.unitName) < 0 ? [c.unitName] : []);
          return '<div class="cv-row" data-c="' + j + '" style="' + (active ? '' : 'opacity:.55') + '"><div><select class="in sm' + Wiz.errCls(p + '.unitName') + '" data-u' + (locked || !active ? ' disabled' : '') + '><option value="">Satuan…</option>' + opts.map(function (u) { return '<option' + (u === c.unitName ? ' selected' : '') + '>' + esc(u) + '</option>'; }).join('') + '<option value="__custom">Lainnya…</option></select>' + Wiz.fe(p + '.unitName') + '</div>' +
            '<span class="lbl">berisi</span><div><input class="in sm' + Wiz.errCls(p + '.factor') + '" data-f type="number" min="2" step="1" placeholder="Isi" value="' + esc(c.factor) + '"' + (locked || !active ? ' disabled' : '') + '>' + Wiz.fe(p + '.factor') + '</div>' +
            '<div><select class="in sm' + Wiz.errCls(p + '.containsUnit') + '" data-cu' + (locked || !active ? ' disabled' : '') + '>' + prev.map(function (u) { return '<option' + (u === (c.containsUnit || base) ? ' selected' : '') + '>' + esc(u) + '</option>'; }).join('') + '</select>' + Wiz.fe(p + '.containsUnit') + '</div>' +
            '<span class="eq">' + (!active ? 'nonaktif' : r && r.eq ? '= ' + fmtNum(r.eq) + ' ' + esc(base) + '<small>kuantitas ekuivalen</small>' : '<span style="color:var(--err)">' + esc(r ? r.err : '') + '</span>') + '</span>' +
            '<label class="row" style="gap:8px;font-size:12px;font-weight:700"><span class="sw"><input type="checkbox" data-tr' + (c.isTradeItem ? ' checked' : '') + (locked || !active ? ' disabled' : '') + '><i></i></span>SKU/GTIN sendiri</label>' +
            '<button class="btn sm ghost" type="button" data-rm title="' + (c.saved ? (active ? 'Nonaktifkan' : 'Aktifkan lagi') : 'Hapus') + '">' + icon(c.saved ? 'power' : 'trash') + '</button>' +
            (locked ? '<div class="hint" style="grid-column:1/-1;margin-top:0">' + icon('lock') + ' Isi kemasan ber-SKU terkunci (SKU permanen). Nonaktifkan bila tidak dipakai, lalu buat kemasan baru.</div>' : '') + Wiz.fe(p + '.status') + Wiz.fe(p + '.isTradeItem') +
            (c.isTradeItem && active ? '<div class="cv-trade"><span class="muted" style="font-weight:700">SKU kemasan</span><span class="sku">' + esc(Wiz.packSkuOf(v, c, r && r.eq) || '—') + '</span>' + Wiz.fe(p + '.sku') + '<div style="flex:1;min-width:230px">' + Wiz.bcInput(c, p + '.barcode', i + ':' + j) + '</div><span data-vs="' + i + ':' + j + '"></span></div>' : '') + '</div>';
        }).join('') +
        '<div class="row" style="margin-top:12px"><button class="btn sm" type="button" data-add>' + icon('plus') + 'Tambah satuan kemasan</button>' + (s.variants.length > 1 ? '<button class="btn sm ghost" type="button" data-copy>' + icon('copy') + 'Salin ke varian lain</button>' : '') + '</div>' +
        (actives.length ? '<div class="calc" data-calc>' + icon('calc') + '<span>Hitung:</span><input class="in" type="number" min="0" value="3" data-q><select class="in" data-qu>' + actives.map(function (c, j) { return '<option value="' + (calc[j].eq || 0) + '">' + esc(c.unitName) + '</option>'; }).join('') + '</select><span>=</span><span class="res" data-r></span></div>' : '') +
        '</div></div>';
    }).join('');
    $$('.vcard', box).forEach(function (card) {
      var i = Number(card.getAttribute('data-v')), v = s.variants[i];
      $('.vcard-h', card).onclick = function () { card.classList.toggle('open'); Wiz.open3[v.key] = card.classList.contains('open'); };
      $$('.cv-row[data-c]', card).forEach(function (row) {
        var j = Number(row.getAttribute('data-c')), c = v.conversions[j], p = 'variants.' + i + '.conversions.' + j;
        var redraw = function () { Wiz.open3[v.key] = true; Wiz.renderConvs(); Wiz.renderSide(); Wiz.persist(); };
        var u = $('[data-u]', row);
        u.onchange = function () {
          if (u.value === '__custom') return promptText('Satuan kemasan lain', 'Nama satuan (2–12 huruf/angka, mis. INNER, DISPLAY)', { multiline: false, min: 2, ok: 'Pakai' }).then(function (x) { if (x) c.unitName = normCode(x).slice(0, 12); redraw(); });
          var old = c.unitName; c.unitName = u.value; Wiz.clearErr(p + '.unitName');
          v.conversions.forEach(function (o) { if (o.containsUnit === old && old) o.containsUnit = c.unitName; });
          redraw();
        };
        $('[data-f]', row).onchange = function (e) { c.factor = e.target.value === '' ? '' : Number(e.target.value); Wiz.clearErr(p + '.factor'); redraw(); };
        $('[data-cu]', row).onchange = function (e) { c.containsUnit = e.target.value; Wiz.clearErr(p + '.containsUnit'); redraw(); };
        $('[data-tr]', row).onchange = function (e) { c.isTradeItem = e.target.checked; Wiz.clearErr(p + '.isTradeItem'); redraw(); };
        $('[data-rm]', row).onclick = function () {
          if (!c.saved) { v.conversions.splice(j, 1); s.errors = {}; return redraw(); }
          c.status = c.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE'; Wiz.clearErr(p + '.status'); redraw();
        };
        var tr = $('.cv-trade', row);
        if (tr) { c.conversion = true; Wiz.bindBc(tr, c, p + '.barcode', i + ':' + j, redraw); }
      });
      $('[data-add]', card).onclick = function () {
        var used = v.conversions.filter(function (c) { return c.status === 'ACTIVE'; }).map(function (c) { return c.unitName; });
        var last = used[used.length - 1];
        var next = (cfg().packUnits || []).find(function (u) { return used.indexOf(u) < 0; }) || '';
        v.conversions.push(Wiz.newConv(next, '', last || s.baseUnit)); Wiz.open3[v.key] = true; Wiz.renderConvs(); Wiz.renderSide(); Wiz.persist();
      };
      var cp = $('[data-copy]', card);
      if (cp) cp.onclick = function () {
        var src = v.conversions.filter(function (c) { return c.status === 'ACTIVE'; });
        if (!src.length) return toast('Belum ada kemasan untuk disalin', 'warn');
        ask('Salin ' + src.length + ' kemasan (' + src.map(function (c) { return c.unitName + ' ' + c.factor; }).join(', ') + ') ke semua varian aktif lain? Kemasan yang belum tersimpan di varian lain akan diganti; kemasan tersimpan tidak diubah.', 'Salin').then(function (y) {
          if (!y) return;
          s.variants.forEach(function (o) {
            if (o === v || o.status !== 'ACTIVE') return;
            var savedNames = o.conversions.filter(function (c) { return c.saved; }).map(function (c) { return c.unitName; });
            o.conversions = o.conversions.filter(function (c) { return c.saved; }).concat(src.filter(function (c) { return savedNames.indexOf(c.unitName) < 0; }).map(function (c) { var n = Wiz.newConv(c.unitName, c.factor, c.containsUnit); n.isTradeItem = c.isTradeItem; return n; }));
          });
          s.errors = {}; toast('Konversi disalin ke varian lain', 'ok'); Wiz.renderConvs(); Wiz.renderSide(); Wiz.persist();
        });
      };
      var calcEl = $('[data-calc]', card);
      if (calcEl) { var run = function () { $('[data-r]', calcEl).textContent = fmtNum((Number($('[data-q]', calcEl).value) || 0) * Number($('[data-qu]', calcEl).value || 0)) + ' ' + s.baseUnit; }; $('[data-q]', calcEl).oninput = run; $('[data-qu]', calcEl).onchange = run; run(); }
    });
    Wiz.updateStatus();
  },

  /* ---------- ringkasan (panel samping) ---------- */
  renderSide: function () {
    var s = Wiz.st, side = $('#wz-side', Wiz.main); if (!side || !s) return;
    var act = s.variants.filter(function (v) { return v.status === 'ACTIVE'; });
    var stat = { GTIN: 0, INTERNAL: 0, NONE: 0, ERR: 0 };
    act.forEach(function (v, i) { var b = Wiz.bcState(v, String(s.variants.indexOf(v))).cls; stat[b === 'CHECK' ? 'GTIN' : b] = (stat[b === 'CHECK' ? 'GTIN' : b] || 0) + 1; });
    var packs = 0, tradeNew = 0, tradeAll = 0;
    s.variants.forEach(function (v) { v.conversions.forEach(function (c) { if (c.status === 'ACTIVE') { packs++; if (c.isTradeItem) { tradeAll++; if (!c.tradeSaved) tradeNew++; } } }); });
    var newVar = s.variants.filter(function (v) { return !v.saved; }).length;
    var skuPrev = s.brand && s.category && s.productCode ? buildSkuJs(cfg().skuTemplate, { brand: s.brand.code, category: s.category.code, product: s.productCode, variant: s.hasVariants ? '{VARIAN}' : '' }).replace('VARIAN', '{VARIAN}').replace('{{VARIAN}}', '{VARIAN}') : '—';
    var errs = Object.keys(s.errors);
    var done = act.length ? Math.round((stat.GTIN + stat.INTERNAL) / act.length * 100) : 0;
    side.innerHTML = '<div class="panel"><div class="panel-h"><h3>Ringkasan produk</h3></div><div class="sum-kv">' +
      '<div>Brand</div><div>' + (s.brand ? esc(s.brand.name) + ' <span class="chip-code ghost">' + esc(s.brand.code) + '</span>' : '<span class="muted">—</span>') + '</div>' +
      '<div>Kategori</div><div>' + (s.category ? esc(s.category.name) + ' <span class="chip-code ghost">' + esc(s.category.code) + '</span>' : '<span class="muted">—</span>') + '</div>' +
      '<div>Produk</div><div>' + (s.name ? esc(s.name) : '<span class="muted">—</span>') + '</div><div>Kode produk</div><div class="code">' + esc(s.productCode || '—') + '</div>' +
      '<div>Satuan dasar</div><div>' + esc(s.baseUnit || '—') + '</div><div>Pola SKU</div><div class="sku">' + esc(skuPrev) + '</div>' +
      '<div>Varian</div><div>' + act.length + ' aktif' + (s.productId && newVar ? ' · ' + newVar + ' baru' : '') + '</div>' +
      '<div>Barcode</div><div>' + stat.GTIN + ' GTIN · ' + stat.INTERNAL + ' internal' + (stat.NONE ? ' · <span style="color:var(--warn)">' + stat.NONE + ' belum</span>' : '') + (stat.ERR ? ' · <span style="color:var(--err)">' + stat.ERR + ' bermasalah</span>' : '') + '<div class="meter"><i style="width:' + done + '%"></i></div></div>' +
      '<div>Kemasan</div><div>' + packs + ' satuan' + (tradeAll ? ' · ' + tradeAll + ' ber-SKU' : '') + '</div>' +
      '<div>SKU ' + (s.productId ? 'baru' : 'dibuat') + '</div><div>' + (newVar + tradeNew) + '</div></div>' +
      (s.similar.length && !s.productId ? '<div class="warn-box">' + icon('alert') + '<span>Ada ' + s.similar.length + ' produk bernama mirip.<label style="display:flex;gap:6px;margin-top:6px"><input type="checkbox" id="ack"' + (s.ack ? ' checked' : '') + '> Saya sudah cek, ini produk berbeda</label></span></div>' : '') +
      (errs.length ? '<div class="sect" style="margin:14px 0 4px;color:var(--err)">' + errs.length + ' masalah perlu diperbaiki</div><ul class="err-list">' + errs.slice(0, 30).map(function (p) { return '<li data-ep="' + esc(p) + '">' + icon('alertCircle') + '<div><small>' + esc(Wiz.pathLabel(p)) + '</small>' + esc(s.errors[p]) + '</div></li>'; }).join('') + '</ul>' : '') +
      (s.step === 3 ? '<button class="btn pri w100" id="sv" style="margin-top:14px;height:44px">' + icon('check') + (s.productId ? 'Simpan Perubahan' : 'Simpan Produk') + '</button><button class="btn ghost w100" id="ck" style="margin-top:6px">Periksa data tanpa menyimpan</button>'
        : '<div class="hint" style="margin-top:12px">Tombol <b>Simpan Produk</b> ada di langkah 3.</div>') + '</div>' +
      (s.step === 1 ? '<div class="tips"><b>Alur registrasi</b><ol><li>Pilih brand & kategori (kode otomatis)</li><li>Buat kombinasi varian & isi GTIN</li><li>Atur BOX / KARTON per varian</li><li>Simpan Produk — langsung aktif</li></ol></div>' : '');
    var ack = $('#ack', side); if (ack) ack.onchange = function () { s.ack = ack.checked; Wiz.persist(); };
    $$('[data-ep]', side).forEach(function (li) { li.onclick = function () { var p = li.getAttribute('data-ep'), k = Wiz.stepOf(p); if (k !== s.step) { s.step = k; Wiz.render(); } var el = $('[data-fe="' + p + '"]', Wiz.main); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }; });
    if ($('#sv', side)) $('#sv', side).onclick = function () { Wiz.save($('#sv', side)); };
    if ($('#ck', side)) $('#ck', side).onclick = function () { Wiz.save($('#ck', side), true); };
  },

  /* ---------- simpan ---------- */
  payload: function () {
    var s = Wiz.st;
    return {
      productId: s.productId || undefined, version: s.version || undefined,
      brandId: s.brand && s.brand.id, categoryId: s.category && s.category.id, name: s.name, productCode: s.productCode, baseUnit: s.baseUnit, hasVariants: s.hasVariants, acknowledgeSimilar: s.ack,
      variants: s.variants.map(function (v) {
        return { id: v.id || undefined, name: v.name, attributes: s.hasVariants || v.saved ? v.attributes : [], variantCode: v.saved ? undefined : (s.hasVariants ? v.code : ''), status: v.status,
          barcode: { mode: v.barcode.mode, code: v.barcode.code }, barcodeChangeReason: v.reason,
          conversions: v.conversions.map(function (c) { return { id: c.id || undefined, unitName: c.unitName, factor: Number(c.factor), containsUnit: c.containsUnit || s.baseUnit, isTradeItem: !!c.isTradeItem, status: c.status, barcode: c.isTradeItem ? { mode: c.barcode.mode, code: c.barcode.code } : { mode: 'none' }, barcodeChangeReason: c.reason }; }) };
      })
    };
  },
  save: function (btn, dryRun) {
    var s = Wiz.st;
    for (var k = 1; k <= 3; k++) { var iss = Wiz.issues(k); if (iss.length) { toast(iss[0], 'err'); if (s.step !== k) { s.step = k; Wiz.render(); } return; } }
    busy(btn, api(dryRun ? 'product.validate' : 'product.save', { input: Wiz.payload() }, { silent: true })).then(function (d) {
      s.errors = {};
      if (dryRun) { Wiz.renderSide(); return toast('Data valid — ' + d.variants.length + ' varian siap disimpan', 'ok'); }
      Wiz.done = true; App.leaveGuard = null;
      if (!s.productId) Store.del(Wiz.key());
      Wiz.success(d, !!s.productId);
    }).catch(function (e) {
      if (e.code === 'VALIDATION_FAILED' || e.code === 'SIMILAR_EXISTS') {
        s.errors = {};
        if (e.code === 'SIMILAR_EXISTS') { s.similar = e.details.map(function (d) { return d.data; }).filter(Boolean); s.ack = false; toast('Ada produk dengan nama mirip. Periksa, lalu centang konfirmasi di ringkasan.', 'warn'); Wiz.render(); return; }
        e.details.forEach(function (d) { var p = d.path || 'variants'; if (!s.errors[p]) s.errors[p] = d.message; });
        var first = Math.min.apply(null, Object.keys(s.errors).map(Wiz.stepOf));
        toast(e.message, 'err');
        s.step = first; Wiz.render();
        var el = $('.fe', Wiz.main); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else if (e.code === 'STALE_VERSION') {
        ask(e.message + ' Muat ulang data produk sekarang? (perubahan yang belum disimpan hilang)', 'Muat ulang').then(function (y) { if (y) { Wiz.done = true; App.go('register', { productId: s.productId }, { force: true }); } });
      } else toast(e.message, 'err');
    });
  },
  success: function (d, edited) {
    var skus = [];
    d.variants.forEach(function (v) { skus.push(v.sku); v.conversions.forEach(function (c) { if (c.sku) skus.push(c.sku); }); });
    Wiz.main.innerHTML = '<div class="success"><div class="ring">' + icon('check') + '</div><div class="eyebrow">' + esc(d.productNo) + '</div><h2>' + (edited ? 'Perubahan tersimpan' : 'Produk tersimpan') + '</h2>' +
      '<p class="muted">' + esc(d.name) + ' · ' + d.variants.length + ' varian · ' + skus.length + ' SKU. ' + (edited ? '' : 'Produk langsung aktif di Direktori Produk.') + '</p>' +
      '<div class="sku-list">' + skus.slice(0, 40).map(function (x) { return '<span class="sku">' + esc(x) + '</span>'; }).join('') + (skus.length > 40 ? '<span>+' + (skus.length - 40) + ' lagi</span>' : '') + '</div>' +
      '<div class="row" style="justify-content:center"><button class="btn pri" id="s1">' + icon('package') + 'Lihat produk</button><button class="btn" id="s2">' + icon('plus') + 'Daftarkan produk lain</button></div></div>';
    toast(edited ? 'Perubahan produk tersimpan' : 'Produk ' + d.name + ' tersimpan', 'ok');
    $('#s1', Wiz.main).onclick = function () { App.go('product', d.id); };
    $('#s2', Wiz.main).onclick = function () { App.go('register', null, { force: true }); };
  }
};
Pages.register = function (main, arg) { Wiz.open(main, arg); };
</script>
