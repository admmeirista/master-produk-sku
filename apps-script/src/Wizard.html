<script>
/* ═════════════ Registrasi Produk v3 ═════════════
 * Mode A — QUICK ENTRY (default): 1 varian fisik. Brand, Kategori, Nama Produk, Barcode/GTIN, Satuan Dasar → Simpan.
 * Mode B — ADVANCED: 1 Identifikasi → 2 Varian & Barcode (generator kombinasi) → 3 Kemasan (opsional) → 4 Ringkasan & Simpan.
 * User tidak mengisi kode apa pun — Product Code & SKU dibuat server. Validasi di browser hanya umpan balik cepat;
 * validasi final & penyimpanan atomik ada di server. Isian produk baru tersimpan otomatis sebagai draf di perangkat ini. */

function norm(s) { return String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9+]/g, ''); }
function titleCase(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase().replace(/(^|\s)\S/g, function (m) { return m.toUpperCase(); }).slice(0, 30); }
function attrKey(attrs) { return (attrs || []).filter(function (a) { return String(a.value || '').trim(); }).map(function (a) { return norm(a.name) + '=' + norm(a.value); }).sort().join('|'); }
function cleanBc(s) { return String(s || '').replace(/[\s-]/g, '').replace(/^'/, ''); }
/** Validasi GTIN produsen di browser: angka, panjang 8/12/13/14, check digit, bukan prefix kupon/internal. */
function checkGtin(raw) {
  var c = cleanBc(raw);
  if (!c) return { ok: false, msg: 'GTIN belum diisi' };
  if (!/^\d+$/.test(c)) return { ok: false, msg: 'GTIN hanya angka' };
  if ([8, 12, 13, 14].indexOf(c.length) < 0) return { ok: false, msg: 'Panjang ' + c.length + ' digit (harus 8/12/13/14)' };
  var sum = 0; for (var i = c.length - 2, w = 3; i >= 0; i--, w = w === 3 ? 1 : 3) sum += Number(c[i]) * w;
  var cd = (10 - (sum % 10)) % 10;
  if (cd !== Number(c[c.length - 1])) return { ok: false, msg: 'Check digit salah (seharusnya ' + cd + ')' };
  if (c.length === 13 && (c.indexOf('99') === 0 || (Number(c.slice(0, 3)) >= 981 && Number(c.slice(0, 3)) <= 984))) return { ok: false, msg: 'Prefix kupon, bukan GTIN produk' };
  if (c.length === 13 && (c[0] === '2' || c.indexOf('02') === 0 || c.indexOf('04') === 0)) return { ok: false, msg: 'Prefix 2/02/04 = kode internal, bukan GTIN produsen' };
  return { ok: true, code: c };
}
/** Ekuivalen satuan dasar (konversi bertingkat; satuan isi harus didefinisikan di atasnya). Isi harus > 0. */
function computeEq(base, rows) {
  var eq = {}; eq[base] = 1;
  return rows.map(function (r) {
    var u = normCode(r.unitName), f = Number(r.factor), cu = normCode(r.containsUnit) || base, e = null, err = '';
    if (!/^[A-Z][A-Z0-9]{1,11}$/.test(u)) err = 'Pilih satuan';
    else if (u === base) err = u + ' adalah satuan dasar';
    else if (eq[u] !== undefined) err = 'Satuan ' + u + ' ganda';
    else if (!(f >= 1 && f <= 100000 && Math.floor(f) === f)) err = 'Isi harus bilangan bulat > 0';
    else if (eq[cu] === undefined) err = 'Satuan isi ' + cu + ' belum ada di atasnya';
    else e = f * eq[cu];
    if (u && eq[u] === undefined && e) eq[u] = e;
    return { eq: e, err: err };
  });
}

var Wiz = {
  st: null, main: null, checks: {}, open3: {},
  key: function () { return 'rpm_wiz4_' + App.me.user.id; },
  fresh: function (mode) {
    return { v: 4, mode: mode || 'quick', step: 1, productId: null, version: null, productCode: '', brand: null, category: null, name: '', baseUnit: '', description: '', imageUrl: '', dataSource: '', status: '',
      attrs: [{ name: '', values: [] }], variants: [Wiz.newVariant([])], similar: [], ack: false, errors: {}, savedAt: null, note: '', reqKey: uid(), lookup: null };
  },
  newVariant: function (attrs) {
    return { key: uid(), id: null, saved: false, attributes: attrs || [], name: (attrs || []).map(function (a) { return a.value; }).join(' '), nameTouched: false,
      sku: '', status: 'ACTIVE', barcode: { mode: 'gtin', code: '' }, orig: null, reason: '', conversions: [], batchTracking: false, expiryTracking: false, shelfLifeMonths: '', purchaseUnit: '', salesUnit: '', statusReason: '' };
  },
  newConv: function (unit, factor, contains) { return { key: uid(), id: null, saved: false, unitName: unit || '', factor: factor || '', containsUnit: contains || '', isTradeItem: false, tradeSaved: false, sku: '', status: 'ACTIVE', barcode: { mode: 'gtin', code: '' }, orig: null, reason: '' }; },

  open: function (main, arg) {
    arg = arg || {};
    Wiz.main = main; Wiz.checks = {}; Wiz.open3 = {}; Wiz.done = false;
    var src = arg.productId || arg.duplicateOf;
    if (src) {
      main.innerHTML = loadingBox('Memuat produk…');
      return api('product.get', { id: src }).then(function (p) {
        Wiz.st = arg.duplicateOf ? Wiz.fromDuplicate(p) : Wiz.fromProduct(p);
        if (arg.addGtin) {
          var s = Wiz.st, names = s.attrs.filter(function (a) { return a.name; }).map(function (a) { return a.name; });
          if (s.mode === 'quick') { s.mode = 'advanced'; s.variants.forEach(function (v) { if (!v.attributes.length) v.attributes = [{ name: 'Varian', value: v.name === 'Standar' ? s.name : v.name }]; }); names = ['Varian']; s.attrs = [{ name: 'Varian', values: [] }]; }
          var nv = Wiz.newVariant(names.map(function (n) { return { name: n, value: '' }; })); nv.barcode = { mode: 'gtin', code: arg.addGtin }; nv.manual = true;
          s.variants.push(nv); s.step = 2; s.note = 'GTIN ' + arg.addGtin + ' ditambahkan sebagai varian baru (baris terakhir). Isi atributnya, lalu simpan.';
        }
        Wiz.restored = false; Wiz.guard(); Wiz.render();
      }).catch(function (e) { main.innerHTML = errBox(e.message); });
    }
    var draft = null;
    try { draft = JSON.parse(Store.get(Wiz.key()) || 'null'); } catch (e) { draft = null; }
    var useDraft = draft && draft.v === 4 && !arg.gtin && !arg.mode && (draft.name || draft.brand || draft.variants.some(function (v) { return v.barcode.code || v.attributes.length; }));
    Wiz.st = useDraft ? draft : Wiz.fresh(arg.mode);
    Wiz.restored = !!useDraft;
    Wiz.guard();
    Wiz.render();
    if (arg.gtin) Wiz.lookup(arg.gtin);
  },
  guard: function () { App.leaveGuard = function () { var s = Wiz.st; return !s || Wiz.done || !(s.name || s.brand || s.variants.some(function (v) { return v.barcode.code; })); }; },
  persist: debounce(function () { var s = Wiz.st; if (!s || s.productId || Wiz.done) return; s.savedAt = new Date().toISOString(); Store.set(Wiz.key(), JSON.stringify(s)); }, 400),
  attrsFrom: function (variants) {
    var names = [], vals = {};
    variants.forEach(function (v) { v.attributes.forEach(function (a) { if (names.indexOf(a.name) < 0) { names.push(a.name); vals[a.name] = []; } if (vals[a.name].indexOf(a.value) < 0) vals[a.name].push(a.value); }); });
    return names.length ? names.map(function (n) { return { name: n, values: vals[n] }; }) : [{ name: '', values: [] }];
  },
  fromProduct: function (p) {
    var s = Wiz.fresh(p.hasVariants ? 'advanced' : 'quick');
    var bcOf = function (g, i) { return g ? { mode: 'gtin', code: g } : i ? { mode: 'internal', code: i } : { mode: 'none', code: '' }; };
    Object.assign(s, {
      productId: p.id, version: p.version, productCode: p.productCode, brand: p.brand, category: p.category, name: p.name, baseUnit: p.baseUnit, step: p.hasVariants ? 2 : 1, description: p.description, imageUrl: p.imageUrl, dataSource: p.dataSource, status: p.status,
      attrs: Wiz.attrsFrom(p.variants),
      variants: p.variants.map(function (v) {
        var b = bcOf(v.gtin, v.internalBarcode);
        return { key: uid(), id: v.id, saved: true, attributes: v.attributes, name: v.name, nameTouched: true, sku: v.sku, status: v.status, savedStatus: v.status, barcode: Object.assign({}, b), orig: b, reason: '', statusReason: '',
          batchTracking: v.batchTracking, expiryTracking: v.expiryTracking, shelfLifeMonths: v.shelfLifeMonths || '', purchaseUnit: v.purchaseUnit, salesUnit: v.salesUnit,
          conversions: v.conversions.filter(function (c) { return !c.isBaseUnit; }).map(function (c) {
            var cb = bcOf(c.gtin, c.internalBarcode);
            return { key: uid(), id: c.id, saved: true, unitName: c.unitName, factor: c.factor, containsUnit: c.containsUnit, isTradeItem: c.isTradeItem, tradeSaved: c.isTradeItem, sku: c.sku, status: c.status, barcode: Object.assign({}, cb.mode === 'none' ? { mode: 'gtin', code: '' } : cb), orig: cb, reason: '' };
          }) };
      })
    });
    return s;
  },
  /** Duplikat produk: salin brand, kategori, satuan, atribut & konfigurasi kemasan — TANPA ID, SKU, atau GTIN. */
  fromDuplicate: function (p) {
    var s = Wiz.fresh(p.hasVariants ? 'advanced' : 'quick');
    var act = p.variants.filter(function (v) { return v.status === 'ACTIVE'; });
    Object.assign(s, {
      brand: p.brand.status === 'ACTIVE' ? p.brand : null, category: p.category.status === 'ACTIVE' ? p.category : null, name: p.name, baseUnit: p.baseUnit, step: 1, description: p.description,
      attrs: Wiz.attrsFrom(act),
      note: 'Duplikat dari ' + p.name + ' (' + p.productCode + '). ID, SKU, dan GTIN tidak disalin — ubah nama/atribut, lalu isi GTIN masing-masing varian.',
      variants: act.map(function (v) {
        var nv = Wiz.newVariant(v.attributes.map(function (a) { return { name: a.name, value: a.value }; }));
        nv.barcode = { mode: p.hasVariants ? 'gtin' : 'gtin', code: '' };
        nv.conversions = v.conversions.filter(function (c) { return !c.isBaseUnit && c.status === 'ACTIVE'; }).map(function (c) { var n = Wiz.newConv(c.unitName, c.factor, c.containsUnit); n.isTradeItem = c.isTradeItem; return n; });
        Object.assign(nv, { batchTracking: v.batchTracking, expiryTracking: v.expiryTracking, shelfLifeMonths: v.shelfLifeMonths || '', purchaseUnit: v.purchaseUnit, salesUnit: v.salesUnit });
        return nv;
      })
    });
    if (!s.variants.length) s.variants = [Wiz.newVariant([])];
    return s;
  },

  /* ---------- turunan ---------- */
  isQuick: function () { return Wiz.st.mode === 'quick'; },
  convCalc: function (v) { return computeEq(Wiz.st.baseUnit || 'PCS', v.conversions.filter(function (c) { return c.status === 'ACTIVE'; })); },
  bcState: function (row, target) {
    var b = row.barcode, chk = Wiz.checks[target];
    if (b.mode === 'none') return { cls: 'NONE', txt: 'Belum ada barcode' };
    if (b.mode === 'internal') return { cls: 'INTERNAL', txt: row.orig && row.orig.mode === 'internal' && (!b.code || b.code === row.orig.code) ? 'Lengkap · Internal' : 'Internal (dialokasikan saat simpan)' };
    var g = checkGtin(b.code);
    if (!g.ok) return { cls: b.code ? 'ERR' : 'NONE', txt: b.code ? g.msg : 'GTIN belum diisi' };
    if (Wiz.dupBarcode(g.code) > 1) return { cls: 'ERR', txt: 'GTIN dipakai baris lain' };
    if (chk && chk.code === g.code && chk.state === 'err') return { cls: 'ERR', txt: chk.msg };
    if (chk && chk.code === g.code && chk.state === 'checking') return { cls: 'CHECK', txt: 'Memeriksa…' };
    return { cls: 'GTIN', txt: 'Lengkap · GTIN' };
  },
  dupBarcode: function (code) {
    var n = 0;
    Wiz.st.variants.forEach(function (v) {
      if (v.barcode.mode !== 'none' && cleanBc(v.barcode.code) === code) n++;
      v.conversions.forEach(function (c) { if (c.isTradeItem && c.status === 'ACTIVE' && c.barcode.mode !== 'none' && cleanBc(c.barcode.code) === code) n++; });
    });
    return n;
  },
  bcChanged: function (row) { return row.orig && row.orig.mode !== 'none' && !(row.barcode.mode === row.orig.mode && cleanBc(row.barcode.code) === row.orig.code) && !(row.barcode.mode === 'internal' && row.orig.mode === 'internal' && !row.barcode.code); },

  /* ---------- error dari server ---------- */
  fe: function (path) { var m = Wiz.st.errors[path]; return m ? '<div class="fe" data-fe="' + esc(path) + '">' + icon('alertCircle') + '<span>' + esc(m) + '</span></div>' : ''; },
  errCls: function (path) { return Wiz.st.errors[path] ? ' err' : ''; },
  clearErr: function (path) { if (Wiz.st.errors[path]) { delete Wiz.st.errors[path]; var el = $('[data-fe="' + path + '"]', Wiz.main); if (el) el.remove(); Wiz.renderSide(); } },
  stepOf: function (path) { if (Wiz.isQuick()) return 1; return /^variants\.\d+\.conversions/.test(path) ? 3 : /^variants/.test(path) ? 2 : 1; },
  pathLabel: function (path) {
    var s = Wiz.st, m = /^variants\.(\d+)(?:\.conversions\.(\d+))?(?:\.(\w+))?/.exec(path);
    var F = { brandId: 'Brand', categoryId: 'Kategori', name: 'Nama Produk', baseUnit: 'Satuan Dasar', attributes: 'Atribut', barcode: 'Barcode', unitName: 'Satuan', factor: 'Isi', containsUnit: 'Satuan isi', status: 'Status', isTradeItem: 'SKU kemasan' };
    if (!m) return 'Identifikasi · ' + (F[path] || path);
    var v = s.variants[Number(m[1])];
    var vl = Wiz.isQuick() ? 'Produk' : 'Varian ' + (Number(m[1]) + 1) + (v && v.name ? ' (' + v.name + ')' : '');
    if (m[2] !== undefined) { var c = v && v.conversions[Number(m[2])]; return vl + ' · Kemasan ' + (c && c.unitName ? c.unitName : Number(m[2]) + 1) + (m[3] ? ' · ' + (F[m[3]] || m[3]) : ''); }
    return vl + (m[3] ? ' · ' + (F[m[3]] || m[3]) : '');
  },

  /* ---------- kerangka ---------- */
  render: function () {
    var s = Wiz.st, main = Wiz.main, quick = Wiz.isQuick();
    var steps = ['Identifikasi Produk', 'Varian & Barcode', 'Kemasan (opsional)', 'Ringkasan & Simpan'];
    var bad = [0, 0, 0, 0, 0]; Object.keys(s.errors).forEach(function (p) { bad[Wiz.stepOf(p)]++; });
    var multiSaved = s.variants.filter(function (v) { return v.saved; }).length > 1 || s.variants.length > 1;
    main.innerHTML = pageHead(s.productId ? 'Edit produk · ' + s.productCode : 'Master data', s.productId ? s.name : 'Registrasi Produk',
      s.productId ? '<button class="btn" id="wz-cancel">' + icon('x') + 'Batal</button>' : (Wiz.restored ? '<button class="btn ghost" id="wz-reset">' + icon('refresh') + 'Mulai dari awal</button>' : ''),
      s.productId ? 'ID, kode produk, dan SKU bersifat permanen. Nama, brand, kategori, atribut, barcode, dan kemasan boleh dikoreksi — semuanya tercatat di audit.' : 'Kode produk & SKU dibuat otomatis. Scan GTIN dulu untuk cek duplikat &amp; auto-fill. Simpan langsung aktif, atau Simpan sebagai Draft bila data belum lengkap — tanpa approval.') +
      (s.note ? '<div class="info-box" style="margin:-8px 0 14px">' + icon('copy') + '<span>' + esc(s.note) + '</span></div>' : '') +
      (Wiz.restored && !s.productId ? '<div class="info-box" style="margin:-8px 0 14px">' + icon('clock') + '<span>Melanjutkan draf yang belum disimpan' + (s.savedAt ? ' (' + fmtDate(s.savedAt) + ')' : '') + '. Draf hanya tersimpan di perangkat ini.</span></div>' : '') +
      (s.productId ? '' : '<form class="regscan" id="wz-scan" autocomplete="off"><span class="k">' + icon('scan') + ' SCAN GTIN</span><input class="in" name="q" placeholder="Scan / ketik GTIN untuk cek duplikat & auto-fill, lalu Enter" spellcheck="false"><button class="btn pri" type="submit">Cari</button></form><div id="wz-gl"></div>') +
      '<div class="mode"><button type="button" data-mode="quick" class="' + (quick ? 'on' : '') + '"' + (!quick && multiSaved ? ' disabled title="Produk punya lebih dari satu varian"' : '') + '><span class="i">' + icon('zap') + '</span><span><b>Quick Entry</b><span>Satu varian fisik — Brand, Kategori, Nama, Barcode, Satuan → Simpan.</span></span></button>' +
      '<button type="button" data-mode="advanced" class="' + (quick ? '' : 'on') + '"><span class="i">' + icon('layers') + '</span><span><b>Advanced</b><span>Beberapa varian (aroma, volume, shade…) dengan GTIN masing-masing.</span></span></button></div>' +
      (quick ? '' : '<div class="stepper s4">' + steps.map(function (n, i) {
        var k = i + 1; return '<button class="stp' + (s.step === k ? ' on' : s.step > k ? ' done' : '') + (bad[k] ? ' bad' : '') + '" data-step="' + k + '"><span class="n">' + (bad[k] ? '!' : s.step > k ? '✓' : k) + '</span><span><span class="k">Tahap ' + k + '</span><span class="v" style="display:block">' + n + '</span></span></button>';
      }).join('') + '</div>') +
      '<div class="wz-grid"><div id="wz-body"></div><aside class="wz-side" id="wz-side"></aside></div>';
    $$('[data-step]', main).forEach(function (b) { b.onclick = function () { Wiz.goStep(Number(b.getAttribute('data-step'))); }; });
    $$('[data-mode]', main).forEach(function (b) { b.onclick = function () { Wiz.setMode(b.getAttribute('data-mode')); }; });
    if ($('#wz-cancel', main)) $('#wz-cancel', main).onclick = function () { Wiz.done = true; App.go('product', s.productId, { force: true }); };
    if ($('#wz-reset', main)) $('#wz-reset', main).onclick = function () { ask('Hapus draf dan mulai registrasi baru?', 'Mulai baru', true).then(function (y) { if (y) { Store.del(Wiz.key()); Wiz.restored = false; Wiz.st = Wiz.fresh(); Wiz.render(); } }); };
    var sf = $('#wz-scan', main);
    if (sf) {
      sf.onsubmit = function (e) { e.preventDefault(); var q = sf.q.value.trim(); if (q) Wiz.lookup(q); };
      if (!s.name && !s.brand && !s.variants.some(function (v) { return v.barcode.code; })) setTimeout(function () { sf.q.focus(); }, 60);
    }
    Wiz.renderLookup();
    var body = $('#wz-body', main);
    if (quick) Wiz.quickForm(body);
    else if (s.step === 1) Wiz.step1(body); else if (s.step === 2) Wiz.step2(body); else if (s.step === 3) Wiz.step3(body); else Wiz.step4(body);
    Wiz.renderSide();
    Wiz.persist();
  },
  setMode: function (m) {
    var s = Wiz.st;
    if (m === s.mode) return;
    if (m === 'quick') {
      if (s.variants.length > 1) return ask('Quick Entry hanya untuk satu varian. Hapus semua baris varian kecuali yang pertama?', 'Ya, jadikan satu varian', true).then(function (y) {
        if (!y) return; s.variants = s.variants.slice(0, 1); s.variants[0].attributes = []; s.variants[0].name = 'Standar'; s.mode = 'quick'; s.errors = {}; Wiz.render();
      });
      if (s.variants[0]) { s.variants[0].attributes = s.variants[0].saved ? s.variants[0].attributes : []; }
      s.mode = 'quick'; s.errors = {}; return Wiz.render();
    }
    s.mode = 'advanced'; s.step = Math.min(s.step || 1, 4); s.errors = {};
    // varian default tanpa atribut tetap ada; user mengisi atributnya di tabel varian
    Wiz.render();
  },
  goStep: function (k) {
    var s = Wiz.st;
    if (k > s.step) {
      for (var i = s.step; i < k; i++) { var issues = Wiz.issues(i); if (issues.length) { toast(issues[0], 'err'); if (i !== s.step) { s.step = i; Wiz.render(); } return; } }
    }
    s.step = k; Wiz.render(); window.scrollTo(0, 0);
  },
  /** Pemeriksaan cepat sebelum pindah langkah (server tetap memvalidasi ulang). */
  issues: function (step) {
    var s = Wiz.st, out = [];
    if (step === 1) {
      if (!s.brand) out.push('Pilih Brand');
      if (!s.category) out.push('Pilih Kategori');
      if (String(s.name).trim().length < 3) out.push('Nama Produk minimal 3 karakter');
      if (!s.baseUnit) out.push('Pilih Satuan Dasar');
    }
    if (step === 2 || (step === 1 && Wiz.isQuick())) {
      if (!s.variants.length) out.push('Buat kombinasi varian terlebih dahulu');
      var keys = {};
      s.variants.forEach(function (v, i) {
        var lbl = Wiz.isQuick() ? 'Barcode' : 'Varian ' + (i + 1);
        if (!Wiz.isQuick()) {
          if (v.status === 'ACTIVE' && !v.attributes.some(function (a) { return String(a.value).trim(); })) out.push(lbl + ': isi atribut varian');
          var k = attrKey(v.attributes); if (k && keys[k]) out.push(lbl + ': kombinasi atribut sama dengan ' + keys[k]); keys[k] = lbl;
        }
        if (v.barcode.mode === 'gtin' && v.barcode.code && !checkGtin(v.barcode.code).ok) out.push(lbl + ': ' + checkGtin(v.barcode.code).msg);
        if (v.barcode.mode === 'gtin' && !v.barcode.code && !v.saved) out.push(lbl + ': GTIN belum diisi — pilih "Internal" atau "Belum ada" bila tidak punya GTIN');
        if (Wiz.bcChanged(v) && String(v.reason).trim().length < 5) out.push(lbl + ': isi alasan perubahan barcode');
      });
    }
    if (step === 3 || (step === 1 && Wiz.isQuick())) {
      s.variants.forEach(function (v, i) { Wiz.convCalc(v).forEach(function (r, j) { if (r.err) out.push((Wiz.isQuick() ? 'Kemasan ' : 'Varian ' + (i + 1) + ' kemasan ') + (j + 1) + ': ' + r.err); }); });
    }
    return out;
  },

  /* ---------- field identifikasi (dipakai Quick & Advanced tahap 1) ---------- */
  identFields: function () {
    var s = Wiz.st;
    return '<div class="fgrid"><div class="fld"><label class="f">Brand <span class="req">*</span></label><div id="f-brand"></div><div class="hint" id="h-brand"></div>' + Wiz.fe('brandId') + '</div>' +
      '<div class="fld"><label class="f">Kategori <span class="req">*</span></label><div id="f-cat"></div><div class="hint" id="h-cat"></div>' + Wiz.fe('categoryId') + '</div>' +
      '<div class="fld full"><label class="f">Nama Produk <span class="req">*</span></label><input class="in w100' + Wiz.errCls('name') + '" id="f-name" maxlength="120" placeholder="Contoh: Viva Air Mawar 100 ml" value="' + esc(s.name) + '">' +
      (Wiz.isQuick() ? '' : '<div class="hint">Nama umum / product family — varian (aroma, shade, ukuran) diisi di tahap 2.</div>') + Wiz.fe('name') + '<div id="f-sim"></div></div>' +
      '<div class="fld"><label class="f">Satuan Dasar <span class="req">*</span></label><select class="in w100' + Wiz.errCls('baseUnit') + '" id="f-unit"><option value="">Pilih satuan…</option>' +

    if (g.name) s.name = g.name;
    if (g.brand) s.brand = g.brand;
    if (g.category) s.category = g.category;
    if (g.imageUrl) s.imageUrl = g.imageUrl;
    s.dataSource = g.dataSource;
    if (!Wiz.isQuick() && g.attributes.length) {
      var v = s.variants.find(function (x) { return x.barcode.code === r.gtin; });
      g.attributes.forEach(function (a) {
        var at = s.attrs.find(function (x) { return titleCase(x.name) === a.name; });
        if (!at) { at = s.attrs[0] && !s.attrs[0].name ? s.attrs[0] : null; if (at) at.name = a.name; else { at = { name: a.name, values: [] }; s.attrs.push(at); } }
        if (at.values.indexOf(a.value) < 0) at.values.push(a.value);
        if (v) { var va = v.attributes.find(function (x) { return x.name === a.name; }); if (va) va.value = a.value; else v.attributes.push({ name: a.name, value: a.value }); if (!v.nameTouched) v.name = v.attributes.map(function (x) { return x.value; }).join(' '); }
      });
    }
    s.lookup = null;
    toast('Usulan diterapkan — periksa sebelum menyimpan', 'ok');
    Wiz.check();
    Wiz.render();
  },

  /* ---------- MODE B: tahap 4 — ringkasan & simpan ---------- */
  step4: function (body) {
    var s = Wiz.st;
    body.innerHTML = '<div class="card"><div class="sec-h"><h3>Ringkasan</h3><span class="sub">Periksa singkat, lalu simpan. Produk langsung aktif.</span></div>' +
      '<div class="tbl-x" style="margin-top:10px"><table class="t"><thead><tr><th>#</th><th>Varian</th><th>Atribut</th><th>Barcode</th><th>Kemasan</th><th>Status</th></tr></thead><tbody>' + s.variants.map(function (v, i) {
        var calc = Wiz.convCalc(v), acts = v.conversions.filter(function (c) { return c.status === 'ACTIVE'; });
        var st = Wiz.bcState(v, String(i));
        return '<tr' + (v.status !== 'ACTIVE' ? ' class="off"' : '') + '><td class="muted">' + (i + 1) + '</td><td><b>' + esc(v.name || '—') + '</b>' + (v.sku ? '<div class="sku">' + esc(v.sku) + '</div>' : '<div class="muted" style="font-size:11.5px">SKU otomatis</div>') + '</td><td>' + v.attributes.map(function (a) { return '<span class="attr-pill"><i>' + esc(a.name) + '</i>' + esc(a.value) + '</span>'; }).join('') + '</td>' +
          '<td>' + (v.barcode.mode === 'gtin' && v.barcode.code ? '<span class="code">' + esc(v.barcode.code) + '</span> ' : '') + '<span class="badge b-' + st.cls + '">' + esc(st.txt) + '</span></td><td>' + (acts.length ? acts.map(function (c, j) { return esc(c.unitName) + ' = ' + (calc[j].eq || '?') + (c.isTradeItem ? ' (ber-SKU)' : ''); }).join('<br>') : '<span class="muted">—</span>') + '</td><td>' + badge(v.status) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="wz-foot"><button class="btn" id="bk">' + icon('arrowLeft') + 'Kembali</button><button class="btn ghost right" id="ck">Periksa tanpa menyimpan</button>' + (s.productId ? '' : '<button class="btn" id="dr4">Simpan sebagai Draft</button>') + '<button class="btn pri" id="sv4">' + icon('check') + (s.productId ? 'Simpan Perubahan' : 'Simpan Produk') + '</button></div></div>';
    $('#bk', body).onclick = function () { Wiz.goStep(3); };
    $('#ck', body).onclick = function () { Wiz.save($('#ck', body), true); };
    $('#sv4', body).onclick = function () { Wiz.save($('#sv4', body)); };
    if ($('#dr4', body)) $('#dr4', body).onclick = function () { Wiz.save($('#dr4', body), false, true); };
  },

  /* ---------- panel ringkasan samping ---------- */
  renderSide: function () {
    var s = Wiz.st, side = $('#wz-side', Wiz.main); if (!side || !s) return;
    var act = s.variants.filter(function (v) { return v.status === 'ACTIVE'; });
    var stat = { GTIN: 0, INTERNAL: 0, NONE: 0, ERR: 0 };
    act.forEach(function (v) { var b = Wiz.bcState(v, String(s.variants.indexOf(v))).cls; b = b === 'CHECK' ? 'GTIN' : b; stat[b] = (stat[b] || 0) + 1; });
    var packs = 0, trade = 0;
    s.variants.forEach(function (v) { v.conversions.forEach(function (c) { if (c.status === 'ACTIVE') { packs++; if (c.isTradeItem) trade++; } }); });
    var errs = Object.keys(s.errors);
    var done = act.length ? Math.round((stat.GTIN + stat.INTERNAL) / act.length * 100) : 0;
    var newSku = s.variants.filter(function (v) { return !v.saved; }).length + s.variants.reduce(function (n, v) { return n + v.conversions.filter(function (c) { return c.isTradeItem && c.status === 'ACTIVE' && !c.tradeSaved; }).length; }, 0);
    side.innerHTML = '<div class="panel"><div class="panel-h"><h3>Ringkasan produk</h3></div><div class="sum-kv">' +
      '<div>Mode</div><div>' + (Wiz.isQuick() ? 'Quick Entry' : 'Advanced') + '</div>' +
      '<div>Brand</div><div>' + (s.brand ? esc(s.brand.name) + ' <span class="chip-code ghost">' + esc(s.brand.code) + '</span>' : '<span class="muted">—</span>') + '</div>' +
      '<div>Kategori</div><div>' + (s.category ? esc(s.category.name) + ' <span class="chip-code ghost">' + esc(s.category.code) + '</span>' : '<span class="muted">—</span>') + '</div>' +
      '<div>Produk</div><div>' + (s.name ? esc(s.name) : '<span class="muted">—</span>') + '</div><div>Kode produk</div><div class="code">' + esc(s.productCode || 'otomatis') + '</div>' +
      '<div>Satuan dasar</div><div>' + esc(s.baseUnit || '—') + '</div>' +
      '<div>Varian</div><div>' + act.length + ' aktif</div>' +
      '<div>Barcode</div><div>' + stat.GTIN + ' GTIN · ' + stat.INTERNAL + ' internal' + (stat.NONE ? ' · <span style="color:var(--warn)">' + stat.NONE + ' belum</span>' : '') + (stat.ERR ? ' · <span style="color:var(--err)">' + stat.ERR + ' bermasalah</span>' : '') + '<div class="meter"><i style="width:' + done + '%"></i></div></div>' +
      '<div>Kemasan</div><div>' + (packs ? packs + ' satuan' + (trade ? ' · ' + trade + ' ber-SKU' : '') : 'tidak ada (opsional)') + '</div>' +
      '<div>SKU baru</div><div>' + newSku + ' (otomatis)</div></div>' +
      (s.similar.length ? '<div class="warn-box">' + icon('alert') + '<span>' + s.similar.length + ' kemungkinan duplikat.' + (s.ack ? ' <b>Dikonfirmasi berbeda.</b>' : ' Konfirmasi di bawah nama produk.') + '</span></div>' : '') +
      (errs.length ? '<div class="sect" style="margin:14px 0 4px;color:var(--err)">' + errs.length + ' masalah perlu diperbaiki</div><ul class="err-list">' + errs.slice(0, 30).map(function (p) { return '<li data-ep="' + esc(p) + '">' + icon('alertCircle') + '<div><small>' + esc(Wiz.pathLabel(p)) + '</small>' + esc(s.errors[p]) + '</div></li>'; }).join('') + '</ul>' : '') +
      '<button class="btn pri w100" id="sv" style="margin-top:14px;height:44px">' + icon('check') + (s.productId ? 'Simpan Perubahan' : 'Simpan Produk') + '</button></div>' +
      (Wiz.isQuick() && !s.productId ? '<div class="tips"><b>Quick Entry</b><ol><li>Pilih brand & kategori</li><li>Ketik nama produk</li><li>Scan GTIN ke kolom barcode</li><li>Pilih satuan dasar → Simpan</li></ol></div>' : '');
    $$('[data-ep]', side).forEach(function (li) { li.onclick = function () { var p = li.getAttribute('data-ep'), k = Wiz.stepOf(p); if (!Wiz.isQuick() && k !== s.step) { s.step = k; Wiz.render(); } var el = $('[data-fe="' + p + '"]', Wiz.main); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }; });
    $('#sv', side).onclick = function () { Wiz.save($('#sv', side)); };
  },

  /* ---------- simpan ---------- */
  payload: function () {
    var s = Wiz.st, quick = Wiz.isQuick();
    var variants = quick ? s.variants.slice(0, 1) : s.variants;
    return {
      productId: s.productId || undefined, version: s.version || undefined,
      brandId: s.brand && s.brand.id, categoryId: s.category && s.category.id, name: s.name, baseUnit: s.baseUnit, hasVariants: !quick, acknowledgeSimilar: s.ack,
      description: s.description, imageUrl: s.imageUrl, dataSource: s.dataSource,
      variants: variants.map(function (v) {
        return { id: v.id || undefined, name: quick && !v.saved ? '' : v.name, attributes: quick ? (v.saved ? v.attributes : []) : v.attributes.filter(function (a) { return String(a.value).trim(); }), status: v.status,
          barcode: { mode: v.barcode.mode, code: v.barcode.code }, barcodeChangeReason: v.reason, statusReason: v.statusReason,
          batchTracking: !!v.batchTracking, expiryTracking: !!v.expiryTracking, shelfLifeMonths: v.shelfLifeMonths === '' || v.shelfLifeMonths === null ? '' : Number(v.shelfLifeMonths), purchaseUnit: v.purchaseUnit || '', salesUnit: v.salesUnit || '',
          conversions: v.conversions.filter(function (c) { return c.saved || c.status === 'ACTIVE'; }).map(function (c) { return { id: c.id || undefined, unitName: c.unitName, factor: Number(c.factor), containsUnit: c.containsUnit || s.baseUnit, isTradeItem: !!c.isTradeItem, status: c.status, barcode: c.isTradeItem ? { mode: c.barcode.mode, code: c.barcode.code } : { mode: 'none' }, barcodeChangeReason: c.reason }; }) };
      })
    };
  },
  save: function (btn, dryRun, asDraft) {
    var s = Wiz.st, quick = Wiz.isQuick();
    var steps = quick ? [1] : [1, 2, 3];
    for (var k = 0; k < steps.length; k++) { var iss = Wiz.issues(steps[k]); if (iss.length) { toast(iss[0], 'err'); if (!quick && s.step !== steps[k]) { s.step = steps[k]; Wiz.render(); } return; } }
    if (s.similar.length && !s.ack && !dryRun) { toast('Ada kemungkinan produk duplikat. Lihat detailnya, atau centang "Lanjutkan — ini produk yang berbeda".', 'warn'); if (!quick && s.step !== 1) { s.step = 1; Wiz.render(); } return; }
    // conversions dengan status DELETED yang belum tersimpan tidak perlu dikirim; index path server = urutan payload
    s.variants.forEach(function (v) { v.conversions = v.conversions.filter(function (c) { return c.saved || c.status === 'ACTIVE'; }); });
    var input = Wiz.payload();
    if (asDraft) input.saveAsDraft = true;
    // requestKey: kirim ulang / klik ganda tidak menyimpan dua kali (server mengembalikan hasil pertama)
    busy(btn, api(dryRun ? 'product.validate' : 'product.save', { input: input, requestKey: dryRun ? undefined : s.reqKey + (s.productId ? ':' + s.version : '') }, { silent: true })).then(function (d) {
      s.errors = {};
      if (dryRun) { Wiz.renderSide(); return toast('Data valid — ' + d.variants.length + ' varian siap disimpan', 'ok'); }
      Wiz.done = true; App.leaveGuard = null;
      if (!s.productId) Store.del(Wiz.key());
      Wiz.success(d, !!s.productId);
    }).catch(function (e) {
      if (e.code === 'VALIDATION_FAILED' || e.code === 'SIMILAR_EXISTS') {
        s.errors = {};
        if (e.code === 'SIMILAR_EXISTS') { s.similar = e.details.map(function (d) { return d.data; }).filter(Boolean); s.ack = false; toast(e.message, 'warn'); if (!quick) s.step = 1; Wiz.render(); return; }
        e.details.forEach(function (d) { var p = d.path || 'variants'; if (!s.errors[p]) s.errors[p] = d.message; });
        toast(e.message, 'err');
        if (!quick) s.step = Math.min.apply(null, Object.keys(s.errors).map(Wiz.stepOf));
        Wiz.render();
        var el = $('.fe', Wiz.main); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else if (e.code === 'STALE_VERSION') {
        ask(e.message + ' Muat ulang data produk sekarang? (perubahan yang belum disimpan hilang)', 'Muat ulang').then(function (y) { if (y) { Wiz.done = true; App.go('register', { productId: s.productId }, { force: true }); } });
      } else toast(e.message, 'err');
    });
  },
  success: function (d, edited) {
    var rows = [];
    d.variants.forEach(function (v) { rows.push([v.sku, v.isDefault ? 'Standar' : v.name, v.gtin || v.internalBarcode || '—']); v.conversions.forEach(function (c) { if (c.sku) rows.push([c.sku, (v.isDefault ? '' : v.name + ' · ') + c.unitName + ' isi ' + c.baseUnitEquivalent, c.gtin || c.internalBarcode || '—']); }); });
    var draft = d.status === 'DRAFT';
    Wiz.main.innerHTML = '<div class="success"><div class="ring">' + icon('check') + '</div><div class="eyebrow">' + esc(d.productCode) + ' · ' + esc(STATUS_TXT[d.status] || d.status) + '</div><h2>' + (edited ? 'Perubahan tersimpan' : draft ? 'Draft tersimpan' : 'Produk tersimpan') + '</h2>' +
      '<p class="muted">' + esc(d.name) + ' · ' + d.variants.length + ' Child SKU · ' + rows.length + ' SKU. ' + (edited ? '' : draft ? 'Belum tersedia untuk sistem downstream — aktifkan dari halaman detail bila sudah lengkap.' : 'Produk langsung aktif di Master Produk.') + '</p>' +
      '<div class="tbl-x" style="text-align:left;margin:16px 0"><table class="t"><thead><tr><th>SKU</th><th>Varian</th><th>Barcode</th></tr></thead><tbody>' + rows.slice(0, 50).map(function (r) { return '<tr><td class="sku">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="code">' + esc(r[2]) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="row" style="justify-content:center"><button class="btn pri" id="s2">' + icon('plus') + 'Registrasi produk lain</button><button class="btn" id="s1">' + icon('package') + 'Lihat produk</button><button class="btn" id="s3">' + icon('scan') + 'Scan barcode</button></div></div>';
    toast(edited ? 'Perubahan produk tersimpan' : 'Produk ' + d.name + ' tersimpan', 'ok');
    $('#s1', Wiz.main).onclick = function () { App.go('product', d.id); };
    $('#s2', Wiz.main).onclick = function () { App.go('register', { mode: Wiz.st.mode }, { force: true }); };
    $('#s3', Wiz.main).onclick = function () { App.go('scan'); };
    setTimeout(function () { var b = $('#s2', Wiz.main); if (b) b.focus(); }, 50);
  }
};
Pages.register = function (main, arg) { Wiz.open(main, arg); };
</script>
